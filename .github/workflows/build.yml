name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  APP_NAME: "Bastion Breaker"
  APP_ID: "com.bastionbreaker.game"
  # "sensorLandscape", "sensorPortrait", or "" for free rotation
  ORIENTATION: "sensorLandscape"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for index.html
        run: |
          test -f index.html || { echo "index.html not found in repo root"; exit 1; }

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create web folder
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Create Capacitor project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "$APP_NAME" "$APP_ID" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Set screen orientation
        if: env.ORIENTATION != ''
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i "s/<activity/<activity android:screenOrientation=\"$ORIENTATION\"/" "$MANIFEST"
          grep -n "screenOrientation" "$MANIFEST"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bastion-breaker-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
