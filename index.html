      function applyBastionHullDamage(amount, silentFlash) {
        var b = GAME.bastion;
        if (GAME.mode !== "PLAYING" || GAME.playMode !== "RUN") return;
        // Step B15 Requirement 2: Hull hits of 20 or more trigger train impact camera shake (6 px, 0.25 s)
        if (amount >= 20) {
          shake(CFG.trainImpactShakeIntensity, CFG.trainImpactShakeDuration);
        }
        // Step B9 Requirement 3: Plasma Shield Generator reduces all hull damage by 20 percent
        var remaining = amount * getEffectiveHullDamageMultiplier();

        // Step B8 Requirement 1: Shield Pylon projects a barrier dome (radius 220 px) over the train that absorbs 100 hull damage, then recharges after 20 s
        if (b.wagonSlots && b.wagonStates) {
          var sIdx;
          for (sIdx = 0; sIdx < CFG.wagonSlotCount; sIdx++) {
            if (b.wagonSlots[sIdx] === "shield_pylon") {
              var st = b.wagonStates[sIdx];
              if (st && st.domeHp > 0 && remaining > 0) {
                var absorbed = Math.min(st.domeHp, remaining);
                st.domeHp = Math.max(0, st.domeHp - absorbed);
                remaining -= absorbed;
                st.domeHitFlashTimer = 0.18;
                if (st.domeHp <= 0) {
                  st.domeHp = 0;
                  st.domeRechargeTimer = CFG.shieldPylonRechargeTime;
                  var pCar = getWagonCarBySlotIndex(sIdx);
                  var px = pCar ? pCar.x + pCar.w * 0.5 : b.engineFrontX - 180;
                  spawnDmgNumber(px, b.roofY - 36, "PYLON DOME DOWN! (20s)", "#52b8ff");
                  spawnSparkBurst(px, b.roofY - 18, 16, "#52b8ff");
                  AUDIO.playShieldBreak();
                }
              }
            }
          }
        }

        if (remaining <= 0) {
          return;
        }

        b.hull = Math.max(0, b.hull - remaining);
        if (!silentFlash) {
          b.hullHitFlashTimer = 0.14;
        }
        if (b.hull <= 0) {
          b.hull = 0;
          GAME.runState.defeatReason = "BASTION HULL DESTROYED (0 / " + b.maxHull + ")";
          GAME.mode = "DEFEAT";
          INPUT.clearAll();
          AUDIO.playPlayerDefeat();
        }
      }

        GAME.bastion.rearX += deltaPx;
        GAME.player.x += deltaPx;
        syncBastionGeometry();
        GAME.runState.distancePx = Math.max(0, GAME.bastion.rearX - GAME.runState.startRearX);
        GAME.runState.distanceKm = GAME.runState.distancePx / CFG.kmLengthPx;
        GAME.runState.nextOreSpawnX = Math.max(GAME.runState.nextOreSpawnX, GAME.bastion.drillTipX + 180);
        WORLD.updateRunSegments();
        spawnRunOreNodesUpTo(GAME.bastion.drillTipX + 1900);
        snapCameraToPlayer();
      }

      function spawnRunMiteWave(count) {
        var b = GAME.bastion;
        var rs = GAME.runState;
        var tCfg = getCurrentThrottleConfig();
        var zoneKey = getRunZoneKeyForDistance();
        var i;
        for (i = 0; i < count; i++) {
          rs.spawnCounter++;
          var pickedVariant = pickWeightedVariantForZone(zoneKey);
          var resolved = resolveEnemyTypeAndVariant(pickedVariant);
          var skelDef = DATA_TABLES.enemyTypes[resolved.skeletonKey] || DATA_TABLES.enemyTypes.mite;
          var eH = skelDef.height || CFG.miteHeight;
          var isFlyer = !!skelDef.flying;
          var spawnY = isFlyer ? (b.roofY - 82 - (i % 3) * 24) : (b.floorY - eH);
          var isElite = Math.random() < tCfg.eliteChance;
          var dist = CFG.runMiteSpawnMinDist + Math.random() * (CFG.runMiteSpawnMaxDist - CFG.runMiteSpawnMinDist) + i * 48;
          spawnEnemy(Math.round(b.drillTipX + dist), spawnY, resolved.variantId, -1, isElite);
        }
        recountActiveEnemies();

      function handlePlayerDeath(pl) {
        var plCx = pl.x + pl.w * 0.5;
        pl.hp = 0;
        pl.vx = 0;
        pl.vy = 0;
        pl.overheatTimer = 0;
        pl.bladeTimer = 0;

        if (GAME.playMode === "RUN") {
          // Requirement 9: Player death in Run mode is not the end: 2-second fade then rebuild in Foundry Car
          if (GAME.runState.rebuildTimer <= 0) {
            GAME.runState.playerDeaths++;
            GAME.runState.rebuildTimer = CFG.runPlayerRebuildTime;
          }
        } else {
          GAME.mode = "DEFEAT";
          INPUT.clearAll();
        }
      }

      function resetCheckpoints() {
        var i;
        for (i = 0; i < GAME.checkpoints.length; i++) {
          GAME.checkpoints[i].lit = false;
        }
        GAME.lastCheckpoint = null;
        GAME.checkpointBannerTimer = 0;
      }

      /* =====================================================================
       * SYSTEMS
       * ===================================================================== */
      function moveAndCollideX(ent, dx) {
        ent.x += dx;
        var ts = CFG.tileSize;
        var skin = 0.02;
        var leftCol = Math.floor(ent.x / ts);
        var rightCol = Math.floor((ent.x + ent.w - 0.001) / ts);
        var topRow = Math.floor((ent.y + skin) / ts);
        var botRow = Math.floor((ent.y + ent.h - skin) / ts);

        var r, c;
        if (dx > 0) {
          for (c = rightCol; c >= leftCol; c--) {
            for (r = topRow; r <= botRow; r++) {
              if (WORLD.isSolid(c, r)) {
                ent.x = c * ts - ent.w;
                ent.vx = 0;
                return true;
              }
            }
          }
        } else if (dx < 0) {
          for (c = leftCol; c <= rightCol; c++) {
            for (r = topRow; r <= botRow; r++) {
              if (WORLD.isSolid(c, r)) {
                ent.x = (c + 1) * ts;
                ent.vx = 0;
                return true;
              }
            }
          }
        }
        return false;
      }

      function moveAndCollideY(ent, dy) {
        ent.y += dy;
        var ts = CFG.tileSize;
        var skin = 0.02;
        var leftCol = Math.floor((ent.x + skin) / ts);
        var rightCol = Math.floor((ent.x + ent.w - skin) / ts);
        var topRow = Math.floor(ent.y / ts);
        var botRow = Math.floor((ent.y + ent.h - 0.001) / ts);

        var r, c;
        if (dy > 0) {
          for (r = botRow; r >= topRow; r--) {
            for (c = leftCol; c <= rightCol; c++) {
              if (WORLD.isSolid(c, r)) {
                ent.y = r * ts - ent.h;
                ent.vy = 0;
                ent.onGround = true;
                return true;
              }
            }
          }
        } else if (dy < 0) {
          for (r = topRow; r <= botRow; r++) {
            for (c = leftCol; c <= rightCol; c++) {
              if (WORLD.isSolid(c, r)) {
                ent.y = (r + 1) * ts;
                ent.vy = 0;
                return true;
              }
            }
          }
        }
        return false;
      }

      function checkPlayerHazardsAndCheckpoints(pl) {
        var ts = CFG.tileSize;
        var leftCol = Math.floor((pl.x + 2) / ts);
        var rightCol = Math.floor((pl.x + pl.w - 2) / ts);
        var topRow = Math.floor((pl.y + 2) / ts);
        var botRow = Math.floor((pl.y + pl.h - 1) / ts);

        // 1. Checkpoints ('!')
        var i;
        for (i = 0; i < GAME.checkpoints.length; i++) {
          var cp = GAME.checkpoints[i];
          var cpLeft = cp.col * ts;
          var cpTop = (cp.row - 1) * ts;
          if (
            pl.x + pl.w >= cpLeft &&
            pl.x <= cpLeft + ts &&
            pl.y + pl.h >= cpTop &&
            pl.y <= cpTop + ts * 2
          ) {
            if (!cp.lit || !GAME.lastCheckpoint || GAME.lastCheckpoint.col !== cp.col) {
              cp.lit = true;
              GAME.lastCheckpoint = { x: cp.x, y: cp.y, col: cp.col, row: cp.row };
              GAME.checkpointBannerTimer = CFG.checkpointBannerTime;
              spawnSparkBurst(cpLeft + 16, cpTop + 20, 14, "#5cd68d");
              AUDIO.playCheckpoint();
              updateDebugPanelUI();
            }
          }
        }

        // 2. Spikes ('^'): 15 damage, upward knockback, 0.8s invulnerability
        if (pl.invulnTimer <= 0 && GAME.mode === "PLAYING") {
          var r, c;
          for (r = topRow; r <= botRow; r++) {
            for (c = leftCol; c <= rightCol; c++) {
              if (WORLD.getTile(c, r) === "^") {
                var spikeTop = r * ts + 14;
                if (pl.y + pl.h >= spikeTop) {
                  applySpikeDamage(pl);
                  return;
                }
              }
            }
          }
        }
      }

      function applySpikeDamage(pl) {
        if (pl.invulnTimer > 0) return;

        var plCx = pl.x + pl.w * 0.5;
        pl.vy = CFG.spikeKnockbackY;
        pl.vx = -pl.facing * CFG.spikeKnockbackX;
        pl.onGround = false;
        pl.hurtLockTimer = CFG.playerHurtLockTime;
        pl.invulnTimer = CFG.playerInvulnTime;

        if (!GAME.godmode) {
          pl.hp = Math.max(0, pl.hp - CFG.spikeDamage);
          spawnDmgNumber(plCx, pl.y - 6, CFG.spikeDamage, "#ff5e57");
        } else {
          spawnDmgNumber(plCx, pl.y - 6, "0", "#68e8de");
        }

        spawnSparkBurst(plCx, pl.y + pl.h, 12, "#ff5e57");

        if (pl.hp <= 0) {
          handlePlayerDeath(pl);
        } else {
          AUDIO.playPlayerHurt();
        }
        updateDebugPanelUI();
      }

      function triggerPlayerOverheat(pl) {
        pl.heat = CFG.heatMax;
        pl.heatPoints = pl.heatCapacity || (GAME.bladeStats ? GAME.bladeStats.heatCapacity : 100);
        pl.overheatTimer = CFG.overheatStunTime;
        pl.heatCoolDelayTimer = CFG.heatCoolDelay;
        pl.bladeTimer = 0;
        pl.bladeComboPending = 0;
        pl.buzzsawActive = false;
        pl.vx = 0;
        pl.steamSpawnTimer = 0;
        spawnSteam(pl.x + pl.w * 0.5, pl.y + 8, 12);
        AUDIO.playOverheat();
      }

      function normalizeAngleDiff(a, b) {
        var d = a - b;
        while (d > Math.PI) d -= Math.PI * 2;
        while (d < -Math.PI) d += Math.PI * 2;
        return d;
      }

      function isBoxInLineThrust(bx, by, bw, bh, originX, originY, aimAng, reach, halfWidth) {
        var x2 = originX + Math.cos(aimAng) * reach;
        var y2 = originY + Math.sin(aimAng) * reach;
        return lineSegmentIntersectsRect(
          originX,
          originY,
          x2,
          y2,
          bx - halfWidth,
          by - halfWidth,
          bw + halfWidth * 2,
          bh + halfWidth * 2
        );
      }

      function isBoxInBladeArc(bx, by, bw, bh, originX, originY, aimAng, reach, halfArcRad) {
        if (GAME.bladeStats && GAME.bladeStats.isLineThrust && reach === CFG.bladeReach) {
          if (isBoxInLineThrust(bx, by, bw, bh, originX, originY, aimAng, reach, 15)) {
            return true;
          }
        }
        var clX = Math.max(bx, Math.min(originX, bx + bw));
        var clY = Math.max(by, Math.min(originY, by + bh));
        var dx = clX - originX;
        var dy = clY - originY;
        var distSq = dx * dx + dy * dy;
        if (distSq > reach * reach) {
          return false;
        }
        if (distSq < 14 * 14) {
          return true;
        }
        var cx = bx + bw * 0.5;
        var cy = by + bh * 0.5;
        var angCenter = Math.atan2(cy - originY, cx - originX);
        var angClosest = Math.atan2(dy, dx);
        var pad = 0.16;
        return (
          Math.abs(normalizeAngleDiff(angCenter, aimAng)) <= halfArcRad + pad ||
          Math.abs(normalizeAngleDiff(angClosest, aimAng)) <= halfArcRad + pad
        );
      }

      function computeBladeZoneOverlapScore(zr, originX, originY, aimAng, reach, halfArcRad) {
        // Sample a 3x3 grid inside the zone rectangle to measure how much of the swing arc overlaps this zone
        var score = 0;
        var gx, gy;
        for (gx = 0; gx < 3; gx++) {
          for (gy = 0; gy < 3; gy++) {
            var px = zr.x + zr.w * ((gx + 0.5) / 3);
            var py = zr.y + zr.h * ((gy + 0.5) / 3);
            var dx = px - originX;
            var dy = py - originY;
            var dist = Math.sqrt(dx * dx + dy * dy);
            if (dist <= reach + 6) {
              var ang = Math.atan2(dy, dx);
              var diff = Math.abs(normalizeAngleDiff(ang, aimAng));
              if (diff <= halfArcRad + 0.20) {
                score += (1.2 - diff / (halfArcRad + 0.25)) + (1 - dist / (reach + 20)) * 0.5;
              }
            }
          }
        }
        if (score <= 0 && isBoxInBladeArc(zr.x, zr.y, zr.w, zr.h, originX, originY, aimAng, reach, halfArcRad)) {
          var cx = zr.x + zr.w * 0.5;
          var cy = zr.y + zr.h * 0.5;
          var cDist = Math.sqrt((cx - originX) * (cx - originX) + (cy - originY) * (cy - originY));
          score = Math.max(0.05, 1 - cDist / (reach + 40));
        }
        return score;
      }

      function pickBruteZoneForBlade(e, originX, originY, aimAng, reach, halfArcRad) {
        var bestZone = null;
        var bestScore = -1;
        var i;
        for (i = 0; i < e.zones.length; i++) {
          var z = e.zones[i];
          var zr = getBruteZoneWorldRect(e, z);
          var sc = computeBladeZoneOverlapScore(zr, originX, originY, aimAng, reach, halfArcRad);
          // Slight tie-breaker preference for Cracked zones (or non-broken zones on a frozen enemy) so Shatter Strike feels responsive
          if (sc > 0 && (z.state === "CRACKED" || (e.freezeTimer > 0 && z.state !== "BROKEN"))) {
            sc += 0.3;
          }
          if (sc > bestScore) {
            bestScore = sc;
            bestZone = z;
          }
        }
        if (!bestZone && e.zones.length > 0) {
          // Fallback to zone closest to blade tip along aimAng
          var tipX = originX + Math.cos(aimAng) * (reach * 0.65);
          var tipY = originY + Math.sin(aimAng) * (reach * 0.65);
          var bestDist = Infinity;
          for (i = 0; i < e.zones.length; i++) {
            var zf = e.zones[i];
            var zfr = getBruteZoneWorldRect(e, zf);
            var ddx = (zfr.x + zfr.w * 0.5) - tipX;
            var ddy = (zfr.y + zfr.h * 0.5) - tipY;
            var d2 = ddx * ddx + ddy * ddy;
            if (d2 < bestDist) {
              bestDist = d2;
              bestZone = zf;
            }
          }
        }
        return bestZone;
      }

      function triggerVoltCoreArcLightning(sourceEnt, baseHitDmg) {
        var stats = GAME.bladeStats;
        if (!stats || stats.redlineEffect !== "volt") return;
        var radius = stats.redlineArcRadius || 120;
        var arcMult = stats.redlineArcDmgMult || 0.50;
        var arcDmg = Math.max(1, Math.round(baseHitDmg * arcMult));
        var sx = sourceEnt.x + sourceEnt.w * 0.5;
        var sy = sourceEnt.y + sourceEnt.h * 0.5;

        var bestEnemy = null;
        var bestDistSq = radius * radius;
        var i;
        for (i = 0; i < CFG.maxEnemies; i++) {
          var other = GAME.enemies[i];
          if (!other.active || other === sourceEnt) continue;
          var ox = other.x + other.w * 0.5;
          var oy = other.y + other.h * 0.5;
          var dx = ox - sx;
          var dy = oy - sy;
          var dSq = dx * dx + dy * dy;
          if (dSq <= bestDistSq) {
            bestDistSq = dSq;
            bestEnemy = other;
          }
        }

        if (bestEnemy) {
          var tx = bestEnemy.x + bestEnemy.w * 0.5;
          var ty = bestEnemy.y + bestEnemy.h * 0.5;
          bestEnemy.hp -= arcDmg;
          bestEnemy.hpBarTimer = CFG.enemyHpBarDuration;
          bestEnemy.flashTimer = CFG.miteFlashDuration;
          GAME.voltArcs.push({
            x1: sx,
            y1: sy,
            x2: tx,
            y2: ty,
            timer: 0.22,
            maxTimer: 0.22
          });
          spawnSparkBurst(tx, ty, 9, "#ffe652");
          spawnDmgNumber(tx, bestEnemy.y - 12, "⚡" + arcDmg, "#ffe652");
          if (bestEnemy.hp <= 0) {
            handleEnemyKilled(bestEnemy);
          }
          return;
        }

        // Sandbox fallback: arc to another dummy within 120 px
        for (i = 0; i < GAME.dummies.length; i++) {
          var od = GAME.dummies[i];
          if (od === sourceEnt) continue;
          var ddx = (od.x + od.w * 0.5) - sx;
          var ddy = (od.y + od.h * 0.5) - sy;
          if (ddx * ddx + ddy * ddy <= radius * radius) {
            od.hits++;
            od.flashTimer = CFG.dummyFlashDuration;
            GAME.voltArcs.push({
              x1: sx,
              y1: sy,
              x2: od.x + od.w * 0.5,
              y2: od.y + od.h * 0.5,
              timer: 0.22,
              maxTimer: 0.22
            });
            spawnSparkBurst(od.x + od.w * 0.5, od.y + od.h * 0.4, 8, "#ffe652");
            spawnDmgNumber(od.x + od.w * 0.5, od.y - 12, "⚡" + arcDmg, "#ffe652");
            break;
          }
        }
      }

      function applyMotorCoreRedlineToEnemy(e, isRedline, hitDmg) {
        if (!isRedline) return;
        var stats = GAME.bladeStats;
        var eff = stats ? stats.redlineEffect : "standard";
        if (eff === "standard" || eff === "magma") {
          e.burnTimer = CFG.burnDuration;
          e.burnTickTimer = CFG.burnTickInterval;
        } else if (eff === "cryo") {
          var wasChilled = e.coreChillTimer > 0.4;
          e.coreChillTimer = Math.max(e.coreChillTimer || 0, (stats && stats.redlineChillDuration) || 3.0);
          if (!wasChilled) {
            spawnDmgNumber(e.x + e.w * 0.5, e.y - 20, "CHILLED -30%", "#5ef2ff");
            spawnSparkBurst(e.x + e.w * 0.5, e.y + e.h * 0.5, 8, "#5ef2ff");
          }
        } else if (eff === "volt") {
          triggerVoltCoreArcLightning(e, hitDmg);
        }
      }

      function checkBladeHitsTargets(pl) {
        var shoulderX = pl.x + pl.w * 0.5;
        var shoulderY = pl.y + pl.h - 20;
        var halfArcRad = ((CFG.bladeArcDeg * 0.5) * Math.PI) / 180;
        var isRedline =
          pl.bladeIsRedline ||
          (pl.heat >= CFG.heatRedlineMin && pl.heat <= CFG.heatRedlineMax);
        // Redline bonus (+40% / +25% / +40% / +55%) counts as armor-shredding: applies to both armor damage and main HP blade damage
        var baseDmg = isRedline
          ? Math.round(CFG.bladeDamage * CFG.redlineDamageMult)
          : CFG.bladeDamage;
        // Step B12 Requirement 3: Aerial blade strike on harpoon arrival deals x1.5 damage
        var harpoonMult = pl.bladeHarpoonMult || 1.0;
        var dmg = Math.round(baseDmg * harpoonMult);
        var knockDir = Math.cos(pl.bladeAngle) >= -0.01 ? 1 : -1;
        var hitAny = false;
        var triggeredShatter = false;
        var i;

        for (i = 0; i < CFG.maxEnemies; i++) {
          var e = GAME.enemies[i];
          if (!e.active || e.lastBladeSwingId === pl.bladeSwingId) continue;
          if (
            isBoxInBladeArc(
              e.x,
              e.y,
              e.w,
              e.h,
              shoulderX,
              shoulderY,
              pl.bladeAngle,
              CFG.bladeReach,
              halfArcRad
            )
          ) {
            e.lastBladeSwingId = pl.bladeSwingId;
            e.hpBarTimer = CFG.enemyHpBarDuration;
            e.flashTimer = CFG.miteFlashDuration;
            e.knockVx = knockDir * (e.type === "brute" ? CFG.bladeKnockback * 0.65 : CFG.bladeKnockback);

            // Step B11 Requirement 4: A tripped enemy is exposed: the next blade hit deals +25 percent damage
            var wasTripExposed = !!e.tripExposed;
            var enemyBladeDmg = wasTripExposed
              ? Math.round(dmg * CFG.tripwireExposedBladeMult)
              : dmg;
            if (wasTripExposed) {
              e.tripExposed = false;
            }

            applyMotorCoreRedlineToEnemy(e, isRedline, enemyBladeDmg);

            if (e.useArmorZones && e.zones && e.zones.length > 0) {
              var hitZone = pickBruteZoneForBlade(
                e,
                shoulderX,
                shoulderY,
                pl.bladeAngle,
                CFG.bladeReach,
                halfArcRad
              );
              var zr = getBruteZoneWorldRect(e, hitZone);
              var zcx = zr.x + zr.w * 0.5;
              var zcy = zr.y + zr.h * 0.5;

              if (hitZone.state === "CRACKED" || (e.freezeTimer > 0 && hitZone.state !== "BROKEN")) {
                // Step B5 Req 5 & Step B10 Req 2: Shatter Strike! A blade hit on a Cracked zone OR on a Frozen enemy
                // breaks the zone at once (even if Intact), with a white flash, 90 ms hit-stop, shake(3, 0.1), and SHATTER text.
                if (e.freezeTimer > 0) {
                  e.freezeTimer = 0;
                  spawnSparkBurst(zcx, zcy, 16, "#7af8ff");
                }
                breakBruteZone(e, hitZone, true);
                triggeredShatter = true;
                spawnDmgNumber(zcx, zr.y - 14, "SHATTER", "#ffffff");
                shake(CFG.shatterShakeIntensity, CFG.shatterShakeDuration);
                AUDIO.playShatterStrike();
                // For fragile flyers (Glider, 20 HP), shattering or breaking a zone also damages HP
                if (e.type === "glider") {
                  e.hp -= enemyBladeDmg;
                  if (e.hp <= 0) {
                    handleEnemyKilled(e);
                  }
                }
              } else if (hitZone.state === "INTACT") {
                // Requirement 2: Armor takes full blade damage (including Redline armor-shredding, +25% Exposed, and x1.5 Harpoon aerial)
                var brokeNow = damageBruteArmorZone(e, hitZone, enemyBladeDmg);
                spawnDmgNumber(
                  zcx,
                  zr.y - 8,
                  "-" + enemyBladeDmg + " ARM" + (harpoonMult > 1 ? " (x1.5)" : (wasTripExposed ? " (+25%)" : "")),
                  harpoonMult > 1 ? "#ff8c42" : (wasTripExposed ? "#ffe066" : (isRedline ? "#ff8c29" : "#9beeff"))
                );
                spawnSparkBurst(zcx, zcy, 10, isRedline ? "#ff6b24" : "#9beeff");
                AUDIO.playArmorHit();
                if (e.type === "glider" && brokeNow) {
                  e.hp -= Math.round(enemyBladeDmg * 0.5);
                  if (e.hp <= 0) {
                    handleEnemyKilled(e);
                  }
                }
              } else {
                // Requirement 3 & 4: Broken zone takes no armor damage; hits go to main HP at x1.5 (Core: x2.0)
                var mult = (hitZone.key === "core" || hitZone.key === "carapace") ? CFG.brokenCoreHpMult : CFG.brokenZoneHpMult;
                var bruteHpDmg = Math.round(enemyBladeDmg * mult);
                if (e.freezeTimer > 0) {
                  e.freezeTimer = 0;
                  bruteHpDmg = Math.round(bruteHpDmg * 1.5);
                  triggeredShatter = true;
                  spawnDmgNumber(zcx, zr.y - 18, "SHATTER", "#ffffff");
                  shake(CFG.shatterShakeIntensity, CFG.shatterShakeDuration);
                  AUDIO.playShatterStrike();
                }
                if (e.armorCrackTimer > 0) {
                  bruteHpDmg = Math.round(bruteHpDmg * CFG.armorCrackDamageMult);
                  e.armorCrackTimer = 0;
                }
                e.hp -= bruteHpDmg;
                spawnDmgNumber(
                  zcx,
                  zr.y - 8,
                  bruteHpDmg + ((hitZone.key === "core" || hitZone.key === "carapace") ? " x2!" : " x1.5") + (wasTripExposed ? " +25%" : ""),
                  wasTripExposed ? "#ffe066" : ((hitZone.key === "core" || hitZone.key === "carapace") ? "#ff5252" : "#ffae42")
                );
                if (e.hp <= 0) {
                  handleEnemyKilled(e);
                } else {
                  spawnSparkBurst(zcx, zcy, 12, "#ff6b24");
                  AUDIO.playBladeHit(isRedline);
                }
              }
              hitAny = true;
              continue;
            }

            // Standard Mite blade damage (Step B10: Frozen Mite takes guaranteed Shatter Strike; Step B11: +25% if Exposed)
            var hitDmg = enemyBladeDmg;
            var wasFrozenMite = e.freezeTimer > 0;
            if (wasFrozenMite) {
              e.freezeTimer = 0;
              hitDmg = Math.max(e.hp, enemyBladeDmg * 2);
              triggeredShatter = true;
              spawnDmgNumber(e.x + e.w * 0.5, e.y - 18, "SHATTER", "#ffffff");
              spawnSparkBurst(e.x + e.w * 0.5, e.y + e.h * 0.5, 16, "#7af8ff");
              shake(CFG.shatterShakeIntensity, CFG.shatterShakeDuration);
              AUDIO.playShatterStrike();
            }
            var wasCracked = e.armorCrackTimer > 0;
            if (wasCracked) {
              hitDmg = Math.round(hitDmg * CFG.armorCrackDamageMult);
              e.armorCrackTimer = 0;
            }
            e.hp -= hitDmg;
            spawnDmgNumber(
              e.x + e.w * 0.5,
              e.y - 8,
              hitDmg + (wasTripExposed ? " (+25%)" : ""),
              wasFrozenMite
                ? "#7af8ff"
                : wasTripExposed
                ? "#ffe066"
                : wasCracked
                ? "#5ef2ff"
                : isRedline
                ? "#ff7730"
                : "#fff0a8"
            );

            if (e.hp <= 0) {
              handleEnemyKilled(e);
            } else {
              spawnSparkBurst(
                e.x + e.w * 0.5,
                e.y + e.h * 0.5,
                10,
                wasCracked ? "#5ef2ff" : (isRedline ? "#ff6b24" : "#ffd27d")
              );
              AUDIO.playBladeHit(isRedline);
            }
            hitAny = true;
          }
        }

        for (i = 0; i < GAME.dummies.length; i++) {
          var d = GAME.dummies[i];
          if (d.lastBladeSwingId === pl.bladeSwingId) continue;
          if (
            isBoxInBladeArc(
              d.x,
              d.y,
              d.w,
              d.h,
              shoulderX,
              shoulderY,
              pl.bladeAngle,
              CFG.bladeReach,
              halfArcRad
            )
          ) {
            d.lastBladeSwingId = pl.bladeSwingId;
            d.hits++;
            d.flashTimer = CFG.dummyFlashDuration;
            d.wobbleVel += knockDir * 12;
            if (isRedline) {
              var effDummy = GAME.bladeStats ? GAME.bladeStats.redlineEffect : "standard";
              if (effDummy === "standard" || effDummy === "magma") {
                d.burnTimer = CFG.burnDuration;
                d.burnTickTimer = CFG.burnTickInterval;
              } else if (effDummy === "volt") {
                triggerVoltCoreArcLightning(d, dmg);
              }
            }
            spawnDmgNumber(
              d.x + d.w * 0.5,
              d.y - 6,
              dmg,
              isRedline ? "#ff7730" : "#ffd478"
            );
            spawnSparkBurst(
              d.x + d.w * 0.5,
              d.y + d.h * 0.4,
              10,
              isRedline ? "#ff6b24" : "#ffd27d"
            );
            AUDIO.playBladeHit(isRedline);
            hitAny = true;
          }
        }

        // Step B7 Requirement 4: The player can also break glowing ore nodes with the blade in Run mode
        if (GAME.playMode === "RUN" && GAME.runState.oreNodes) {
          var ores = GAME.runState.oreNodes;
          for (i = 0; i < ores.length; i++) {
            var nd = ores[i];
            if (!nd.active || nd.lastBladeSwingId === pl.bladeSwingId) continue;
            if (
              isBoxInBladeArc(
                nd.x - nd.r,
                nd.y - nd.r,
                nd.r * 2,
                nd.r * 2,
                shoulderX,
                shoulderY,
                pl.bladeAngle,
                CFG.bladeReach + 6,
                halfArcRad
              )
            ) {
              nd.lastBladeSwingId = pl.bladeSwingId;
              collectOreNode(nd, false);
              hitAny = true;
            }
          }
        }

        if (hitAny) {
          var baseHitStop = pl.buzzsawActive ? 0.012 : CFG.bladeHitStopTime;
          GAME.hitStopTimer = Math.max(
            GAME.hitStopTimer,
            triggeredShatter ? CFG.shatterHitStopTime : baseHitStop
          );
          updateDebugPanelUI();
        }
      }

      function getWagonCarBySlotIndex(slotIdx) {
        var cars = GAME.bastion.cars;
        var i;
        for (i = 0; i < cars.length; i++) {
          if (cars[i].wagonSlotIndex === slotIdx) {
            return cars[i];
          }
        }
        return null;
      }

      function detonateArtilleryShell(sh) {
        var splashR = CFG.artillerySplashRadius;
        var dmg = CFG.artilleryDamage;
        GAME.runState.wagonExplosions.push({
          x: sh.x,
          y: sh.y,
          radius: splashR,
          timer: 0.26,
          maxTimer: 0.26
        });
        // Step B10 Combo 1 (Smelter Car + Artillery Car): shells carry molten slag, leaving a burning puddle
        // (radius 40 px, 6 damage per second, 4 s) where it lands.
        if (sh.moltenSlag && GAME.runState.moltenPuddles) {
          var pudY = Math.min(sh.y, GAME.bastion.floorY - 2);
          GAME.runState.moltenPuddles.push({
            x: sh.x,
            y: pudY,
            radius: CFG.comboMoltenPuddleRadius,
            dps: CFG.comboMoltenPuddleDps,
            timer: CFG.comboMoltenPuddleDuration,
            maxTimer: CFG.comboMoltenPuddleDuration,
            tickAccum: 0
          });
          spawnDmgNumber(sh.x, pudY - 16, "MOLTEN SLAG!", "#ff9429");
        }
        spawnSparkBurst(sh.x, sh.y, 16, sh.moltenSlag ? "#ff9429" : "#ff5e57");
        AUDIO.playHitEnemy();

        var i, zIdx;
        for (i = 0; i < CFG.maxEnemies; i++) {
          var e = GAME.enemies[i];
          if (!e.active) continue;
          var clX = Math.max(e.x, Math.min(sh.x, e.x + e.w));
          var clY = Math.max(e.y, Math.min(sh.y, e.y + e.h));
          var dx = clX - sh.x;
          var dy = clY - sh.y;
          if (dx * dx + dy * dy <= splashR * splashR) {
            var eCx = e.x + e.w * 0.5;
            e.hpBarTimer = CFG.enemyHpBarDuration;
            e.flashTimer = CFG.miteFlashDuration;
            e.knockVx = (eCx >= sh.x ? 1 : -1) * 140;

            if (e.useArmorZones && e.zones && e.zones.length > 0) {
              // Damage closest intact/cracked armor zone or main HP if broken
              var bestZ = null;
              var bestD = Infinity;
              for (zIdx = 0; zIdx < e.zones.length; zIdx++) {
                var z = e.zones[zIdx];
                var zr = getBruteZoneWorldRect(e, z);
                var zdx = (zr.x + zr.w * 0.5) - sh.x;
                var zdy = (zr.y + zr.h * 0.5) - sh.y;
                var d2 = zdx * zdx + zdy * zdy;
                if (z.state !== "BROKEN") d2 *= 0.5;
                if (d2 < bestD) {
                  bestD = d2;
                  bestZ = z;
                }
              }
              if (bestZ && bestZ.state !== "BROKEN") {
                damageBruteArmorZone(e, bestZ, Math.round(dmg * 0.65));
              }
            }

            e.hp -= dmg;
            spawnDmgNumber(eCx, e.y - 10, dmg, "#ff5e57");
            if (e.hp <= 0) {
              handleEnemyKilled(e);
            }
          }
        }
      }

      function updateWagonsAndEffects(dt) {
        var b = GAME.bastion;
        var rs = GAME.runState;
        var pl = GAME.player;
        if (!b.wagonSlots || !b.wagonStates) return;

        syncActiveWagonPassives();

        var actualSpeed = b.moving ? b.speed : 0;
        var trainDx = actualSpeed * dt;
        var plCx = pl.x + pl.w * 0.5;
        var plCy = pl.y + pl.h * 0.5;

        var sIdx, i, dIdx;
        for (sIdx = 0; sIdx < CFG.wagonSlotCount; sIdx++) {
          var wId = b.wagonSlots[sIdx];
          var st = b.wagonStates[sIdx];
          var car = getWagonCarBySlotIndex(sIdx);
          if (!wId || !st || !car) continue;

          var carCx = car.x + car.w * 0.5;
          var carCy = car.y + car.h * 0.5;

          if (wId === "smelter") {
            // Smelter Car: refines 4 ore into 1 Ingot every 3 s (or 1.5 s with Smelter + Artillery combo)
            var effSmeltInterval = isSlotInCombo(sIdx, "molten_barrage")
              ? CFG.comboMoltenSmeltInterval
              : CFG.smelterInterval;
            if (GAME.ore >= CFG.smelterOrePerIngot) {
              st.smeltTimer += dt;
              if (Math.random() < 0.25) {
                spawnChimneySmoke(car.x + 132, car.y - 10);
              }
              if (st.smeltTimer >= effSmeltInterval) {
                st.smeltTimer -= effSmeltInterval;
                GAME.ore -= CFG.smelterOrePerIngot;
                GAME.inventory.ingot = (GAME.inventory.ingot || 0) + CFG.smelterIngotOutput;
                spawnDmgNumber(carCx, car.y - 14, "+1 Ingot", "#ffb347");
                spawnSparkBurst(carCx, car.y + 34, 10, "#ffb347");
                AUDIO.playPickup(true);
                updateDebugPanelUI();
              }
            } else {
              st.smeltTimer = 0;
            }
          } else if (wId === "artillery") {
            // Artillery Car: roof cannon fires a shell every 2.5 s at the nearest enemy within 600 px, 40 damage, splash radius 48 px
            if (st.recoilTimer > 0) {
              st.recoilTimer = Math.max(0, st.recoilTimer - dt);
            }
            st.artilleryTimer -= dt;
            if (st.artilleryTimer <= 0) {
              var turretX = carCx;
              var turretY = car.y - 8;
              var nearest = null;
              var bestDist = CFG.artilleryRange;
              for (i = 0; i < CFG.maxEnemies; i++) {
                var en = GAME.enemies[i];
                if (!en.active) continue;
                var edx = (en.x + en.w * 0.5) - turretX;
                var edy = (en.y + en.h * 0.5) - turretY;
                var ed = Math.sqrt(edx * edx + edy * edy);
                if (ed <= bestDist) {
                  bestDist = ed;
                  nearest = en;
                }
              }
              if (nearest) {
                st.artilleryTimer = CFG.artilleryInterval;
                st.recoilTimer = 0.22;
                var tx = nearest.x + nearest.w * 0.5;
                var ty = nearest.y + nearest.h * 0.5;
                var ang = Math.atan2(ty - turretY, tx - turretX);
                st.barrelAngle = ang;
                var muzzleX = turretX + Math.cos(ang) * 24;
                var muzzleY = turretY + Math.sin(ang) * 24;
                var hasMoltenCombo = isSlotInCombo(sIdx, "molten_barrage");
                rs.artilleryShells.push({
                  x: muzzleX,
                  y: muzzleY,
                  vx: Math.cos(ang) * CFG.artilleryShellSpeed,
                  vy: Math.sin(ang) * CFG.artilleryShellSpeed,
                  targetX: tx,
                  targetY: ty,
                  moltenSlag: hasMoltenCombo,
                  life: 1.6
                });
                spawnSparkBurst(muzzleX, muzzleY, 9, hasMoltenCombo ? "#ff9429" : "#ff7b57");
                AUDIO.playArtilleryFire();
              } else {
                st.artilleryTimer = 0.25;
              }
            }
          } else if (wId === "cryo_vent") {
            // Cryo-Vent Car: every 10 s it vents freezing mist for 2 s; enemies within 150 px of the car move 60 percent slower
            if (st.cryoActiveTimer > 0) {
              st.cryoActiveTimer = Math.max(0, st.cryoActiveTimer - dt);
              // Apply cryo slow to all enemies within 150 px of the car center
              for (i = 0; i < CFG.maxEnemies; i++) {
                var ce = GAME.enemies[i];
                if (!ce.active) continue;
                var cdx = (ce.x + ce.w * 0.5) - carCx;
                var cdy = (ce.y + ce.h * 0.5) - carCy;
                if (cdx * cdx + cdy * cdy <= CFG.cryoVentRadius * CFG.cryoVentRadius) {
                  ce.cryoSlowTimer = Math.max(ce.cryoSlowTimer || 0, 0.25);
                }
              }
            } else {
              st.cryoCycleTimer += dt;
              if (st.cryoCycleTimer >= CFG.cryoVentPeriod) {
                st.cryoCycleTimer = 0;
                st.cryoActiveTimer = CFG.cryoVentDuration;
                spawnDmgNumber(carCx, car.y - 14, "CRYO VENT!", "#48f0e4");
                AUDIO.playCryoVent();
              }
            }
          } else if (wId === "shield_pylon") {
            // Shield Pylon: projects a barrier dome (radius 220 px) over the train that absorbs 100 hull damage, then recharges after 20 s
            if (st.domeHitFlashTimer > 0) {
              st.domeHitFlashTimer = Math.max(0, st.domeHitFlashTimer - dt);
            }
            if (st.domeHp <= 0) {
              st.domeRechargeTimer -= dt;
              if (st.domeRechargeTimer <= 0) {
                st.domeRechargeTimer = 0;
                st.domeHp = CFG.shieldPylonCapacity;
                spawnDmgNumber(carCx, car.y - 24, "PYLON DOME RECHARGED", "#52b8ff");
                spawnSparkBurst(carCx, car.y - 10, 14, "#52b8ff");
                AUDIO.playCheckpoint();
              }
            } else if (isSlotInCombo(sIdx, "glacial_dome")) {
              // Step B10 Combo 2 (Cryo-Vent Car + Shield Pylon): enemies touching the barrier dome freeze solid for 2 s.
              var domeCenterX = carCx;
              var domeCenterY = car.y + 30;
              var domeR = CFG.shieldPylonRadius;
              for (i = 0; i < CFG.maxEnemies; i++) {
                var fe = GAME.enemies[i];
                if (!fe.active) continue;
                var fClX = Math.max(fe.x, Math.min(domeCenterX, fe.x + fe.w));
                var fClY = Math.max(fe.y, Math.min(domeCenterY, fe.y + fe.h));
                var fdx = fClX - domeCenterX;
                var fdy = fClY - domeCenterY;
                if (fdx * fdx + fdy * fdy <= domeR * domeR) {
                  var alreadyFrozen = fe.freezeTimer > 0.35;
                  fe.freezeTimer = CFG.comboCryoDomeFreezeTime;
                  fe.vx = 0;
                  if (!alreadyFrozen) {
                    spawnDmgNumber(fe.x + fe.w * 0.5, fe.y - 14, "FROZEN!", "#7af8ff");
                    spawnSparkBurst(fe.x + fe.w * 0.5, fe.y + fe.h * 0.5, 8, "#7af8ff");
                  }
                }
              }
            }
          } else if (wId === "drone_bay") {
            // Step B9 Requirement 1 & Step B10 Combo 3 (Drone Bay + Med-Station):
            // Launches 2 small drones that collect dropped pieces and ore within 250 px (or 900 px with combo),
            // and with combo the drones also repair the hull 1 HP per second.
            if (!st.drones || st.drones.length < CFG.droneBayDroneCount) {
              st.drones = [createDefaultDroneState(0), createDefaultDroneState(1)];
            }
            var hasSalvageCombo = isSlotInCombo(sIdx, "salvage_aegis");
            if (hasSalvageCombo && b.hull > 0 && b.hull < b.maxHull) {
              b.hull = Math.min(b.maxHull, b.hull + CFG.comboDroneHullRepairRate * dt);
            }
            var rangePx = hasSalvageCombo ? CFG.comboDroneCollectRange : CFG.droneBayCollectRange;
            var trainMinX = b.rearX - rangePx;
            var trainMaxX = b.drillTipX + rangePx;
            var trainMinY = b.roofY - rangePx;
            var trainMaxY = b.floorY + rangePx;

            for (dIdx = 0; dIdx < st.drones.length; dIdx++) {
              var dr = st.drones[dIdx];
              dr.orbitPhase += dt * (2.0 + dIdx * 0.55);
              if (dr.x === 0 && dr.y === 0) {
                dr.x = carCx + (dIdx === 0 ? -28 : 28);
                dr.y = car.y - 24 - dIdx * 10;
              } else {
                dr.x += trainDx;
              }

              if (dr.carrying) {
                // Fly back to player (or Drone Bay roof if player is rebuilding) to deposit into stock
                var destX = rs.rebuildTimer > 0 ? carCx : plCx;
                var destY = rs.rebuildTimer > 0 ? (car.y - 16) : plCy;
                var rdx = destX - dr.x;
                var rdy = destY - dr.y;
                var rDist = Math.sqrt(rdx * rdx + rdy * rdy);
                var stepSpd = (CFG.droneBaySpeed + actualSpeed * 0.5) * dt;
                if (rDist <= stepSpd + 20) {
                  if (dr.carrying.type === "ore") {
                    GAME.ore += dr.carrying.units;
                    spawnDmgNumber(destX, destY - 16, "+" + dr.carrying.units + " Ore", "#48f0e4");
                    AUDIO.playPickup(false);
                  } else if (dr.carrying.type === "pickup") {
                    var mKey = dr.carrying.materialKey;
                    var mUnits = dr.carrying.units;
                    var mPrist = dr.carrying.isPristine;
                    creditMaterialToInventory(mKey, mUnits);
                    var mDef = DATA_TABLES.materials[mKey];
                    var mName = mDef ? mDef.name : mKey;
                    var mCol = mPrist ? "#ffd700" : (mDef ? mDef.color : "#68e894");
                    spawnDmgNumber(
                      destX,
                      destY - 16,
                      "+" + mUnits + " " + mName + (mPrist ? " (PRISTINE)" : ""),
                      mCol
                    );
                    AUDIO.playPickup(mPrist);
                  }
                  spawnSparkBurst(dr.x, dr.y, 6, "#68e894");
                  dr.carrying = null;
                  updateDebugPanelUI();
                } else {
                  dr.x += (rdx / rDist) * stepSpd;
                  dr.y += (rdy / rDist) * stepSpd;
                }
              } else {
                // Find closest dropped material piece or ore node within 250 px of the train hull
                var bestTargetType = null;
                var bestTargetObj = null;
                var bestTargetX = 0;
                var bestTargetY = 0;
                var bestDistSq = Infinity;

                var otherDrone = st.drones[1 - dIdx];
                var otherTargetObj = otherDrone ? otherDrone.targetObj : null;

                // 1. Check dropped material pickups
                for (i = 0; i < CFG.maxPickups; i++) {
                  var pk = GAME.pickups[i];
                  if (!pk.active || pk === otherTargetObj) continue;
                  var pkCx = pk.x + pk.w * 0.5;
                  var pkCy = pk.y + pk.h * 0.5;
                  if (pkCx < trainMinX || pkCx > trainMaxX || pkCy < trainMinY || pkCy > trainMaxY) continue;
                  var ddx = pkCx - dr.x;
                  var ddy = pkCy - dr.y;
                  var dSq = ddx * ddx + ddy * ddy;
                  if (dSq < bestDistSq) {
                    bestDistSq = dSq;
                    bestTargetType = "pickup";
                    bestTargetObj = pk;
                    bestTargetX = pkCx;
                    bestTargetY = pkCy;
                  }
                }

                // 2. Check ore nodes within 250 px of the train
                for (i = 0; i < rs.oreNodes.length; i++) {
                  var ond = rs.oreNodes[i];
                  if (!ond.active || ond === otherTargetObj) continue;
                  if (ond.x < trainMinX || ond.x > trainMaxX || ond.y < trainMinY || ond.y > trainMaxY) continue;
                  var odx = ond.x - dr.x;
                  var ody = ond.y - dr.y;
                  var oSq = odx * odx + ody * ody;
                  if (oSq < bestDistSq) {
                    bestDistSq = oSq;
                    bestTargetType = "ore";
                    bestTargetObj = ond;
                    bestTargetX = ond.x;
                    bestTargetY = ond.y;
                  }
                }

                dr.targetObj = bestTargetObj;

                if (bestTargetObj) {
                  var tdx = bestTargetX - dr.x;
                  var tdy = bestTargetY - dr.y;
                  var tDist = Math.sqrt(tdx * tdx + tdy * tdy);
                  var collectStep = (CFG.droneBaySpeed + actualSpeed * 0.4) * dt;
                  if (tDist <= collectStep + 14) {
                    dr.x = bestTargetX;
                    dr.y = bestTargetY;
                    if (bestTargetType === "pickup" && bestTargetObj.active) {
                      bestTargetObj.active = false;
                      dr.carrying = {
                        type: "pickup",
                        materialKey: bestTargetObj.materialKey,
                        units: bestTargetObj.units,
                        isPristine: bestTargetObj.isPristine
                      };
                      spawnSparkBurst(dr.x, dr.y, 7, "#68e894");
                    } else if (bestTargetType === "ore" && bestTargetObj.active) {
                      bestTargetObj.active = false;
                      var tCfgDr = getCurrentThrottleConfig();
                      var drillYieldMult = (GAME.bladeStats && GAME.bladeStats.drillOreYieldMult) ? GAME.bladeStats.drillOreYieldMult : 1.0;
                      var oreYield = Math.max(1, Math.round(CFG.oreBaseYield * tCfgDr.oreYieldMult * drillYieldMult));
                      dr.carrying = {
                        type: "ore",
                        units: oreYield
                      };
                      spawnSparkBurst(dr.x, dr.y, 8, "#48f0e4");
                    }
                    dr.targetObj = null;
                  } else {
                    dr.x += (tdx / tDist) * collectStep;
                    dr.y += (tdy / tDist) * collectStep;
                  }
                } else {
                  // Patrol/hover smoothly above the Drone Bay car
                  var hoverX = carCx + Math.cos(dr.orbitPhase) * (46 + dIdx * 24);
                  var hoverY = car.y - 26 + Math.sin(dr.orbitPhase * 1.8) * 9 - dIdx * 8;
                  dr.x += (hoverX - dr.x) * Math.min(1, dt * 6);
                  dr.y += (hoverY - dr.y) * Math.min(1, dt * 6);
                }
              }
            }
          } else if (wId === "med_station") {
            // Step B9 Requirement 2: Med-Station heals player 3 HP/s while on or within 120 px of that car,
            // and repairs the hull 1 HP/s.
            var clCarX = Math.max(car.x, Math.min(plCx, car.x + car.w));
            var clCarY = Math.max(car.y, Math.min(plCy, car.y + car.h));
            var mdx = plCx - clCarX;
            var mdy = plCy - clCarY;
            var playerNearMed = (mdx * mdx + mdy * mdy <= CFG.medStationRange * CFG.medStationRange);
            st.playerInRange = playerNearMed;

            if (playerNearMed && rs.rebuildTimer <= 0 && pl.hp > 0 && pl.hp < pl.maxHp) {
              pl.hp = Math.min(pl.maxHp, pl.hp + CFG.medStationPlayerHealRate * dt);
              st.medPulseTimer += dt;
              if (st.medPulseTimer >= 1.0) {
                st.medPulseTimer -= 1.0;
                spawnDmgNumber(plCx, pl.y - 10, "+3 HP", "#ff6b8b");
              }
            } else {
              st.medPulseTimer = 0;
            }

            if (b.hull > 0 && b.hull < b.maxHull) {
              b.hull = Math.min(b.maxHull, b.hull + CFG.medStationHullRepairRate * dt);
            }
          }
        }

        // Update active Artillery shells
        for (i = rs.artilleryShells.length - 1; i >= 0; i--) {
          var sh = rs.artilleryShells[i];
          sh.x += sh.vx * dt;
          sh.y += sh.vy * dt;
          sh.life -= dt;
          var hitSomething = false;

          // Check proximity to any enemy or target point or floor
          var eIdx;
          for (eIdx = 0; eIdx < CFG.maxEnemies; eIdx++) {
            var e = GAME.enemies[eIdx];
            if (!e.active) continue;
            if (
              sh.x + 8 >= e.x &&
              sh.x - 8 <= e.x + e.w &&
              sh.y + 8 >= e.y &&
              sh.y - 8 <= e.y + e.h
            ) {
              hitSomething = true;
              break;
            }
          }
          var dTargetSq = (sh.x - sh.targetX) * (sh.x - sh.targetX) + (sh.y - sh.targetY) * (sh.y - sh.targetY);
          if (hitSomething || dTargetSq <= 18 * 18 || sh.y >= b.floorY - 4 || WORLD.isPointInSolidTile(sh.x, sh.y)) {
            detonateArtilleryShell(sh);
            rs.artilleryShells.splice(i, 1);
            continue;
          }
          if (sh.life <= 0) {
            rs.artilleryShells.splice(i, 1);
          }
        }

        // Update splash explosion visuals
        for (i = rs.wagonExplosions.length - 1; i >= 0; i--) {
          var ex = rs.wagonExplosions[i];
          ex.timer -= dt;
          if (ex.timer <= 0) {
            rs.wagonExplosions.splice(i, 1);
          }
        }

        // Step B10 Combo 1: Update molten slag burning puddles (radius 40 px, 6 damage per second, 4 s)
        if (rs.moltenPuddles) {
          for (i = rs.moltenPuddles.length - 1; i >= 0; i--) {
            var pud = rs.moltenPuddles[i];
            pud.timer -= dt;
            if (pud.timer <= 0) {
              rs.moltenPuddles.splice(i, 1);
              continue;
            }
            var showTick = false;
            pud.tickAccum += dt;
            if (pud.tickAccum >= 0.5) {
              pud.tickAccum -= 0.5;
              showTick = true;
            }
            var pIdx2;
            for (pIdx2 = 0; pIdx2 < CFG.maxEnemies; pIdx2++) {
              var pe = GAME.enemies[pIdx2];
              if (!pe.active) continue;
              var pclX = Math.max(pe.x, Math.min(pud.x, pe.x + pe.w));
              var pclY = Math.max(pe.y, Math.min(pud.y, pe.y + pe.h));
              var pdx = pclX - pud.x;
              var pdy = pclY - pud.y;
              if (pdx * pdx + pdy * pdy <= pud.radius * pud.radius) {
                pe.hp -= pud.dps * dt;
                pe.hpBarTimer = CFG.enemyHpBarDuration;
                if (showTick) {
                  spawnDmgNumber(pe.x + pe.w * 0.5, pe.y - 10, Math.round(pud.dps * 0.5), "#ff9429");
                }
                if (pe.hp <= 0) {
                  handleEnemyKilled(pe);
                }
              }
            }
          }
        }
      }

      function updateBastionAndRun(dt) {
        if (GAME.playMode !== "RUN") return;
        var b = GAME.bastion;
        var rs = GAME.runState;
        var pl = GAME.player;
        var tCfg = getCurrentThrottleConfig();

        if (b.hullHitFlashTimer > 0) {
          b.hullHitFlashTimer = Math.max(0, b.hullHitFlashTimer - dt);
        }

        // Step B7 Requirement 1: Speed eases between notches over 0.5 s
        b.targetSpeed = CFG.trainCrawlSpeed * tCfg.speedMult;
        if (b.throttleEaseTimer > 0) {
          b.throttleEaseTimer = Math.max(0, b.throttleEaseTimer - dt);
          var prog = 1 - b.throttleEaseTimer / CFG.throttleEaseTime;
          var smoothProg = prog * prog * (3 - 2 * prog);
          b.speed = b.easeStartSpeed + (b.targetSpeed - b.easeStartSpeed) * smoothProg;
        } else {
          b.speed = b.targetSpeed;
        }

        // Train movement, hull wear per second (0 / 0.5 / 2), & Ember-Heart drain/refill (Requirement 2 & 6)
        var actualSpeed = b.moving ? b.speed : 0;
        var trainDx = actualSpeed * dt;
        if (b.moving && actualSpeed > 0) {
          b.rearX += trainDx;
          b.wheelAngle += (trainDx / 18);
          b.drillPhase += dt * 12 * tCfg.speedMult;
          b.emberHeart = Math.min(b.maxEmberHeart, b.emberHeart + CFG.emberHeartRefillRate * dt);

          // Step B7 Requirement 2: Hull wear per second (0 at Crawl, 0.5 at Cruise, 2 at Ramming Speed)
          if (tCfg.hullWearDps > 0 && GAME.mode === "PLAYING") {
            applyBastionHullDamage(tCfg.hullWearDps * dt, true);
            if (GAME.mode === "DEFEAT") return;
          }
        } else {
          b.drillPhase += dt * 4;
          // Requirement 6: The Ember-Heart still drains only when the train is stopped
          b.emberHeart = Math.max(0, b.emberHeart - CFG.emberHeartDrainRate * dt);
          if (b.emberHeart <= 0 && GAME.mode === "PLAYING") {
            b.emberHeart = 0;
            rs.defeatReason = "EMBER-HEART DEPLETED (0 / " + b.maxEmberHeart + ")";
            GAME.mode = "DEFEAT";
            INPUT.clearAll();
            AUDIO.playPlayerDefeat();
            return;
          }
        }

        syncBastionGeometry(false);

        // Step B8: Update active support wagons (Smelter, Artillery, Cryo-Vent, Shield Pylon)
        if (GAME.mode === "PLAYING") {
          updateWagonsAndEffects(dt);
        }

        // Carry player if standing on train roof platform
        if (pl.onTrainRoof && trainDx !== 0 && rs.rebuildTimer <= 0) {
          pl.x += trainDx;
        }

        // Requirement 5: The kilometre counter uses the current speed (1 km = 2700 px)
        rs.distancePx = Math.max(0, b.rearX - rs.startRearX);
        rs.distanceKm = rs.distancePx / CFG.kmLengthPx;

        // Update repeating track segments and ore nodes (~1 per 300 px) ahead and behind
        WORLD.updateRunSegments();
        spawnRunOreNodesUpTo(Math.max(b.drillTipX, pl.x) + 1900);

        // Step B7 Requirement 4: The drill collects any ore node it passes
        var oi;
        for (oi = 0; oi < rs.oreNodes.length; oi++) {
          var ond = rs.oreNodes[oi];
          if (!ond.active) continue;
          if (ond.x - ond.r <= b.drillTipX + 6 && ond.x + ond.r >= b.engineFrontX - 24) {
            collectOreNode(ond, true);
          }
        }

        // Update speed streaks (Step B7 Requirement 5)
        if (b.moving && rs.speedStreaks) {
          var stIdx;
          var streakSpd = (180 + actualSpeed * 3.2);
          for (stIdx = 0; stIdx < rs.speedStreaks.length; stIdx++) {
            var st = rs.speedStreaks[stIdx];
            st.x -= streakSpd * st.speedFactor * dt;
            if (st.x + st.len * tCfg.speedMult < -20) {
              st.x = CFG.logicalWidth + Math.random() * 140;
              st.y = 48 + Math.random() * (CFG.logicalHeight - 96);
            }
          }
        }

        // Chimney smoke & ember particles
        b.chimneyTimer -= dt;
        if (b.chimneyTimer <= 0) {
          b.chimneyTimer = b.moving ? (0.09 / tCfg.speedMult) : 0.18;
          var engCar = b.cars[b.cars.length - 1];
          if (engCar) {
            spawnChimneySmoke(engCar.x + 128, engCar.y - 14);
          }
        }

        // Drill sparks & rock chips
        if (b.moving) {
          b.drillSparkTimer -= dt;
          if (b.drillSparkTimer <= 0) {
            b.drillSparkTimer = 0.06 / Math.sqrt(tCfg.speedMult);
            spawnDrillSparksAndChips(b.drillTipX, b.floorY - 58);
          }
        }

        // Step B7 Requirement 2 & 3 + Step B12 Requirement 6 + Step B14 Requirement 3:
        // Zone-based SPAWN_TABLES in Run mode with throttle spawn density & Elite chance
        rs.miteSpawnTimer -= dt;
        if (rs.miteSpawnTimer <= 0) {
          var baseInterval = CFG.runMiteSpawnInterval / tCfg.spawnDensityMult;
          rs.miteSpawnTimer = baseInterval * (0.9 + Math.random() * 0.2);
          rs.spawnCounter++;
          var zoneKeyRun = getRunZoneKeyForDistance();
          var spVariant = pickWeightedVariantForZone(zoneKeyRun);
          var spResolved = resolveEnemyTypeAndVariant(spVariant);
          var spSkel = DATA_TABLES.enemyTypes[spResolved.skeletonKey] || DATA_TABLES.enemyTypes.mite;
          var spHeight = spSkel.height || CFG.miteHeight;
          var spawnY = spSkel.flying
            ? (b.roofY - 82 - (rs.spawnCounter % 3) * 24)
            : (b.floorY - spHeight);
          var isEliteSpawn = Math.random() < tCfg.eliteChance;
          var spawnDist = CFG.runMiteSpawnMinDist + Math.random() * (CFG.runMiteSpawnMaxDist - CFG.runMiteSpawnMinDist);
          spawnEnemy(Math.round(b.drillTipX + spawnDist), spawnY, spResolved.variantId, -1, isEliteSpawn);
          recountActiveEnemies();
        }

        // Player rebuild in Foundry Car after 2-second fade (Requirement 9 & Step R3 Requirement 7)
        if (rs.rebuildTimer > 0) {
          rs.rebuildTimer = Math.max(0, rs.rebuildTimer - dt);
          pl.x = getSafeFoundryRoofSpawnX();
          pl.y = b.roofY - pl.h;
          if (rs.rebuildTimer <= 0) {
            pl.hp = pl.maxHp;
            pl.maxShield = getEffectiveLeashShieldMax();
            pl.shield = pl.maxShield;
            pl.tetherRecalling = false;
            pl.harpoonSoftSpringActive = false;
            if (rs.harpoon) {
              rs.harpoon.active = false;
              rs.harpoon.state = "IDLE";
            }
            pl.heat = 0;
            pl.overheatTimer = 0;
            // Step R3 Requirement 7: A rebuild places them on Foundry Car roof with 1.5 s immunity to all damage
            pl.invulnTimer = CFG.rebuildImmuneTime;
            pl.drillImmuneTimer = CFG.drillImmuneTime;
            pl.inDrillZone = false;
            pl.airJumpsLeft = CFG.maxAirJumps;
            pl.vx = 0;
            pl.vy = 0;
            pl.onGround = true;
            pl.onTrainRoof = true;
            rs.outOfBoundsTimer = 0;
            spawnSparkBurst(pl.x + pl.w * 0.5, pl.y + pl.h * 0.5, 18, "#48f0e4");
            AUDIO.playCheckpoint();
            updateDebugPanelUI();
          }
        }

        // Step R3 Requirement 8 + Step R4 Requirement 3: Falling behind or too far ahead in Run mode:
        // If more than 1400 px behind the train, or more than 900 px ahead of the drill, for 3 seconds in a row,
        // show RETURNING and use the Return 0.2s blue flash effect to return to the Foundry Car roof.
        if (GAME.mode === "PLAYING" && rs.rebuildTimer <= 0 && !pl.tetherRecalling) {
          var isTooFarBehind = (pl.x + pl.w) < (b.rearX - CFG.behindTrainMaxDist);
          var isTooFarAhead = pl.x > (b.drillTipX + CFG.aheadDrillMaxDist);
          if (isTooFarBehind || isTooFarAhead) {
            rs.outOfBoundsTimer = (rs.outOfBoundsTimer || 0) + dt;
            if (rs.outOfBoundsTimer >= CFG.outOfBoundsReturnTime) {
              rs.outOfBoundsTimer = 0;
              rs.returningBannerTimer = 1.4;
              startTetherRecall(pl, true);
              updateDebugPanelUI();
            }
          } else {
            rs.outOfBoundsTimer = 0;
          }
        } else {
          rs.outOfBoundsTimer = 0;
        }
      }

      function checkPlayerBastionInteractions(pl, prevBottom) {
        if (GAME.playMode !== "RUN") {
          pl.onTrainRoof = false;
          pl.inDrillZone = false;
          return;
        }
        var hp = GAME.runState.harpoon;
        if (pl.tetherRecalling || (hp && hp.active && hp.state === "REELING")) {
          return;
        }
        var b = GAME.bastion;

        // 1. Roof platform collision across the train cars (from rearX to engineFrontX at y = b.roofY)
        // Step R3 Requirement 6: Player can walk off the front-top of the roof and drop in front of the drill,
        // or drop off the back end of the train, or off the sides of any wagon.
        var roofLeft = b.rearX;
        var roofRight = b.engineFrontX;
        if (
          pl.vy >= 0 &&
          pl.x + pl.w > roofLeft + 2 &&
          pl.x < roofRight - 2 &&
          prevBottom <= b.roofY + 10 &&
          pl.y + pl.h >= b.roofY
        ) {
          pl.y = b.roofY - pl.h;
          pl.vy = 0;
          pl.onGround = true;
          pl.onTrainRoof = true;
          // Step R3 Requirement 1: Air jump resets on standing on the train roof
          pl.airJumpsLeft = Math.max(pl.airJumpsLeft || 0, CFG.maxAirJumps);
          pl.inDrillZone = false;
        }

        // 2. Step R3 Requirement 4, 5 & 6: Drill hitbox & damage rules
        // The damaging area is ONLY the spinning cone at the front of the engine (front 70% of the cone).
        // It does NOT include the train roof, the engine body, or any space above the roofline.
        // Anything whose feet are at or above the roofline is NEVER hit by the drill.
        var dRect = getDrillHitboxRect();
        var overlapsDrillCone =
          pl.x + pl.w > dRect.x &&
          pl.x < dRect.x + dRect.w &&
          pl.y + pl.h > dRect.y &&
          pl.y < dRect.y + dRect.h;

        if (!overlapsDrillCone) {
          pl.inDrillZone = false;
          return;
        }

        // Requirement 4 & 5: Feet at or above the roofline, or standing on the roof -> never hit by the drill
        if (pl.onTrainRoof || (pl.y + pl.h) <= b.roofY + 2) {
          return;
        }

        // Requirement 5 & 6: Cannot be hit by the drill again until leaving the drill area, and while immune standing in the drill area is allowed
        if (pl.inDrillZone || pl.drillImmuneTimer > 0 || pl.invulnTimer > 0) {
          return;
        }

        // Touching the cone from the front or below the roofline while not on the roof:
        // 15 damage, pushed forward and slightly up away from the train (vx = 320, vy = -200),
        // immune to drill damage for 1.5 s, and cannot be hit again until leaving the drill area.
        // Never bounce the player up onto the drill or the roof!
        var plCx = pl.x + pl.w * 0.5;
        pl.vx = CFG.drillPushVx;   // +320 px/s forward away from the train
        pl.vy = CFG.drillPushVy;   // -200 px/s slightly up
        pl.x = Math.max(pl.x, dRect.x + dRect.w - 2);
        pl.onGround = false;
        pl.onTrainRoof = false;
        pl.hurtLockTimer = CFG.playerHurtLockTime;
        pl.drillImmuneTimer = CFG.drillImmuneTime; // 1.5 s immunity to drill damage
        pl.invulnTimer = Math.max(pl.invulnTimer, CFG.playerInvulnTime);
        pl.inDrillZone = true;

        applyDamageToPlayer(pl, CFG.drillContactDamage, plCx, pl.y - 8);
        spawnSparkBurst(dRect.x + dRect.w * 0.5, pl.y + pl.h * 0.5, 14, "#ff9436");
        shake(4, 0.14);
        if (pl.hp <= 0) {
          handlePlayerDeath(pl);
        } else {
          AUDIO.playPlayerHurt();
        }
        updateDebugPanelUI();
      }

      function updateKineticTether(dt) {
        var pl = GAME.player;
        var rs = GAME.runState;
        if (GAME.playMode === "RUN" && rs && rs.rebuildTimer > 0) {
          pl.tetherRecalling = false;
          pl.returnFadeTimer = 0;
          updateTetherButtonUI();
          return;
        }

        if (pl.harpoonCooldownTimer > 0) {
          pl.harpoonCooldownTimer = Math.max(0, pl.harpoonCooldownTimer - dt);
        }
        if (pl.tetherRecallCooldownTimer > 0) {
          pl.tetherRecallCooldownTimer = Math.max(0, pl.tetherRecallCooldownTimer - dt);
        }
        if (pl.tripwireCooldownTimer > 0) {
          pl.tripwireCooldownTimer = Math.max(0, pl.tripwireCooldownTimer - dt);
        }
        if (pl.shieldHitFlashTimer > 0) {
          pl.shieldHitFlashTimer = Math.max(0, pl.shieldHitFlashTimer - dt);
        }
        if (pl.shieldBreakFlashTimer > 0) {
          pl.shieldBreakFlashTimer = Math.max(0, pl.shieldBreakFlashTimer - dt);
        }
        if (rs && rs.returningBannerTimer > 0) {
          rs.returningBannerTimer = Math.max(0, rs.returningBannerTimer - dt);
        }
        if (rs && rs.returningFlashTimer > 0) {
          rs.returningFlashTimer = Math.max(0, rs.returningFlashTimer - dt);
        }

        var hp = rs ? rs.harpoon : null;
        var tw = rs ? rs.tripwire : null;

        // Step R4 Requirement 4: Update active Harpoon (flight, yank, reel, or retract) in Run and Sandbox
        if (hp && hp.active) {
          updateHarpoon(dt);
        }

        // Step R4 Requirement 5: Update active 2-post Tripwire (8s duration, knee-height wire, sparks, enemy stun + shock)
        if (tw && tw.active) {
          if (tw.tripFlashTimer > 0) {
            tw.tripFlashTimer = Math.max(0, tw.tripFlashTimer - dt);
          }
          tw.timer -= dt;
          if (tw.timer <= 0) {
            retractTripwire(false);
          } else {
            var wx1 = tw.x1;
            var wy1 = tw.y1 - 12;
            var wx2 = tw.x2;
            var wy2 = tw.y2 - 12;
            var wdx = wx2 - wx1;
            var wdy = wy2 - wy1;

            // Crackling sparks along the knee-height wire
            tw.sparkTimer = (tw.sparkTimer || 0) - dt;
            if (tw.sparkTimer <= 0) {
              tw.sparkTimer = 0.08;
              var spT = 0.10 + Math.random() * 0.80;
              var spX = wx1 + wdx * spT;
              var spY = wy1 + wdy * spT;
              spawnDust(spX, spY, 1, Math.random() < 0.5 ? "#5ef2ff" : "#ffe082");
            }

            // Line-segment collision against active enemies
            var eIdx;
            for (eIdx = 0; eIdx < CFG.maxEnemies; eIdx++) {
              var e = GAME.enemies[eIdx];
              if (!e.active) continue;
              if (lineSegmentIntersectsRect(wx1, wy1, wx2, wy2, e.x, e.y, e.w, e.h)) {
                var eCx = e.x + e.w * 0.5;
                var eCy = e.y + e.h * 0.5;

                // Trip enemy on first contact with this wire OR automatically if in the middle of a lunge or slam
                var isAttacking = e.state === "LUNGE" || e.state === "TELEGRAPH" || e.state === "DIVE";
                if (e.trippedByWireId !== tw.id || isAttacking) {
                  e.trippedByWireId = tw.id;
                  e.lungeTimer = 0;
                  e.telegraphTimer = 0;
                  e.recoverTimer = 0;
                  e.state = "STAGGER";
                  e.staggerTimer = Math.max(e.staggerTimer, CFG.tripwireStunTime);
                  e.tripStunTimer = CFG.tripwireStunTime;
                  e.tripExposed = true;
                  e.vx = 0;
                  e.knockVx = -e.dir * 85;
                  e.flashTimer = 0.16;
                  e.hpBarTimer = CFG.enemyHpBarDuration;

                  tw.tripFlashTimer = 0.22;
                  tw.lastTripX = eCx;
                  tw.lastTripY = eCy;

                  spawnSparkBurst(eCx, eCy, 14, "#5ef2ff");
                  spawnDmgNumber(
                    eCx,
                    e.y - 16,
                    isAttacking ? "ATTACK TRIPPED!" : "TRIPPED! (EXPOSED)",
                    "#5ef2ff"
                  );
                  AUDIO.playTripwireTrip();
                }

                // 15 shock damage per second while touching the wire
                e.hp -= CFG.tripwireShockDps * dt;
                e.hpBarTimer = CFG.enemyHpBarDuration;
                e.shockTickTimer = (e.shockTickTimer || 0) + dt;
                if (e.shockTickTimer >= 0.40) {
                  e.shockTickTimer -= 0.40;
                  spawnDmgNumber(eCx, e.y - 8, Math.round(CFG.tripwireShockDps * 0.40), "#ffe082");
                  spawnSparkBurst(eCx, eCy, 4, "#ffe082");
                }
                if (e.hp <= 0) {
                  handleEnemyKilled(e);
                }
              }
            }
          }
        }

        // Step R4 Requirement 3: RETURN button 0.2s blue flash fade (no wire or line drawn; invulnerable during it)
        if (pl.tetherRecalling) {
          pl.invulnTimer = Math.max(pl.invulnTimer, 0.10);
          pl.vx = 0;
          pl.vy = 0;
          pl.returnFadeTimer = (pl.returnFadeTimer || 0) - dt;
          if (Math.random() < 0.8) {
            spawnDust(pl.x + pl.w * 0.5, pl.y + pl.h * 0.5, 1, "#35E0F0");
          }
          if (pl.returnFadeTimer <= 0) {
            completeReturnFadeTeleport(pl);
          }
        }

        // Step R4 Requirement 1 & 2: No Leash clamp or pull! Player can walk any distance from the train.
        // Shield recharges 6 points/s while within 500 px of any train car, and 2 points/s beyond that.
        var plCx = pl.x + pl.w * 0.5;
        var plCy = pl.y + pl.h * 0.5;
        var minCarDist = 0;
        if (GAME.playMode === "RUN" && GAME.bastion && GAME.bastion.cars && GAME.bastion.cars.length > 0) {
          minCarDist = 999999;
          var ci;
          for (ci = 0; ci < GAME.bastion.cars.length; ci++) {
            var car = GAME.bastion.cars[ci];
            var clX = Math.max(car.x, Math.min(plCx, car.x + car.w));
            var clY = Math.max(car.y, Math.min(plCy, car.y + car.h));
            var cdx = plCx - clX;
            var cdy = plCy - clY;
            var cDist = Math.sqrt(cdx * cdx + cdy * cdy);
            if (cDist < minCarDist) {
              minCarDist = cDist;
            }
          }
        } else {
          var refX = (GAME.lastCheckpoint ? GAME.lastCheckpoint.x : CFG.startX) + pl.w * 0.5;
          var refY = (GAME.lastCheckpoint ? GAME.lastCheckpoint.y : CFG.startY) + pl.h * 0.5;
          var sdx = plCx - refX;
          var sdy = plCy - refY;
          minCarDist = Math.sqrt(sdx * sdx + sdy * sdy);
        }

        pl.tetherDist = minCarDist;
        pl.tetherInShieldRange = (minCarDist <= CFG.tetherShieldRange);
        pl.maxShield = getEffectiveLeashShieldMax();
        if (pl.shieldEnabled && pl.shield < pl.maxShield) {
          var rechargeRate = pl.tetherInShieldRange
            ? CFG.tetherShieldRechargeRate
            : CFG.tetherShieldFarRechargeRate;
          pl.shield = Math.min(pl.maxShield, pl.shield + rechargeRate * dt);
        }

        updateTetherButtonUI();
      }

      function updatePlayerPhysics(dt) {
        var pl = GAME.player;
        if (GAME.playMode === "RUN" && GAME.runState.rebuildTimer > 0) {
          return;
        }
        pl.wasOnGround = pl.onGround;
        var prevBottom = pl.y + pl.h;

        if (pl.invulnTimer > 0) {
          pl.invulnTimer = Math.max(0, pl.invulnTimer - dt);
        }
        if (pl.drillImmuneTimer > 0) {
          pl.drillImmuneTimer = Math.max(0, pl.drillImmuneTimer - dt);
        }
        if (pl.hurtLockTimer > 0) {
          pl.hurtLockTimer = Math.max(0, pl.hurtLockTimer - dt);
        }
        if (pl.squashTimer > 0) {
          pl.squashTimer = Math.max(0, pl.squashTimer - dt);
          if (pl.squashTimer <= 0) {
            pl.squashScaleX = 1;
            pl.squashScaleY = 1;
          }
        }
        if (GAME.doubleJumpRings && GAME.doubleJumpRings.length > 0) {
          var rIdx;
          for (rIdx = GAME.doubleJumpRings.length - 1; rIdx >= 0; rIdx--) {
            GAME.doubleJumpRings[rIdx].timer -= dt;
            if (GAME.doubleJumpRings[rIdx].timer <= 0) {
              GAME.doubleJumpRings.splice(rIdx, 1);
            }
          }
        }
        if (GAME.checkpointBannerTimer > 0) {
          GAME.checkpointBannerTimer = Math.max(0, GAME.checkpointBannerTimer - dt);
        }
        if (GAME.switchEdgeFlashTimer > 0) {
          GAME.switchEdgeFlashTimer = Math.max(0, GAME.switchEdgeFlashTimer - dt);
        }
        if (pl.heldItemTimer > 0) {
          pl.heldItemTimer = Math.max(0, pl.heldItemTimer - dt);
        }
        if (pl.doubleJumpAnimTimer > 0) {
          pl.doubleJumpAnimTimer = Math.max(0, pl.doubleJumpAnimTimer - dt);
        }

        var isOverheated = pl.overheatTimer > 0;
        var cap = GAME.bladeStats ? GAME.bladeStats.heatCapacity : 100;
        pl.heatCapacity = cap;
        if (isOverheated) {
          pl.overheatTimer = Math.max(0, pl.overheatTimer - dt);
          pl.steamSpawnTimer -= dt;
          if (pl.steamSpawnTimer <= 0) {
            pl.steamSpawnTimer = 0.09;
            spawnSteam(pl.x + pl.w * 0.5, pl.y + 8, 2);
          }
          if (pl.overheatTimer <= 0) {
            pl.overheatTimer = 0;
            pl.heat = CFG.overheatResetHeat;
            pl.heatPoints = Math.round((pl.heat / 100) * cap);
            pl.heatCoolDelayTimer = 0;
            updateDebugPanelUI();
          }
        } else {
          if (pl.heatCoolDelayTimer > 0) {
            pl.heatCoolDelayTimer = Math.max(0, pl.heatCoolDelayTimer - dt);
          } else if (pl.heat > CFG.heatMin) {
            pl.heat = Math.max(CFG.heatMin, pl.heat - getEffectiveHeatCoolRate() * dt);
            pl.heatPoints = Math.round((pl.heat / 100) * cap);
          }
        }

        if (pl.bladeHangTimer > 0) {
          pl.bladeHangTimer = Math.max(0, pl.bladeHangTimer - dt);
        }

        // If Tether Recall or Harpoon Reel is active, updateKineticTether moves the player directly along the cable
        var hp = GAME.runState ? GAME.runState.harpoon : null;
        if (pl.tetherRecalling || (hp && hp.active && hp.state === "REELING")) {
          updateKineticTether(dt);
          if (pl.tetherRecalling || (hp && hp.active && hp.state === "REELING")) {
            pl.animTime += dt;
            pl.pose = "jump";
            return;
          }
        }

        var moveDir = isOverheated
          ? 0
          : (INPUT.held.right ? 1 : 0) - (INPUT.held.left ? 1 : 0);
        if (moveDir !== 0 && pl.hurtLockTimer <= 0 && pl.bladeTimer <= 0 && !pl.buzzsawActive) {
          pl.facing = moveDir;
        }

        // Step B13 Requirement 2: Buzzsaw slows movement 50% while held
        var maxRunSpd = pl.buzzsawActive
          ? CFG.runSpeed * (GAME.bladeStats ? GAME.bladeStats.moveSpeedMultWhileHeld : 0.50)
          : (pl.onGround && pl.bladeTimer > 0
            ? CFG.runSpeed * CFG.bladeGroundSpeedMult
            : CFG.runSpeed);

        var controlMult = pl.onGround ? 1.0 : CFG.airControl;
        if (pl.hurtLockTimer <= 0) {
          if (moveDir !== 0) {
            var accel = CFG.groundAccel * controlMult;
            pl.vx += moveDir * accel * dt;
            if (pl.vx > maxRunSpd) pl.vx = maxRunSpd;
            if (pl.vx < -maxRunSpd) pl.vx = -maxRunSpd;
          } else {
            var fric = CFG.groundFriction * controlMult * dt;
            if (Math.abs(pl.vx) <= fric) {
              pl.vx = 0;
            } else {
              pl.vx -= (pl.vx > 0 ? 1 : -1) * fric;
            }
          }
        }

        // Step R3 Requirement 1: Air jump resets on landing and on standing on the train roof
        if (pl.onGround || pl.onTrainRoof) {
          pl.coyoteTimer = CFG.coyoteTime;
          pl.bladeHangTimer = 0;
          pl.airJumpsLeft = Math.max(pl.airJumpsLeft || 0, CFG.maxAirJumps);
        } else {
          pl.coyoteTimer = Math.max(0, pl.coyoteTimer - dt);
        }

        if (pl.jumpBufferTimer > 0) {
          pl.jumpBufferTimer = Math.max(0, pl.jumpBufferTimer - dt);
        }

        // Step R3 Requirement 1 & 2:
        // Jump speed 880 px/s (~6 tiles high); double-jump speed 780 px/s (~4.7 tiles);
        // Pressing Jump in the air with an air jump left performs the double jump;
        // with none left, the press is buffered for landing.
        if (!isOverheated && INPUT.justPressedJump) {
          if (pl.coyoteTimer > 0) {
            pl.vy = -CFG.jumpSpeed;
            pl.onGround = false;
            pl.onTrainRoof = false;
            pl.coyoteTimer = 0;
            pl.jumpBufferTimer = 0;
            pl.jumpCutApplied = false;
            pl.squashMaxTimer = 0.16;
            pl.squashTimer = 0.16;
            pl.squashScaleX = 0.84;
            pl.squashScaleY = 1.18;
            spawnDust(pl.x + pl.w * 0.5, pl.y + pl.h, 6, "#d99b66");
            AUDIO.playJump();
          } else if (pl.airJumpsLeft > 0) {
            pl.airJumpsLeft = Math.max(0, pl.airJumpsLeft - 1);
            pl.vy = -CFG.doubleJumpSpeed;
            pl.onGround = false;
            pl.onTrainRoof = false;
            pl.jumpBufferTimer = 0;
            pl.jumpCutApplied = false;
            pl.doubleJumpAnimTimer = 0.36;
            pl.squashMaxTimer = 0.18;
            pl.squashTimer = 0.18;
            pl.squashScaleX = 0.78;
            pl.squashScaleY = 1.24;
            GAME.doubleJumpRings.push({
              x: pl.x + pl.w * 0.5,
              y: pl.y + pl.h - 2,
              timer: 0.24,
              maxTimer: 0.24
            });
            spawnDust(pl.x + pl.w * 0.5, pl.y + pl.h, 8, "#d9c2a3");
            spawnSparkBurst(pl.x + pl.w * 0.5, pl.y + pl.h - 2, 10, "#35E0F0");
            AUDIO.playDoubleJump();
          } else {
            pl.jumpBufferTimer = CFG.jumpBuffer;
          }
        } else if (!isOverheated && pl.jumpBufferTimer > 0 && pl.coyoteTimer > 0) {
          pl.vy = -CFG.jumpSpeed;
          pl.onGround = false;
          pl.onTrainRoof = false;
          pl.coyoteTimer = 0;
          pl.jumpBufferTimer = 0;
          pl.jumpCutApplied = false;
          pl.squashMaxTimer = 0.16;
          pl.squashTimer = 0.16;
          pl.squashScaleX = 0.84;
          pl.squashScaleY = 1.18;
          spawnDust(pl.x + pl.w * 0.5, pl.y + pl.h, 6, "#d99b66");
          AUDIO.playJump();
        }

        // Variable jump height: releasing Jump early cuts the rise to 40 percent
        if (!INPUT.held.jump && pl.vy < 0 && !pl.jumpCutApplied) {
          pl.vy *= CFG.earlyJumpCutMultiplier;
          pl.jumpCutApplied = true;
        }

        // Step B13 Requirement 3: Counterweight aerial hang-time = seconds of reduced gravity during an air swing
        if (!pl.onGround && pl.bladeHangTimer > 0) {
          pl.vy += CFG.gravity * 0.20 * dt;
          if (pl.vy > 55) {
            pl.vy = 55;
          }
        } else {
          pl.vy += CFG.gravity * dt;
          if (pl.vy > CFG.maxFallSpeed) {
            pl.vy = CFG.maxFallSpeed;
          }
        }

        var totalDx = pl.vx * dt;
        var totalDy = pl.vy * dt;
        var maxStep = 10;
        var steps = Math.max(1, Math.ceil(Math.max(Math.abs(totalDx), Math.abs(totalDy)) / maxStep));
        var stepDx = totalDx / steps;
        var stepDy = totalDy / steps;

        pl.onGround = false;
        pl.onTrainRoof = false;
        var s;
        for (s = 0; s < steps; s++) {
          var subPrevBot = pl.y + pl.h;
          if (stepDy < 0) {
            if (moveAndCollideY(pl, stepDy)) {
              stepDy = 0;
            }
            if (stepDx !== 0 && moveAndCollideX(pl, stepDx)) {
              stepDx = 0;
            }
          } else {
            if (stepDx !== 0 && moveAndCollideX(pl, stepDx)) {
              stepDx = 0;
            }
            if (stepDy !== 0 && moveAndCollideY(pl, stepDy)) {
              stepDy = 0;
            }
          }
          checkPlayerBastionInteractions(pl, subPrevBot);
        }
        checkPlayerBastionInteractions(pl, prevBottom);

        // Enforce Kinetic Tether leash, elastic pull, and shield recharge in Run mode
        updateKineticTether(dt);

        if (pl.onGround && !pl.wasOnGround) {
          pl.airJumpsLeft = Math.max(pl.airJumpsLeft || 0, CFG.maxAirJumps);
          pl.squashMaxTimer = 0.12;
          pl.squashTimer = 0.12;
          pl.squashScaleX = 1.15;
          pl.squashScaleY = 0.86;
          spawnDust(pl.x + pl.w * 0.5, pl.y + pl.h, 5, "#b8a388");
          AUDIO.playLand();
        }

        // Check checkpoints and spike hazards (Sandbox mode)
        if (GAME.playMode === "SANDBOX") {
          checkPlayerHazardsAndCheckpoints(pl);
        }

        if (pl.y > GAME.worldHeight + 64) {
          if (GAME.playMode === "RUN") {
            pl.x = getSafeFoundryRoofSpawnX();
            pl.y = GAME.bastion.roofY - pl.h;
            pl.onGround = true;
            pl.onTrainRoof = true;
            pl.airJumpsLeft = CFG.maxAirJumps;
          } else if (GAME.lastCheckpoint) {
            pl.x = GAME.lastCheckpoint.x;
            pl.y = GAME.lastCheckpoint.y;
          } else {
            pl.x = CFG.startX;
            pl.y = CFG.startY;
          }
          pl.vx = 0;
          pl.vy = 0;
        }

        pl.animTime += dt;
        if (!pl.onGround) {
          pl.pose = pl.vy < 0 ? "jump" : "fall";
        } else if (Math.abs(pl.vx) > 15) {
          pl.pose = "run";
          if (Math.floor(pl.animTime * 10) !== Math.floor((pl.animTime - dt) * 10)) {
            spawnDust(pl.x + pl.w * 0.5, pl.y + pl.h, 1, "#8c7a65");
          }
        } else {
          pl.pose = "idle";
        }
      }

      function hasFloorAhead(ent, dir) {
        var ts = CFG.tileSize;
        var leadX = dir > 0 ? (ent.x + ent.w + 2) : (ent.x - 2);
        var col = Math.floor(leadX / ts);
        var footRow = Math.floor((ent.y + ent.h + 2) / ts);
        // Also avoid walking into floor spikes '^'
        if (WORLD.getTile(col, Math.floor((ent.y + ent.h - 2) / ts)) === "^") {
          return false;
        }
