          // 8. Projectiles (Ember Bolts & Step B14 Enemy Projectiles + Spore Hazard Clouds)
          RENDER.drawBolts(ctx, camX, camY);
          RENDER.drawEnemyProjectiles(ctx, camX, camY);

          // 9. Combat Particles (respecting Reduce particles cap)
          var i;
          var pCap = GAME.particleCap || CFG.maxParticles;
          for (i = 0; i < pCap; i++) {
            var p = GAME.particles[i];
            if (!p || !p.active) continue;
            var px = p.x - camX;
            var py = p.y - camY;
            if (px < -10 || px > viewW + 10 || py < -10 || py > viewH + 10) continue;
            ctx.fillStyle = p.color;
            ctx.fillRect(px - p.size * 0.5, py - p.size * 0.5, p.size, p.size);
          }

          // Restore unscaled logical coordinate space for foreground silhouettes, ambient motes, 20px damage numbers, and HUD
          ctx.restore();

          // 9b. Step R7 Requirement 3: Up to 60 floating cyan spores + soft glow blobs
          RENDER.drawAmbientParticles(ctx, curBiome);

          // 9c. Step R7 Requirement 3 & 10: Foreground silhouette layer (1.3x camera speed, at top and bottom edges)
          if (GAME.layer4Visible !== false && bp && bp.fgCanvas) {
            var fgTileW = bp.fgCanvas.width || 960;
            var fgShift = -(((camX * 1.3) % fgTileW + fgTileW) % fgTileW);
            var fgX;
            for (fgX = fgShift; fgX < lw; fgX += fgTileW) {
              ctx.drawImage(bp.fgCanvas, fgX, 0);
            }
          }

          // 10. Floating Damage Numbers & Pickup Text (Step R1 Req 6: at least 20 px logical text)
          RENDER.drawDmgNumbers(ctx, camX, camY, zoom);

          // 11. Top HUD Bar (Unshaken, unified layout across all modes)
          RENDER.drawHudStatus(ctx, curZone, curBiome);

          // 11b. Step R7 Requirement 10: On-screen particle count debug overlay when toggled
          if (GAME.showParticleCountDebug) {
            var totPart = (GAME.activeParticleCount || 0) + (GAME.activeAmbientCount || 0);
            ctx.save();
            ctx.fillStyle = "rgba(12, 10, 16, 0.92)";
            ctx.strokeStyle = totPart < 150 ? "#4CF5C8" : "#FF5A36";
            ctx.lineWidth = 2;
            ctx.fillRect(16, 92, 316, 26);
            ctx.strokeRect(16, 92, 316, 26);
            RENDER.drawOutlinedHudText(
              ctx,
              "PARTICLES: " + totPart + " / 148 (FX:" + (GAME.activeParticleCount || 0) + " SPORES:" + (GAME.activeAmbientCount || 0) + ")",
              24,
              110,
              "#4CF5C8",
              "left",
              14
            );
            ctx.restore();
          }

          // 12. Mouse Crosshair
          if (INPUT.mouseActive && INPUT.aimMode === "mouse" && GAME.mode === "PLAYING") {
            RENDER.drawCrosshair(ctx, INPUT.mouseLogicalX, INPUT.mouseLogicalY);
          }
        },

        drawBastion: function (ctx, camX, camY) {
          var b = GAME.bastion;
          var cars = b.cars;
          var floorScreenY = Math.round(b.floorY - camY);
          var roofScreenY = Math.round(b.roofY - camY);
          var isHullFlash = b.hullHitFlashTimer > 0;
          var i, wIdx;

          // 1. Draw couplers between cars (plus Step B10 Req 4: spark arc between adjacent combo cars)
          for (i = 0; i < cars.length - 1; i++) {
            var cLeft = cars[i];
            var cRight = cars[i + 1];
            var coupX = Math.round(cLeft.x + cLeft.w - camX);
            var coupY = floorScreenY - 38;
            if (coupX + CFG.trainCouplerGap < -20 || coupX > CFG.logicalWidth + 20) continue;

            // Pixel-art coupler sprite (4x5 art px -> 16x20 world px) + roof catwalk plate
            drawSprite(ctx, "bastion_coupler", 0, coupX - 1, coupY, false, 4);
            ctx.fillStyle = "#0C0A10";
            ctx.fillRect(coupX - 2, roofScreenY, CFG.trainCouplerGap + 4, 8);
            ctx.fillStyle = "#C9962E";
            ctx.fillRect(coupX - 2, roofScreenY, CFG.trainCouplerGap + 4, 4);

            // Step B10 Requirement 4: Draw a small spark arc between the two cars while a combo is active
            var adjCombo = getAdjacentComboBetweenSlots(cLeft.wagonSlotIndex, cRight.wagonSlotIndex);
            if (adjCombo) {
              var arcX1 = coupX - 8;
              var arcX2 = coupX + CFG.trainCouplerGap + 8;
              var arcMidX = (arcX1 + arcX2) * 0.5;
              var arcY = roofScreenY + 38;
              var jitterA = Math.sin(GAME.time * 28 + i * 2.1) * 7;
              var jitterB = Math.cos(GAME.time * 34 + i * 1.7) * 6;
              ctx.save();
              ctx.strokeStyle = adjCombo.colour;
              ctx.lineWidth = 3.5;
              ctx.beginPath();
              ctx.moveTo(arcX1, arcY);
              ctx.lineTo(arcMidX - 4, arcY - 8 + jitterA);
              ctx.lineTo(arcMidX + 4, arcY + 6 + jitterB);
              ctx.lineTo(arcX2, arcY);
              ctx.stroke();

              ctx.strokeStyle = "#ffffff";
              ctx.lineWidth = 1.6;
              ctx.beginPath();
              ctx.moveTo(arcX1, arcY);
              ctx.lineTo(arcMidX - 3, arcY - 6 + jitterA * 0.7);
              ctx.lineTo(arcMidX + 3, arcY + 4 + jitterB * 0.7);
              ctx.lineTo(arcX2, arcY);
              ctx.stroke();

              ctx.strokeStyle = adjCombo.colour;
              ctx.lineWidth = 2.2;
              ctx.beginPath();
              ctx.moveTo(arcX1 + 2, roofScreenY + 4);
              ctx.lineTo(arcMidX, roofScreenY - 7 - jitterB * 0.8);
              ctx.lineTo(arcX2 - 2, roofScreenY + 4);
              ctx.stroke();
              ctx.restore();
            }
          }

          // 2. Draw each car (1 art px = 4 world px; roofline at y = sy)
          for (i = 0; i < cars.length; i++) {
            var car = cars[i];
            var sx = Math.round(car.x - camX);
            var sy = Math.round(car.y - camY);
            if (sx + car.w < -240 || sx > CFG.logicalWidth + 240) continue;

            if (car.isFlatbed) {
              // Empty Wagon Slot (30x30 art px = 120x120 world px)
              drawSprite(ctx, "wagon_empty", 0, sx, sy, false, 4);
            } else if (car.wagonId) {
              var wSlotIdx = car.wagonSlotIndex;
              var wState = (b.wagonStates && b.wagonStates[wSlotIdx]) ? b.wagonStates[wSlotIdx] : null;

              if (car.wagonId === "smelter") {
                var smeltActive = GAME.ore >= CFG.smelterOrePerIngot;
                var effSmeltIntDraw = isSlotInCombo(wSlotIdx, "molten_barrage")
                  ? CFG.comboMoltenSmeltInterval
                  : CFG.smelterInterval;
                var smeltProg = (wState && smeltActive) ? Math.min(1, wState.smeltTimer / effSmeltIntDraw) : 0;
                var smeltFrame = Math.floor(GAME.time * (smeltActive ? 6 : 2)) % 2;
                drawSprite(ctx, "wagon_smelter", smeltFrame, sx, sy, false, 4);

                // Smelting progress bar overlay on crucible rim
                if (smeltActive) {
                  ctx.fillStyle = "#0C0A10";
                  ctx.fillRect(sx + 56, sy + 64, 68, 8);
                  ctx.fillStyle = "#FFE670";
                  ctx.fillRect(sx + 58, sy + 66, Math.round(64 * smeltProg), 4);
                }
              } else if (car.wagonId === "artillery") {
                drawSprite(ctx, "wagon_artillery", 0, sx, sy, false, 4);

                // Rotating & recoiling pixel-art cannon barrel on roof turret
                var turCx = sx + car.w * 0.5;
                var turCy = sy - 6;
                var bAng = wState ? wState.barrelAngle : -0.25;
                var isRecoil = wState && wState.recoilTimer > 0;
                var recoilOffset = isRecoil ? (wState.recoilTimer / 0.22) * 8 : 0;

                ctx.save();
                ctx.translate(Math.round(turCx), Math.round(turCy));
                ctx.rotate(bAng);
                drawSprite(ctx, "wagon_artillery_barrel", isRecoil ? 1 : 0, Math.round(-4 - recoilOffset), -10, false, 4);
                ctx.restore();
              } else if (car.wagonId === "cryo_vent") {
                var isVenting = wState && wState.cryoActiveTimer > 0;
                var ventFrame = isVenting ? (Math.floor(GAME.time * 8) % 2) : 0;
                drawSprite(ctx, "wagon_cryo_vent", ventFrame, sx, sy, false, 4);

                // Freezing mist aura (radius 150 px) when venting
                if (isVenting) {
                  var mistCx = sx + car.w * 0.5;
                  var mistCy = sy + car.h * 0.5;
                  var mistPulse = 0.7 + Math.sin(GAME.time * 16) * 0.25;
                  ctx.save();
                  ctx.fillStyle = "rgba(72, 240, 228, " + (0.18 * mistPulse).toFixed(2) + ")";
                  ctx.beginPath();
                  ctx.arc(mistCx, mistCy, CFG.cryoVentRadius, 0, Math.PI * 2);
                  ctx.fill();

                  ctx.strokeStyle = "rgba(180, 255, 250, " + (0.65 * mistPulse).toFixed(2) + ")";
                  ctx.lineWidth = 2.2;
                  ctx.setLineDash([10, 6]);
                  ctx.beginPath();
                  ctx.arc(mistCx, mistCy, CFG.cryoVentRadius, 0, Math.PI * 2);
                  ctx.stroke();
                  ctx.setLineDash([]);
                  ctx.restore();
                }
              } else if (car.wagonId === "shield_pylon") {
                var domeUp = wState && wState.domeHp > 0;
                var pylCx = sx + car.w * 0.5;
                var pylonFrame = domeUp ? (Math.floor(GAME.time * 5) % 2) : 0;
                drawSprite(ctx, "wagon_shield_pylon", pylonFrame, sx, sy, false, 4);

                // Barrier Dome (radius 220 px) projected over the train
                if (domeUp) {
                  var domeCy = sy + 30;
                  var dFlash = wState.domeHitFlashTimer > 0;
                  var dRatio = Math.max(0.15, wState.domeHp / CFG.shieldPylonCapacity);
                  ctx.save();
                  ctx.fillStyle = dFlash
                    ? "rgba(200, 240, 255, 0.28)"
                    : "rgba(82, 184, 255, " + (0.09 + 0.08 * dRatio).toFixed(2) + ")";
                  ctx.beginPath();
                  ctx.arc(pylCx, domeCy, CFG.shieldPylonRadius, 0, Math.PI * 2);
                  ctx.fill();

                  ctx.strokeStyle = dFlash ? "#ffffff" : "#52b8ff";
                  ctx.lineWidth = dFlash ? 3.2 : 2.2;
                  ctx.beginPath();
                  ctx.arc(pylCx, domeCy, CFG.shieldPylonRadius, 0, Math.PI * 2);
                  ctx.stroke();
                  ctx.restore();
                }
              } else if (car.wagonId === "drone_bay") {
                var bayFrame = Math.floor(GAME.time * 3) % 2;
                drawSprite(ctx, "wagon_drone_bay", bayFrame, sx, sy, false, 4);

                // Draw the 2 hovering collector drones using pixel-art sprite wagon_collector_drone (scale 4)
                if (wState && wState.drones) {
                  var dIdx;
                  for (dIdx = 0; dIdx < wState.drones.length; dIdx++) {
                    var dr = wState.drones[dIdx];
                    var dsx = Math.round(dr.x - camX);
                    var dsy = Math.round(dr.y - camY);
                    var drFrame = Math.floor(GAME.time * 14 + dIdx) % 2;

                    ctx.save();
                    ctx.fillStyle = dr.carrying
                      ? "rgba(255, 225, 102, 0.28)"
                      : "rgba(104, 232, 148, 0.22)";
                    ctx.beginPath();
                    ctx.arc(dsx, dsy, 16, 0, Math.PI * 2);
                    ctx.fill();

                    drawSprite(ctx, "wagon_collector_drone", drFrame, dsx - 16, dsy - 12, false, 4);

                    if (dr.carrying) {
                      if (dr.carrying.type === "ore") {
                        ctx.fillStyle = "#48f0e4";
                        ctx.beginPath();
                        ctx.arc(dsx, dsy + 12, 4.5, 0, Math.PI * 2);
                        ctx.fill();
                      } else {
                        RENDER.drawMaterialIcon(
                          ctx,
                          dr.carrying.materialKey,
                          dsx,
                          dsy + 12,
                          5,
                          dr.carrying.isPristine
                        );
                      }
                    }
                    ctx.restore();
                  }
                }
              } else if (car.wagonId === "med_station") {
                var medCx = sx + car.w * 0.5;
                var medCy = sy + car.h * 0.5;
                var inHealRange = wState && wState.playerInRange;

                // Subtle 120 px healing aura around the car
                ctx.save();
                ctx.strokeStyle = inHealRange
                  ? "rgba(255, 107, 139, 0.55)"
                  : "rgba(255, 107, 139, 0.22)";
                ctx.fillStyle = inHealRange
                  ? "rgba(255, 107, 139, 0.09)"
                  : "rgba(255, 107, 139, 0.03)";
                ctx.lineWidth = inHealRange ? 2.0 : 1.2;
                ctx.beginPath();
                ctx.arc(medCx, medCy, CFG.medStationRange, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.restore();

                var medFrame = inHealRange ? (Math.floor(GAME.time * 6) % 2) : 0;
                drawSprite(ctx, "wagon_med_station", medFrame, sx, sy, false, 4);
              } else if (car.wagonId === "plasma_shield") {
                var plsCx = sx + car.w * 0.5;
                var plsFrame = Math.floor(GAME.time * 8) % 2;
                drawSprite(ctx, "wagon_plasma_shield", plsFrame, sx, sy, false, 4);

                // Plasma arc bridge between the two coils
                ctx.save();
                ctx.strokeStyle = "#8AF7FF";
                ctx.lineWidth = 2.0;
                ctx.beginPath();
                ctx.moveTo(plsCx - 24, sy + 52);
                ctx.lineTo(plsCx, sy + 46 + Math.sin(GAME.time * 18) * 5);
                ctx.lineTo(plsCx + 24, sy + 52);
                ctx.stroke();
                ctx.restore();
              } else if (car.wagonId === "thermal_conduit") {
                var thmFrame = Math.floor(GAME.time * 4) % 2;
                drawSprite(ctx, "wagon_thermal_conduit", thmFrame, sx, sy, false, 4);
              }
            } else if (car.key === "foundry") {
              // Foundry Car (45x30 art px = 180x120 world px)
              var fFrame = Math.floor(GAME.time * 4) % 2;
              drawSprite(ctx, "wagon_foundry", fFrame, sx, sy, false, 4);

              // Step R5 Requirement 6: Chief Engineer Mara & Workbench at the rear end of the Foundry Car
              RENDER.drawMaraAndWorkbench(ctx, camX, camY, "RUN", car);
            } else if (car.key === "engine") {
              // Engine Car (46x30 art px = 184x120 world px) + Smokestack + Furnace Wheel Ember-Heart glow
              var smokeFrame = Math.floor(GAME.time * 6) % 3;
              drawSprite(ctx, "bastion_smokestack", smokeFrame, sx + 124, sy - 32, false, 4);

              var engFrame = Math.floor(GAME.time * 8) % 3;
              drawSprite(ctx, "bastion_engine", engFrame, sx, sy, false, 4);

              // Step R6 Requirement 2: The furnace wheel glows with the Ember-Heart value (dim when low)
              var heartRatio = Math.max(0, Math.min(1, b.emberHeart / b.maxEmberHeart));
              var wheelCx = sx + 114;
              var wheelCy = sy + 62;
              ctx.save();
              if (heartRatio < 0.35) {
                ctx.fillStyle = "rgba(12, 10, 16, " + ((1 - heartRatio / 0.35) * 0.65).toFixed(2) + ")";
                ctx.fillRect(wheelCx - 16, wheelCy - 16, 32, 32);
              } else {
                var glowAlpha = (0.18 + 0.25 * heartRatio) * (0.85 + Math.sin(GAME.time * 10) * 0.15);
                ctx.fillStyle = "rgba(255, 197, 58, " + glowAlpha.toFixed(2) + ")";
                ctx.beginPath();
                ctx.arc(wheelCx, wheelCy, 22, 0, Math.PI * 2);
                ctx.fill();
              }
              ctx.restore();
            }

            // Hull hit white flash overlay
            if (isHullFlash) {
              ctx.save();
              ctx.fillStyle = "rgba(255, 255, 255, 0.55)";
              ctx.fillRect(sx, sy, car.w, car.h - 16);
              ctx.restore();
            }

            // Step R6 Requirement 2: Turning pixel-art wheels (bastion_wheel, 4 frames) + moving connecting rods
            var wheelFrameBase = Math.floor(((b.wheelAngle * 2.2) % 4 + 4) % 4);
            if (car.key === "engine") {
              // Two big wheels with connecting rods on the Engine
              var ewX1 = sx + 24;
              var ewX2 = sx + 112;
              var ewY = floorScreenY - 36;
              drawSprite(ctx, "bastion_wheel", wheelFrameBase, ewX1, ewY, false, 4);
              drawSprite(ctx, "bastion_wheel", (wheelFrameBase + 1) % 4, ewX2, ewY, false, 4);

              // Moving pixel-art connecting rod linking the two engine drive wheels
              var rodPhase = b.wheelAngle * 1.4;
              var rodOffX = Math.round(Math.cos(rodPhase) * 6);
              var rodOffY = Math.round(Math.sin(rodPhase) * 4);
              var rodY = floorScreenY - 22 + rodOffY;
              ctx.fillStyle = "#0C0A10";
              ctx.fillRect(ewX1 + 12 + rodOffX, rodY - 4, (ewX2 - ewX1) + 12, 12);
              ctx.fillStyle = "#C8D0DC";
              ctx.fillRect(ewX1 + 16 + rodOffX, rodY, (ewX2 - ewX1) + 4, 4);
              ctx.fillStyle = "#C9962E";
              ctx.fillRect(ewX1 + 14 + rodOffX, rodY - 2, 8, 8);
              ctx.fillRect(ewX2 + 14 + rodOffX, rodY - 2, 8, 8);
            } else {
              var wheelOffsets = car.w <= 130 ? [12, car.w - 48] : [8, 44, 104, 140];
              for (wIdx = 0; wIdx < wheelOffsets.length; wIdx++) {
                var wx = sx + wheelOffsets[wIdx];
                var wy = floorScreenY - 36;
                var wFrame = (wheelFrameBase + wIdx) % 4;
                drawSprite(ctx, "bastion_wheel", wFrame, wx, wy, false, 4);
              }
            }
          }

          // 2a. Draw Step B10 Molten Slag Burning Puddles (radius 40 px, 6 dps, 4 s)
          var puddles = GAME.runState.moltenPuddles;
          if (puddles) {
            for (i = 0; i < puddles.length; i++) {
              var pud = puddles[i];
              var pdxScreen = Math.round(pud.x - camX);
              var pdyScreen = Math.round(pud.y - camY);
              if (pdxScreen + pud.radius < -20 || pdxScreen - pud.radius > CFG.logicalWidth + 20) continue;
              var pudAlpha = Math.max(0.25, Math.min(1, pud.timer / 1.0));
              var pudPulse = 0.8 + Math.sin(GAME.time * 14 + i) * 0.2;
              ctx.save();
              ctx.globalAlpha = pudAlpha;
              ctx.fillStyle = "rgba(255, 108, 28, " + (0.42 * pudPulse).toFixed(2) + ")";
              ctx.beginPath();
              ctx.ellipse(pdxScreen, pdyScreen, pud.radius, 11, 0, 0, Math.PI * 2);
              ctx.fill();
              ctx.fillStyle = "#ffb347";
              ctx.beginPath();
              ctx.ellipse(pdxScreen, pdyScreen, pud.radius * 0.65, 6, 0, 0, Math.PI * 2);
              ctx.fill();
              ctx.strokeStyle = "#ff5e24";
              ctx.lineWidth = 2;
              ctx.beginPath();
              ctx.ellipse(pdxScreen, pdyScreen, pud.radius, 11, 0, 0, Math.PI * 2);
              ctx.stroke();
              ctx.restore();
            }
          }

          // 2b. Draw active Artillery Shells & 48px Splash Explosions
          var shells = GAME.runState.artilleryShells;
          if (shells) {
            for (i = 0; i < shells.length; i++) {
              var sh = shells[i];
              var shx = Math.round(sh.x - camX);
              var shy = Math.round(sh.y - camY);
              ctx.fillStyle = sh.moltenSlag ? "rgba(255, 148, 41, 0.55)" : "rgba(255, 94, 87, 0.45)";
              ctx.beginPath();
              ctx.arc(shx, shy, sh.moltenSlag ? 11 : 9, 0, Math.PI * 2);
              ctx.fill();
              ctx.fillStyle = sh.moltenSlag ? "#ff9429" : "#ff5e57";
              ctx.beginPath();
              ctx.arc(shx, shy, 5.5, 0, Math.PI * 2);
              ctx.fill();
              ctx.fillStyle = "#fff3c4";
              ctx.beginPath();
              ctx.arc(shx, shy, 2.5, 0, Math.PI * 2);
              ctx.fill();
            }
          }
          var expls = GAME.runState.wagonExplosions;
          if (expls) {
            for (i = 0; i < expls.length; i++) {
              var ex = expls[i];
              var exX = Math.round(ex.x - camX);
              var exY = Math.round(ex.y - camY);
              var exProg = 1 - ex.timer / ex.maxTimer;
              var curR = ex.radius * (0.35 + 0.65 * exProg);
              ctx.save();
              ctx.globalAlpha = Math.max(0, 1 - exProg);
              ctx.fillStyle = "rgba(255, 110, 64, 0.38)";
              ctx.beginPath();
              ctx.arc(exX, exY, curR, 0, Math.PI * 2);
              ctx.fill();
              ctx.strokeStyle = "#ffbe76";
              ctx.lineWidth = 2.5;
              ctx.beginPath();
              ctx.arc(exX, exY, curR, 0, Math.PI * 2);
              ctx.stroke();
              ctx.restore();
            }
          }

          // 3. Step R6 Requirement 1 & 2: Spinning Pixel-Art Drill Cone at the front of the Engine Car
          // (28 x 30 art px = 112 x 120 world px, 4 rotating hazard-stripe frames at 12 fps, faster with throttle)
          var drillBaseX = Math.round(b.engineFrontX - camX);
          var drillTipX = Math.round(b.drillTipX - camX);
          if (drillTipX >= -40 && drillBaseX <= CFG.logicalWidth + 40) {
            var drillFrame = ((Math.floor(b.drillPhase) % 4) + 4) % 4;
            drawSprite(ctx, "bastion_drill", drillFrame, drillBaseX, roofScreenY, false, 4);
          }

          // Step R3 Requirement 9: Debug overlays for Show roofline and Show drill hitbox
          if (GAME.showRooflineDebug) {
            var rlY = Math.round(b.roofY - camY);
            var rlX1 = Math.round(b.rearX - camX);
            var rlX2 = Math.round(b.engineFrontX - camX);
            ctx.save();
            ctx.strokeStyle = "#35E0F0";
            ctx.lineWidth = 2.5;
            ctx.setLineDash([6, 4]);
            ctx.beginPath();
            ctx.moveTo(rlX1 - 24, rlY);
            ctx.lineTo(rlX2 + 24, rlY);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = "#35E0F0";
            ctx.font = "bold 11px monospace";
            ctx.fillText("ROOFLINE (SAFE ABOVE)", rlX2 - 140, rlY - 6);
            ctx.restore();
          }
          if (GAME.showDrillHitboxDebug) {
            var dhb = getDrillHitboxRect();
            var dhx = Math.round(dhb.x - camX);
            var dhy = Math.round(dhb.y - camY);
            ctx.save();
            ctx.fillStyle = "rgba(255, 62, 62, 0.28)";
            ctx.fillRect(dhx, dhy, dhb.w, dhb.h);
            ctx.strokeStyle = "#ff3b30";
            ctx.lineWidth = 2;
            ctx.strokeRect(dhx, dhy, dhb.w, dhb.h);
            ctx.fillStyle = "#ff8a80";
            ctx.font = "bold 10px monospace";
            ctx.fillText("DRILL HITBOX (70%)", dhx - 10, dhy - 5);
            ctx.restore();
          }
        },

        drawKineticTether: function (ctx, camX, camY) {
          var pl = GAME.player;
          var rs = GAME.runState;
          var tw = rs ? rs.tripwire : null;
          var hp = rs ? rs.harpoon : null;

          // Step R4 Requirement 10: Debug overlay for Show hook range
          if (GAME.showHookRangeDebug) {
            var hrCx = Math.round(pl.x + pl.w * 0.5 - camX);
            var hrCy = Math.round(pl.y + pl.h * 0.42 - camY);
            var hrRad = getEffectiveHarpoonRange();
            ctx.save();
            ctx.strokeStyle = "rgba(53, 224, 240, 0.72)";
            ctx.lineWidth = 2;
            ctx.setLineDash([8, 6]);
            ctx.beginPath();
            ctx.arc(hrCx, hrCy, hrRad, 0, Math.PI * 2);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = "#35E0F0";
            ctx.font = "bold 11px monospace";
            ctx.textAlign = "center";
            ctx.fillText("HOOK RANGE (" + hrRad + "px)", hrCx, hrCy - hrRad - 6);
            ctx.restore();
          }

          // Step R4 Requirement 5: Draw active Tripwire (two spike posts 220 px apart + thin crackling electric wire at knee height)
          if (tw && tw.active) {
            var sx1 = Math.round(tw.x1 - camX);
            var sy1 = Math.round(tw.y1 - camY);
            var sx2 = Math.round(tw.x2 - camX);
            var sy2 = Math.round(tw.y2 - camY);
            var wy1 = sy1 - 12;
            var wy2 = sy2 - 12;
            var isTripFlash = tw.tripFlashTimer > 0;
            var wdx = sx2 - sx1;
            var wdy = wy2 - wy1;
            var wireDist = Math.sqrt(wdx * wdx + wdy * wdy);

            ctx.save();
            ctx.lineCap = "round";

            // 1. Two ground spike posts driven into the floor at (sx1, sy1) and (sx2, sy2)
            var postIdx;
            var posts = [
              { x: sx1, y: sy1 },
              { x: sx2, y: sy2 }
            ];
            for (postIdx = 0; postIdx < posts.length; postIdx++) {
              var pst = posts[postIdx];
              ctx.fillStyle = "#2b2136";
              ctx.beginPath();
              ctx.moveTo(pst.x - 8, pst.y + 3);
              ctx.lineTo(pst.x, pst.y - 18);
              ctx.lineTo(pst.x + 8, pst.y + 3);
              ctx.closePath();
              ctx.fill();
              ctx.strokeStyle = isTripFlash ? "#ffffff" : "#FF5A36";
              ctx.lineWidth = 2;
              ctx.stroke();

              // Glowing insulator ring at knee height (y - 12)
              ctx.fillStyle = isTripFlash ? "#ffffff" : "#35E0F0";
              ctx.beginPath();
              ctx.arc(pst.x, pst.y - 12, 4.2, 0, Math.PI * 2);
              ctx.fill();
            }

            // 2. Outer electric aura along knee-height wire
            ctx.strokeStyle = isTripFlash
              ? "rgba(255, 255, 255, 0.85)"
              : "rgba(94, 242, 255, 0.38)";
            ctx.lineWidth = isTripFlash ? 10 : 6;
            ctx.beginPath();
            ctx.moveTo(sx1, wy1);
            ctx.lineTo(sx2, wy2);
            ctx.stroke();

            // 3. Thin taut core wire between the two spike posts
            ctx.strokeStyle = isTripFlash ? "#ffffff" : "#ffd166";
            ctx.lineWidth = 2.0;
            ctx.beginPath();
            ctx.moveTo(sx1, wy1);
            ctx.lineTo(sx2, wy2);
            ctx.stroke();

            // 4. Crackling jagged electric arc dancing between the two posts
            var segCount = 10;
            var perpX = wireDist > 1 ? -wdy / wireDist : 0;
            var perpY = wireDist > 1 ? wdx / wireDist : 1;
            ctx.strokeStyle = isTripFlash ? "#ffffff" : "#9beeff";
            ctx.lineWidth = isTripFlash ? 2.4 : 1.5;
            ctx.beginPath();
            ctx.moveTo(sx1, wy1);
            var sIdx;
            for (sIdx = 1; sIdx < segCount; sIdx++) {
              var frac = sIdx / segCount;
              var bx = sx1 + wdx * frac;
              var by = wy1 + wdy * frac;
              var jag = Math.sin(GAME.time * 42 + sIdx * 2.7) * (isTripFlash ? 8 : 4.5);
              ctx.lineTo(bx + perpX * jag, by + perpY * jag);
            }
            ctx.lineTo(sx2, wy2);
            ctx.stroke();

            // 5. Flash burst at trip contact point on every trip
            if (isTripFlash) {
              var fx = tw.lastTripX - camX;
              var fy = tw.lastTripY - camY;
              var fRad = 16 + (1 - tw.tripFlashTimer / 0.22) * 20;
              ctx.fillStyle = "rgba(155, 238, 255, 0.42)";
              ctx.beginPath();
              ctx.arc(fx, fy, fRad, 0, Math.PI * 2);
              ctx.fill();
              ctx.strokeStyle = "#ffffff";
              ctx.lineWidth = 2.5;
              ctx.beginPath();
              ctx.arc(fx, fy, fRad * 0.7, 0, Math.PI * 2);
              ctx.stroke();
            }

            // Remaining duration label above midpoint of wire
            ctx.textAlign = "center";
            ctx.font = "bold 10px monospace";
            ctx.fillStyle = "#ffd166";
            ctx.fillText(
              "WIRE " + tw.timer.toFixed(1) + "s",
              Math.round((sx1 + sx2) * 0.5),
              Math.min(wy1, wy2) - 10
            );

            ctx.restore();
          }

          // Step R4 Requirement 4: The harpoon chain (thin cyan chain of small links) is drawn ONLY while the hook is flying or reeling
          // and disappears the moment it ends.
          if (hp && hp.active) {
            var hpx = pl.x + pl.w * 0.5 - camX;
            var hpy = pl.y + pl.h * 0.42 - camY;
            var htx = hp.x - camX;
            var hty = hp.y - camY;
            var hdx = htx - hpx;
            var hdy = hty - hpy;
            var hLen = Math.sqrt(hdx * hdx + hdy * hdy);
            var hAng = Math.atan2(hdy, hdx);

            ctx.save();
            ctx.lineCap = "round";

            // 1. Subtle cyan glow along chain path
            ctx.strokeStyle = "rgba(53, 224, 240, 0.34)";
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.moveTo(hpx, hpy);
            ctx.lineTo(htx, hty);
            ctx.stroke();

            // 2. Thin cyan chain of small links along the harpoon vector (fx_chain_link)
            var linkStep = 12;
            var linkCount = Math.max(1, Math.floor(hLen / linkStep));
            var ux = hLen > 0.01 ? hdx / hLen : 1;
            var uy = hLen > 0.01 ? hdy / hLen : 0;
            var li;
            for (li = 0; li < linkCount; li++) {
              var lDist = (li + 0.5) * (hLen / linkCount);
              var lx = hpx + ux * lDist;
              var ly = hpy + uy * lDist;
              ctx.save();
              ctx.translate(lx, ly);
              ctx.rotate(hAng);
              drawSprite(ctx, "fx_chain_link", 0, -6, -4, false, 3);
              ctx.restore();
            }

            // 3. Barbed cyan-white harpoon spearhead at tip (fx_harpoon_head)
            ctx.translate(htx, hty);
            ctx.rotate(hAng);
            drawSprite(ctx, "fx_harpoon_head", 0, -12, -10, false, 3);

            ctx.restore();
          }

          // Step R4 Requirement 1: No Leash cable is ever drawn!
        },

        drawOreNodes: function (ctx, camX, camY) {
          var nodes = GAME.runState.oreNodes;
          if (!nodes) return;
          var pulse = 0.72 + Math.sin(GAME.time * 6.5) * 0.28;
          var i;
          for (i = 0; i < nodes.length; i++) {
            var nd = nodes[i];
            if (!nd.active) continue;
            var sx = Math.round(nd.x - camX);
            var sy = Math.round(nd.y - camY);
            if (sx < -36 || sx > CFG.logicalWidth + 36 || sy < -36 || sy > CFG.logicalHeight + 36) {
              continue;
            }

            var isOrange = (i % 3 === 1);
            var sprKey = isOrange ? "tile_ore_orange" : "tile_ore_cyan";
            ctx.save();
            // Outer cyan or orange ore crystal glow
            ctx.fillStyle = isOrange
              ? ("rgba(255, 138, 30, " + (0.24 * pulse).toFixed(2) + ")")
              : ("rgba(72, 240, 228, " + (0.24 * pulse).toFixed(2) + ")");
            ctx.beginPath();
            ctx.arc(sx, sy, nd.r + 8, 0, Math.PI * 2);
            ctx.fill();

            if (nd.mount === "ceiling") {
              ctx.translate(sx, sy);
              ctx.scale(1, -1);
              drawSprite(ctx, sprKey, 0, -16, -16, false, 2);
            } else {
              drawSprite(ctx, sprKey, 0, sx - 16, sy - 16, false, 2);
            }
            ctx.restore();
          }
        },

        drawSpeedStreaks: function (ctx) {
          if (GAME.playMode !== "RUN" || !GAME.bastion.moving) return;
          var b = GAME.bastion;
          var notch = b.throttleNotch || 1;
          var speedRatio = Math.max(0.5, b.speed / CFG.trainCrawlSpeed);
          var streaks = GAME.runState.speedStreaks;
          if (!streaks) return;

          // Notch 1: 10 subtle short streaks; Notch 2: 22 medium streaks; Notch 3: 36 long vivid streaks
          var count = notch === 1 ? 10 : (notch === 2 ? 22 : 36);
          var alpha = notch === 1 ? 0.14 : (notch === 2 ? 0.28 : 0.46);
          var lenMult = notch === 1 ? 0.75 : (notch === 2 ? 1.55 : 2.85);
          var strokeCol = notch === 3 ? "#ffae68" : (notch === 2 ? "#ffe0a3" : "#c8d6e5");

          ctx.save();
          ctx.strokeStyle = strokeCol;
          ctx.globalAlpha = alpha;
          ctx.lineWidth = notch === 3 ? 1.6 : 1.1;
          ctx.beginPath();
          var i;
          for (i = 0; i < Math.min(count, streaks.length); i++) {
            var st = streaks[i];
            var l = st.len * lenMult * (0.6 + speedRatio * 0.25);
            ctx.moveTo(st.x, st.y);
            ctx.lineTo(st.x + l, st.y);
          }
          ctx.stroke();
          ctx.restore();
        },

        drawEliteCrownAndAura: function (ctx, cx, topY, w, h) {
          var pulse = 0.65 + Math.sin(GAME.time * 10) * 0.35;
          ctx.save();
          // Step R6 Requirement 9: Elites get a gold pixel outline and a small pixel crown icon above their health bar
          ctx.strokeStyle = "rgba(255, 215, 0, " + (0.65 + pulse * 0.35).toFixed(2) + ")";
          ctx.lineWidth = 3;
          ctx.strokeRect(Math.round(cx - w * 0.5 - 3), Math.round(topY - 3), Math.round(w + 6), Math.round(h + 6));

          var crownFrame = Math.floor(GAME.time * 4) % 2;
          drawSprite(ctx, "fx_elite_crown", crownFrame, Math.round(cx - 13), Math.round(topY - 30), false, 3);
          ctx.restore();
        },

        drawCheckpoints: function (ctx, camX, camY) {
          var ts = CFG.tileSize;
          var i;
          for (i = 0; i < GAME.checkpoints.length; i++) {
            var cp = GAME.checkpoints[i];
            var sx = Math.round(cp.col * ts - camX);
            var sy = Math.round(cp.row * ts - camY);
            if (sx < -40 || sx > CFG.logicalWidth + 40 || sy < -40 || sy > CFG.logicalHeight + 40) {
              continue;
            }

            var isCurrent = GAME.lastCheckpoint && GAME.lastCheckpoint.col === cp.col;
            if (cp.lit) {
              var cpPulse = 0.72 + Math.sin(GAME.time * 6) * 0.28;
              ctx.save();
              ctx.fillStyle = isCurrent
                ? ("rgba(71, 240, 166, " + (0.30 * cpPulse).toFixed(2) + ")")
                : ("rgba(245, 161, 66, " + (0.24 * cpPulse).toFixed(2) + ")");
              ctx.beginPath();
              ctx.arc(sx + 16, sy + 10, 20, 0, Math.PI * 2);
              ctx.fill();
              ctx.restore();
              var flagFrame = Math.floor(GAME.time * 5) % 2;
              drawSprite(ctx, "tile_checkpoint_lit", flagFrame, sx, sy, false, 2);
            } else {
              drawSprite(ctx, "tile_checkpoint_unlit", 0, sx, sy, false, 2);
            }
          }
        },

        drawDummies: function (ctx, camX, camY) {
          var i;
          for (i = 0; i < GAME.dummies.length; i++) {
            var d = GAME.dummies[i];
            var sx = d.x - camX;
            var sy = d.y - camY;
            if (sx + d.w < -20 || sx > CFG.logicalWidth + 20 || sy + d.h < -30 || sy > CFG.logicalHeight + 20) {
              continue;
            }

            var isFlash = d.flashTimer > 0;

            ctx.save();
            ctx.translate(sx + d.w * 0.5, sy + d.h);

            ctx.fillStyle = "#3a3142";
            ctx.fillRect(-10, -4, 20, 4);

            ctx.rotate(d.wobbleAngle);

            ctx.fillStyle = isFlash ? "#ffffff" : "#5c4a3e";
            ctx.fillRect(-3, -d.h + 6, 6, d.h - 10);

            ctx.fillStyle = isFlash ? "#ffffff" : "#4b3e54";
            ctx.fillRect(-11, -30, 22, 5);

            ctx.fillStyle = isFlash ? "#ffffff" : "#6e5c78";
            ctx.fillRect(-8, -32, 16, 18);

            ctx.fillStyle = isFlash ? "#fff8eb" : "#e87e33";
            ctx.fillRect(-4, -27, 8, 8);
            ctx.fillStyle = isFlash ? "#ffffff" : "#ffcf87";
            ctx.fillRect(-2, -25, 4, 4);

            ctx.fillStyle = isFlash ? "#ffffff" : "#857491";
            ctx.fillRect(-6, -42, 12, 9);
            ctx.fillStyle = isFlash ? "#ffffff" : "#261f2e";
            ctx.fillRect(-4, -39, 8, 3);

            ctx.restore();

            if (d.burnTimer > 0) {
              RENDER.drawBurnFlames(ctx, sx + d.w * 0.5, sy + d.h * 0.45, d.w);
            }

            if (d.hits > 0) {
              ctx.textAlign = "center";
              ctx.font = "bold 12px monospace";
              ctx.fillStyle = isFlash ? "#ffffff" : "#ffbe6b";
              ctx.fillText(String(d.hits), sx + d.w * 0.5, sy - 8);
            }
          }
        },

        drawBurnFlames: function (ctx, cx, cy, spanW) {
          var t = GAME.time * 18;
          var f;
          for (f = -1; f <= 1; f++) {
            var fx = cx + f * (spanW * 0.26) + Math.sin(t + f * 2.1) * 2;
            var fh = 7 + Math.cos(t * 1.3 + f) * 3;
            ctx.fillStyle = "#ff591c";
            ctx.beginPath();
            ctx.moveTo(fx - 3.5, cy + 2);
            ctx.lineTo(fx, cy - fh);
            ctx.lineTo(fx + 3.5, cy + 2);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = "#ffd966";
            ctx.beginPath();
            ctx.moveTo(fx - 1.8, cy + 2);
            ctx.lineTo(fx, cy - fh * 0.55);
            ctx.lineTo(fx + 1.8, cy + 2);
            ctx.closePath();
            ctx.fill();
          }
        },

        drawArmorPieces: function (ctx, camX, camY) {
          var i;
          for (i = 0; i < GAME.armorPieces.length; i++) {
            var ap = GAME.armorPieces[i];
            var sx = Math.round(ap.x - camX);
            var sy = Math.round(ap.y - camY);
            if (sx < -48 || sx > CFG.logicalWidth + 48 || sy < -48 || sy > CFG.logicalHeight + 48) {
              continue;
            }
            var alpha = Math.max(0, Math.min(1, ap.life / ap.maxLife));
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.translate(sx, sy);
            ctx.rotate(ap.angle);
            ctx.scale(ap.dir, 1);

            if (ap.detachedSprite) {
              ctx.imageSmoothingEnabled = false;
              var dw = ap.detachedSprite.width * 3;
              var dh = ap.detachedSprite.height * 3;
              ctx.drawImage(ap.detachedSprite, Math.round(-dw * 0.5), Math.round(-dh * 0.5), dw, dh);
            } else {
              var hw = ap.w * 0.45;
              var hh = ap.h * 0.42;
              ctx.fillStyle = ap.shattered && ap.life > ap.maxLife - 0.12 ? "#ffffff" : "#4f4363";
              ctx.fillRect(Math.round(-hw), Math.round(-hh), Math.round(hw * 2), Math.round(hh * 2));
              ctx.strokeStyle = "#ff9638";
              ctx.lineWidth = 1.5;
              ctx.strokeRect(Math.round(-hw), Math.round(-hh), Math.round(hw * 2), Math.round(hh * 2));
            }

            ctx.restore();
          }
        },

        drawEnemyProjectiles: function (ctx, camX, camY) {
          var i;
          // 1. Draw active Spore/Acid/Frost Hazard Clouds on the floor
          if (GAME.sporeClouds && GAME.sporeClouds.length > 0) {
            for (i = 0; i < GAME.sporeClouds.length; i++) {
              var cl = GAME.sporeClouds[i];
              var csx = Math.round(cl.x - camX);
              var csy = Math.round(cl.y - camY);
              if (csx + cl.radius < -24 || csx - cl.radius > CFG.logicalWidth + 24) continue;
              var cAlpha = Math.max(0.22, Math.min(0.88, cl.timer / 1.2));
              var cPulse = 0.85 + Math.sin(GAME.time * 9 + i) * 0.15;
              ctx.save();
              ctx.globalAlpha = cAlpha * 0.42;
              ctx.fillStyle = cl.color || "#7af068";
              ctx.beginPath();
              ctx.ellipse(csx, csy - 6, cl.radius * cPulse, 14, 0, 0, Math.PI * 2);
              ctx.fill();

              ctx.globalAlpha = cAlpha * 0.85;
              ctx.strokeStyle = cl.color || "#7af068";
              ctx.lineWidth = 1.8;
              ctx.beginPath();
              ctx.ellipse(csx, csy - 6, cl.radius * cPulse, 14, 0, 0, Math.PI * 2);
              ctx.stroke();

              // Rising spore motes inside cloud
              var mIdx;
              ctx.fillStyle = "#ffffff";
              for (mIdx = -1; mIdx <= 1; mIdx++) {
                var mx = csx + mIdx * (cl.radius * 0.45) + Math.sin(GAME.time * 6 + mIdx) * 4;
                var my = csy - 8 - ((GAME.time * 18 + Math.abs(mIdx) * 7) % 14);
                ctx.beginPath();
                ctx.arc(mx, my, 2.2, 0, Math.PI * 2);
                ctx.fill();
              }
              ctx.restore();
            }
          }

          // 2. Draw active Enemy Projectiles (80-slot pool: clear, dodgeable shapes per pattern)
          if (!GAME.enemyProjectiles) return;
          for (i = 0; i < CFG.maxEnemyProjectiles; i++) {
            var ep = GAME.enemyProjectiles[i];
            if (!ep.active) continue;
            var sx = ep.x - camX;
            var sy = ep.y - camY;
            if (sx < -24 || sx > CFG.logicalWidth + 24 || sy < -24 || sy > CFG.logicalHeight + 24) {
              continue;
            }
            var ang = Math.atan2(ep.vy, ep.vx);
            ctx.save();
            ctx.translate(sx, sy);

            if (ep.pattern === "lob") {
              // Lobbed Spore/Acid/Frost Blob: pulsing organic orb with trailing droplets
              var pulseR = ep.r * (0.9 + Math.sin(GAME.time * 22 + ep.id) * 0.14);
              ctx.fillStyle = ep.color;
              ctx.globalAlpha = 0.35;
              ctx.beginPath();
              ctx.arc(0, 0, pulseR + 4, 0, Math.PI * 2);
              ctx.fill();
              ctx.globalAlpha = 1.0;

              ctx.fillStyle = ep.color;
              ctx.beginPath();
              ctx.arc(0, 0, pulseR, 0, Math.PI * 2);
              ctx.fill();
              ctx.strokeStyle = "#ffffff";
              ctx.lineWidth = 1.4;
              ctx.stroke();

              ctx.fillStyle = ep.coreColor || "#ffffff";
              ctx.beginPath();
              ctx.arc(-1.5, -1.5, pulseR * 0.42, 0, Math.PI * 2);
              ctx.fill();
            } else if (ep.pattern === "line") {
              // Line pattern: elongated high-velocity energy lance needle
              ctx.rotate(ang);
              ctx.fillStyle = ep.color;
              ctx.globalAlpha = 0.35;
              ctx.fillRect(-12, -4.5, 22, 9);
              ctx.globalAlpha = 1.0;
              ctx.beginPath();
              ctx.moveTo(10, 0);
              ctx.lineTo(-9, -4);
              ctx.lineTo(-6, 0);
              ctx.lineTo(-9, 4);
              ctx.closePath();
              ctx.fill();
              ctx.fillStyle = "#ffffff";
              ctx.fillRect(-5, -1.3, 12, 2.6);
            } else {
              // single, spread-3, burst-3: clear diamond/chevron bolt with bright core & outline
              ctx.rotate(ang);
              ctx.fillStyle = ep.color;
              ctx.globalAlpha = 0.32;
              ctx.beginPath();
              ctx.arc(0, 0, ep.r + 3.5, 0, Math.PI * 2);
              ctx.fill();
              ctx.globalAlpha = 1.0;

              ctx.fillStyle = ep.color;
              ctx.strokeStyle = "#181022";
              ctx.lineWidth = 1.3;
              ctx.beginPath();
              ctx.moveTo(ep.r + 2.5, 0);
              ctx.lineTo(-ep.r, -ep.r * 0.85);
              ctx.lineTo(-ep.r * 0.5, 0);
              ctx.lineTo(-ep.r, ep.r * 0.85);
              ctx.closePath();
              ctx.fill();
              ctx.stroke();

              ctx.fillStyle = ep.coreColor || "#ffffff";
              ctx.beginPath();
              ctx.arc(1, 0, ep.r * 0.42, 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.restore();
          }
        },

        drawEnemyArmorPipsAndStatus: function (ctx, e, sx, sy, orderedKeys) {
          var centerScreenX = sx + e.w * 0.5;
          var isTelegraph = e.state === "TELEGRAPH";
          var eyeFlashRed = isTelegraph && Math.floor(GAME.time * 24) % 2 === 0;
          var zHead = getBruteZoneByKey(e, orderedKeys[2] || "head");

          if (e.burnTimer > 0) {
            RENDER.drawBurnFlames(ctx, centerScreenX, sy + 10, e.w * 0.8);
          }

          if (e.freezeTimer > 0) {
            ctx.save();
            ctx.fillStyle = "rgba(110, 244, 255, 0.34)";
            ctx.fillRect(sx - 2, sy - 2, e.w + 4, e.h + 4);
            ctx.strokeStyle = "#9beeff";
            ctx.lineWidth = 2.2;
            ctx.strokeRect(sx - 2, sy - 2, e.w + 4, e.h + 4);
            ctx.textAlign = "center";
            ctx.font = "bold 9.5px monospace";
            ctx.fillStyle = "#9beeff";
            ctx.fillText("FROZEN (" + e.freezeTimer.toFixed(1) + "s)", centerScreenX, sy - 20);
            ctx.restore();
          } else if (isTelegraph) {
            ctx.save();
            ctx.textAlign = "center";
            ctx.font = "bold 16px monospace";
            var exY = sy - 20;
            ctx.fillStyle = "rgba(25, 6, 8, 0.90)";
            ctx.fillRect(centerScreenX - 8, exY - 14, 16, 18);
            ctx.fillStyle = eyeFlashRed ? "#ffd6d6" : "#ff3838";
            ctx.fillText("!", centerScreenX, exY);
            ctx.restore();
          } else if (e.state === "STAGGER") {
            ctx.save();
            ctx.textAlign = "center";
            ctx.font = "bold 9.5px monospace";
            ctx.fillStyle = e.tripStunTimer > 0 ? "#5ef2ff" : "#ffe082";
            ctx.fillText(
              e.tripStunTimer > 0 ? ("TRIPPED (" + e.tripStunTimer.toFixed(1) + "s)") : "STAGGER",
              centerScreenX,
              sy - 20
            );
            ctx.restore();
          } else if (e.tripExposed) {
            ctx.save();
            ctx.textAlign = "center";
            ctx.font = "bold 9px monospace";
            ctx.fillStyle = "#ffe066";
            ctx.fillText("EXPOSED (+25%)", centerScreenX, sy - 20);
            ctx.restore();
          } else if (zHead && zHead.state === "BROKEN") {
            ctx.save();
            ctx.textAlign = "center";
            ctx.font = "bold 9px monospace";
            ctx.fillStyle = "#ffbe6b";
            ctx.fillText("BLIND", centerScreenX, sy - 20);
            ctx.restore();
          }

          var anyZoneDamaged = false;
          if (e.zones) {
            var zi;
            for (zi = 0; zi < e.zones.length; zi++) {
              if (e.zones[zi].armor < e.zones[zi].maxArmor || e.zones[zi].state !== "INTACT") {
                anyZoneDamaged = true;
                break;
              }
            }
          }
          // Step R6 Requirement 10: Enemy health bar above a damaged enemy (60 x 8 logical px) and the 3 armour pips beside it
          if ((e.hp < e.maxHp || anyZoneDamaged) && e.hpBarTimer > 0) {
            var barW = 60;
            var barH = 8;
            var pipW = 7;
            var pipH = 8;
            var pipGap = 2;
            var totalPipsW = pipW * 3 + pipGap * 2;
            var totalBarAndPipsW = barW + 4 + totalPipsW;
            var bx = Math.round(centerScreenX - totalBarAndPipsW * 0.5);
            var hpBarY = Math.round(sy - 14);

            var hpPct = Math.max(0, Math.min(1, e.hp / e.maxHp));
            ctx.fillStyle = "#0C0A10";
            ctx.fillRect(bx - 1, hpBarY - 1, barW + 2, barH + 2);
            ctx.fillStyle = "#2A1215";
            ctx.fillRect(bx, hpBarY, barW, barH);
            ctx.fillStyle = "#E83B3B";
            var fillW = Math.round(barW * hpPct);
            if (fillW > 0) {
              ctx.fillRect(bx, hpBarY, fillW, barH);
              ctx.fillStyle = "#FF8E6E";
              ctx.fillRect(bx, hpBarY, fillW, 2);
            }

            var keys = e.dir >= 0
              ? [orderedKeys[0], orderedKeys[1], orderedKeys[2]]
              : [orderedKeys[2], orderedKeys[1], orderedKeys[0]];
            var pIdx;
            var pipsStartX = bx + barW + 4;
            for (pIdx = 0; pIdx < 3; pIdx++) {
              var pz = getBruteZoneByKey(e, keys[pIdx]);
              var px = pipsStartX + pIdx * (pipW + pipGap);
              ctx.fillStyle = "#0C0A10";
              ctx.fillRect(px - 1, hpBarY - 1, pipW + 2, pipH + 2);
              if (!pz || pz.state === "BROKEN") {
                ctx.fillStyle = "#231a29";
                ctx.fillRect(px, hpBarY, pipW, pipH);
              } else if (pz.state === "CRACKED") {
                var cPct = Math.max(0.25, pz.armor / pz.maxArmor);
                ctx.fillStyle = "#3b2318";
                ctx.fillRect(px, hpBarY, pipW, pipH);
                ctx.fillStyle = "#FF9338";
                ctx.fillRect(px, hpBarY, Math.round(pipW * cPct), pipH);
              } else {
                var iPct = Math.max(0.5, pz.armor / pz.maxArmor);
                ctx.fillStyle = "#243040";
                ctx.fillRect(px, hpBarY, pipW, pipH);
                ctx.fillStyle = "#35E0F0";
                ctx.fillRect(px, hpBarY, Math.round(pipW * iPct), pipH);
              }
            }
          }
        },

        drawMonsterPixelArt: function (ctx, e, sx, sy) {
          var mSet = getMonsterSpriteSet(e);
          if (!mSet || !mSet.base) {
            throw new Error("no sprite set for monster type " + (e && e.type) + " / variant " + (e && e.variantId));
          }

          var scale = 3; // 1 art pixel = 3 world px
          var artW = (mSet.artW || 13) * scale;
          var artH = (mSet.artH || 9) * scale;
          var flip = e.dir < 0;

          // Center art horizontally on hitbox, align bottom of art with bottom of hitbox (for grounded monsters)
          var drawX = Math.round(sx + (e.w - artW) * 0.5);
          var drawY = (e.type === "glider" || e.type === "drone")
            ? Math.round(sy + (e.h - artH) * 0.5)
            : Math.round(sy + e.h - artH);

          // Select animation & frame
          var animKey = "idle";
          var frameIdx = 0;
          var speed = Math.abs(e.vx || 0);
          if (e.flashTimer > 0 || e.state === "STAGGER" || e.tripStunTimer > 0) {
            animKey = "hurt";
            frameIdx = Math.floor(GAME.time * 10);
          } else if (e.state === "TELEGRAPH") {
            animKey = "telegraph";
            frameIdx = Math.floor(GAME.time * 8);
          } else if (e.state === "LUNGE" || e.state === "DIVE" || e.state === "RECOVER") {
            animKey = "attack";
            frameIdx = Math.floor(GAME.time * 12);
          } else if (speed > 8 || e.type === "glider" || e.type === "drone") {
            animKey = "walk";
            frameIdx = Math.floor((e.animTime || GAME.time) * 9);
          } else {
            animKey = "idle";
            frameIdx = Math.floor((e.animTime || GAME.time) * 5);
          }

          // BB-R7 fix: look the frame list up with defaults (empty list, never undefined) and clamp the frame number
          var baseArr = getMonsterAnimFrames(mSet, animKey);
          frameIdx = clampFrameIndex(frameIdx, baseArr.length);
          var baseCanvas = baseArr.length > 0 ? baseArr[frameIdx] : null;
          // Armour-zone sprites are frame lists too; the mite only has 2 (walk pose, crouch pose)
          var zoneFrameIdx = (mSet.skeleton === "mite") ? (animKey === "telegraph" ? 1 : 0) : frameIdx;

          ctx.save();
          try {
          ctx.imageSmoothingEnabled = false;

          // Fungal Slime (lobber) squash-and-stretch when hurt or landing
          var squashX = 1;
          var squashY = 1;
          if (e.type === "lobber" && (e.flashTimer > 0 || e.state === "STAGGER")) {
            squashX = 1.18;
            squashY = 0.82;
          }

          var cx = Math.round(drawX + artW * 0.5);
          var by = Math.round(drawY + artH);
          ctx.translate(cx, by);
          if (e.tripStunTimer > 0) {
            ctx.rotate((e.dir || 1) * 0.25);
          }
          ctx.scale((flip ? -1 : 1) * squashX, squashY);

          var localX = Math.round(-artW * 0.5);
          var localY = -artH;

          // 1. Base monster sprite (includes exposed glowing core in zone slots)
          if (baseCanvas) {
            ctx.drawImage(baseCanvas, localX, localY, artW, artH);
          }

          // 2. Overlay each of the 3 armour zones (INTACT or CRACKED; BROKEN is omitted to reveal glowing inner core)
          var orderedKeys = e.type === "glider" ? ["wing", "carapace", "sensor"] : ["limb", "core", "head"];
          for (var zi = 0; zi < orderedKeys.length; zi++) {
            var zKey = orderedKeys[zi];
            var zObj = getBruteZoneByKey(e, zKey);
            var zState = zObj ? zObj.state : "INTACT";
            if (zState === "BROKEN") continue;
            var zCanvas = getMonsterZoneCanvas(mSet, zKey, zState === "CRACKED", zoneFrameIdx);
            if (zCanvas) {
              ctx.drawImage(zCanvas, localX, localY, artW, artH);
            }
          }

          // 3. 0.08 s white flash overlay when hit
          var anyZoneFlash = false;
          if (e.zones) {
            for (var zf = 0; zf < e.zones.length; zf++) {
              if (e.zones[zf].flashTimer > 0) {
                anyZoneFlash = true;
                break;
              }
            }
          }
          if ((e.flashTimer > 0 || anyZoneFlash) && mSet.whiteFlash) {
            ctx.globalAlpha = 0.85;
            ctx.drawImage(mSet.whiteFlash, localX, localY, artW, artH);
            ctx.globalAlpha = 1.0;
          }
          } finally {
            ctx.restore();
          }

          // Status text, HP bar (60x8) and 3 armour pips beside it
          var orderedStatusKeys = e.type === "glider" ? ["wing", "carapace", "sensor"] : ["limb", "core", "head"];
          RENDER.drawEnemyArmorPipsAndStatus(ctx, e, sx, sy, orderedStatusKeys);

          // Step R6 Requirement 10: Hitbox debug toggle draws both the art box and the 3 zone hitboxes
          if (GAME.showHitboxDebug) {
            ctx.save();
            // Outer pixel-art bounding box (cyan dashed)
            ctx.strokeStyle = "rgba(53, 224, 240, 0.75)";
            ctx.lineWidth = 1;
            ctx.strokeRect(drawX, drawY, artW, artH);
            // Physical body hitbox (85% of art box, yellow)
            ctx.strokeStyle = "rgba(255, 197, 58, 0.9)";
            ctx.lineWidth = 1.5;
            ctx.strokeRect(sx, sy, e.w, e.h);
            // 3 zone hitboxes
            if (e.zones) {
              for (var dIdx = 0; dIdx < e.zones.length; dIdx++) {
                var dz = e.zones[dIdx];
                var zr = getBruteZoneWorldRect(e, dz);
                var zsx = Math.round(zr.x - (e.x - sx));
                var zsy = Math.round(zr.y - (e.y - sy));
                ctx.strokeStyle = dz.state === "BROKEN" ? "#FF3838" : (dz.state === "CRACKED" ? "#FF9338" : "#44D66C");
                ctx.lineWidth = 1.2;
                ctx.strokeRect(zsx, zsy, zr.w, zr.h);
              }
            }
            ctx.restore();
          }
        },

        drawEnemies: function (ctx, camX, camY) {
          var i;
          trackCtxDepth(ctx);
          // 1. Draw dying enemies playing their 3- or 4-frame death animation
          if (GAME.dyingEnemies && GAME.dyingEnemies.length > 0) {
            for (i = 0; i < GAME.dyingEnemies.length; i++) {
              var de = GAME.dyingEnemies[i];
              var deDepth = getCtxDepth(ctx);
              try {
              var dsx = Math.round(de.x - camX);
              var dsy = Math.round(de.y - camY);
              var dmSet = getMonsterSpriteSet(de);
              if (dmSet && dmSet.base && dmSet.base.death && dmSet.base.death.length > 0) {
                var dScale = 3;
                var dArtW = (dmSet.artW || 13) * dScale;
                var dArtH = (dmSet.artH || 9) * dScale;
                var dFrames = dmSet.base.death;
                var prog = 1 - Math.max(0, de.timer) / Math.max(0.01, de.maxTimer);
                var dfIdx = clampFrameIndex(Math.min(dFrames.length - 1, Math.floor(prog * dFrames.length)), dFrames.length);
                var dCanvas = dFrames[dfIdx];
                if (dCanvas) {
                  ctx.save();
                  ctx.imageSmoothingEnabled = false;
                  ctx.globalAlpha = Math.max(0.15, de.timer / de.maxTimer);
                  var dDrawX = Math.round(dsx + (de.w - dArtW) * 0.5);
                  var dDrawY = Math.round(dsy + de.h - dArtH);
                  if (de.dir < 0) {
                    ctx.translate(dDrawX + dArtW, dDrawY);
                    ctx.scale(-1, 1);
                    ctx.drawImage(dCanvas, 0, 0, dArtW, dArtH);
                  } else {
                    ctx.drawImage(dCanvas, dDrawX, dDrawY, dArtW, dArtH);
                  }
                  ctx.restore();
                }
              }
              } catch (deErr) {
                reportOnce("dying monster art", deErr);
                unwindCtx(ctx, deDepth);
              }
            }
          }

          // 2. Draw active enemies
          for (i = 0; i < CFG.maxEnemies; i++) {
            var e = GAME.enemies[i];
            if (!e.active) continue;

            var sx = Math.round(e.x - camX);
            var sy = Math.round(e.y - camY);
            if (sx + e.w < -60 || sx > CFG.logicalWidth + 60 || sy + e.h < -60 || sy > CFG.logicalHeight + 60) {
              continue;
            }

            if (e.isElite) {
              RENDER.drawEliteCrownAndAura(ctx, sx + e.w * 0.5, sy, e.w, e.h);
            }

            var mDepth = getCtxDepth(ctx);
            try {
              RENDER.drawMonsterPixelArt(ctx, e, sx, sy);
            } catch (mErr) {
              // A bad sprite can never stop the game: show a plain coloured box for this monster instead
              reportOnce("drawMonsterPixelArt (" + (e.variantId || e.type) + ")", mErr);
              unwindCtx(ctx, mDepth);
              try {
                var fbDef = (e.variantId && DATA_TABLES.variants) ? DATA_TABLES.variants[e.variantId] : null;
                var fbCol = (fbDef && fbDef.tintPrimary) ? fbDef.tintPrimary : "#7A2A6E";
                var fbEdge = (fbDef && fbDef.tintAccent) ? fbDef.tintAccent : "#FFC53A";
                ctx.save();
                ctx.fillStyle = fbCol;
                ctx.fillRect(sx, sy, e.w || 30, e.h || 30);
                ctx.strokeStyle = fbEdge;
                ctx.lineWidth = 2;
                ctx.strokeRect(sx, sy, e.w || 30, e.h || 30);
                ctx.restore();
              } catch (fbErr) {
                unwindCtx(ctx, mDepth);
              }
            }
          }
        },

        // Step R5 Requirement 6: Chief Engineer Mara & Workbench + floating USE prompt within 120 world px
        drawMaraAndWorkbench: function (ctx, camX, camY, mode, foundryCar) {
          var maraWorldX, maraFeetY, benchWorldX;
          if (mode === "RUN") {
            if (!foundryCar) return;
            // Rear end of the Foundry Car (away from player spawn near middle of car)
            benchWorldX = foundryCar.x + 6;
            maraWorldX = foundryCar.x + 48;
            maraFeetY = foundryCar.y;
          } else {
            // Beside the start in Sandbox (player spawns at CFG.startX = 128, feet at 1088)
            benchWorldX = Math.max(36, CFG.startX - 96);
            maraWorldX = Math.max(82, CFG.startX - 48);
            maraFeetY = CFG.trainFloorY;
          }

          var benchSx = Math.round(benchWorldX - camX);
          var benchSy = Math.round(maraFeetY - 42 - camY);
          var maraSx = Math.round(maraWorldX - camX);
          var maraSy = Math.round(maraFeetY - 54 - camY);

          // Soft shadow under workbench and Mara
          ctx.save();
          ctx.fillStyle = "rgba(12, 10, 16, 0.45)";
          ctx.beginPath();
          ctx.ellipse(benchSx + 24, maraFeetY - camY, 22, 4, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.ellipse(maraSx + 21, maraFeetY - camY, 15, 4, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          // Draw Workbench (16x14 art px -> 48x42 world px, 2 frames)
          var benchFrame = Math.floor(GAME.time * 2) % 2;
          drawSprite(ctx, "mara_workbench", benchFrame, benchSx, benchSy, false, 3);

          // Draw Chief Engineer Mara (14x18 art px -> 42x54 world px, 4-frame idle at 3 fps)
          var pl = GAME.player;
          var plCx = pl.x + pl.w * 0.5;
          var plCy = pl.y + pl.h * 0.5;
          var maraCx = maraWorldX + 21;
          var maraCy = maraFeetY - 27;
          var flipMara = plCx < maraCx - 8;
          var maraFrame = Math.floor(GAME.time * 3) % 4;
          drawSprite(ctx, "npc_mara", maraFrame, maraSx, maraSy, flipMara, 3);

          // Check distance (within 120 world px of Mara) for floating USE prompt
          var distToMara = Math.hypot(plCx - maraCx, plCy - maraCy);
          if (distToMara <= 120 && GAME.mode === "PLAYING") {
            GAME.maraInRange = true;
            var bob = Math.sin(GAME.time * 6) * 2.5;
            var promptW = 54;
            var promptH = 20;
            var promptX = Math.round(maraSx + 21 - promptW * 0.5);
            var promptY = Math.round(maraSy - 24 + bob);

            ctx.save();
            ctx.fillStyle = "rgba(12, 10, 16, 0.92)";
            ctx.strokeStyle = "#35E0F0";
            ctx.lineWidth = 2;
            ctx.fillRect(promptX, promptY, promptW, promptH);
            ctx.strokeRect(promptX, promptY, promptW, promptH);

            ctx.font = "900 11px 'Trebuchet MS', sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillStyle = "#FFF0B8";
            ctx.fillText(GAME.keyboardOrMouseUsed ? "USE [U]" : "USE", promptX + promptW * 0.5, promptY + promptH * 0.5 + 0.5);
            ctx.restore();

            var zoom = getEffectiveZoom();
            GAME.maraUsePromptRect = {
              x: promptX * zoom,
              y: promptY * zoom,
              w: promptW * zoom,
              h: promptH * zoom
            };
          } else if (GAME.playMode === mode) {
            GAME.maraInRange = false;
            GAME.maraUsePromptRect = null;
          }
        },

        drawPlayer: function (ctx, camX, camY) {
          var pl = GAME.player;
          var stats = GAME.bladeStats || recomputeStats(GAME.loadout);

          // Draw Volt-Core Redline arc lightning bolts in world space
          if (GAME.voltArcs && GAME.voltArcs.length > 0) {
            var vaIdx;
            for (vaIdx = 0; vaIdx < GAME.voltArcs.length; vaIdx++) {
              var va = GAME.voltArcs[vaIdx];
              var ax1 = va.x1 - camX;
              var ay1 = va.y1 - camY;
              var ax2 = va.x2 - camX;
              var ay2 = va.y2 - camY;
              var mx = (ax1 + ax2) * 0.5 + (Math.random() - 0.5) * 14;
              var my = (ay1 + ay2) * 0.5 - 8 + (Math.random() - 0.5) * 14;
              ctx.save();
              ctx.globalAlpha = Math.max(0, Math.min(1, va.timer / va.maxTimer));
              ctx.strokeStyle = "#ffe652";
              ctx.lineWidth = 3.2;
              ctx.beginPath();
              ctx.moveTo(ax1, ay1);
              ctx.lineTo(mx, my);
              ctx.lineTo(ax2, ay2);
              ctx.stroke();
              ctx.strokeStyle = "#ffffff";
              ctx.lineWidth = 1.4;
              ctx.beginPath();
              ctx.moveTo(ax1, ay1);
              ctx.lineTo(mx, my);
              ctx.lineTo(ax2, ay2);
              ctx.stroke();
              ctx.restore();
            }
          }

          // Step R3 Requirement 2 & Step R5: Draw expanding double-jump ring of dust and sparks under the feet (fx_double_jump_ring)
          if (GAME.doubleJumpRings && GAME.doubleJumpRings.length > 0) {
            var djrIdx;
            for (djrIdx = 0; djrIdx < GAME.doubleJumpRings.length; djrIdx++) {
              var djr = GAME.doubleJumpRings[djrIdx];
              var djProg = 1 - Math.max(0, djr.timer / Math.max(0.01, djr.maxTimer));
              var ringFrame = Math.min(2, Math.floor(djProg * 3));
              var djsx = Math.round(djr.x - camX - 24);
              var djsy = Math.round(djr.y - camY - 9);
              drawSprite(ctx, "fx_double_jump_ring", ringFrame, djsx, djsy, false, 3);
            }
          }

          var sx = Math.round(pl.x - camX);
          var sy = Math.round(pl.y - camY);

          // Step R3 Requirement 2: Small pip under the feet showing whether the air jump is available
          if (!pl.onGround && !pl.onTrainRoof && GAME.mode !== "DEFEAT") {
            var hasAirJump = (pl.airJumpsLeft || 0) > 0;
            ctx.save();
            ctx.fillStyle = hasAirJump ? "#2FE6A0" : "rgba(90, 98, 112, 0.55)";
            ctx.strokeStyle = "#0C0A10";
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(sx + pl.w * 0.5, sy + pl.h + 6, hasAirJump ? 3.5 : 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.restore();
          }

          // Step R5 Requirement 7: Soft dark ellipse shadow under the hero on the ground and on the train roof
          var shadowAlpha = (pl.onGround || pl.onTrainRoof) ? 0.48 : 0.24;
          var shadowRx = (pl.onGround || pl.onTrainRoof) ? 16 : 11;
          ctx.save();
          ctx.fillStyle = "rgba(12, 10, 16, " + shadowAlpha + ")";
          ctx.beginPath();
          ctx.ellipse(sx + pl.w * 0.5, sy + pl.h, shadowRx, 4, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          // Step R4 Requirement 3 & Step R5: During 0.2s RETURN fade, player fades into fx_return_flash
          if (pl.tetherRecalling && pl.returnFadeTimer > 0) {
            var rfProg = 1 - Math.max(0, Math.min(1, pl.returnFadeTimer / Math.max(0.01, CFG.returnFadeDuration)));
            var rfFrame = Math.min(2, Math.floor(rfProg * 3));
            drawSprite(
              ctx,
              "fx_return_flash",
              rfFrame,
              Math.round(sx + pl.w * 0.5 - 21),
              Math.round(sy + pl.h - 54),
              false,
              3
            );
            return;
          }

          var immuneTimer = Math.max(pl.invulnTimer || 0, pl.drillImmuneTimer || 0);
          if (immuneTimer > 0 && Math.floor(immuneTimer * 20) % 2 === 1 && pl.hurtLockTimer <= 0) {
            return;
          }

          var inRedline =
            pl.overheatTimer <= 0 &&
            pl.heat >= CFG.heatRedlineMin &&
            pl.heat <= CFG.heatRedlineMax;

          var edgeShape = stats ? stats.edgeShape : "cleaver";
          var coreCol = stats ? stats.coreColor : "#ff8c29";
          var coilCol = stats ? stats.coilColor : "#42c6ff";
          var edgeCol = stats ? stats.edgeColor : "#d9e6f2";

          // Step R5 Requirement 2: Select hero sprite animation & frame
          var animName = "hero_idle";
          var animFrame = 0;

          if (GAME.forcedHeroAnim) {
            animName = GAME.forcedHeroAnim;
            var forcedFrames = SPRITES[animName] ? SPRITES[animName].length : 1;
            var forcedFps = animName === "hero_run" ? 12 : animName === "hero_idle" ? 2 : 6;
            animFrame = Math.floor(GAME.time * forcedFps) % forcedFrames;
          } else if (GAME.mode === "DEFEAT") {
            animName = "hero_defeat";
            animFrame = Math.min(2, Math.floor(pl.animTime * 4) % 3);
          } else if (pl.hurtLockTimer > 0) {
            animName = "hero_hurt";
            animFrame = 0;
          } else if (pl.bladeTimer > 0 || pl.buzzsawActive) {
            animName = "hero_swing";
            if (pl.buzzsawActive) {
              animFrame = Math.floor(GAME.time * 16) % 3;
            } else {
              var swingElapsed = CFG.bladeTotalTime - pl.bladeTimer;
              if (swingElapsed < CFG.bladeWindupTime) {
                animFrame = 0; // windup 0.08s
              } else if (swingElapsed < CFG.bladeWindupTime + CFG.bladeActiveTime) {
                animFrame = 1; // active 0.10s
              } else {
                animFrame = 2; // recovery 0.10s
              }
            }
          } else if (!pl.onGround && !pl.onTrainRoof) {
            if (pl.doubleJumpAnimTimer > 0) {
              animName = "hero_double_jump";
              var djSpinProg = 1 - pl.doubleJumpAnimTimer / 0.36;
              animFrame = Math.min(3, Math.floor(djSpinProg * 4));
            } else {
              animName = "hero_jump";
              if (pl.vy < -260) {
                animFrame = pl.squashTimer > 0.08 ? 0 : 1;
              } else {
                animFrame = 2;
              }
            }
          } else if (Math.abs(pl.vx) > 15) {
            animName = "hero_run";
            var spdRatio = Math.max(0.65, Math.min(1.5, Math.abs(pl.vx) / CFG.runSpeed));
            animFrame = Math.floor(pl.animTime * 12 * spdRatio) % 5;
          } else {
            animName = "hero_idle";
            animFrame = Math.floor(pl.animTime * 2) % 3;
          }

          var flipHero = pl.facing < 0;
          var spriteW = 42;
          var spriteH = 54;

          ctx.save();
          ctx.translate(Math.round(sx + pl.w * 0.5), Math.round(sy + pl.h));
          ctx.scale(pl.squashScaleX || 1, pl.squashScaleY || 1);

          // Redline flame aura behind hero (fx_redline_flame)
          if (inRedline) {
            var rfIdx = Math.floor(GAME.time * 10) % 2;
            drawSprite(ctx, "fx_redline_flame", rfIdx, -12, -46, flipHero, 3);
          }

          // Draw 14x18 Vanguard-07 pixel sprite (42x54 world px) aligned to bottom-center of 24x44 hitbox
          drawSprite(ctx, animName, animFrame, -spriteW * 0.5, -spriteH, flipHero, 3);

          // Overheat steam puffs above helmet/backpack (fx_overheat_steam)
          if (pl.overheatTimer > 0) {
            var stFrame = Math.floor(GAME.time * 8) % 3;
            drawSprite(ctx, "fx_overheat_steam", stFrame, -12, -spriteH - 14, false, 3);
          }

          ctx.restore();

          var shoulderScreenX = sx + pl.w * 0.5;
          var shoulderScreenY = sy + pl.h - 22;

          // Step R5 Requirement 4: Held items drawn in the hero's hands, rotating with aim, shown for 0.3s when used
          if (GAME.mode !== "DEFEAT" && pl.overheatTimer <= 0) {
            var showItem = null;
            if (pl.bladeTimer > 0 || pl.buzzsawActive) {
              showItem = "item_blade";
            } else if (pl.heldItemTimer > 0 && pl.heldItemType) {
              if (pl.heldItemType === "blade") showItem = "item_blade";
              else if (pl.heldItemType === "hook") showItem = "item_hook";
              else if (pl.heldItemType === "tripwire") showItem = "item_tripwire";
              else showItem = "item_pistol";
            } else if (INPUT.mouseDown || INPUT.stickFiring || INPUT.held.fireKey || (INPUT.stickPointerId !== null && INPUT.stickMag > 0.1)) {
              showItem = "item_pistol";
            }

            if (showItem) {
              var handX = Math.round(sx + pl.w * 0.5 + (pl.facing >= 0 ? 4 : -4));
              var handY = Math.round(sy + pl.h - 22);
              var itemAngle = (pl.bladeTimer > 0 || pl.buzzsawActive) ? pl.bladeAngle : pl.aimAngle;
              var itemFrame = Math.floor(GAME.time * 12) % 2;

              ctx.save();
              ctx.translate(handX, handY);
              ctx.rotate(itemAngle);
              if (Math.cos(itemAngle) < -0.01) {
                ctx.scale(1, -1);
              }
              if (showItem === "item_blade") {
                var swingOffset = 0;
                if (pl.buzzsawActive) {
                  ctx.rotate(pl.buzzsawSpinAngle || 0);
                } else if (pl.bladeTimer > 0) {
                  var bEl = CFG.bladeTotalTime - pl.bladeTimer;
                  if (bEl < CFG.bladeWindupTime) swingOffset = -0.85;
                  else if (bEl < CFG.bladeWindupTime + CFG.bladeActiveTime) swingOffset = 0.35;
                  else swingOffset = 0.75;
                  ctx.rotate(swingOffset);
                }
                drawSprite(ctx, "item_blade", itemFrame, -6, -13, false, 3);
              } else if (showItem === "item_hook") {
                drawSprite(ctx, "item_hook", itemFrame, -4, -12, false, 3);
              } else if (showItem === "item_tripwire") {
                drawSprite(ctx, "item_tripwire", itemFrame, -3, -12, false, 3);
              } else {
                drawSprite(ctx, "item_pistol", pl.muzzleFlashFrames > 0 ? 1 : 0, -3, -10, false, 3);
              }
              ctx.restore();
            }
          }

          // Step R5 Requirement 5: Blade slash arc sprite (fx_blade_arc) + modular weapon visual effects
          if (pl.buzzsawActive && edgeShape === "buzzsaw") {
            var isRedBuzz = pl.bladeIsRedline || inRedline;
            var sawDist = Math.max(24, CFG.bladeReach - 12);
            var sawX = shoulderScreenX + Math.cos(pl.bladeAngle) * sawDist;
            var sawY = shoulderScreenY + Math.sin(pl.bladeAngle) * sawDist;
            var sawR = 16;

            ctx.save();
            ctx.strokeStyle = coilCol;
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(shoulderScreenX, shoulderScreenY);
            ctx.lineTo(sawX, sawY);
            ctx.stroke();

            ctx.translate(sawX, sawY);
            ctx.rotate(pl.buzzsawSpinAngle || (GAME.time * 25));
            drawSprite(ctx, "fx_blade_arc", Math.floor(GAME.time * 18) % 2, -24, -24, false, 3);
            ctx.fillStyle = isRedBuzz ? coreCol : "#9fb1c4";
            ctx.beginPath();
            ctx.arc(0, 0, sawR - 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          } else if (pl.bladeTimer > 0) {
            var elapsed = CFG.bladeTotalTime - pl.bladeTimer;
            var arcFrame = 0;
            if (elapsed >= CFG.bladeWindupTime + CFG.bladeActiveTime) {
              arcFrame = Math.min(2, 1 + Math.floor(((elapsed - CFG.bladeWindupTime - CFG.bladeActiveTime) / CFG.bladeRecoveryTime) * 2));
            }
            if (elapsed >= CFG.bladeWindupTime * 0.5) {
              ctx.save();
              ctx.translate(shoulderScreenX, shoulderScreenY);
              ctx.rotate(pl.bladeAngle);
              if (pl.bladeComboFlip) {
                ctx.scale(1, -1);
              }
              drawSprite(ctx, "fx_blade_arc", arcFrame, -8, -24, false, 3);
              ctx.restore();
            }
          }

          if (pl.muzzleFlashFrames > 0) {
            var mfx = Math.round(pl.muzzleX - camX);
            var mfy = Math.round(pl.muzzleY - camY);
            drawSprite(ctx, "fx_hit_spark", 0, mfx - 10, mfy - 10, false, 3);
            if (GAME.mode === "PLAYING") {
              pl.muzzleFlashFrames--;
            }
          }

          // Step R5 Requirement 5: Vent Parry glyph sprite (fx_parry_glyph, 6-frame expanding cyan glyph)
          var parryCenterAng = pl.facing >= 0 ? 0 : Math.PI;
          var parryHalfArc = ((CFG.parryBlastArcDeg * 0.5) * Math.PI) / 180;
          if (pl.parryWindowTimer > 0) {
            var parryElapsed = CFG.parryWindow - pl.parryWindowTimer;
            var glyphFrame = Math.min(5, Math.floor((parryElapsed / CFG.parryWindow) * 6));
            drawSprite(
              ctx,
              "fx_parry_glyph",
              glyphFrame,
              Math.round(shoulderScreenX - 24),
              Math.round(shoulderScreenY - 24),
              false,
              3
            );
          }

          // Expanding directional blast ring visual on Vent Parry success (120 px long, 70 deg wide)
          if (pl.parryBlastTimer > 0) {
            var blastProg = 1 - pl.parryBlastTimer / CFG.parryBlastVisualTime;
            var bCenterAng = pl.parryBlastDir >= 0 ? 0 : Math.PI;
            var bScreenX = Math.round(pl.parryBlastX - camX);
            var bScreenY = Math.round(pl.parryBlastY - camY);
            var ringRadius = 24 + blastProg * (CFG.parryBlastLength - 24);
            ctx.save();
            ctx.globalAlpha = Math.max(0, 1 - blastProg * 0.85);
            ctx.fillStyle = "rgba(94, 242, 255, 0.20)";
            ctx.beginPath();
            ctx.moveTo(bScreenX, bScreenY);
            ctx.arc(
              bScreenX,
              bScreenY,
              CFG.parryBlastLength * Math.min(1, blastProg * 1.35),
              bCenterAng - parryHalfArc,
              bCenterAng + parryHalfArc
            );
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = "#5ef2ff";
            ctx.lineWidth = 6 * (1 - blastProg * 0.5);
            ctx.beginPath();
            ctx.arc(
              bScreenX,
              bScreenY,
              ringRadius,
              bCenterAng - parryHalfArc,
              bCenterAng + parryHalfArc
            );
            ctx.stroke();
            ctx.restore();

            drawSprite(
              ctx,
              "fx_parry_glyph",
              Math.min(5, Math.floor(blastProg * 6)),
              Math.round(bScreenX - 24),
              Math.round(bScreenY - 24),
              false,
              3
            );
          }

          // Debug: Show parry window & blast cone overlay when toggled
          if (GAME.showParryDebug) {
            ctx.save();
            ctx.strokeStyle =
              pl.parryWindowTimer > 0
                ? "#47f0a6"
                : pl.parryLockoutTimer > 0
                ? "#ff5e57"
                : "rgba(94, 242, 255, 0.55)";
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(shoulderScreenX, shoulderScreenY);
            ctx.arc(
              shoulderScreenX,
              shoulderScreenY,
              CFG.parryBlastLength,
              parryCenterAng - parryHalfArc,
              parryCenterAng + parryHalfArc
            );
            ctx.closePath();
            ctx.stroke();
            ctx.restore();
          }

          // OVERHEAT warning above player while stunned for 2s
          if (pl.overheatTimer > 0) {
            ctx.save();
            ctx.textAlign = "center";
            ctx.font = "bold 13px monospace";
            var ohX = sx + pl.w * 0.5;
            var ohY = sy - 16;
            ctx.fillStyle = "rgba(20, 8, 10, 0.88)";
            ctx.fillRect(ohX - 42, ohY - 12, 84, 16);
            ctx.strokeStyle = "#ff5242";
            ctx.strokeRect(ohX - 42, ohY - 12, 84, 16);
            ctx.fillStyle =
              Math.floor(GAME.time * 12) % 2 === 0 ? "#ff5e57" : "#ffe082";
            ctx.fillText("OVERHEAT", ohX, ohY);
            ctx.restore();
          }

          // Step R4 Requirement 2 & Step R5: Shield bubble flash sprite (fx_shield_bubble)
          if (pl.shieldHitFlashTimer > 0 || pl.shieldBreakFlashTimer > 0) {
            var shFrame = pl.shieldBreakFlashTimer > 0 ? 1 : (Math.floor(GAME.time * 14) % 2);
            drawSprite(
              ctx,
              "fx_shield_bubble",
              shFrame,
              Math.round(sx + pl.w * 0.5 - 24),
              Math.round(sy + pl.h - 57),
              false,
              3
            );
          }

          // Step R5 Requirement 8: Debug Show Hitbox (green 24x44 hitbox inside 42x54 sprite bounds)
          if (GAME.showHitboxDebug) {
            ctx.save();
            ctx.strokeStyle = "rgba(255, 90, 54, 0.85)";
            ctx.lineWidth = 1;
            ctx.strokeRect(Math.round(sx + pl.w * 0.5 - 21), Math.round(sy + pl.h - 54), 42, 54);
            ctx.strokeStyle = "#2FE6A0";
            ctx.lineWidth = 1.5;
            ctx.strokeRect(sx, sy, pl.w, pl.h);
            ctx.restore();
          }
        },

        drawBolts: function (ctx, camX, camY) {
          var i;
          var frameIdx = Math.floor(GAME.time * 16) % 2;
