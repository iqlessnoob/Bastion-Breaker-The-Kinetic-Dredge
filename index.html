              ctx.fillStyle = "#FFC53A";
              ctx.fillText(entry.version + " (" + entry.date + ")", listX + 16, curY + 21);

              ctx.font = "13px sans-serif";
              ctx.fillStyle = "#E8DFD1";
              var summaryNote = String(entry.notes || "");
              if (summaryNote.length > 86) summaryNote = summaryNote.substring(0, 83) + "...";
              ctx.fillText(summaryNote, listX + 16, curY + 42);
              curY += 64;
            }
            ctx.restore();

            var backRectL = { x: pxL + Math.round((pwL - 260) * 0.5), y: pyL + phL - 78, w: 260, h: 64 };
            GAME.settingsSubBackRect = backRectL;
            ctx.fillStyle = "#C9962E";
            ctx.strokeStyle = "#FFC53A";
            ctx.lineWidth = 2.5;
            RENDER.fillRoundRect(ctx, backRectL.x, backRectL.y, backRectL.w, backRectL.h, 8);
            RENDER.strokeRoundRect(ctx, backRectL.x, backRectL.y, backRectL.w, backRectL.h, 8);
            ctx.textAlign = "center";
            ctx.font = "bold 22px sans-serif";
            ctx.fillStyle = "#0C0A10";
            ctx.fillText("BACK", backRectL.x + backRectL.w * 0.5, backRectL.y + 40);
            ctx.restore();
          } else {
            // MAIN SETTINGS / PAUSE MENU: riveted dark-steel & brass panel with scrollable 64px-tall buttons
            ctx.fillStyle = "rgba(8, 6, 12, 0.80)";
            ctx.fillRect(0, 0, CFG.logicalWidth, CFG.logicalHeight);

            var panelW = Math.min(640, CFG.logicalWidth - 40);
            var panelH = 496;
            var panelX = Math.round((CFG.logicalWidth - panelW) * 0.5);
            var panelY = Math.round((CFG.logicalHeight - panelH) * 0.5);

            ctx.save();
            var titleStr = GAME.settingsReturnToTitle
              ? "SETTINGS — BASTION CONFIG"
              : "PAUSED / SETTINGS (" + GAME.playMode + ")";
            RENDER.drawRivetedSteelPanel(ctx, panelX, panelY, panelW, panelH, titleStr, false);

            ctx.textAlign = "center";
            ctx.fillStyle = "#D8E2F0";
            ctx.font = "bold 13px monospace";
            ctx.fillText("Drag or scroll list · Tap any button to activate", panelX + panelW * 0.5, panelY + 62);

            var st = GAME.settings;
            var zoomLabel = "NORMAL (1.7x)";
            if (st.zoomPreset === "Close") zoomLabel = "CLOSE (2.0x)";
            else if (st.zoomPreset === "Far") zoomLabel = "FAR (1.4x)";

            var items = [
              { id: "resume", label: GAME.settingsReturnToTitle ? "BACK TO TITLE" : "RESUME", accent: "#2FE6A0", textCol: "#0C0A10" },
              { id: "restart", label: "RESTART", accent: "#FF8A1E", textCol: "#0C0A10" },
              { id: "quit", label: "QUIT TO TITLE", accent: "#3b2229", textCol: "#ffd6d1" },
              { id: "edit_controls", label: "EDIT CONTROLS", accent: "#35E0F0", textCol: "#0C0A10" },
              { id: "sound", label: "SOUND: " + (st.soundOn ? "ON" : "OFF"), accent: st.soundOn ? "#2d4436" : "#222730", textCol: "#F4EFE6" },
              { id: "zoom", label: "ZOOM: " + zoomLabel, accent: "#222730", textCol: "#F4EFE6" },
              { id: "hud_size", label: "HUD SIZE: " + (st.hudSize || "M"), accent: "#222730", textCol: "#F4EFE6" },
              { id: "reduce_shake", label: "REDUCE SHAKE: " + (st.reduceShake ? "ON" : "OFF"), accent: st.reduceShake ? "#2d4436" : "#222730", textCol: "#F4EFE6" },
              { id: "reduce_particles", label: "REDUCE PARTICLES: " + (st.reduceParticles ? "ON" : "OFF"), accent: st.reduceParticles ? "#2d4436" : "#222730", textCol: "#F4EFE6" },
              { id: "controls_help", label: "CONTROLS HELP", accent: "#222730", textCol: "#F4EFE6" },
              { id: "version_log", label: "VERSION LOG", accent: "#222730", textCol: "#F4EFE6" },
              { id: "back", label: "BACK", accent: "#C9962E", textCol: "#0C0A10" }
            ];

            var vpX = panelX + 24;
            var vpY = panelY + 74;
            var vpW = panelW - 48;
            var vpH = panelH - 92;
            var rowH = 64;
            var rowGap = 10;
            var totalContentH = items.length * (rowH + rowGap) - rowGap;
            var maxScroll = Math.max(0, totalContentH - vpH);
            GAME.settingsMaxScrollY = maxScroll;
            if (GAME.settingsScrollY < 0) GAME.settingsScrollY = 0;
            if (GAME.settingsScrollY > maxScroll) GAME.settingsScrollY = maxScroll;

            GAME.settingsItemRects = [];

            ctx.save();
            ctx.beginPath();
            ctx.rect(vpX, vpY, vpW, vpH);
            ctx.clip();

            for (var idx = 0; idx < items.length; idx++) {
              var it = items[idx];
              var iy = vpY + idx * (rowH + rowGap) - GAME.settingsScrollY;
              var ix = vpX;
              var iw = vpW - 14;

              // Record clipped clickable rect if visible within viewport
              var clipTop = Math.max(vpY, iy);
              var clipBot = Math.min(vpY + vpH, iy + rowH);
              if (clipBot > clipTop + 8) {
                GAME.settingsItemRects.push({
                  id: it.id,
                  x: ix,
                  y: clipTop,
                  w: iw,
                  h: clipBot - clipTop
                });
              }

              if (iy + rowH < vpY || iy > vpY + vpH) continue;

              ctx.fillStyle = it.accent;
              ctx.strokeStyle = "#C9962E";
              ctx.lineWidth = 2.5;
              RENDER.fillRoundRect(ctx, ix, iy, iw, rowH, 8);
              RENDER.strokeRoundRect(ctx, ix, iy, iw, rowH, 8);

              // Rivet studs on each 64px button
              ctx.fillStyle = "#FFE699";
              ctx.fillRect(ix + 6, iy + 6, 3, 3);
              ctx.fillRect(ix + iw - 9, iy + 6, 3, 3);
              ctx.fillRect(ix + 6, iy + rowH - 9, 3, 3);
              ctx.fillRect(ix + iw - 9, iy + rowH - 9, 3, 3);

              ctx.textAlign = "center";
              ctx.font = "bold 22px sans-serif";
              ctx.fillStyle = it.textCol;
              ctx.fillText(it.label, ix + iw * 0.5, iy + 40);
            }
            ctx.restore();

            // Scrollbar track on right edge of viewport
            if (maxScroll > 0) {
              var sbX = vpX + vpW - 6;
              ctx.fillStyle = "rgba(255,255,255,0.12)";
              RENDER.fillRoundRect(ctx, sbX, vpY, 6, vpH, 3);
              var thumbH = Math.max(36, (vpH / totalContentH) * vpH);
              var thumbY = vpY + (GAME.settingsScrollY / maxScroll) * (vpH - thumbH);
              ctx.fillStyle = "#FFC53A";
              RENDER.fillRoundRect(ctx, sbX, thumbY, 6, thumbH, 3);
            }

            ctx.restore();
          }
        } else if (GAME.mode === "DEFEAT") {
          ctx.fillStyle = "rgba(18, 6, 10, 0.78)";
          ctx.fillRect(0, 0, CFG.logicalWidth, CFG.logicalHeight);

          ctx.save();
          ctx.translate(ox, 0);

          RENDER.drawRivetedSteelPanel(
            ctx,
            220,
            135,
            520,
            260,
            GAME.playMode === "RUN" ? "BASTION EXPEDITION LOST" : "SYSTEM DOWN",
            false
          );

          ctx.textAlign = "center";

          if (GAME.playMode === "RUN") {
            ctx.fillStyle = "#ffd199";
            ctx.font = "bold 15px monospace";
            ctx.fillText(
              GAME.runState.defeatReason || "THE BASTION COULD NOT CONTINUE",
              480,
              218
            );

            ctx.fillStyle = "#c9b8a6";
            ctx.font = "13px monospace";
            ctx.fillText(
              "Distance: " + fmt(GAME.runState.distanceKm, 1) + " / " + GAME.runState.targetKm +
                " km · Kills: " + GAME.crawlersDestroyed + " · Deaths: " + GAME.runState.playerDeaths,
              480,
              250
            );

            // Restart Run button (x: 250..490, y: 282..346)
            ctx.fillStyle = "#e67e22";
            ctx.fillRect(250, 282, 240, 64);
            ctx.strokeStyle = "#ffe0b2";
            ctx.lineWidth = 2;
            ctx.strokeRect(250, 282, 240, 64);
            ctx.fillStyle = "#140d18";
            ctx.font = "bold 20px sans-serif";
            ctx.fillText("RESTART RUN (R)", 370, 321);

            // Quit to Title button (x: 510..710, y: 282..346)
            ctx.fillStyle = "#2d243b";
            ctx.fillRect(510, 282, 200, 64);
            ctx.strokeStyle = "#e68a38";
            ctx.strokeRect(510, 282, 200, 64);
            ctx.fillStyle = "#f2eadc";
            ctx.font = "bold 18px sans-serif";
            ctx.fillText("QUIT TO TITLE", 610, 320);
          } else {
            ctx.fillStyle = "#f0e2d0";
            ctx.font = "16px sans-serif";
            ctx.fillText("Vanguard-07 recalled to the Foundry Car", 480, 224);

            var cpNote = GAME.lastCheckpoint
              ? "Respawn at Checkpoint (Col " + GAME.lastCheckpoint.col + ") · Crawlers destroyed: " + GAME.crawlersDestroyed
              : "Respawn at Start · Crawlers destroyed: " + GAME.crawlersDestroyed;
            ctx.fillStyle = "#c9b8a6";
            ctx.font = "13px monospace";
            ctx.fillText(cpNote, 480, 254);

            // Large Rebuild Button (x: 340..620, y: 278..342)
            ctx.fillStyle = "#e67e22";
            ctx.fillRect(340, 278, 280, 64);
            ctx.strokeStyle = "#ffe0b2";
            ctx.lineWidth = 2;
            ctx.strokeRect(340, 278, 280, 64);

            ctx.fillStyle = "#140d18";
            ctx.font = "bold 22px sans-serif";
            ctx.fillText("REBUILD (R)", 480, 318);

            ctx.fillStyle = "#a89888";
            ctx.font = "12px sans-serif";
            ctx.fillText("Tap Rebuild (or R) for Checkpoint · Top-right RESTART resets full run", 480, 372);
          }
          ctx.restore();
        }

        // Yes / No canvas confirmation modal (for Restart or Quit to Title)
        if (GAME.confirmDialog) {
          ctx.save();
          ctx.fillStyle = "rgba(6, 4, 10, 0.82)";
          ctx.fillRect(0, 0, CFG.logicalWidth, CFG.logicalHeight);

          var cw = 480;
          var ch = 216;
          var cx = Math.round((CFG.logicalWidth - cw) * 0.5);
          var cy = Math.round((CFG.logicalHeight - ch) * 0.5);

          RENDER.drawRivetedSteelPanel(ctx, cx, cy, cw, ch, "CONFIRM ACTION", false);

          ctx.textAlign = "center";
          ctx.font = "bold 18px sans-serif";
          ctx.fillStyle = "#F4EFE6";
          ctx.fillText(GAME.confirmDialog.message || "ARE YOU SURE?", cx + cw * 0.5, cy + 84);

          var yesR = { x: cx + 44, y: cy + 122, w: 180, h: 64 };
          var noR = { x: cx + cw - 224, y: cy + 122, w: 180, h: 64 };
          GAME.confirmDialog.yesRect = yesR;
          GAME.confirmDialog.noRect = noR;

          ctx.fillStyle = "#FF5A36";
          ctx.strokeStyle = "#FFC53A";
          ctx.lineWidth = 2.5;
          RENDER.fillRoundRect(ctx, yesR.x, yesR.y, yesR.w, yesR.h, 10);
          RENDER.strokeRoundRect(ctx, yesR.x, yesR.y, yesR.w, yesR.h, 10);
          ctx.fillStyle = "#0C0A10";
          ctx.font = "bold 24px sans-serif";
          ctx.fillText("YES", yesR.x + yesR.w * 0.5, yesR.y + 40);

          ctx.fillStyle = "#2B2B33";
          ctx.strokeStyle = "#8C95A3";
          RENDER.fillRoundRect(ctx, noR.x, noR.y, noR.w, noR.h, 10);
          RENDER.strokeRoundRect(ctx, noR.x, noR.y, noR.w, noR.h, 10);
          ctx.fillStyle = "#F4EFE6";
          ctx.fillText("NO", noR.x + noR.w * 0.5, noR.y + 40);

          ctx.restore();
        }

        // Step R5, R6 & R7: Interactive Sprite Viewer Modal (grid of every sprite in SPRITES; tapping any sprite enlarges it)
        if (GAME.spriteViewerOpen) {
          drawSpriteViewerModal(ctx, CFG.logicalWidth, CFG.logicalHeight);
        }
      }

      function drawSpriteViewerModal(ctx, w, h) {
        ctx.save();
        ctx.fillStyle = "rgba(12, 10, 16, 0.94)";
        ctx.fillRect(0, 0, w, h);

        var pad = 14;
        var panelX = pad;
        var panelY = pad;
        var panelW = w - pad * 2;
        var panelH = h - pad * 2;

        ctx.fillStyle = "#171422";
        ctx.strokeStyle = "#FFC53A";
        ctx.lineWidth = 2;
        ctx.fillRect(panelX, panelY, panelW, panelH);
        ctx.strokeRect(panelX, panelY, panelW, panelH);

        ctx.font = "900 15px 'Trebuchet MS', sans-serif";
        ctx.fillStyle = "#FFC53A";
        ctx.textAlign = "left";
        ctx.textBaseline = "middle";
        ctx.fillText("SPRITE VIEWER — R5, R6 & R7 PIXEL ART SHEET (TAP SPRITE TO ENLARGE · WHEEL TO SCROLL)", panelX + 12, panelY + 20);

        var closeBtn = { x: panelX + panelW - 102, y: panelY + 5, w: 94, h: 28 };
        ctx.fillStyle = "#3A1F28";
        ctx.strokeStyle = "#FF5A36";
        ctx.fillRect(closeBtn.x, closeBtn.y, closeBtn.w, closeBtn.h);
        ctx.strokeRect(closeBtn.x, closeBtn.y, closeBtn.w, closeBtn.h);
        ctx.fillStyle = "#FFF5E4";
        ctx.font = "900 12px 'Trebuchet MS', sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("CLOSE [ESC]", closeBtn.x + closeBtn.w * 0.5, closeBtn.y + closeBtn.h * 0.5);

        GAME.spriteViewerHitRects = [{ type: "close", rect: closeBtn }];

        // Category Filter Tabs (including R7 TILES, PROPS, ICONS)
        var catDefs = [
          { id: "ALL", label: "ALL" },
          { id: "HERO", label: "HERO & FX" },
          { id: "BASTION", label: "TRAIN" },
          { id: "MONSTERS", label: "MONSTERS" },
          { id: "TILES", label: "TILES" },
          { id: "PROPS", label: "PROPS" },
          { id: "ICONS", label: "ICONS" }
        ];
        var curCat = GAME.spriteViewerCat || GAME.spriteViewerCategory || "ALL";
        var tabY = panelY + 36;
        var tabH = 26;
        var tabW = 98;
        for (var ti = 0; ti < catDefs.length; ti++) {
          var cd = catDefs[ti];
          var tx = panelX + 12 + ti * (tabW + 6);
          var isTabActive = curCat === cd.id;
          ctx.fillStyle = isTabActive ? "#35E0F0" : "#251F33";
          ctx.strokeStyle = isTabActive ? "#FFF5E4" : "#5A5270";
          ctx.lineWidth = isTabActive ? 2 : 1;
          ctx.fillRect(tx, tabY, tabW, tabH);
          ctx.strokeRect(tx, tabY, tabW, tabH);
          ctx.fillStyle = isTabActive ? "#0C0A10" : "#E8DFD1";
          ctx.font = "900 10.5px 'Trebuchet MS', sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(cd.label, tx + tabW * 0.5, tabY + tabH * 0.5);
          GAME.spriteViewerHitRects.push({
            type: "cat",
            cat: cd.id,
            rect: { x: tx, y: tabY, w: tabW, h: tabH }
          });
        }

        // Scroll Up / Down buttons on right side of tab bar
        var scUpBtn = { x: panelX + panelW - 186, y: tabY, w: 84, h: tabH };
        var scDnBtn = { x: panelX + panelW - 96, y: tabY, w: 84, h: tabH };
        ctx.fillStyle = "#251F33";
        ctx.strokeStyle = "#FFC53A";
        ctx.fillRect(scUpBtn.x, scUpBtn.y, scUpBtn.w, scUpBtn.h);
        ctx.strokeRect(scUpBtn.x, scUpBtn.y, scUpBtn.w, scUpBtn.h);
        ctx.fillRect(scDnBtn.x, scDnBtn.y, scDnBtn.w, scDnBtn.h);
        ctx.strokeRect(scDnBtn.x, scDnBtn.y, scDnBtn.w, scDnBtn.h);
        ctx.fillStyle = "#FFC53A";
        ctx.font = "900 11px 'Trebuchet MS', sans-serif";
        ctx.fillText("▲ SCROLL UP", scUpBtn.x + scUpBtn.w * 0.5, scUpBtn.y + scUpBtn.h * 0.5);
        ctx.fillText("▼ SCROLL DN", scDnBtn.x + scDnBtn.w * 0.5, scDnBtn.y + scDnBtn.h * 0.5);
        GAME.spriteViewerHitRects.push({ type: "scroll", delta: -156, rect: scUpBtn });
        GAME.spriteViewerHitRects.push({ type: "scroll", delta: 156, rect: scDnBtn });

        var allKeys = Object.keys(SPRITES);
        var keys = [];
        for (var ki = 0; ki < allKeys.length; ki++) {
          var keyName = allKeys[ki];
          if (keyName === "monsters" || keyName === "variants") continue;
          var val = SPRITES[keyName];
          if (!val) continue;
          var isBastion = keyName.indexOf("bastion_") === 0 || keyName.indexOf("wagon_") === 0;
          var isMonster = keyName.indexOf("monster_") === 0 || keyName.indexOf("variant_") === 0 || keyName === "fx_elite_crown";
          var isTile = keyName.indexOf("tile_") === 0;
          var isProp = keyName.indexOf("prop_") === 0;
          var isIcon = keyName.indexOf("icon_") === 0;
          if (curCat === "HERO" && (isBastion || isMonster || isTile || isProp || isIcon)) continue;
          if (curCat === "BASTION" && !isBastion) continue;
          if (curCat === "MONSTERS" && !isMonster) continue;
          if (curCat === "TILES" && !isTile) continue;
          if (curCat === "PROPS" && !isProp) continue;
          if (curCat === "ICONS" && !isIcon) continue;
          keys.push(keyName);
        }

        var cols = Math.max(4, Math.floor((panelW - 20) / 132));
        var cellW = Math.floor((panelW - 20) / cols);
        var cellH = 78;
        var startY = panelY + 68;
        var viewH = panelH - 74;
        var totalRows = Math.ceil(keys.length / cols);
        var maxScroll = Math.max(0, totalRows * cellH - viewH);
        var scrollY = Math.max(0, Math.min(maxScroll, GAME.spriteViewerScroll || 0));
        GAME.spriteViewerScroll = scrollY;

        ctx.save();
        ctx.beginPath();
        ctx.rect(panelX + 4, startY, panelW - 8, viewH);
        ctx.clip();

        for (var i = 0; i < keys.length; i++) {
          var k = keys[i];
          var col = i % cols;
          var row = Math.floor(i / cols);
          var cx = panelX + 10 + col * cellW;
          var cy = startY + row * cellH - scrollY;
          if (cy + cellH < startY || cy > startY + viewH) continue;

          var isSel = GAME.spriteViewerSelected === k;
          ctx.fillStyle = isSel ? "#2B243D" : "#211C2E";
          ctx.strokeStyle = isSel ? "#35E0F0" : "#4A435E";
          ctx.lineWidth = isSel ? 2 : 1;
          ctx.fillRect(cx + 3, cy + 3, cellW - 6, cellH - 6);
          ctx.strokeRect(cx + 3, cy + 3, cellW - 6, cellH - 6);

          var frames = SPRITES[k];
          var fCount = Array.isArray(frames) ? frames.length : 1;
          var fIdx = Math.floor(GAME.time * 4) % fCount;
          var img = Array.isArray(frames) ? frames[fIdx] : frames;
          if (img && img.width) {
            var sc = Math.min(3, Math.floor((cellH - 28) / Math.max(1, img.height)), Math.floor((cellW - 18) / Math.max(1, img.width)));
            sc = Math.max(1, sc);
            var dw = img.width * sc;
            var dh = img.height * sc;
            drawSprite(ctx, k, fIdx, cx + cellW * 0.5 - dw * 0.5, cy + 6 + (cellH - 28 - dh) * 0.5, false, sc);
          }

          ctx.font = "700 9.5px 'Trebuchet MS', sans-serif";
          ctx.fillStyle = "#FFF0B8";
          ctx.textAlign = "center";
          var shortLabel = k.length > 18 ? k.substring(0, 17) + "…" : k;
          ctx.fillText(shortLabel + " (" + fCount + "f)", cx + cellW * 0.5, cy + cellH - 11);

          GAME.spriteViewerHitRects.push({
            type: "sprite",
            name: k,
            rect: { x: cx + 3, y: Math.max(startY, cy + 3), w: cellW - 6, h: cellH - 6 }
          });
        }
        ctx.restore();

        if (GAME.spriteViewerSelected && SPRITES[GAME.spriteViewerSelected]) {
          var selKey = GAME.spriteViewerSelected;
          var selFrames = SPRITES[selKey];
          var selCount = Array.isArray(selFrames) ? selFrames.length : 1;
          var boxW = Math.min(panelW - 36, Math.max(360, selCount * 124 + 54));
          var boxH = 228;
          var boxX = Math.round(w * 0.5 - boxW * 0.5);
          var boxY = Math.round(h * 0.5 - boxH * 0.5);

          ctx.fillStyle = "rgba(12, 10, 16, 0.97)";
          ctx.strokeStyle = "#35E0F0";
          ctx.lineWidth = 2.5;
          ctx.fillRect(boxX, boxY, boxW, boxH);
          ctx.strokeRect(boxX, boxY, boxW, boxH);

          var firstImg = Array.isArray(selFrames) ? selFrames[0] : selFrames;
          var artDim = firstImg ? (firstImg.width + "x" + firstImg.height + " art px") : "";
          ctx.font = "900 14px 'Trebuchet MS', sans-serif";
          ctx.fillStyle = "#35E0F0";
          ctx.textAlign = "center";
          ctx.fillText(selKey.toUpperCase() + " — " + selCount + " FRAME(S) · " + artDim + " (TAP TO CLOSE)", boxX + boxW * 0.5, boxY + 22);

          var slotW = Math.floor((boxW - 32) / Math.max(1, selCount));
          for (var sf = 0; sf < selCount; sf++) {
            var fImg = Array.isArray(selFrames) ? selFrames[sf] : selFrames;
            if (!fImg) continue;
            var bigScale = Math.min(5, Math.max(2, Math.floor(116 / Math.max(fImg.width, fImg.height))));
            var bdw = fImg.width * bigScale;
            var bdh = fImg.height * bigScale;
            var fx = boxX + 16 + sf * slotW + slotW * 0.5 - bdw * 0.5;
            var fy = boxY + 46 + (134 - bdh) * 0.5;
            drawSprite(ctx, selKey, sf, fx, fy, false, bigScale);

            ctx.font = "700 11px 'Trebuchet MS', sans-serif";
            ctx.fillStyle = "#FFC53A";
            ctx.fillText("Frame " + sf, boxX + 16 + sf * slotW + slotW * 0.5, boxY + boxH - 18);
          }
        }

        ctx.restore();
      }

      function updateDebugPanelUI() {
        if (!GAME.debugOpen) return;
        var statsEl = document.getElementById("dbg-stats");
        var warnEl = document.getElementById("dbg-warnings");
        if (statsEl) {
          var pl = GAME.player;
          var bs = GAME.bladeStats || recomputeStats(GAME.loadout);
          var col = Math.floor((pl.x + pl.w * 0.5) / CFG.tileSize);
          var z = WORLD.getZoneForCol(col);
          var bm = WORLD.getBiomeForCol(col);
          var heatStatus =
            pl.overheatTimer > 0
              ? "OVERHEAT (" + pl.overheatTimer.toFixed(1) + "s)"
              : pl.heat >= CFG.heatRedlineMin && pl.heat <= CFG.heatRedlineMax
              ? "REDLINE"
              : "NORMAL";
          var parryStateText =
            pl.parryWindowTimer > 0
              ? "ACTIVE (" + (pl.parryWindowTimer * 1000).toFixed(0) + "ms)"
              : pl.parryLockoutTimer > 0
              ? "LOCKOUT (" + (pl.parryLockoutTimer * 1000).toFixed(0) + "ms)"
              : "READY";
          var tCfgDbg = getCurrentThrottleConfig();
          var twDbg = GAME.runState.tripwire;
          var twStatusDbg = (twDbg && twDbg.active)
            ? ("ACTIVE (" + twDbg.timer.toFixed(1) + "s)")
            : (pl.tripwireCooldownTimer > 0 ? ("CD " + pl.tripwireCooldownTimer.toFixed(1) + "s") : "READY");
          var hpDbg = GAME.runState.harpoon;
          var hpStatusDbg = (hpDbg && hpDbg.active)
            ? ("ACTIVE [" + hpDbg.state + "]")
            : (pl.harpoonCooldownTimer > 0 ? ("CD " + pl.harpoonCooldownTimer.toFixed(1) + "s") : "READY (" + getEffectiveHarpoonRange() + "px)");
          var retStatusDbg = pl.tetherRecalling
            ? ("FADING (" + Math.max(0, pl.returnFadeTimer).toFixed(2) + "s)")
            : (pl.tetherRecallCooldownTimer > 0 ? ("CD " + pl.tetherRecallCooldownTimer.toFixed(1) + "s") : "READY");
          var toolsDbg =
            "Tools: Return=" + retStatusDbg + " | Wire=" + twStatusDbg + " | Hook=" + hpStatusDbg + "<br>" +
            "Shield: " +
            (pl.shieldEnabled ? Math.floor(pl.shield) + "/" + (pl.maxShield || CFG.tetherShieldMax) : "OFF") +
            (pl.tetherInShieldRange ? " [<=500px: 6/s]" : " [>500px: 2/s]") +
            " (CarDist " + Math.round(pl.tetherDist) + "px) | Cool: " + getEffectiveHeatCoolRate().toFixed(0) + "%/s<br>";
          var runInfo =
            GAME.playMode === "RUN"
              ? "Bastion Hull: " + Math.ceil(GAME.bastion.hull) + "/" + GAME.bastion.maxHull +
                " | Core: " + Math.ceil(GAME.bastion.emberHeart) + "% | Dist: " +
                GAME.runState.distanceKm.toFixed(2) + "km<br>" +
                "Throttle: N" + GAME.bastion.throttleNotch + " (" + tCfgDbg.name + " " + tCfgDbg.speedMult + "x, " + Math.round(GAME.bastion.speed) + " px/s, Wear " + tCfgDbg.hullWearDps + "/s, Elite " + Math.round(tCfgDbg.eliteChance * 100) + "%, Ore x" + tCfgDbg.oreYieldMult + ")<br>" +
                toolsDbg
              : toolsDbg;
          var activeBrutes = 0;
          var activeGliders = 0;
          var activeElites = 0;
          var bi;
          for (bi = 0; bi < CFG.maxEnemies; bi++) {
            if (GAME.enemies[bi].active) {
              if (GAME.enemies[bi].type === "brute") activeBrutes++;
              if (GAME.enemies[bi].type === "glider") activeGliders++;
              if (GAME.enemies[bi].isElite) activeElites++;
            }
          }
          var wagonSummary = "None";
          if (GAME.bastion.wagonSlots) {
            var wsArr = [];
            var wi;
            for (wi = 0; wi < CFG.wagonSlotCount; wi++) {
              wsArr.push((wi + 1) + ":" + (GAME.bastion.wagonSlots[wi] || "Empty"));
            }
            wagonSummary = wsArr.join(" ");
          }
          var lastBrk = GAME.armorBreakLog.length > 0 ? GAME.armorBreakLog[GAME.armorBreakLog.length - 1] : null;
          var brkText = lastBrk ? (lastBrk.zone.toUpperCase() + " in " + lastBrk.timeToBreak + "s") : "None";
          var activeCombosDbg = getActiveCombosSummaryList();
          var bladeDbg =
            "Blade: " + bs.edgeName + "(T" + bs.edgeTier + ") / " +
            bs.counterweightName + "(T" + bs.counterweightTier + ") / " +
            bs.coreName + "(T" + bs.coreTier + ") / " +
            bs.coilName + "(T" + bs.coilTier + ") | Drill: T" + bs.drillBitTier + "<br>" +
            "Stats: " + bs.baseDamage + " DMG, " + bs.reach + "px, " + bs.arcDeg + "°, Spd x" + fmt(bs.attackSpeedMult, 2) +
            ", KB x" + fmt(bs.knockbackMult, 2) + ", Cap " + bs.heatCapacity + ", HookRng " + bs.hookRange + "px<br>";
          var st = GAME.settings;
          var effZ = getEffectiveZoom();
          var ptrKeys = Object.keys(INPUT.activePointers || {});
          var ptrInfo = ptrKeys.length + (GAME.pointerListDebugNote ? " (" + GAME.pointerListDebugNote + ")" : "");
          var settingsDbg =
            "Screen: " + CFG.logicalWidth + "x" + CFG.logicalHeight +
            " | Zoom: " + CFG.zoom.toFixed(2) + "x (eff " + effZ.toFixed(2) + "x)" +
            " | HitAreas=" + (GAME.showHitAreasDebug ? "ON" : "OFF") +
            " | Pointers=" + ptrInfo + "<br>" +
            "Settings: HUD=" + st.hudSize +
            " | ZoomPreset=" + (st.zoomPreset || "Normal") +
            " | RedShake=" + (st.reduceShake ? "ON" : "OFF") +
            " | RedPart=" + (st.reduceParticles ? "ON" : "OFF") +
            " | Sound=" + (st.soundOn ? "ON" : "OFF") + "<br>";
          var jumpDrillDbg =
            "Jump: " + CFG.jumpSpeed + "px/s (Dbl " + CFG.doubleJumpSpeed + "px/s) | AirJumps: " + (pl.airJumpsLeft || 0) + "/" + CFG.maxAirJumps +
            " | Roof: " + (pl.onTrainRoof ? "YES" : "NO") +
            " | DrillImm: " + (pl.drillImmuneTimer > 0 ? pl.drillImmuneTimer.toFixed(1) + "s" : "0s") +
            (pl.inDrillZone ? " [IN-ZONE]" : "") + "<br>";
          statsEl.innerHTML =
            "FPS: " + Math.round(GAME.fps) + " | Mode: " + GAME.playMode + " (" + GAME.mode + ")" + (GAME.slowMo ? " [0.25x]" : "") + "<br>" +
            settingsDbg +
            jumpDrillDbg +
            bladeDbg +
            runInfo +
            "Wagons: " + wagonSummary + "<br>" +
            "Combos" + (GAME.forceCombosOn ? " [FORCED ON]" : "") + ": " + activeCombosDbg + "<br>" +
            "Zone: " + z.id + " (" + z.name.split(": ")[1] + ") | Biome: " + bm.key.toUpperCase() + (GAME.forcedBiomeKey ? " [FORCED]" : "") + " | Chunks: " + GAME.visibleChunkCount + "<br>" +
            "HP: " + Math.ceil(pl.hp) + "/" + pl.maxHp + " | Godmode: " + (GAME.godmode ? "ON" : "OFF") + "<br>" +
            "Heat: " + Math.round(pl.heat) + "% (" + Math.round(pl.heatPoints || 0) + "/" + bs.heatCapacity + " pts) [" + heatStatus + "] | Parry: " + parryStateText + "<br>" +
            "Player X: " + pl.x.toFixed(0) + " (Col " + col + ") | Y: " + pl.y.toFixed(0) + "<br>" +
            "Enemies: " + GAME.activeEnemyCount + "/" + CFG.maxEnemies + " (Brutes: " + activeBrutes + ", Gliders: " + activeGliders + ", Elites: " + activeElites + ") | Kills: " + GAME.crawlersDestroyed + "<br>" +
            "Enemy Projectiles: " + (GAME.activeEnemyProjCount || 0) + "/" + CFG.maxEnemyProjectiles + " | Spore Clouds: " + (GAME.sporeClouds ? GAME.sporeClouds.length : 0) + "<br>" +
            "Last Zone Break TTB: " + brkText + " | Total Breaks: " + GAME.armorBreakLog.length + "<br>" +
            "Ore: " + GAME.ore + " | Ingot: " + (GAME.inventory.ingot || 0) + " | Mats: " + getTotalInventoryUnits() + " (Chitin:" + GAME.inventory.scrap_chitin + " Lens:" + GAME.inventory.sensor_lens + " Plate:" + GAME.inventory.carapace_plate + " Strut:" + GAME.inventory.limb_strut + ")<br>" +
            "Pickups: " + GAME.activePickupCount + "/" + CFG.maxPickups + " | Pristine Window: " + getEffectivePristineSeconds().toFixed(1) + "s<br>" +
            "Bolts: " + GAME.activeBoltCount + "/" + CFG.maxBolts + " | Particles: " + GAME.activeParticleCount + "/" + GAME.particleCap + " | Ambient: " + GAME.activeAmbientCount + "/" + CFG.maxAmbientParticles;
        }
        if (warnEl) {
          if (GAME.mapWarnings.length === 0) {
            warnEl.textContent = "Map Warnings: none (300x40 Sandbox & Run Segs OK)";
          } else {
            warnEl.textContent = "Map Warnings (" + GAME.mapWarnings.length + "): " + GAME.mapWarnings.slice(0, 3).join("; ");
          }
        }
      }

      function clientToLogical(clientX, clientY) {
        var canvas = RENDER.canvas;
        if (!canvas) return { x: 0, y: 0 };
        var rect = canvas.getBoundingClientRect();
        if (rect.width === 0 || rect.height === 0) return { x: 0, y: 0 };
        return {
          x: ((clientX - rect.left) / rect.width) * CFG.logicalWidth,
          y: ((clientY - rect.top) / rect.height) * CFG.logicalHeight
        };
      }

      function snapCameraToPlayer() {
        var zoom = getEffectiveZoom();
        var viewW = CFG.logicalWidth / zoom;
        var viewH = CFG.logicalHeight / zoom;
        var maxCamX = Math.max(0, GAME.worldWidth - viewW);
        var maxCamY = Math.max(0, GAME.worldHeight - viewH);
        var pCenterX = GAME.player.x + GAME.player.w * 0.5;
        var lookAhead = (GAME.player.facing || 1) * (CFG.cameraLookAheadX || 80);
        var targetX = pCenterX + lookAhead - viewW * 0.5;
        if (GAME.playMode === "RUN" && Math.abs(pCenterX - GAME.bastion.drillTipX) <= (CFG.cameraDrillKeepVisibleDist || 600)) {
          var minDrillCamX = (GAME.bastion.drillTipX + 44) - viewW;
          if (targetX < minDrillCamX) targetX = minDrillCamX;
        }
        var railY = GAME.playMode === "RUN" ? GAME.bastion.floorY : CFG.trainFloorY;
        var targetY = railY - 0.70 * viewH;
        var pCenterY = GAME.player.y + GAME.player.h * 0.5;
        if (pCenterY < targetY + 0.35 * viewH) {
          targetY = pCenterY - 0.35 * viewH;
        } else if (pCenterY > targetY + 0.85 * viewH) {
          targetY = pCenterY - 0.85 * viewH;
        }
        GAME.camera.x = Math.max(0, Math.min(maxCamX, targetX));
        GAME.camera.y = Math.max(0, Math.min(maxCamY, targetY));
      }

      function startSandboxMode() {
        GAME.playMode = "SANDBOX";
        GAME.settingsReturnToTitle = false;
        GAME.ledgerOpen = false;
        GAME.confirmDialog = null;
        GAME.worldWidth = CFG.mapCols * CFG.tileSize;
        recomputeStats(GAME.loadout);
        resetCheckpoints();
        resetPlayerToCoords(CFG.startX, CFG.startY);
        GAME.player.invulnTimer = CFG.rebuildImmuneTime || 1.50;
        GAME.player.drillImmuneTimer = CFG.drillImmuneTime || 1.50;
        initBoltPool();
        initPickupPool();
        initDummies();
        loadInitialEnemies();
        initDmgNumberPool();
        initParticlePool();
        GAME.crawlersDestroyed = 0;
        snapCameraToPlayer();
        initAmbientPool();
        GAME.mode = "PLAYING";
        GAME.lastTimestamp = 0;
        INPUT.clearAll();
        AUDIO.playBeep(440, 0.07, "triangle", 0.07);
        updateDebugPanelUI();
      }

      function startRunMode() {
        GAME.playMode = "RUN";
        GAME.settingsReturnToTitle = false;
        GAME.ledgerOpen = false;
        GAME.confirmDialog = null;
        recomputeStats(GAME.loadout);
        initBastionForRun();
        var spawnX = getSafeFoundryRoofSpawnX();
        var spawnY = GAME.bastion.roofY - CFG.playerHeight;
        resetPlayerToCoords(spawnX, spawnY);
        GAME.player.onGround = true;
        GAME.player.onTrainRoof = true;
        GAME.player.invulnTimer = CFG.rebuildImmuneTime || 1.50;
        GAME.player.drillImmuneTimer = CFG.drillImmuneTime || 1.50;
        initBoltPool();
        initPickupPool();
        GAME.dummies = [];
        initEnemyPool();
        initEnemyProjectilePool();
        // Spawn initial Zone 1 variants ahead of the drill so action starts promptly
        GAME.runState.spawnCounter = 2;
        spawnEnemy(Math.round(GAME.bastion.drillTipX + 620), GAME.bastion.floorY - CFG.miteHeight, "ash_mite", -1);
        spawnEnemy(Math.round(GAME.bastion.drillTipX + 820), GAME.bastion.floorY - CFG.lobberHeight, "spore_lobber", -1);
        recountActiveEnemies();
        initDmgNumberPool();
        initParticlePool();
        GAME.crawlersDestroyed = 0;
        snapCameraToPlayer();
        initAmbientPool();
        GAME.mode = "PLAYING";
        GAME.lastTimestamp = 0;
        INPUT.clearAll();
        AUDIO.playBeep(520, 0.08, "triangle", 0.08);
        updateDebugPanelUI();
      }

      function quitToTitle() {
        GAME.ledgerOpen = false;
        GAME.settingsReturnToTitle = false;
        GAME.confirmDialog = null;
        GAME.mode = "TITLE";
        GAME.lastTimestamp = 0;
        INPUT.clearAll();
        AUDIO.playBeep(300, 0.06, "triangle", 0.06);
        updateDebugPanelUI();
      }

      function togglePause() {
        if (GAME.ledgerOpen) {
          toggleLedger(false);
          return;
        }
        if (GAME.mode === "PLAYING") {
          GAME.settingsReturnToTitle = false;
          GAME.mode = "PAUSED";
          GAME.settingsSubView = "MAIN";
          GAME.settingsScrollY = 0;
          GAME.confirmDialog = null;
          INPUT.clearAll();
        } else if (GAME.mode === "PAUSED") {
          if (GAME.settingsReturnToTitle) {
            GAME.settingsReturnToTitle = false;
            GAME.mode = "TITLE";
          } else {
            GAME.mode = "PLAYING";
          }
          GAME.settingsSubView = "MAIN";
          GAME.confirmDialog = null;
          GAME.lastTimestamp = 0;
        }
      }

      // Rebuild after defeat in Sandbox: respawns at the last checkpoint with full health and 1.5s immunity
      function rebuildFromCheckpoint() {
        if (GAME.playMode === "RUN") {
          startRunMode();
          return;
        }
        var spawnX = GAME.lastCheckpoint ? GAME.lastCheckpoint.x : CFG.startX;
        var spawnY = GAME.lastCheckpoint ? GAME.lastCheckpoint.y : CFG.startY;
        resetPlayerToCoords(spawnX, spawnY);
        GAME.player.invulnTimer = CFG.rebuildImmuneTime || 1.50;
        GAME.player.drillImmuneTimer = CFG.drillImmuneTime || 1.50;
        initBoltPool();
        initEnemyProjectilePool();
        initDmgNumberPool();
        initParticlePool();
        if (!GAME.lastCheckpoint) {
          loadInitialEnemies();
          GAME.crawlersDestroyed = 0;
        }
        snapCameraToPlayer();
        GAME.mode = "PLAYING";
        GAME.lastTimestamp = 0;
        INPUT.clearAll();
        AUDIO.playBeep(380, 0.08, "triangle", 0.07);
        updateDebugPanelUI();
      }

      // Restart button: restarts the current mode from the beginning
      function restartGame() {
        GAME.confirmDialog = null;
        if (GAME.playMode === "RUN") {
          startRunMode();
        } else {
          startSandboxMode();
        }
      }

      function teleportToCoords(wx, wy) {
        if (GAME.mode === "DEFEAT") {
          GAME.mode = "PLAYING";
        }
        GAME.player.x = wx;
        GAME.player.y = wy;
        GAME.player.vx = 0;
        GAME.player.vy = 0;
        snapCameraToPlayer();
        updateDebugPanelUI();
      }

      function toggleDebugPanel() {
        GAME.debugOpen = !GAME.debugOpen;
        var panel = document.getElementById("debug-panel");
        if (panel) {
          panel.classList.toggle("open", GAME.debugOpen);
        }
        updateDebugPanelUI();
      }

      /* =====================================================================
        * MAIN LOOP
        * ===================================================================== */
      function stepSimulation(dt) {
        if (GAME.ledgerOpen || GAME.isPortrait || GAME.confirmDialog) {
          return;
        }
        var simDt = GAME.slowMo ? dt * 0.25 : dt;
        GAME.time += simDt;
        if (GAME.shakeTimer > 0) {
          GAME.shakeTimer = Math.max(0, GAME.shakeTimer - dt);
        }
        if (GAME.mode === "PLAYING") {
          INPUT.stepEdgeTriggers();
          if (GAME.hitStopTimer > 0) {
            GAME.hitStopTimer = Math.max(0, GAME.hitStopTimer - dt);
            updateArmorPieces(simDt);
            updatePickups(simDt);
            updateDmgNumbers(simDt);
            updateParticles(simDt);
            updateAmbientParticles(simDt);
            return;
          }
          updateBastionAndRun(simDt);
          if (GAME.mode === "PLAYING") {
            updatePlayerPhysics(simDt);
            updateAimAndGun(simDt);
            updateEnemies(simDt);
            updateCamera();
          }
          if (GAME.mode === "PLAYING") {
            updateBolts(simDt);
            updateEnemyProjectiles(simDt);
          }
          updateArmorPieces(simDt);
          updatePickups(simDt);
          updateDummies(simDt);
          updateDmgNumbers(simDt);
          updateParticles(simDt);
          updateAmbientParticles(simDt);
        } else if (GAME.mode === "DEFEAT") {
          updateArmorPieces(simDt);
          updatePickups(simDt);
          updateDmgNumbers(simDt);
          updateParticles(simDt);
          updateAmbientParticles(simDt);
        }
      }

      function frameLoop(timestamp) {
        try {
          if (!GAME.lastTimestamp) {
            GAME.lastTimestamp = timestamp;
          }
          var rawDt = (timestamp - GAME.lastTimestamp) / 1000;
          GAME.lastTimestamp = timestamp;

          if (rawDt < 0) rawDt = 0;

          if (GAME.foundrySlideTimer > 0) {
            GAME.foundrySlideTimer = Math.max(0, GAME.foundrySlideTimer - rawDt);
          }

          GAME.fpsFrames++;
          GAME.fpsTimer += rawDt;
          if (GAME.fpsTimer >= 0.5) {
            GAME.fps = GAME.fpsFrames / GAME.fpsTimer;
            GAME.fpsFrames = 0;
            GAME.fpsTimer = 0;
            updateDebugPanelUI();
          }
          if (GAME.mode === "PLAYING" && !GAME.ledgerOpen && !GAME.isPortrait) {
            if (GAME.fps < CFG.lowFpsThreshold) {
              GAME.lowFpsTimer += rawDt;
              if (GAME.lowFpsTimer >= CFG.lowFpsDuration) {
                GAME.particleCap = CFG.reducedParticles;
              }
            } else {
              GAME.lowFpsTimer = 0;
            }
          }

          var clampedDt = Math.min(rawDt, CFG.maxFrameDt);

          if ((GAME.mode === "PLAYING" || GAME.mode === "DEFEAT") && !GAME.ledgerOpen && !GAME.isPortrait && !document.hidden) {
            GAME.accumulator += clampedDt;
            var maxSteps = 5;
            while (GAME.accumulator >= CFG.fixedDt && maxSteps > 0) {
              stepSimulation(CFG.fixedDt);
              GAME.accumulator -= CFG.fixedDt;
              maxSteps--;
            }
          }

          var ctx = RENDER.ctx;
          if (ctx) {
            RENDER.drawWorld(ctx);
            safeDrawCall("drawOverlays", drawOverlays, ctx, null, [ctx]);
          }
        } catch (err) {
          var line = err && err.stack ? err.stack.split("\n")[1] || "?" : "?";
          reportCrash(err && err.message ? err.message : String(err), line);
        }

        requestAnimationFrame(frameLoop);
      }

      function boot() {
        loadSettingsFromStorage();
        buildAllSprites();
        recomputeStats(GAME.loadout);
        applySettingsToDOMAndGame();
        WORLD.loadMap(DATA_TABLES.worldMap);
        WORLD.buildOffscreenCaches();
        WORLD.buildRunSegmentCaches();
        initBoltPool();
        initEnemyProjectilePool();
        initPickupPool();
        initDummies();
        loadInitialEnemies();
        initDmgNumberPool();
        initParticlePool();
        resetCheckpoints();
        resetPlayerToCoords(CFG.startX, CFG.startY);
        RENDER.init();
        snapCameraToPlayer();
        initAmbientPool();
        bindInputs();
        syncZoomDebugButtons();
        requestAnimationFrame(frameLoop);
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", boot);
      } else {
        boot();
      }
    })();
  </script>
</body>
</html>
