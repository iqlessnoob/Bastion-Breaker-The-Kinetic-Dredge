      // Helper to build a 50-col by 40-row section cleanly from drawing commands
      function buildSectionGrid(setupFn) {
        var cols = 50;
        var rows = 40;
        var g = [];
        var r, c;
        for (r = 0; r < rows; r++) {
          var rowArr = [];
          for (c = 0; c < cols; c++) {
            rowArr.push(".");
          }
          g.push(rowArr);
        }
        function rect(c1, r1, c2, r2, ch) {
          var rr, cc;
          for (rr = Math.max(0, r1); rr <= Math.min(rows - 1, r2); rr++) {
            for (cc = Math.max(0, c1); cc <= Math.min(cols - 1, c2); cc++) {
              g[rr][cc] = ch;
            }
          }
        }
        // Standard ceiling rows 0..1 and base floor rows 34..39
        rect(0, 0, 49, 1, "#");
        for (c = 1; c < 49; c++) {
          if ((c * 7) % 11 === 0) rect(c, 2, c + 1, 2, "#");
          if ((c * 13) % 17 === 0) rect(c, 2, c, 3, "#");
        }
        rect(0, 34, 49, 39, "#");

        setupFn(rect, g);

        var out = [];
        for (r = 0; r < rows; r++) {
          out.push(g[r].join(""));
        }
        return out;
      }

          "BB-R7 v1: Added Art Pass 3 — World, Props, Menus & Title Screen (Step R7): added 16x16 art px tile sprites (2 world px per art px) pre-rendered into chunk & Run segment canvases (3 rock variants with cracks & top crusts, steel lattice girder platforms with rivets, rusty vertical scaffold pillars, hazard-base crystal spikes, glowing cyan/orange ore nodes in rock, and checkpoint flag with glowing banner); added Run mode steel rails on orange-brown sleepers over gravel with joint plates and overhead rock ceiling band with stalactites; updated 4-layer pre-rendered biome backgrounds from BIOMES table (rust cavern teal-green fog gradient with stalagmite & mushroom forest silhouettes, middle stalactites/chains/scaffold/pipes, near steel trusses/pipes, and top/bottom foreground silhouettes) plus up to 60 floating cyan spores and soft glow blobs; added non-colliding PROPS table with deterministic placement and density limit (wooden crate stacks 1-3, blue glowing crate, flanged pipes, hanging yellow lamps with glow, 3 sizes of glowing mushroom clusters, crystal clusters, barrels, and warning signs); added 12x12 art px icons for Ore, Ingot, all Materials, all 8 Wagons, and all 4 Blade Edges; updated R1 HUD skin with dark metal rounded backs, thin brass borders, 2px bar highlights, pixel hearts/icons, and a top-right framed weapon slot showing the equipped Blade Edge icon and key letter; redesigned Foundry menu with dark steel riveted plates, brass anvil title bar, 0.15s slide-in, Mara's portrait with hint lines, >=64px tabs (Train, Forge, Ledger, Perks) and buttons, >=20px headers, Train side-view with 2x wagon sprites and scrollable wagon cards, Forge large blade diagram with 4 surrounding slot boxes and + stat arrows, and R6 monster sprites in the Anatomy Ledger; added sprite-built Title Screen scene with flame-gradient pixel title and STORY, FREE RUN, SANDBOX, SETTINGS buttons; applied the riveted steel panel skin to Settings/Pause menus; and added Toggle Layer 1-4, Show prop boxes, and Show particle count debug buttons.",
          "BB-R6 v1: Added Art Pass 2 — The Bastion, Wagons & Monsters (Step R6): added pixel art for The Bastion at 1 art px = 4 world px matching car hitboxes (45x30 art px = 180x120 world px; empty flatbed 30x30 art px = 120x120 world px) with roofline drawn at roof top; added steam-style drill locomotive (46x30 art px boiler with riveted brass bands over dark iron & brick-like panels, tall smokestack with fire & smoke, 3-frame flickering furnace window, glowing Ember-Heart furnace wheel on the side, 4-frame big wheels with moving connecting rods, couplers, and 28x30 art px 4-frame rotating hazard-striped drill cone with silver highlights & flying sparks/rock chips); added pixel-art wagons (Empty flatbed, Foundry Car with riveted posts & wooden slats, Smelter Car with molten crucible & scrap piles, Artillery Car with brass turret barrel & shell crate, Cryo-Vent Car with frosted tanks & icicles, Shield Pylon with cyan crystal spire, Drone Bay with hangar hatches & perched/flying collector drones, Med-Station with red cross cabin & green light, Plasma Shield Generator with pulsing purple-blue orb, and Thermal Conduit with glowing red-orange pipes & vents); added multi-part pixel-art monsters at 1 art px = 3 world px with 85% body hitboxes and scaled 3 armor zones (Mite Crawler Spore Beetle 13x9 art px / 33x23 hitbox, Shell Brute Cave Brute golem 30x22 art px / 76x56 hitbox, Glider Crystal Bat 14x11 art px / 36x28 hitbox with crystal shards/drips on hit, Spore Lobber Fungal Slime 16x14 art px / 41x36 hitbox, Rail Charger Rusted Gear-Bot 22x15 art px / 56x38 hitbox with spinning saw arm, and Husk Drone floating gear-bot 16x16 art px / 41x41 hitbox with rotating gear ring); cached all 20 VARIANTS with custom palettes, plate shapes & accents; added 0.08s white hit flash, pixel-art flying broken armor plates, Elite gold outline + pixel crown, 60x8 enemy health bars with 3 armor pips beside them, categorized/scrollable Sprite Viewer, and debug buttons to spawn each monster in front of the player.",
          "BB-R5 v1: Added Art Pass 1 — The Hero, The NPC, Weapons & Effects (Step R5): built reusable Pixel Sprite System (makeSprite, px, ART palette table, SPRITES cache built at startup inside try/catch with coloured-box fallback, and drawSprite with imageSmoothingEnabled = false at 1 art px = 3 world px); replaced Vanguard-07 plain shapes with 14x18 art px (42x54 world px) chunky pixel-art diver (brass-gold domed helmet with wide glowing cyan visor and side lamp, dark grey undersuit, brass shoulder/chest/knee plates with rivets, brown backpack with coiled grey cable, chunky brass-toed boots, and buckled belt) aligned to a 24x44 world hitbox; added hero_idle (3 frames @ 2 fps), hero_run (5 frames @ 12 fps scaling with speed), hero_jump (3 frames: crouch, rising, tucked fall), hero_double_jump (4-frame spin), hero_hurt (1 frame + white flash), hero_defeat (3-frame falling-apart sequence), and hero_swing (3 frames synced with 0.08s windup / 0.10s active / 0.10s recovery); added rotating held items shown for 0.3s on use (item_pistol, item_blade 2-frame flickering flame sword, item_hook coil launcher, item_tripwire red-lens gadget); added pixel-art effect sprites (fx_blade_arc, fx_redline_flame, fx_overheat_steam, fx_parry_glyph 6-frame expanding cyan glyph, fx_shield_bubble, fx_return_flash, fx_double_jump_ring, fx_dust_puff, fx_ember_bolt, fx_hit_spark, fx_shatter_flash, fx_harpoon_head, fx_chain_link); added Chief Engineer Mara (npc_mara 14x18 4-frame idle @ 3 fps, mara_workbench 16x14 with glowing monitor, and 24x24 mara_portrait) on the Foundry Car rear in Run mode and beside the start in Sandbox with a floating USE prompt within 120 px that opens the Foundry menu; added soft ground/roof shadow under the hero; and added Show hitbox, Cycle hero animation, and interactive Sprite viewer debug tools.",
          "BB-R4 v1: Added Hook, Return & Tripwire Buttons, No Leash (Step R4): removed Leash cable, cable rendering, max-length clamp, elastic pull, Q mode cycle, HUD MODE text, and tether-mode state so player can walk any distance from the train; kept 30-pt Shield without a wire (+50 with Plasma Shield Generator), recharging 6 pts/s within 500 px of any train car and 2 pts/s beyond that with brief blue bubble flash on hit; updated RETURN button (key L) to fade player into a 0.2 s invulnerable blue flash and reappear on the Foundry Car roof (or start/last checkpoint in Sandbox) with 3 s cooldown ring, +8% heat, blocked while overheat-stunned, and shared with R3 auto-return; updated HOOK button (key H) to fire harpoon toward aim (Aim stick, mouse, or facing) with 20-deg cone aim-assist, 1200 px/s speed, Tether Coil range (Standard 420 px), 900 px/s pull speed, 3 s cooldown ring, +8% heat, and thin cyan link chain drawn only while flying/reeling in both Run and Sandbox; updated TRIPWIRE button (key T) to drop two ground spike posts (at player's feet and 220 px ahead in facing/aim direction) with knee-height crackling electric wire between them for 8 s (early retract on re-press, 8 s cooldown ring after end, +6% heat, trips/stuns enemies 1.5 s, 15 shock dmg/s, +25% next blade hit) in both Run and Sandbox; updated SWITCH button (key Q) to cycle owned Blade Edges and show edge name + icon (or NO OTHER EDGE) for 1 s; added Story mode locks (Return from start, Tripwire Act 1, Hook Act 2; all unlocked in Sandbox/Run); and added Reset all cooldowns, Show hook range, and Place tripwire now debug buttons.",
          "BB-R3 v1: Added Higher Jump, Double Jump & Drill Fix (Step R3): jumpSpeed = 880 px/s (~6 tiles high with gravity 2000, clearing the 120 px train roof in a single jump from the ground), doubleJumpSpeed = 780 px/s (~4.7 tiles), maxAirJumps = 1 (resets on landing, standing on the train roof, and after a Hook or Return), variable jump height (releasing Jump early cuts rise to 40%), coyote time 0.12 s, jump buffer 0.12 s, max fall speed 1000 px/s; pressing Jump in the air with an air jump left performs the double jump immediately, and with none left buffers the press for landing; double-jump visuals (expanding ring of dust and sparks under the feet, short squash-and-stretch on Vanguard-07, tiny double-jump synth sound when audio is on, and a small air-jump pip on the Jump button and under the player's feet); reachability check (tall walls extended so they cannot be skipped from the floor, 2-tile tunnels still bump the head cleanly); Drill hitbox restricted strictly to the front 70% of the spinning cone (never includes the train roof, engine body, or space above the roofline; anything whose feet are at or above the roofline is never hit); Drill contact deals 15 damage only from the front/below roofline while not on the roof, pushes the player forward and slightly up (vx 320, vy -200) away from the train, grants 1.5 s drill immunity, and requires leaving the drill zone before being hit again (removed old bounce-onto-roof rule); safe ways down off front-top of roof, rear of train, or sides of any wagon; player spawns and rebuilds on the Foundry Car roof near the middle of the car (>= 150 px from the drill) with 1.5 s immunity to all damage; Run mode out-of-bounds return (> 1400 px behind train or > 900 px ahead of drill for 3 s in a row shows RETURNING and teleports to the Foundry Car roof with a blue flash); and added Show drill hitbox, Show roofline, Set jump speed, and Give extra air jump debug buttons.",
          "BB-R2 v1: Added New Control Layout, Settings Menu & Edit Controls (Step R2 / Master Prompt Addendum Rules 3 & 4): single CONTROLS table in DATA_TABLES driving all touch button rendering, exact-shape hit-testing, and editing; corner-anchored non-overlapping layout (top-left SETTINGS gear & FOUNDRY anvil 56px squares 12px apart; top-right RESTART with YES/NO canvas confirm & MUTE speaker 56px squares 12px apart; bottom-left 210x84 pill LEFT/RIGHT pad with smooth thumb slide and gentle arc of 72px HOOK, RETURN, TRIPWIRE buttons; bottom-right 130px AIM stick with 60px thumb, 88px green JUMP boot, 76px orange BLADE flaming sword, 72px cyan PARRY shield, and 64px yellow SWITCH cycle arrows; 14px white labels, 45% idle / 90% pressed opacity with glow ring, key names shown only after physical keyboard/mouse use); multi-touch Pointer Events with setPointerCapture per pointerId; scrollable canvas Settings Menu (RESUME, RESTART, QUIT TO TITLE, EDIT CONTROLS, SOUND, ZOOM Close/Normal/Far, HUD SIZE S/M/L, REDUCE SHAKE, REDUCE PARTICLES, CONTROLS HELP diagram, VERSION LOG, BACK); interactive Edit Controls screen (drag with 4px grid snap, SMALLER/BIGGER 48..120px, OPACITY 20%..100%, RESET TO DEFAULT, CANCEL, SAVE) persisted as screen fractions in GAME.settings & localStorage; direct HOOK (H), RETURN (L), TRIPWIRE (T) actions without mode switching, SWITCH (Q) cycling owned Blade Edges (flashing NO OTHER EDGE if only one owned), double jump in air, and debug Show hit areas / Reset controls / List active pointers buttons.",
          "BB-R1 v1: Added Full-Screen View, Camera Zoom & Redone HUD (Step R1 / Master Prompt Addendum Rule 1): removed 960x540 letterbox so canvas fills the whole window (logicalHeight = 540, logicalWidth = 540 * aspect clamped to 720..1300, DPR capped at 2) with resize/orientationchange/visualViewport support, 12 logical px safe margin + env(safe-area-inset-*), and portrait ROTATE YOUR PHONE overlay that pauses the game; added world camera zoom CFG.zoom (default 1.7, allowed 1.3..2.2, presets Close 2.0 / Normal 1.7 / Far 1.4) with automatic safety clamp so train roof + standing player never enters the top 100 logical px, plus zoom-aware mouse/touch-to-world coordinate conversion; updated vertical framing (ground/rail line at 70% screen height, 80 world px horizontal look-ahead, vertical follow outside 35%..85% deadzone, and Run mode drill-head framing within 600 px); redid HUD with drawBar(x, y, w, h, fraction, colour, icon, text) and drawIcon(name, x, y, size), >=18 px bold outlined text (>=20 px for damage numbers, pickup text & banners), top-left stack (Health 240x24, Shield 240x16, Thermal Gauge 240x18 with Redline band & %), top-center progress bar (280x14 + 16 px zone name), top-right stack (Hull 240x24 + wagon icons instead of cut-off wagon text, Ember-Heart 240x16, Ore/Ingots/Materials chips, and vertical 3-step Throttle indicator with Up/Down buttons), free 30%..70% middle corridor, tiny 40%-opacity bottom-center version label, and debug Zoom 1.3 / 1.7 / 2.2, Show safe areas & Show HUD boxes buttons.",
          "BB-B15 v1: Added Parallax, Screen Shake & HUD Polish: 3 pre-rendered offscreen parallax layers (far spires 0.2x, middle arches & stalactites 0.45x, near columns & pipes 0.7x) plus 1 foreground silhouette layer (1.3x, only near top/bottom edges and partly see-through) colored from a 5-biome BIOMES table (rust, fungal, volt-quartz, obsidian, solar); finished camera-only shake(intensity, duration) with decay capped at 10 px (Vent Parry 4px/0.15s, Shatter Strike 3px/0.1s, train impacts 6px/0.25s on hull hits >=20, drill smashing ore nodes, and Rail Charger slams) respecting Reduce shake; unified non-overlapping HUD layout with >=14 px outlined high-contrast text (top-left HP/shield/heat, top-center km progress & zone/biome name, top-right hull/Ember-Heart/throttle/ore/Ingots/materials, bottom touch controls); Pause menu Settings screen (HUD size S/M/L, Left-hand mode mirroring touch controls, Reduce shake, Reduce particles, Sound on/off in GAME.settings); verified touch layout (>=56 px buttons, >=12 px spacing, env(safe-area-inset-*) padding); pooled ambient details capped at 80 (drifting dust, fungal fireflies, crystal glints, foundry sparks); and added Cycle biome now / Shake test / Show touch zones debug buttons.",
          "BB-B14 v1: Added Enemy Roster and Variants: 6 core skeletons in ENEMY TYPES with 3 relative armor zones each (Mite Crawler, Shell Brute, Glider, Spore Lobber [46x38 px, 70 HP, weight 2, slow, lobs arcing 12 dmg spore blob + hazard cloud every 3s, armor Head 25 / Core 60 / Limb 35], Rail Charger [56x36 px, 90 HP, weight 3, quadruped, 0.6s telegraph then 420 px/s track charge up to 400px for 25 dmg, armor Head 30 / Core 70 / Limb 50, prime Tripwire target], and Husk Drone [36x32 px, 60 HP, weight 2, floating sentry, hovers & fires 3-shot burst every 3s at 8 dmg each / 10 deg apart, armor Head 30 / Core 50 / Limb 25]), VARIANTS table with 20 distinct variants changing plate shapes, tint colours, stat multipliers, drop materials, and projectile patterns (single, spread-3, burst-3, lob, line), SPAWN TABLES per zone in Sandbox & Run, variant materials & Anatomy Ledger tracking all 6 skeletons + 20 variants as met, 80-slot enemy projectile pool + hazard clouds, and debug variant spawn dropdown.",
          "BB-B13 v1: Added Modular Engine-Blade & Forge (both Sandbox & Run modes): PARTS data table with 4 upgrade slots (Blade Edge: Cleaver, Twin-Fang, Piercing Lance, Buzzsaw; Counterweight: Light, Standard, Heavy; Motor Core: Standard, Cryo-Core, Volt-Core, Magma-Core; Tether Coil: Standard, Reinforced, Long-Haul), Tiers 1-4 (Scrap x1.0, Carbide x1.2, Obsidian-Steel x1.4, Mythril-Alloy x1.7), Train Drill Bit 4-tier upgrade (+ore yield & drill contact damage to enemies), unified recomputeStats(loadout), Forge tab in Foundry menu, dynamic sheathed/attacking weapon visuals, and debug Unlock all parts / Max all tiers / Reset loadout buttons.",
          "BB-B12 v1: Added Harpoon Overdrive (third tether mode, unlocked in HUD mode strip & Q/touch cycle in Run mode) and the flying Glider enemy (38x24 px, 20 HP, weight 1, flapping wings, wavy flight path, 10 dmg dive-bomb on player or hull, climb & repeat, 3 armor zones Sensor/Carapace/Wing with 15 armor each; 1-in-5 Run spawns + 3 in Sandbox). Added enemy weights (Mite 1, Glider 1, Shell Brute 3). Harpoon fires toward aim at 1200 px/s (range 500 px, 4s cooldown, +10% heat, disconnects player from train Leash/shield while out): yanks weight-1 enemies to player and slams onto track for 40 dmg + 1s stun; reels player at 900 px/s to weight >=2 enemies hit on a Cracked/Broken zone with an automatic x1.5 aerial blade strike on arrival; grapples player to solid tiles (including high rock ledges in Run mode) within 500 px; retracts after 0.4s on miss; 1.2s max reel with soft spring pull-back if >420px on reattach; and adds Spawn Glider / Harpoon range 800 debug buttons.",
          "BB-B11 v1: Added Tripwire Tether Mode in Run mode: HUD mode display (LEASH, TRIPWIRE, and HARPOON greyed out until B12), Q key and touch mode button next to Tether button to cycle modes with a 0.5s delay, L / Tether button in Tripwire mode firing an anchor spike into the ground 80px in front of the player (+6% heat) stretching a taut crackling electrified wire from the train anchor while freeing the player from Leash pull and shield. Wire lasts 8s, snaps early past 600px, or retracts early on re-press (10s cooldown after end/snap, 5s if retracted early). Line-segment collision trips enemies (1.5s knockdown stun, cancels lunges/slams, 15 shock dmg/s while touching, Exposed +25% next blade hit), draws wire sparks and trip flashes, and adds Place wire now / Clear wire / Tripwire duration 20s debug buttons.",
          "BB-B10 v1: Added ADJACENCY data table with 3 neighbouring wagon combos (recomputed whenever slots 1-2, 2-3, or 3-4 change, order-independent): Smelter Car + Artillery Car (Molten Slag Barrage: shells leave a 40px burning puddle dealing 6 dmg/s for 4s, and Smelter refining speed doubles to 1.5s/Ingot), Cryo-Vent Car + Shield Pylon (Glacial Barrier Dome: enemies touching the barrier dome freeze solid for 2s and take a guaranteed Shatter Strike on the next blade hit even if not Cracked), and Drone Bay + Med-Station (Bio-Salvage Drone Link: drones also repair the hull 1 HP/s and collect range expands to 900px). Added glowing combo links with name and one-line description in the Foundry menu, active combos in the status line, spark arcs between combo cars, and debug Force combos on / List active combos buttons.",
          "BB-B9 v1: Enabled the remaining 4 wagons in the Foundry menu with full combat effects and CFG costs: Drone Bay (70 Ore + 6 Scrap Chitin; launches 2 glowing hovering drones that collect dropped pieces and ore within 250px of the train into player stock), Med-Station (60 Ore + 6 Limb Strut; heals player 3 HP/s on or within 120px of car and repairs hull 1 HP/s), Plasma Shield Generator (120 Ore + 10 Ingot; adds +50 to Leash shield capacity and reduces all hull damage by 20%), and Thermal Conduit (120 Ore + 10 Ingot + 4 Sensor Lens; raises Thermal Gauge cooling by 50% from 12%/s to 18%/s), plus active effects status line.",
          "BB-B8 v1: Added WAGONS data table with all 8 designs (Smelter Car, Artillery Car, Cryo-Vent Car, Shield Pylon working in B8; Drone Bay, Med-Station, Plasma Shield Generator, Thermal Conduit marked Coming in B9), 4 active wagon slots behind Foundry Car (each built wagon is a distinct 180px car linked by couplers, lengthening the train while empty slots show a flatbed), Smelter Car (refines 4 Ore -> 1 Ingot every 3s, Ingot on HUD), Artillery Car (roof cannon fires every 2.5s within 600px, 40 dmg, 48px splash), Cryo-Vent Car (vents freezing mist every 10s for 2s slowing enemies within 150px by 60%), Shield Pylon (220px barrier dome absorbing 100 hull dmg, 20s recharge), Foundry Menu Train tab (Slots 1-4, Build/Swap/Remove), and B8 debug controls.",
          "BB-B7 v1: Added Run-mode 3-notch Throttle (Crawl 1x / 60 px/s, Cruise 1.5x / 90 px/s, Ramming Speed 2.5x / 150 px/s; keys E/Z and HUD arrow buttons under Hull bar; 0.5s speed easing), THROTTLE table in CFG (speed 1/1.5/2.5x, spawn density x1/x1.5/x2.2, elite chance 5/10/22%, hull wear 0/0.5/2 dps, ore yield x1/x1.5/x2.5), Elite enemies (+50% HP & armor, pulsing outline, crown mark, double material units x2), glowing track Ore nodes (~1 per 300px, harvested by drill or player blade for 3 * yield mult Ore with +N Ore text), HUD Ore counter next to Materials, speed streaks scaling with notch, and B7 debug controls.",
          "BB-B6 v1: Added MATERIALS table (Scrap Chitin, Sensor Lens, Carapace Plate, Limb Strut with shape-drawn icons), deterministic zone & Mite drops, Pristine grade (<=45s break: gold-edged, 2 units, PRISTINE text), physics pickups (120px magnet, 30s lifetime, +N Material text), GAME.inventory with clickable top-right HUD counter, full-canvas scrollable Anatomy Ledger screen (M / Tab / LEDGER button, pauses game), and debug material/ledger/timer controls.",
          "BB-B5 v1: Added Shell Brute (64x48 px, 120 HP, 40 px/s, 260px chase, 20 dmg slam with 0.6s parryable telegraph), 3 targetable Armor Zones in ENEMY_TYPES (Head 40, Core 90, Limb 60) with Intact/Cracked/Broken states, falling armor plates (3s fade), broken effects (Head wanders, Core x2 HP dmg & 0.9s slam telegraph, Limb half speed & no slam), Shatter Strike on Cracked zones (90ms hit-stop, shake(3, 0.1), SHATTER text), Vent Parry cracking all zones in blast, 3 armor pips + HP bar, time-to-break tracking, 1-in-4 Run spawns + 3 Sandbox Brutes, and debug buttons.",
          "BB-B4 v1: Added Kinetic Tether in Run mode: energized sagging cable from Foundry Car roof anchor to player (blue relaxed, orange past 80%), 420px max length (elastic pull past 380px, holds firm at 420px), 30-pt Leash Shield within 300px (absorbs damage first, recharges 6/s in range, bubble & break flash), L key / Tether button Recall (1400 px/s to roof, invulnerable, 6s cooldown ring, +10% heat, blocked when overheated), HUD shield bar, and debug controls.",
          "BB-B3 v1: Added The Bastion moving drill-train (spinning drill head, Engine with Ember-Heart & chimney, Foundry Car, 3 flatbed wagon slots, 120x180px cars, roof platform) and Run mode (SANDBOX/RUN title buttons, Quit to Title, repeating track segments, 1 km = 2700 px at 60 px/s Crawl, drill 20 dmg bounce, Mite spawns every 4s gnawing hull at 3 dps, Hull 1000 / Ember-Heart 100 / 50 km HUD, 2s Foundry Car player rebuild, and train debug buttons).",
          "BB-B2 v1: Added Mite lunge attack (90px trigger, 0.45s red-eye/! telegraph, 380 px/s lunge for 0.25s dealing 15 dmg, 0.8s recovery) and frame-accurate Vent Parry (K key / Parry touch button, 0.12s window, 0.35s miss lockout, -30% heat, 120px/70-deg directional blast, 0.8s/1.0s stagger, 3s Armor Cracked +50% next-hit dmg, 0.15s invuln, 60ms hit-stop, shake(4, 0.15)), plus debug controls.",
          "BB-B1 v1: Added Engine-Blade melee weapon (J key / Blade touch button, 56px reach, 100-deg arc, 0.28s swing, 25 dmg, 200 px/s knockback, 60% ground move speed, 50ms hit-stop), Thermal Gauge (0-100%, +8%/swing, 12%/s cooling after 0.8s), Redline (75-95%: +40% dmg, 5 dps burn for 3s, orange blade glow), 2s Overheat stun at 100% (resets to 50%), and debug heat controls.",
          "BB-A8 v1: Fixed wall/ledge corner-snagging bug when jumping while holding horizontal movement in moveAndCollideX, moveAndCollideY, and updatePlayerPhysics.",
          "BB-A7 v1: Rolled back the higher jump from BB-A6 v1 (CFG.jumpSpeed: 840 -> 720) to match BB-A5 v1.",
          "BB-A6 v1: Revised player jump height (CFG.jumpSpeed: 720 -> 840 px/s).",
          "BB-A5 v1: Expanded world to 300x40 tiles (9600x1280 px) built from 6 named 50-tile sections across 3 visual zones. Added '^' spikes, '!' checkpoints, 'P' pillars, tall walls, 2-tile tunnels, 29 new platforms, 20 Mite spawns, top progress bar, chunked tile rendering, and debug teleports.",
          "BB-A4 v1: Added player 100 HP bar, Mite contact damage (10 dmg, 240 px/s knockback, 0.8s invuln), enemy HP bars (3s fade), 40-slot floating damage pool, Crawlers destroyed counter, SYSTEM DOWN defeat screen, and debug HP/Godmode controls.",
          "BB-A3 v1: Added Mite Crawler enemy (28x18 Litho-Swarm insect, PATROL/IDLE/CHASE AI with ledge detection, 30 HP / 10 bolt damage, knockback & death burst), ENEMY_SPAWNS table, and debug enemy controls.",
          "BB-A2 v1: Added Ember Pistol aiming (mouse crosshair, touch Aim Stick, keyboard F), 120-bolt projectile pool with 8px sub-stepped collision, 4 interactive training dummies, and debug controls.",
          "BB-A1 v1: Base game in Training Cavern with Vanguard-07 movement, variable jump, coyote/buffer timers, tile map, parallax cave renderer, and touch/keyboard controls."

      // Join the 6 named 50-tile sections side-by-side into the 300x40 world map
      DATA_TABLES.worldMap = (function () {

        var combined = [];
        var r, s;

      /* =====================================================================
       * PIXEL SPRITE SYSTEM (Step R5 — Reusable across all art passes)
       * ===================================================================== */
      var ART = {
        palette: {
          o: "#0C0A10",  // thick dark outline (1 art px)
          k: "#171422",  // deep shadow / dark metal
          u0: "#24242C", // undersuit dark
          u1: "#353744", // undersuit mid
          u2: "#4E5366", // undersuit highlight
          s0: "#3A3F4B", // steel dark
          s1: "#646D7E", // steel mid

          b0: "#785220", // brass-gold dark shade
          b1: "#C9962E", // brass-gold base
          b2: "#FFC53A", // brass-gold bright
          b3: "#FFF0B8", // brass-gold specular highlight
          c0: "#14687E", // cyan visor dark
          c1: "#35E0F0", // cyan visor glow
          c2: "#A8F9FF", // cyan visor bright core
          w: "#FFFFFF",  // pure white flash / core
          l0: "#3D291E", // leather / backpack dark brown
          l1: "#5C3E2B", // leather / backpack mid brown
          l2: "#825A40", // leather / backpack highlight
          r0: "#6E1814", // dark red hilt / gadget shade
          r1: "#B82921", // crimson red mid

          f1: "#FF8A1E", // orange flame mid
          f2: "#FFD147", // yellow flame core
          f3: "#FFF4C2", // pale cream slash / flame hot core
          t0: "#17424B", // Mara dark teal jacket shade
          t1: "#266D7A", // Mara dark teal jacket mid
          t2: "#429FAD", // Mara teal highlight
          h0: "#9E3714", // Mara orange hair shade
          h1: "#D95826", // Mara orange hair mid
          h2: "#FF8642", // Mara orange hair highlight
          sk0: "#BD8E68",// skin shadow
          sk1: "#E8C19D"// skin base
        }
      };

      var SPRITES = {};

      function px(ctx, x, y, w, h, colour) {
        if (!ctx || !colour) return;
        ctx.fillStyle = ART.palette[colour] || colour;
        ctx.fillRect(Math.round(x), Math.round(y), Math.max(1, Math.round(w)), Math.max(1, Math.round(h)));
      }

      function makeFallbackSprite(w, h, color) {
        var c = document.createElement("canvas");
        c.width = Math.max(1, w || 14);
        c.height = Math.max(1, h || 18);
        var cx = c.getContext("2d");
        if (cx) {
          cx.imageSmoothingEnabled = false;
          cx.fillStyle = "#0C0A10";
          cx.fillRect(0, 0, c.width, c.height);
          cx.fillStyle = color || "#FFC53A";
          cx.fillRect(1, 1, Math.max(1, c.width - 2), Math.max(1, c.height - 2));
        }
        return c;
      }

      function makeSprite(w, h, drawFn) {
        var bw = Math.max(1, Math.round(w || 14));
        var bh = Math.max(1, Math.round(h || 18));
        try {
          var c = document.createElement("canvas");
          c.width = bw;
          c.height = bh;
          var ctx = c.getContext("2d");
          if (!ctx) return makeFallbackSprite(bw, bh, "#FFC53A");
          ctx.imageSmoothingEnabled = false;
          if (typeof drawFn === "function") {
            drawFn(ctx, bw, bh);
          } else if (Array.isArray(drawFn)) {
            drawRectList(ctx, drawFn);
          }
          return c;
        } catch (err) {
          return makeFallbackSprite(bw, bh, "#FF5A36");
        }
      }

      function drawRectList(ctx, list) {
        if (!list) return;
        for (var i = 0; i < list.length; i++) {
          var r = list[i];
          if (!r || r.length < 5) continue;
          px(ctx, r[0], r[1], r[2], r[3], r[4]);
        }
      }

      // Helper for Vanguard-07 (14x18 art px): chibi armoured diver with brass-gold domed helmet,
      // wide glowing cyan visor, side lamp, brown backpack with coiled grey cable, brass plates & chunky boots.
      function buildHeroFrame(opts) {
        opts = opts || {};
        var headY = opts.headY || 0;
        var bodyY = opts.bodyY || 0;
        var packY = opts.packY !== undefined ? opts.packY : bodyY;
        var leanX = opts.leanX || 0;
        var lLegX = opts.lLegX || 0;
        var lLegY = opts.lLegY || 0;
        var rLegX = opts.rLegX || 0;
        var rLegY = opts.rLegY || 0;
        var lArmX = opts.lArmX || 0;
        var lArmY = opts.lArmY || 0;
        var rArmX = opts.rArmX || 0;
        var rArmY = opts.rArmY || 0;
        var whiteFlash = !!opts.whiteFlash;

        return makeSprite(14, 18, function (ctx) {
          // 1. Backpack on left side (x: 1..4, y: 7..13) with coiled grey cable
          var py = 7 + packY;
          px(ctx, 0, py - 1, 5, 7, "o");
          px(ctx, 1, py, 3, 5, "l1");
          px(ctx, 1, py, 3, 1, "l2");
          px(ctx, 1, py + 4, 3, 1, "l0");
          px(ctx, 1, py + 1, 2, 3, "s1");
          px(ctx, 1, py + 2, 1, 1, "s2");

          // 2. Legs & chunky boots with brass toe caps
          var lx = 4 + lLegX;
          var ly = 13 + lLegY;
          px(ctx, lx - 1, ly, 4, 5, "o");
          px(ctx, lx, ly, 2, 2, "u1");
          px(ctx, lx, ly + 1, 2, 1, "b1");
          px(ctx, lx, ly + 2, 2, 2, "l0");
          px(ctx, lx + 1, ly + 3, 2, 1, "b2");

          var rx = 8 + rLegX;
          var ry = 13 + rLegY;
          px(ctx, rx - 1, ry, 4, 5, "o");
          px(ctx, rx, ry, 2, 2, "u1");
          px(ctx, rx, ry + 1, 2, 1, "b2");
          px(ctx, rx, ry + 2, 2, 2, "l1");
          px(ctx, rx + 1, ry + 3, 2, 1, "b2");

          // 3. Torso: dark grey undersuit, brass chest plate with rivets, belt with buckle
          var tx = 4 + leanX;
          var ty = 8 + bodyY;
          px(ctx, tx - 1, ty - 1, 8, 7, "o");
          px(ctx, tx, ty, 6, 5, "u0");
          px(ctx, tx + 1, ty, 5, 3, "b1");
          px(ctx, tx + 2, ty, 3, 2, "b2");
          px(ctx, tx + 1, ty + 1, 1, 1, "b0");
          px(ctx, tx + 5, ty + 1, 1, 1, "b0");
          px(ctx, tx, ty + 3, 6, 2, "l0");
          px(ctx, tx + 3, ty + 3, 2, 2, "b2");

          // 4. Back/Left shoulder & arm
          var lax = 3 + leanX + lArmX;
          var lay = 8 + bodyY + lArmY;
          px(ctx, lax - 1, lay - 1, 4, 5, "o");
          px(ctx, lax, lay, 2, 2, "b1");
          px(ctx, lax, lay, 1, 1, "b2");
          px(ctx, lax, lay + 2, 2, 1, "u1");

          // 5. Head (chibi ~40% height: 7px tall domed brass-gold helmet + wide cyan visor + side lamp)
          var hx = 3 + leanX;
          var hy = 1 + headY;
          px(ctx, hx, hy - 1, 8, 1, "o");
          px(ctx, hx - 1, hy, 10, 7, "o");
          px(ctx, hx + 1, hy, 6, 1, "b2");
          px(ctx, hx + 2, hy, 3, 1, "b3");
          px(ctx, hx, hy + 1, 8, 5, "b1");
          px(ctx, hx + 1, hy + 1, 6, 2, "b2");
          px(ctx, hx, hy + 5, 8, 1, "b0");
          px(ctx, hx + 1, hy + 1, 1, 1, "b0");
          px(ctx, hx + 4, hy + 1, 1, 1, "b0");
          // Wide glowing cyan visor
          px(ctx, hx + 3, hy + 2, 5, 3, "o");
          px(ctx, hx + 3, hy + 2, 5, 2, "c1");
          px(ctx, hx + 4, hy + 2, 3, 1, "c2");
          px(ctx, hx + 7, hy + 2, 1, 1, "w");
          px(ctx, hx + 3, hy + 4, 4, 1, "c0");
          // Small side lamp on left side of helmet
          px(ctx, hx - 1, hy + 2, 3, 3, "o");
          px(ctx, hx, hy + 3, 1, 1, "b2");
          px(ctx, hx + 1, hy + 3, 1, 1, "f3");

          // 6. Front/Right arm & brass shoulder plate
          var rax = 8 + leanX + rArmX;
          var ray = 8 + bodyY + rArmY;
          px(ctx, rax - 1, ray - 1, 4, 5, "o");
          px(ctx, rax, ray, 2, 2, "b2");
          px(ctx, rax, ray + 2, 2, 1, "l1");

          if (whiteFlash) {
            ctx.globalCompositeOperation = "source-atop";
            ctx.fillStyle = "rgba(255,255,255,0.78)";
            ctx.fillRect(0, 0, 14, 18);
            ctx.globalCompositeOperation = "source-over";
          }
        });
      }

      // Helper for Chief Engineer Mara (14x18 art px): orange ponytail, forehead goggles, dark teal jacket, brown gloves, big steel wrench
      function buildMaraFrame(frameIdx) {
        return makeSprite(14, 18, function (ctx) {
          var bobY = (frameIdx === 1 || frameIdx === 3) ? 1 : 0;

          px(ctx, 4, 15, 3, 2, "l0");

          var ty = 8 + bobY;

          px(ctx, 4, ty, 6, 5, "t0");
          px(ctx, 4, ty, 2, 4, "t1");
          px(ctx, 8, ty, 2, 4, "t2");
          px(ctx, 6, ty, 2, 3, "l2");
          px(ctx, 4, ty + 4, 6, 1, "l0");
          px(ctx, 6, ty + 4, 2, 1, "b2");

          px(ctx, 3, hy - 1, 8, 1, "o");
          px(ctx, 2, hy, 10, 7, "o");
          px(ctx, 3, hy, 8, 4, "h1");
          px(ctx, 4, hy, 6, 2, "h2");
          px(ctx, 4, hy + 3, 7, 3, "sk1");
          px(ctx, 4, hy + 5, 7, 1, "sk0");
          var eyeX = lookLeft ? 5 : 6;
          px(ctx, eyeX, hy + 4, 1, 1, "o");
          px(ctx, eyeX + 3, hy + 4, 1, 1, "o");

          px(ctx, 3, hy + 1, 8, 2, "l0");

          px(ctx, 8, hy + 1, 3, 2, "b2");
          px(ctx, 5, hy + 1, 1, 1, "c2");

          px(ctx, 9, ty + 1, 3, 3, "o");
          px(ctx, 10, ty + 2, 2, 2, "l1");
          px(ctx, 10, wy, 4, 8, "o");
          px(ctx, 11, wy + 2, 1, 5, "s2");
          px(ctx, 10, wy, 3, 2, "s3");
          px(ctx, 11, wy, 2, 1, "o");
        });
      }

        px(ctx, wArt - 2, 3, 1, 19, "s1");

      function sanitizeControlLayoutEntry(def, raw) {
        if (!def || !raw || typeof raw !== "object") return null;
        var fx = Number(raw.fx);
        var fy = Number(raw.fy);
        var sz = Number(raw.size);
        var op = Number(raw.opacity);
        var corner = raw.corner;
        if (corner !== "tl" && corner !== "tr" && corner !== "bl" && corner !== "br") {
          corner = def.corner;
        }
        if (!isFinite(fx) || !isFinite(fy) || fx < 0.01 || fx > 0.99 || fy < 0.01 || fy > 0.99) {
          return null;
        }
        if (!isFinite(sz) || sz < 48 || sz > 160) {
          sz = def.defaultSize;
        }
        if (!isFinite(op) || op < 0.20 || op > 1.0) {
          op = 0.45;
        }
        return {
          corner: corner,
          fx: fx,
          fy: fy,
          size: Math.round(sz),
          opacity: Math.round(op * 100) / 100
        };
      }

          if (typeof window !== "undefined" && window.localStorage) {

            var parsed = JSON.parse(rawStr);

            if (parsed.hudSize === "S" || parsed.hudSize === "M" || parsed.hudSize === "L") {
              GAME.settings.hudSize = parsed.hudSize;

            if (typeof parsed.leftHandMode === "boolean") {

              GAME.settings.zoomPreset = parsed.zoomPreset;
              CFG.zoom = parsed.zoomPreset === "Close" ? 2.0 : (parsed.zoomPreset === "Far" ? 1.4 : 1.7);
            }
            var cleanLayout = {};
            if (parsed.controlsLayout && typeof parsed.controlsLayout === "object") {
              var i;
              for (i = 0; i < CONTROLS.length; i++) {
                var cDef = CONTROLS[i];
                var cleaned = sanitizeControlLayoutEntry(cDef, parsed.controlsLayout[cDef.id]);
                if (cleaned) {

            GAME.settings.controlsLayout = cleanLayout;

          GAME.settings.controlsLayout = {};

      function isControlVisible(def) {
        if (!def) return false;
        var rule = def.visibility || "always";
        if (rule === "always" || rule === "unlocked") return true;
        if (rule === "tool_return") {
          return true;
        }
        if (rule === "tool_tripwire") {
          if (GAME.playMode === "STORY") {
            return (GAME.storyAct || 0) >= 1;
          }
          return true;
        }
        if (rule === "tool_hook") {
          if (GAME.playMode === "STORY") {
            return (GAME.storyAct || 0) >= 2;
          }
          return true;
        }
        if (rule === "run_only") {
          return GAME.playMode === "RUN";
        }
        return true;

      function getControlEntry(def, useDraft) {
        var map = (useDraft && GAME.editControlsState && GAME.editControlsState.draftLayout)
          ? GAME.editControlsState.draftLayout
          : (GAME.settings.controlsLayout || {});
        var custom = map[def.id];
        var valid = sanitizeControlLayoutEntry(def, custom);
        if (valid) return valid;
        return {
          corner: def.corner,
          fx: def.defaultPos.fx,
          fy: def.defaultPos.fy,
          size: def.defaultSize,
          opacity: 0.45
        };
      }

      function getControlGeometry(def, useDraft) {
        var lw = CFG.logicalWidth || 960;
        var lh = CFG.logicalHeight || 540;
        var entry = getControlEntry(def, useDraft);
        var corner = entry.corner || def.corner;
        var dx = entry.fx * lw;
        var dy = entry.fy * lh;
        var cx = (corner === "tl" || corner === "bl") ? dx : (lw - dx);
        var cy = (corner === "tl" || corner === "tr") ? dy : (lh - dy);

        var scale = entry.size / Math.max(1, def.defaultSize);
        var w = def.shape === "pill" ? Math.round((def.defaultWidth || 210) * scale) : Math.round(entry.size);
        var h = def.shape === "pill" ? Math.round((def.defaultHeight || 84) * scale) : Math.round(entry.size);
        var halfW = w * 0.5;
        var halfH = h * 0.5;

        // If custom entry is off-screen, silently fall back to default entry
        var margin = 12;
        if (cx - halfW < 2 || cx + halfW > lw - 2 || cy - halfH < 2 || cy + halfH > lh - 2) {
          if (GAME.settings.controlsLayout && GAME.settings.controlsLayout[def.id] && !useDraft) {
            delete GAME.settings.controlsLayout[def.id];
            entry = getControlEntry(def, false);
            corner = entry.corner;
            dx = entry.fx * lw;
            dy = entry.fy * lh;
            cx = (corner === "tl" || corner === "bl") ? dx : (lw - dx);
            cy = (corner === "tl" || corner === "tr") ? dy : (lh - dy);
            scale = 1;
            w = def.shape === "pill" ? (def.defaultWidth || 210) : def.defaultSize;
            h = def.shape === "pill" ? (def.defaultHeight || 84) : def.defaultSize;
            halfW = w * 0.5;
            halfH = h * 0.5;
          }
        }

        // Clamp inside safe screen bounds
        cx = Math.max(margin + halfW, Math.min(lw - margin - halfW, cx));
        cy = Math.max(margin + halfH, Math.min(lh - margin - halfH, cy));

        return {
          id: def.id,
          def: def,
          cx: Math.round(cx),
          cy: Math.round(cy),
          x: Math.round(cx - halfW),
          y: Math.round(cy - halfH),
          w: w,
          h: h,
          r: Math.round(Math.min(w, h) * 0.5),
          size: entry.size,
          opacity: entry.opacity,
          corner: corner
        };
      }

      function pointInControlGeometry(lx, ly, geom) {
        var shape = geom.def.shape;
        if (shape === "circle" || shape === "stick") {
          var ddx = lx - geom.cx;
          var ddy = ly - geom.cy;
          return (ddx * ddx + ddy * ddy) <= (geom.r * geom.r);
        }
        if (shape === "pill") {
          if (lx < geom.x || lx > geom.x + geom.w || ly < geom.y || ly > geom.y + geom.h) {
            return false;
          }
          var pr = geom.h * 0.5;
          var leftCx = geom.x + pr;
          var rightCx = geom.x + geom.w - pr;
          if (lx >= leftCx && lx <= rightCx) return true;
          var capCx = lx < leftCx ? leftCx : rightCx;
          var cdx = lx - capCx;
          var cdy = ly - geom.cy;
          return (cdx * cdx + cdy * cdy) <= (pr * pr);
        }
        // rounded_square exact rectangle hit area
        return lx >= geom.x && lx <= geom.x + geom.w && ly >= geom.y && ly <= geom.y + geom.h;
      }

      // Requirement 3: Reverse-order hit testing so if hit areas overlap after editing, the one drawn last wins
      function hitTestControls(lx, ly, useDraft) {
        var i;
        for (i = CONTROLS.length - 1; i >= 0; i--) {
          var def = CONTROLS[i];
          if (!isControlVisible(def)) continue;
          var geom = getControlGeometry(def, useDraft);
          if (pointInControlGeometry(lx, ly, geom)) {
            return geom;
          }
        }
        return null;

        if (GAME.mode !== "PLAYING" || GAME.ledgerOpen) return false;
        var edges = (DATA_TABLES.parts && DATA_TABLES.parts.edge) ? DATA_TABLES.parts.edge : [];
        var owned = [];
        var i;
        for (i = 0; i < edges.length; i++) {
          var pId = edges[i].id;
          var isOwned =
            GAME.partsUnlockedAllDebug ||
            (GAME.ownedParts && GAME.ownedParts.edge && GAME.ownedParts.edge[pId]);
          if (isOwned) {
            owned.push(edges[i]);

        }
        var pl = GAME.player;
        if (owned.length <= 1) {
          GAME.switchEdgeFlashTimer = 1.0;
          GAME.switchEdgeFlashText = "NO OTHER EDGE";
          GAME.switchEdgeFlashColor = "#FFC53A";
          GAME.switchEdgeFlashShape = null;

          AUDIO.playBeep(240, 0.06, "sawtooth", 0.07);
          return false;
        }
        var curId = GAME.loadout.edge;
        var idx = 0;
        for (i = 0; i < owned.length; i++) {
          if (owned[i].id === curId) {
            idx = i;
            break;

        var nextEdge = owned[(idx + 1) % owned.length];

      // Step R1 Requirement 2 & 4: Effective camera zoom with safety clamp (never below 1.3)
      // Automatically lowers zoom if the train roof + standing player would reach into the top 100 logical px
      function getEffectiveZoom() {
        var desired = Math.max(CFG.minZoom, Math.min(CFG.maxZoom, CFG.zoom || 1.7));
        var railLogicalY = CFG.logicalHeight * (CFG.railScreenFractionY || 0.70); // 378 logical px
        var trainAndPlayerWorldH = CFG.trainCarHeight + CFG.playerHeight; // 120 + 36 = 156 world px
        var maxSafeSpacePx = railLogicalY - (CFG.topHudSafetyPx || 100); // 278 logical px
        var maxSafeZoom = Math.max(CFG.minZoom, maxSafeSpacePx / trainAndPlayerWorldH);
        // Apply safety clamp when in Run mode and the player is on or above the train roof
        var eff = desired;
        if (GAME.playMode === "RUN" && GAME.player && GAME.bastion) {
          var playerTopOnRoof = GAME.player.y <= GAME.bastion.roofY + 4;
          if (playerTopOnRoof && eff > maxSafeZoom) {

        }
        eff = Math.max(CFG.minZoom, Math.min(CFG.maxZoom, eff));
        GAME.effectiveZoom = eff;

      /* =====================================================================
       * INPUT (Step R2: Multi-touch Pointer Events with setPointerCapture)
       * ===================================================================== */
      var INPUT = {
        keysDown: {},
        pointers: {},
        // Each active touch/pointer on the canvas is tracked by pointerId and stays bound to the button it first touched:
        // { [pointerId]: { id, type, startX, startY, lx, ly, dir } }
        activePointers: {},
        held: {
          left: false,
          right: false,
          jump: false,
          fireKey: false,
          blade: false,
          parry: false,
          tether: false
        },
        prevHeldJump: false,
        justPressedJump: false,
        justReleasedJump: false,
        prevHeldBlade: false,
        justPressedBlade: false,
        prevHeldParry: false,
        justPressedParry: false,
        prevHeldTether: false,
        justPressedTether: false,

        aimMode: "facing",
        mouseLogicalX: CFG.logicalWidth * 0.6,
        mouseLogicalY: CFG.logicalHeight * 0.5,
        mouseActive: false,
        mouseDown: false,
        mousePointerId: null,

        stickPointerId: null,
        stickCenterX: 0,
        stickCenterY: 0,
        stickDx: 0,
        stickDy: 0,
        stickMag: 0,
        stickAngle: 0,
        stickFiring: false,

        isControlPressed: function (ctrlId) {
          var pid;
          for (pid in INPUT.activePointers) {
            if (Object.prototype.hasOwnProperty.call(INPUT.activePointers, pid)) {
              var p = INPUT.activePointers[pid];
              if (p && p.id === ctrlId) return true;
            }
          }
          var k = INPUT.keysDown;
          if (ctrlId === "jump" && (k.KeyW || k.ArrowUp || k.Space)) return true;
          if (ctrlId === "blade" && k.KeyJ) return true;
          if (ctrlId === "parry" && k.KeyK) return true;
          if (ctrlId === "hook" && k.KeyH) return true;
          if (ctrlId === "return" && k.KeyL) return true;
          if (ctrlId === "tripwire" && k.KeyT) return true;
          if (ctrlId === "switch" && k.KeyQ) return true;
          if (ctrlId === "move_pad" && (k.KeyA || k.ArrowLeft || k.KeyD || k.ArrowRight)) return true;
          if (ctrlId === "aim_stick" && (INPUT.stickPointerId !== null || k.KeyF || INPUT.mouseDown)) return true;
          return false;
        },

        clearAll: function () {
          INPUT.keysDown = {};
          INPUT.pointers = {};
          INPUT.activePointers = {};
          INPUT.held.left = false;
          INPUT.held.right = false;
          INPUT.held.jump = false;
          INPUT.held.fireKey = false;
          INPUT.held.blade = false;
          INPUT.held.parry = false;
          INPUT.held.tether = false;
          INPUT.prevHeldJump = false;
          INPUT.justPressedJump = false;
          INPUT.justReleasedJump = false;
          INPUT.prevHeldBlade = false;
          INPUT.justPressedBlade = false;
          INPUT.prevHeldParry = false;
          INPUT.justPressedParry = false;
          INPUT.prevHeldTether = false;
          INPUT.justPressedTether = false;
          INPUT.mouseDown = false;
          INPUT.mousePointerId = null;
          if (GAME && GAME.editControlsState) {
            GAME.editControlsState.draggingId = null;
            GAME.editControlsState.dragPointerId = null;
          }
          if (GAME) {
            GAME.settingsDragging = false;
            GAME.settingsDragPointerId = null;
          }
          INPUT.resetAimStick();
        },

        resetAimStick: function () {
          INPUT.stickPointerId = null;
          INPUT.stickDx = 0;
          INPUT.stickDy = 0;
          INPUT.stickMag = 0;
          INPUT.stickFiring = false;
        },

        recomputeHeld: function () {
          var k = INPUT.keysDown;
          var left = !!(k.KeyA || k.ArrowLeft);
          var right = !!(k.KeyD || k.ArrowRight);
          var jump = !!(k.KeyW || k.ArrowUp || k.Space);
          var fireKey = !!k.KeyF;
          var blade = !!k.KeyJ;
          var parry = !!k.KeyK;
          var tether = false;

          var pid;
          for (pid in INPUT.activePointers) {
            if (Object.prototype.hasOwnProperty.call(INPUT.activePointers, pid)) {
              var ptr = INPUT.activePointers[pid];
              if (!ptr) continue;
              if (ptr.id === "move_pad") {
                if (ptr.dir === "left") left = true;
                else if (ptr.dir === "right") right = true;
              } else if (ptr.id === "jump") {
                jump = true;
              } else if (ptr.id === "blade") {
                blade = true;
              } else if (ptr.id === "parry") {
                parry = true;
              }
            }
          }

          INPUT.held.left = left;
          INPUT.held.right = right;
          INPUT.held.jump = jump;
          INPUT.held.fireKey = fireKey;
          INPUT.held.blade = blade;
          INPUT.held.parry = parry;
          INPUT.held.tether = tether;
        },

        stepEdgeTriggers: function () {
          INPUT.justPressedJump = INPUT.held.jump && !INPUT.prevHeldJump;
          INPUT.justReleasedJump = !INPUT.held.jump && INPUT.prevHeldJump;
          INPUT.prevHeldJump = INPUT.held.jump;

          INPUT.justPressedBlade = INPUT.held.blade && !INPUT.prevHeldBlade;
          INPUT.prevHeldBlade = INPUT.held.blade;

          INPUT.justPressedParry = INPUT.held.parry && !INPUT.prevHeldParry;
          INPUT.prevHeldParry = INPUT.held.parry;

          INPUT.justPressedTether = INPUT.held.tether && !INPUT.prevHeldTether;
          INPUT.prevHeldTether = INPUT.held.tether;
        },

        syncButtonVisuals: function () {}
      };

      function updateAimStickLogical(lx, ly, stickGeom) {
        var cx = stickGeom ? stickGeom.cx : INPUT.stickCenterX;
        var cy = stickGeom ? stickGeom.cy : INPUT.stickCenterY;
        var maxR = stickGeom ? Math.max(28, stickGeom.r * 0.62) : CFG.aimStickMaxRadius;
        var dx = lx - cx;
        var dy = ly - cy;
        var dist = Math.sqrt(dx * dx + dy * dy);
        var clampedDist = Math.min(dist, maxR);
        var angle = dist > 0.001 ? Math.atan2(dy, dx) : INPUT.stickAngle;
        var knobX = Math.cos(angle) * clampedDist;
        var knobY = Math.sin(angle) * clampedDist;

        INPUT.stickCenterX = cx;
        INPUT.stickCenterY = cy;
        INPUT.stickDx = knobX;
        INPUT.stickDy = knobY;
        INPUT.stickMag = Math.min(1, dist / maxR);
        if (dist > 3) {
          INPUT.stickAngle = angle;
          INPUT.aimMode = "stick";
        }
        INPUT.stickFiring = INPUT.stickMag > CFG.aimStickDeadzone;
      }

          toggleLedger(false);
        }
        GAME.settingsReturnToTitle = !!fromTitle || GAME.mode === "TITLE";

        GAME.settingsSubView = "MAIN";
        GAME.settingsScrollY = 0;
        GAME.confirmDialog = null;

        AUDIO.playBeep(480, 0.05, "triangle", 0.07);
        updateDebugPanelUI();
      }

      function openEditControlsScreen() {
        var copy = {};
        var i;
        for (i = 0; i < CONTROLS.length; i++) {
          var def = CONTROLS[i];
          var ent = getControlEntry(def, false);
          copy[def.id] = {
            corner: ent.corner,
            fx: ent.fx,
            fy: ent.fy,
            size: ent.size,
            opacity: ent.opacity
          };
        }
        GAME.editControlsState.draftLayout = copy;
        GAME.editControlsState.selectedId = "jump";
        GAME.editControlsState.draggingId = null;
        GAME.editControlsState.dragPointerId = null;
        GAME.settingsSubView = "EDIT";
        GAME.confirmDialog = null;
        AUDIO.playBeep(540, 0.05, "triangle", 0.07);
      }

      function handleSettingsMenuClick(lx, ly) {
        var lw = CFG.logicalWidth;
        var lh = CFG.logicalHeight;

        // 1. Sub-view: EDIT CONTROLS
        if (GAME.settingsSubView === "EDIT") {
          var ec = GAME.editControlsState;
          var tr = ec.toolbarRects || {};
          function hitR(r) {
            return r && lx >= r.x && lx <= r.x + r.w && ly >= r.y && ly <= r.y + r.h;
          }
          var selId = ec.selectedId || "jump";
          var selDef = null;
          var i;
          for (i = 0; i < CONTROLS.length; i++) {
            if (CONTROLS[i].id === selId) {
              selDef = CONTROLS[i];
              break;
            }
          }
          if (selDef && !ec.draftLayout[selId]) {
            var baseEnt = getControlEntry(selDef, true);
            ec.draftLayout[selId] = {
              corner: baseEnt.corner,
              fx: baseEnt.fx,
              fy: baseEnt.fy,
              size: baseEnt.size,
              opacity: baseEnt.opacity
            };
          }
          var curDraft = selDef ? ec.draftLayout[selId] : null;

          if (hitR(tr.smaller) && curDraft) {
            curDraft.size = Math.max(48, Math.min(120, Math.round(curDraft.size - 6)));
            AUDIO.playBeep(440, 0.04, "triangle", 0.06);
            return true;
          }
          if (hitR(tr.bigger) && curDraft) {
            curDraft.size = Math.max(48, Math.min(120, Math.round(curDraft.size + 6)));
            AUDIO.playBeep(520, 0.04, "triangle", 0.06);
            return true;
          }
          if (hitR(tr.opDown) && curDraft) {
            curDraft.opacity = Math.max(0.20, Math.min(1.0, Math.round((curDraft.opacity - 0.10) * 100) / 100));
            AUDIO.playBeep(440, 0.04, "triangle", 0.06);
            return true;
          }
          if (hitR(tr.opUp) && curDraft) {
            curDraft.opacity = Math.max(0.20, Math.min(1.0, Math.round((curDraft.opacity + 0.10) * 100) / 100));
            AUDIO.playBeep(520, 0.04, "triangle", 0.06);
            return true;
          }
          if (hitR(tr.reset)) {
            askConfirmDialog("RESET ALL BUTTONS TO DEFAULT LAYOUT?", function () {
              var j;
              var fresh = {};
              for (j = 0; j < CONTROLS.length; j++) {
                var d = CONTROLS[j];
                fresh[d.id] = {
                  corner: d.corner,
                  fx: d.defaultPos.fx,
                  fy: d.defaultPos.fy,
                  size: d.defaultSize,
                  opacity: 0.45
                };
              }
              GAME.editControlsState.draftLayout = fresh;
              GAME.settings.controlsLayout = {};
              saveSettingsToStorage();
            });
            return true;
          }
          if (hitR(tr.cancel)) {
            GAME.editControlsState.draftLayout = {};
            GAME.editControlsState.draggingId = null;
            GAME.editControlsState.dragPointerId = null;
            GAME.settingsSubView = "MAIN";
            AUDIO.playBeep(360, 0.05, "triangle", 0.07);
            return true;
          }
          if (hitR(tr.save)) {
            var saved = {};
            var k;
            for (k = 0; k < CONTROLS.length; k++) {
              var cDef = CONTROLS[k];
              var clean = sanitizeControlLayoutEntry(cDef, ec.draftLayout[cDef.id]);
              if (clean) {
                saved[cDef.id] = clean;
              }
            }
            GAME.settings.controlsLayout = saved;
            saveSettingsToStorage();
            GAME.editControlsState.draggingId = null;
            GAME.editControlsState.dragPointerId = null;
            GAME.settingsSubView = "MAIN";
            AUDIO.playBeep(640, 0.06, "triangle", 0.08);
            return true;
          }
          return false;
        }

        // 2. Sub-view: CONTROLS HELP or VERSION LOG
        if (GAME.settingsSubView === "HELP" || GAME.settingsSubView === "LOG") {
          var backR = GAME.settingsSubBackRect;
          if (backR && lx >= backR.x && lx <= backR.x + backR.w && ly >= backR.y && ly <= backR.y + backR.h) {
            GAME.settingsSubView = "MAIN";
            AUDIO.playBeep(420, 0.05, "triangle", 0.07);
            return true;
          }
          return false;
        }

        // 3. Main Scrollable Settings List
        var rows = GAME.settingsItemRects || [];
        var rIdx;
        for (rIdx = 0; rIdx < rows.length; rIdx++) {
          var item = rows[rIdx];
          if (lx >= item.x && lx <= item.x + item.w && ly >= item.y && ly <= item.y + item.h) {
            var act = item.id;
            if (act === "resume" || act === "back") {
              togglePause();
              return true;
            }
            if (act === "restart") {
              askConfirmDialog("RESTART CURRENT MODE FROM THE BEGINNING?", function () {
                restartGame();
              });
              return true;
            }
            if (act === "quit") {
              askConfirmDialog("QUIT CURRENT EXPEDITION TO TITLE?", function () {
                quitToTitle();
              });
              return true;
            }
            if (act === "edit_controls") {
              openEditControlsScreen();
              return true;
            }
            if (act === "sound") {
              AUDIO.toggleMute();
              updateDebugPanelUI();
              return true;
            }
            if (act === "zoom") {
              if (GAME.settings.zoomPreset === "Normal") {
                setCameraZoom(2.0);
                GAME.settings.zoomPreset = "Close";
              } else if (GAME.settings.zoomPreset === "Close") {
                setCameraZoom(1.4);
                GAME.settings.zoomPreset = "Far";
              } else {
                setCameraZoom(1.7);
                GAME.settings.zoomPreset = "Normal";
              }
              saveSettingsToStorage();
              AUDIO.playBeep(520, 0.05, "triangle", 0.07);
              return true;
            }
            if (act === "hud_size") {
              if (GAME.settings.hudSize === "M") GAME.settings.hudSize = "L";
              else if (GAME.settings.hudSize === "L") GAME.settings.hudSize = "S";
              else GAME.settings.hudSize = "M";
              saveSettingsToStorage();
              AUDIO.playBeep(520, 0.05, "triangle", 0.07);
              updateDebugPanelUI();
              return true;
            }
            if (act === "reduce_shake") {
              GAME.settings.reduceShake = !GAME.settings.reduceShake;
              if (GAME.settings.reduceShake) GAME.shakeTimer = 0;
              saveSettingsToStorage();
              AUDIO.playBeep(500, 0.05, "triangle", 0.07);
              updateDebugPanelUI();
              return true;
            }
            if (act === "reduce_particles") {
              GAME.settings.reduceParticles = !GAME.settings.reduceParticles;
              applySettingsToDOMAndGame();
              AUDIO.playBeep(500, 0.05, "triangle", 0.07);
              updateDebugPanelUI();
              return true;
            }
            if (act === "controls_help") {
              GAME.settingsSubView = "HELP";
              AUDIO.playBeep(540, 0.05, "triangle", 0.07);
              return true;
            }
            if (act === "version_log") {
              GAME.settingsSubView = "LOG";
              GAME.settingsScrollY = 0;
              AUDIO.playBeep(540, 0.05, "triangle", 0.07);
              return true;
            }
          }
        }
        return false;
      }

      function bindInputs() {
        window.addEventListener("keydown", function (e) {
          AUDIO.unlock();
          GAME.keyboardOrMouseUsed = true;
          var code = e.code || e.key;
          if (
            code === "ArrowLeft" ||
            code === "ArrowRight" ||
            code === "ArrowUp" ||
            code === "ArrowDown" ||
            code === "Space" ||
            code === "Tab" ||
            code === "F3"
          ) {
            e.preventDefault();
          }

          if (e.repeat) return;

          if (code === "F3") {
            toggleDebugPanel();
            return;
          }
          if (code === "KeyN") {
            AUDIO.toggleMute();
            return;
          }

          // Confirm dialog keyboard shortcuts
          if (GAME.confirmDialog) {
            if (code === "Enter" || code === "KeyY") {
              var fn = GAME.confirmDialog.onYes;
              closeConfirmDialog();
              if (fn) fn();
              return;
            }
            if (code === "Escape" || code === "KeyN") {
              closeConfirmDialog();
              return;
            }
            return;
          }

          if (code === "KeyM" || code === "Tab") {
            if (GAME.mode === "PLAYING" || GAME.mode === "PAUSED" || GAME.ledgerOpen) {
              toggleLedger();
            }
            return;
          }
          if (code === "KeyP" || code === "Escape") {
            if (GAME.spriteViewerOpen) {
              GAME.spriteViewerOpen = false;
              GAME.spriteViewerSelected = null;
              return;
            }
            if (GAME.ledgerOpen) {
              toggleLedger(false);
              return;
            }
            if (GAME.mode === "PAUSED" && GAME.settingsSubView !== "MAIN") {
              GAME.settingsSubView = "MAIN";
              return;
            }
            if (GAME.mode === "PLAYING" || GAME.mode === "PAUSED") {
              togglePause();
            }
            return;
          }
          if (code === "KeyR") {
            if (GAME.mode === "DEFEAT") {
              if (GAME.playMode === "RUN") {
                restartGame();
              } else {
                rebuildFromCheckpoint();
              }
            } else if (GAME.mode === "PLAYING" || GAME.mode === "PAUSED") {
              askConfirmDialog("RESTART CURRENT MODE FROM THE BEGINNING?", function () {
                restartGame();
              });
            }
            return;
          }
          if (GAME.mode === "TITLE") {
            if (code === "Digit1" || code === "KeyS") {
              startSandboxMode();
              return;
            }
            if (code === "Digit2" || code === "Space" || code === "Enter") {
              startRunMode();
              return;
            }
          }
          if (GAME.mode === "DEFEAT" && (code === "Enter" || code === "Space")) {
            if (GAME.playMode === "RUN") {
              restartGame();
            } else {
              rebuildFromCheckpoint();
            }
            return;
          }

          if (code === "KeyF") {
            INPUT.aimMode = "facing";
          }

          // Step R2 & Addendum Control Map:
          // H = Hook, L = Return, T = Tripwire (direct actions, no mode switch),
          // Q = Switch equipped Blade Edge, E/Z = Throttle Up/Down, Enter / U = Interact (Use / Foundry)
          if (GAME.mode === "PLAYING" && !GAME.ledgerOpen) {
            if (code === "KeyQ") {
              cycleEquippedBladeEdge();
              return;
            }
            if (code === "KeyH") {
              triggerDirectHook();
              INPUT.keysDown[code] = true;
              return;
            }
            if (code === "KeyL") {
              triggerDirectReturn();
              INPUT.keysDown[code] = true;
              return;
            }
            if (code === "KeyT") {
              triggerDirectTripwire();
              INPUT.keysDown[code] = true;
              return;
            }
            if (code === "Enter" || code === "KeyU") {
              toggleLedger(true);
              return;
            }
            if (GAME.playMode === "RUN") {
              if (code === "KeyE") {
                changeThrottleStep(1);
                return;
              }
              if (code === "KeyZ") {
                changeThrottleStep(-1);
                return;
              }
            }
          }

          INPUT.keysDown[code] = true;
          INPUT.recomputeHeld();
        });

          delete INPUT.keysDown[code];

          canvas.addEventListener("pointermove", function (e) {

            if (GAME.mode === "PAUSED") {
              if (
                GAME.settingsSubView === "EDIT" &&
                GAME.editControlsState.draggingId &&
                e.pointerId === GAME.editControlsState.dragPointerId
              ) {
                var ec = GAME.editControlsState;
                var dragId = ec.draggingId;
                var cDef = null;
                var i;
                for (i = 0; i < CONTROLS.length; i++) {
                  if (CONTROLS[i].id === dragId) {
                    cDef = CONTROLS[i];
                    break;
                  }
                }
                if (cDef && ec.draftLayout[dragId]) {
                  var draft = ec.draftLayout[dragId];
                  var scale = draft.size / Math.max(1, cDef.defaultSize);
                  var w = cDef.shape === "pill" ? Math.round((cDef.defaultWidth || 210) * scale) : draft.size;
                  var h = cDef.shape === "pill" ? Math.round((cDef.defaultHeight || 84) * scale) : draft.size;
                  var halfW = w * 0.5;
                  var halfH = h * 0.5;
                  var margin = 12;
                  var lw = CFG.logicalWidth;
                  var lh = CFG.logicalHeight;

                  // Snap to 4 px grid and keep fully on screen
                  var rawCx = Math.round((pt.x - ec.dragOffsetX) / 4) * 4;
                  var rawCy = Math.round((pt.y - ec.dragOffsetY) / 4) * 4;
                  var clampedCx = Math.max(margin + halfW, Math.min(lw - margin - halfW, rawCx));
                  var clampedCy = Math.max(margin + halfH, Math.min(lh - margin - halfH, rawCy));

                  var dx = (corner === "tl" || corner === "bl") ? clampedCx : (lw - clampedCx);

          function releasePointer(e) {
            var pt = clientToLogical(e.clientX, e.clientY);
            var ox = Math.round((CFG.logicalWidth - 960) * 0.5);
            var ux = pt.x - ox;

            if (e.pointerId === GAME.ledgerDragPointerId) {
              var ledgerMoved = GAME.ledgerDragMoved;
              GAME.ledgerDragging = false;
              GAME.ledgerDragPointerId = null;
              GAME.ledgerDragMoved = false;
              if (!ledgerMoved && e.type === "pointerup" && GAME.ledgerOpen) {
                if (GAME.foundryTab === "FORGE") {
                  handleFoundryForgeTabClick(ux, pt.y);

                  handleFoundryTrainTabClick(ux, pt.y);

              return;
            }

            if (GAME.mode === "PAUSED") {
              if (
                GAME.settingsSubView === "EDIT" &&
                e.pointerId === GAME.editControlsState.dragPointerId
              ) {
                GAME.editControlsState.draggingId = null;
                GAME.editControlsState.dragPointerId = null;
                return;
              }
              if (GAME.settingsDragging && e.pointerId === GAME.settingsDragPointerId) {
                var wasMoved = GAME.settingsDragMoved;
                GAME.settingsDragging = false;
                GAME.settingsDragPointerId = null;
                GAME.settingsDragMoved = false;
                if (!wasMoved && e.type === "pointerup") {
                  handleSettingsMenuClick(pt.x, pt.y);
                }
                return;
              }
            }

            if (INPUT.activePointers[e.pointerId]) {
              var released = INPUT.activePointers[e.pointerId];
              delete INPUT.activePointers[e.pointerId];
              if (released.id === "aim_stick" || e.pointerId === INPUT.stickPointerId) {
                INPUT.resetAimStick();
              }
              INPUT.recomputeHeld();
            }

            if (e.pointerId === INPUT.mousePointerId || e.pointerType === "mouse") {
              INPUT.mouseDown = false;
              INPUT.mousePointerId = null;
            }
          }

          canvas.addEventListener("pointerup", releasePointer);
          canvas.addEventListener("pointercancel", releasePointer);
          canvas.addEventListener("lostpointercapture", releasePointer);
        }
      }
