      // Step B15 Req 6 & Step R7 Req 3: Pooled Ambient Details (up to 60 floating cyan spores + soft glow blobs)
      function initAmbientPool() {
        GAME.ambientParticles = [];
        GAME.activeAmbientCount = 0;
        var i;
        for (i = 0; i < CFG.maxAmbientParticles; i++) {
          var p = {
            active: true,
            x: Math.random() * CFG.logicalWidth,
            y: 36 + Math.random() * (CFG.logicalHeight - 72),
            vx: (Math.random() - 0.5) * 18,
            vy: -8 - Math.random() * 18,
            size: 2.0 + Math.random() * 2.2,
            phase: Math.random() * Math.PI * 2,
            speed: 0.8 + Math.random() * 1.4,
            altColor: Math.random() < 0.45
          };
          GAME.ambientParticles.push(p);
        }
        GAME.ambientGlowBlobs = [];
        for (i = 0; i < 5; i++) {
          GAME.ambientGlowBlobs.push({
            x: (i + 0.5) * (CFG.logicalWidth / 5),
            y: 96 + (i % 3) * 135,
            vx: (i % 2 === 0 ? 1 : -1) * (5 + i * 1.4),
            vy: (i % 2 === 0 ? -1 : 1) * (3 + i),
            r: 64 + (i % 3) * 28,
            phase: i * 1.25
          });
        }
      }

      function updateAmbientParticles(dt) {
        if (!GAME.ambientParticles || GAME.ambientParticles.length === 0) return;
        var centerCol = Math.floor((GAME.camera.x + CFG.logicalWidth * 0.5) / CFG.tileSize);
        var biome = WORLD.getBiomeForCol(centerCol);
        var ambType = biome ? biome.ambientType : "spores";
        var cap = GAME.settings && GAME.settings.reduceParticles
          ? Math.floor(CFG.maxAmbientParticles * 0.45)
          : CFG.maxAmbientParticles;
        GAME.activeAmbientCount = cap;

        var i;
        for (i = 0; i < cap; i++) {
          var p = GAME.ambientParticles[i];
          p.phase += dt * (ambType === "fireflies" || ambType === "spores" ? 2.6 : 1.7) * p.speed;

          if (ambType === "fireflies" || ambType === "spores") {
            p.x += (Math.cos(p.phase * 0.9) * 18 - 4) * dt;
            p.y += (Math.sin(p.phase * 1.3) * 14 - 5) * dt;
          } else if (ambType === "sparks") {
            p.x += (Math.sin(p.phase * 2.1) * 22 - 14) * dt;
            p.y -= (28 + p.speed * 26) * dt;
          } else {
            p.x += (Math.cos(p.phase * 0.6) * 10 - 8) * dt;
            p.y += (Math.sin(p.phase * 0.8) * 7 - 4) * dt;
          }

          if (p.x < -12) p.x += CFG.logicalWidth + 24;
          if (p.x > CFG.logicalWidth + 12) p.x -= CFG.logicalWidth + 24;
          if (p.y < 16) p.y = CFG.logicalHeight - 20;
          if (p.y > CFG.logicalHeight - 14) p.y = 20;
        }

        if (GAME.ambientGlowBlobs) {
          for (i = 0; i < GAME.ambientGlowBlobs.length; i++) {
            var gb = GAME.ambientGlowBlobs[i];
            gb.phase += dt * 0.85;
            gb.x += gb.vx * dt;
            gb.y += Math.sin(gb.phase) * 5 * dt;
            if (gb.x < -gb.r) gb.x = CFG.logicalWidth + gb.r;
            if (gb.x > CFG.logicalWidth + gb.r) gb.x = -gb.r;
          }
        }
      }

      /* =====================================================================
       * WORLD/MAP
       * ===================================================================== */
      var WORLD = {
        zoneTileAtlases: [], // 1 per zone: rock (8 variants), plat, pillar, spike
        zoneParallax: [],    // Legacy 1 per zone alias
        biomeParallax: {},   // Step B15 & R7: 1 per biome: { farCanvas (0.2x), midCanvas (0.45x), nearCanvas (0.7x), fgCanvas (1.3x) }
        chunkCache: {},      // key "cx_cy" -> offscreen Canvas (30x20 tiles = 960x640 px)
        runSegmentCanvases: [], // 1 pre-rendered 960x640 canvas per runSegment template
        runSegmentProps: [],    // Step R7 Req 4: deterministic non-colliding props per runSegment template
        sandboxProps: [],       // Step R7 Req 4: deterministic non-colliding props across Sandbox sections

        getZoneForCol: function (col) {
          var zones = DATA_TABLES.zones;
          if (GAME.playMode === "RUN") {
            var zIdx = Math.floor(Math.max(0, col) / 90) % zones.length;
            return zones[zIdx];
          }
          var i;
          for (i = 0; i < zones.length; i++) {
            if (col >= zones[i].startTile && col <= zones[i].endTile) {
              return zones[i];
            }
          }
          return zones[0];
        },

        getBiomeForCol: function (col) {
          if (GAME.forcedBiomeKey && DATA_TABLES.biomes[GAME.forcedBiomeKey]) {
            return DATA_TABLES.biomes[GAME.forcedBiomeKey];
          }
          if (GAME.playMode === "RUN") {
            var km = GAME.runState ? GAME.runState.distanceKm : 0;
            if (km >= 36) return DATA_TABLES.biomes.solar;
            if (km >= 24) return DATA_TABLES.biomes.obsidian;
            if (km >= 14) return DATA_TABLES.biomes["volt-quartz"];
            if (km >= 6) return DATA_TABLES.biomes.fungal;
            var segBand = Math.floor(Math.max(0, col) / 90) % 5;
            var bKeyRun = DATA_TABLES.biomeOrder[segBand] || "rust";
            return DATA_TABLES.biomes[bKeyRun];
          }
          if (col >= 285) return DATA_TABLES.biomes.solar;
          if (col >= 255) return DATA_TABLES.biomes.obsidian;
          var z = WORLD.getZoneForCol(col);
          return DATA_TABLES.biomes[z.biomeKey || "rust"] || DATA_TABLES.biomes.rust;
        },

        loadMap: function (rowsArray) {
          GAME.mapWarnings = [];
          GAME.tiles = [];
          GAME.checkpoints = [];

          if (!Array.isArray(rowsArray) || rowsArray.length === 0) {
            GAME.mapWarnings.push("Map data missing or not an array; generated fallback floor.");
            rowsArray = [];
          }

          var r, c;
          for (r = 0; r < CFG.mapRows; r++) {
            var rawRow = typeof rowsArray[r] === "string" ? rowsArray[r] : "";
            if (r < rowsArray.length && rawRow.length < CFG.mapCols) {
              GAME.mapWarnings.push("Row " + r + " padded (" + rawRow.length + "/" + CFG.mapCols + ").");
            }
            var tileRow = [];
            for (c = 0; c < CFG.mapCols; c++) {
              var ch = c < rawRow.length ? rawRow.charAt(c) : ".";
              if (ch === "#" || ch === "=" || ch === "." || ch === "^" || ch === "!" || ch === "P") {
                tileRow.push(ch);
                if (ch === "!") {
                  GAME.checkpoints.push({
                    col: c,
                    row: r,
                    x: c * CFG.tileSize + 6,
                    y: (r + 1) * CFG.tileSize - CFG.playerHeight,
                    lit: false
                  });
                }
              } else {
                GAME.mapWarnings.push("Unknown char '" + ch + "' at (" + c + "," + r + ") treated as '.'");
                tileRow.push(".");
              }
            }
            GAME.tiles.push(tileRow);
          }

          if (rowsArray.length === 0) {
            for (c = 0; c < CFG.mapCols; c++) {
              GAME.tiles[CFG.mapRows - 2][c] = "#";
              GAME.tiles[CFG.mapRows - 1][c] = "#";
            }
          }

          GAME.worldWidth = CFG.mapCols * CFG.tileSize;
          GAME.worldHeight = CFG.mapRows * CFG.tileSize;
          WORLD.chunkCache = {};
          WORLD.buildSandboxProps();
        },

        // Step R7 Requirement 4: Deterministic non-colliding props per Sandbox section with a density limit
        buildSandboxProps: function () {
          WORLD.sandboxProps = [];
          if (!GAME.tiles || GAME.tiles.length === 0) return;
          var ts = CFG.tileSize;
          var sectionCols = 30;
          var maxPerSec = DATA_TABLES.propMaxPerSection || 10;
          var sec;
          for (sec = 0; sec < 10; sec++) {
            var count = 0;
            var startC = sec * sectionCols + 2;
            var endC = (sec + 1) * sectionCols - 2;
            var c, r;
            for (c = startC; c < endC && count < maxPerSec; c += 3) {
              var hash = (c * 37 + sec * 13) % 19;
              for (r = 21; r <= 33; r++) {
                var curT = GAME.tiles[r] ? GAME.tiles[r][c] : ".";
                var belowT = GAME.tiles[r + 1] ? GAME.tiles[r + 1][c] : "#";
                var aboveT = GAME.tiles[r - 1] ? GAME.tiles[r - 1][c] : ".";
                if (curT === "." && (belowT === "#" || belowT === "=")) {
                  var propId = "mushroom_md";
                  if (hash === 0) propId = "crate_blue";
                  else if (hash <= 3) propId = "crate_" + ((hash % 3) + 1);
                  else if (hash <= 5) propId = "barrel";
                  else if (hash === 6) propId = "warning_sign";
                  else if (hash <= 9) propId = "mushroom_lg";
                  else if (hash <= 12) propId = "mushroom_md";
                  else if (hash <= 15) propId = "mushroom_sm";
                  else propId = "crystal_cluster";
                  var pDef = DATA_TABLES.props[propId];
                  if (pDef) {
                    WORLD.sandboxProps.push({
                      id: propId,
                      def: pDef,
                      x: c * ts + Math.round((ts - pDef.artW * 2) * 0.5),
                      y: (r + 1) * ts - pDef.artH * 2
                    });
                    count++;
                  }
                  break;
                } else if (curT === "." && aboveT === "#" && (hash === 7 || hash === 14)) {
                  var ceilId = hash === 7 ? "hanging_lamp" : "pipe_flange";
                  var cDef = DATA_TABLES.props[ceilId];
                  if (cDef) {
                    WORLD.sandboxProps.push({
                      id: ceilId,
                      def: cDef,
                      x: c * ts + Math.round((ts - cDef.artW * 2) * 0.5),
                      y: r * ts
                    });
                    count++;
                  }
                  break;
                }
              }
            }
          }
        },

        getRunTile: function (col, row) {
          if (row < 0) return "#";
          if (row >= CFG.mapRows) return "#";
          var activeSegs = GAME.runState.activeSegments;
          if (activeSegs.length > 0 && col < activeSegs[0].startCol) {
            return "#";
          }
          if (row <= 20) return "#";
          if (row >= 34) return "#";
          if (row === 21 || row === 22) {
            var segCols = CFG.runSegmentCols;
            var segIdx = Math.floor(Math.max(0, col) / segCols);
            var localCol = ((col % segCols) + segCols) % segCols;
            var templates = DATA_TABLES.runSegments;
            var tpl = templates[segIdx % templates.length];
            var i;
            for (i = 0; i < tpl.stalactites.length; i++) {
              var st = tpl.stalactites[i];
              if (localCol === st.col || (row === 21 && Math.abs(localCol - st.col) <= 1)) {
                if (row === 21 || st.len >= 3) {
                  return "#";
                }
              }
            }
          }
          if (row === 25 && col >= 2) {
            var segColsL = CFG.runSegmentCols;
            var segIdxL = Math.floor(Math.max(0, col) / segColsL);
            var localColL = ((col % segColsL) + segColsL) % segColsL;
            var templatesL = DATA_TABLES.runSegments;
            var tplL = templatesL[segIdxL % templatesL.length];
            if (tplL && tplL.highLedges) {
              var hIdx;
              for (hIdx = 0; hIdx < tplL.highLedges.length; hIdx++) {
                var hl = tplL.highLedges[hIdx];
                if (localColL >= hl.startCol && localColL <= hl.endCol) {
                  return "#";
                }
              }
            }
          }
          return ".";
        },

        getTile: function (col, row) {
          if (GAME.playMode === "RUN") {
            return WORLD.getRunTile(col, row);
          }
          if (row < 0 || row >= CFG.mapRows || col < 0 || col >= CFG.mapCols) {
            if (col < 0 || col >= CFG.mapCols || row < 0) return "#";
            return ".";
          }
          return GAME.tiles[row][col];
        },

        isSolid: function (col, row) {
          var t = WORLD.getTile(col, row);
          return t === "#" || t === "=" || t === "P";
        },

        isPointInSolidTile: function (wx, wy) {
          var col = Math.floor(wx / CFG.tileSize);
          var row = Math.floor(wy / CFG.tileSize);
          return WORLD.isSolid(col, row);
        },

        // Step R7 Requirement 1, 2 & 4: Pre-render Run Mode track segments using 16x16 pixel-art tiles
        // + steel rails on orange-brown sleepers over gravel with small joint plates + deterministic props
        buildRunSegmentCaches: function () {
          var ts = CFG.tileSize;
          var segCols = CFG.runSegmentCols; // 30 cols = 960 px
          var segRows = 20; // rows 20..39 = 640 px (y = 640..1280)
          var templates = DATA_TABLES.runSegments;
          var maxProps = DATA_TABLES.propMaxPerSegment || 8;
          WORLD.runSegmentCanvases = [];
          WORLD.runSegmentProps = [];

          var tIdx;
          for (tIdx = 0; tIdx < templates.length; tIdx++) {
            var tpl = templates[tIdx];
            var cvs = document.createElement("canvas");
            cvs.width = segCols * ts;
            cvs.height = segRows * ts;
            var cctx = cvs.getContext("2d");
            cctx.imageSmoothingEnabled = false;

            // Background cavern rock wall & rusty vertical scaffold pillars in the rail room (local rows 1..13)
            cctx.fillStyle = "rgba(12, 20, 24, 0.42)";
            cctx.fillRect(0, ts, segCols * ts, 13 * ts);

            var pIdx;
            for (pIdx = 0; pIdx < tpl.bgPillars.length; pIdx++) {
              var pCol = tpl.bgPillars[pIdx];
              var px = pCol * ts;
              var pr;
              for (pr = 1; pr <= 13; pr++) {
                if (SPRITES.tile_pillar && SPRITES.tile_pillar[0]) {
                  cctx.globalAlpha = 0.65;
                  cctx.drawImage(SPRITES.tile_pillar[0], px, pr * ts, ts, ts);
                  cctx.drawImage(SPRITES.tile_pillar[0], px + ts, pr * ts, ts, ts);
                  cctx.globalAlpha = 1.0;
                } else {
                  cctx.fillStyle = "#3A231B";
                  cctx.fillRect(px, pr * ts, ts * 2, ts);
                }
              }
            }

            // Ceiling row 20 (local row 0) & floor rows 34..39 (local rows 14..19) using 16x16 pixel-art rock tiles
            var r, c;
            for (r = 20; r < 40; r++) {
              var dy = (r - 20) * ts;
              for (c = 0; c < segCols; c++) {
                var dx = c * ts;
                if (r === 20 || r >= 34) {
                  var airAbove = r === 34;
                  var vIdx = (c * 7 + r * 13 + tIdx * 5) % 3;
                  var rockSpr = airAbove ? SPRITES["tile_rock_top_" + vIdx] : SPRITES["tile_rock_" + vIdx];
                  if (rockSpr && rockSpr[0]) {
                    cctx.drawImage(rockSpr[0], dx, dy, ts, ts);
                  } else {
                    cctx.fillStyle = "#2E2630";
                    cctx.fillRect(dx, dy, ts, ts);
                  }
                }
              }
            }

            // Step B12 & R7: High grapple ledges at row 25 (local row 5 -> dy = 5 * ts) using steel lattice girder & rock art
            if (tpl.highLedges) {
              var hlY = (25 - 20) * ts;
              var hIdx2;
              for (hIdx2 = 0; hIdx2 < tpl.highLedges.length; hIdx2++) {
                var hl = tpl.highLedges[hIdx2];
                var hc;
                for (hc = hl.startCol; hc <= hl.endCol; hc++) {
                  var hlX = hc * ts;
                  var hVar = (hc + tIdx) % 3;
                  if (SPRITES["tile_rock_top_" + hVar] && SPRITES["tile_rock_top_" + hVar][0]) {
                    cctx.drawImage(SPRITES["tile_rock_top_" + hVar][0], hlX, hlY, ts, ts);
                  }
                  if (SPRITES.tile_girder && SPRITES.tile_girder[0]) {
                    cctx.drawImage(SPRITES.tile_girder[0], hlX, hlY, ts, ts);
                  }
                }
              }
            }

            // Hanging pixel-art stalactites at rows 21..22 (local rows 1..2)
            var sIdx;
            for (sIdx = 0; sIdx < tpl.stalactites.length; sIdx++) {
              var st = tpl.stalactites[sIdx];
              var scx = st.col * ts;
              var sr;
              for (sr = 1; sr <= st.len; sr++) {
                var stVar = (st.col + sr) % 3;
                var stSpr = SPRITES["tile_rock_" + stVar];
                if (stSpr && stSpr[0]) {
                  if (sr === 1) {
                    cctx.drawImage(stSpr[0], scx - ts, sr * ts, ts, ts);
                    cctx.drawImage(stSpr[0], scx + ts, sr * ts, ts, ts);
                  }
                  cctx.drawImage(stSpr[0], scx, sr * ts, ts, ts);
                }
              }
            }

            // Step R7 Requirement 2: Rail track in Run mode — steel rails on orange-brown sleepers over gravel, with small joint plates
            var railTopY = 14 * ts;
            for (c = 0; c < segCols; c++) {
              var rx = c * ts;
              // Crushed gravel ballast bed
              cctx.fillStyle = "#18141E";
              cctx.fillRect(rx, railTopY - 4, ts, 6);
              cctx.fillStyle = "#342C3D";
              cctx.fillRect(rx + 4, railTopY - 3, 6, 3);
              cctx.fillRect(rx + 18, railTopY - 2, 8, 3);

              // Two orange-brown sleepers per 32px tile
              var slp;
              for (slp = 0; slp < 2; slp++) {
                var sx = rx + 3 + slp * 16;
                cctx.fillStyle = "#0C0A10";
                cctx.fillRect(sx - 1, railTopY - 5, 12, 7);
                cctx.fillStyle = "#6B3A1E";
                cctx.fillRect(sx, railTopY - 4, 10, 5);
                cctx.fillStyle = "#A85C30";
                cctx.fillRect(sx + 1, railTopY - 4, 8, 2);
              }

              // Steel rail bar + silver top highlight
              cctx.fillStyle = "#0C0A10";
              cctx.fillRect(rx, railTopY - 9, ts, 6);
              cctx.fillStyle = "#5A6578";
              cctx.fillRect(rx, railTopY - 8, ts, 4);
              cctx.fillStyle = "#C8D0DC";
              cctx.fillRect(rx, railTopY - 8, ts, 2);

              // Small bolted joint plate every 2 tiles
              if (c % 2 === 0) {
                cctx.fillStyle = "#0C0A10";
                cctx.fillRect(rx + 11, railTopY - 9, 10, 6);
                cctx.fillStyle = "#8C96A6";
                cctx.fillRect(rx + 12, railTopY - 8, 8, 4);
                cctx.fillStyle = "#2E3540";
                cctx.fillRect(rx + 13, railTopY - 7, 2, 2);
                cctx.fillRect(rx + 17, railTopY - 7, 2, 2);
              }
            }

            // Step R7 Requirement 4: Deterministic non-colliding props per Run segment (capped at maxProps = 8)
            var segProps = [];
            var propOrderFloor = ["crate_1", "crate_2", "crate_3", "crate_blue", "mushroom_sm", "mushroom_md", "mushroom_lg", "crystal_cluster", "barrel", "warning_sign"];
            for (c = 2; c < segCols - 2 && segProps.length < maxProps; c += 4) {
              var pHash = (c * 19 + tIdx * 31) % propOrderFloor.length;
              if ((c + tIdx) % 3 === 0 && segProps.length < maxProps) {
                var ceilId = (c + tIdx) % 2 === 0 ? "hanging_lamp" : "pipe_flange";
                var ceilDef = DATA_TABLES.props[ceilId];
                if (ceilDef) {
                  segProps.push({
                    id: ceilId,
                    def: ceilDef,
                    relX: c * ts + Math.round((ts - ceilDef.artW * 2) * 0.5),
                    relY: ts
                  });
                }
              }
              if (segProps.length >= maxProps) break;
              var flPropId = propOrderFloor[pHash];
              var flDef = DATA_TABLES.props[flPropId];
              if (flDef) {
                segProps.push({
                  id: flPropId,
                  def: flDef,
                  relX: c * ts + Math.round((ts - flDef.artW * 2) * 0.5),
                  relY: railTopY - flDef.artH * 2 - 4
                });
              }
            }

            WORLD.runSegmentCanvases.push(cvs);
            WORLD.runSegmentProps.push(segProps);
          }
        },

        updateRunSegments: function () {
          var segCols = CFG.runSegmentCols;
          var segWidthPx = segCols * CFG.tileSize;
          var minNeededX = Math.max(0, Math.min(GAME.bastion.rearX, GAME.player.x) - 1600);
          var maxNeededX = Math.max(GAME.bastion.drillTipX, GAME.player.x) + 1920;

          var minSegIdx = Math.max(0, Math.floor(minNeededX / segWidthPx));
          var maxSegIdx = Math.floor(maxNeededX / segWidthPx) + 1;

          var active = GAME.runState.activeSegments;
          while (active.length > 0 && active[0].segIndex < minSegIdx) {
            active.shift();
          }

          var nextIdx = active.length > 0 ? active[active.length - 1].segIndex + 1 : minSegIdx;
          var tplCount = DATA_TABLES.runSegments.length;
          while (nextIdx <= maxSegIdx) {
            active.push({
              segIndex: nextIdx,
              startCol: nextIdx * segCols,
              endCol: (nextIdx + 1) * segCols - 1,
              startX: nextIdx * segWidthPx,
              endX: (nextIdx + 1) * segWidthPx,
              templateIdx: nextIdx % tplCount
            });
            nextIdx++;
          }

          GAME.worldWidth = Math.max(9600, (maxSegIdx + 2) * segWidthPx);
        },

        // Step R7 Requirement 1 & 3: Build offscreen tile atlases and 4 pixel-art parallax layers per biome
        buildOffscreenCaches: function () {
          var ts = CFG.tileSize;
          var zones = DATA_TABLES.zones;
          WORLD.zoneTileAtlases = [];
          WORLD.zoneParallax = [];
          WORLD.biomeParallax = {};

          var zIdx;
          for (zIdx = 0; zIdx < zones.length; zIdx++) {
            var atlas = document.createElement("canvas");
            atlas.width = ts * 11;
            atlas.height = ts;
            var actx = atlas.getContext("2d");
            actx.imageSmoothingEnabled = false;

            var v;
            for (v = 0; v < 8; v++) {
              var ox = v * ts;
              var isTopExposed = v >= 4;
              var vIdx = v % 3;
              var rockSpr = isTopExposed ? SPRITES["tile_rock_top_" + vIdx] : SPRITES["tile_rock_" + vIdx];
              if (rockSpr && rockSpr[0]) {
                actx.drawImage(rockSpr[0], ox, 0, ts, ts);
              }
            }
            if (SPRITES.tile_girder && SPRITES.tile_girder[0]) {
              actx.drawImage(SPRITES.tile_girder[0], 8 * ts, 0, ts, ts);
            }
            if (SPRITES.tile_pillar && SPRITES.tile_pillar[0]) {
              actx.drawImage(SPRITES.tile_pillar[0], 9 * ts, 0, ts, ts);
            }
            if (SPRITES.tile_spikes && SPRITES.tile_spikes[0]) {
              actx.drawImage(SPRITES.tile_spikes[0], 10 * ts, 0, ts, ts);
            }

            WORLD.zoneTileAtlases.push(atlas);
          }

          // Step R7 Requirement 3: Pre-render 4 parallax layers per BIOME (Far 0.2x, Mid 0.45x, Near 0.7x, FG 1.3x)
          var biomeOrder = DATA_TABLES.biomeOrder;
          var bIdx, i;
          for (bIdx = 0; bIdx < biomeOrder.length; bIdx++) {
            var bKey = biomeOrder[bIdx];
            var bm = DATA_TABLES.biomes[bKey];

            // Layer 1: Far layer (0.2x): teal-green fog gradient with silhouettes of stalagmites and a distant mushroom forest
            var farCvs = document.createElement("canvas");
            farCvs.width = 960;
            farCvs.height = 540;
            var fctx = farCvs.getContext("2d");
            fctx.imageSmoothingEnabled = false;

            var fogGrad = fctx.createLinearGradient(0, 70, 0, 540);
            fogGrad.addColorStop(0, "rgba(0,0,0,0)");
            fogGrad.addColorStop(0.55, bm.glowRgba || "rgba(38, 196, 178, 0.22)");
            fogGrad.addColorStop(1, "rgba(7, 14, 18, 0.45)");
            fctx.fillStyle = fogGrad;
            fctx.fillRect(0, 70, 960, 470);

            fctx.fillStyle = bm.farCol || bm.farFill || "#0E2830";
            for (i = 0; i < 16; i++) {
              var px = i * 60;
              var topH = 68 + ((i * 37 + bIdx * 19) % 85);
              var botH = 90 + ((i * 53 + bIdx * 23) % 110);
              // Step-pixel ceiling stalactite silhouette
              fctx.fillRect(px, 0, 52, Math.round(topH * 0.45));
              fctx.fillRect(px + 10, Math.round(topH * 0.45), 32, Math.round(topH * 0.35));
              fctx.fillRect(px + 20, Math.round(topH * 0.80), 12, Math.round(topH * 0.20));

              // Step-pixel floor stalagmite silhouette
              var by = 540 - botH;
              fctx.fillRect(px + 6, by + Math.round(botH * 0.35), 44, Math.round(botH * 0.65));
              fctx.fillRect(px + 16, by, 24, Math.round(botH * 0.35));
            }

            // Distant mushroom forest silhouettes along the far horizon
            var capCol = bm.mushroomCapCol || "#1E6B5E";
            var glowCol = bm.mushroomGlowCol || "#4CF5C8";
            for (i = 0; i < 10; i++) {
              var mshX = 36 + i * 94 + ((i * 17) % 18);
              var mshH = 74 + ((i * 31 + bIdx * 11) % 68);
              var mshY = 540 - 48 - mshH;
              var mshW = 36 + (i % 3) * 14;
              fctx.fillStyle = bm.farCol || bm.farFill || "#0E2830";
              fctx.fillRect(mshX - 5, mshY + 16, 10, mshH);
              fctx.fillStyle = capCol;
              fctx.fillRect(mshX - Math.round(mshW * 0.5), mshY + 6, mshW, 12);
              fctx.fillRect(mshX - Math.round(mshW * 0.35), mshY, Math.round(mshW * 0.7), 8);
              fctx.fillStyle = glowCol;
              fctx.globalAlpha = 0.5;
              fctx.fillRect(mshX - Math.round(mshW * 0.44), mshY + 16, Math.round(mshW * 0.88), 3);
              fctx.fillRect(mshX - 6, mshY + 3, 4, 3);
              fctx.fillRect(mshX + 4, mshY + 4, 3, 3);
              fctx.globalAlpha = 1.0;
            }

            // Layer 2: Middle layer (0.45x): stalactites, hanging chains, rusty scaffold, and pipes
            var midCvs = document.createElement("canvas");
            midCvs.width = 960;
            midCvs.height = 540;
            var mctx = midCvs.getContext("2d");
            mctx.imageSmoothingEnabled = false;

            var scafCol = bm.scaffoldCol || "#5C3528";
            var pipeCol = bm.pipeCol || "#384A54";
            var midCol = bm.midCol || bm.midFill || "#163840";

            // Rock ceiling band across top of middle layer so there is never an empty dark gap above the train
            mctx.fillStyle = midCol;
            mctx.fillRect(0, 0, 960, 38);

            // Horizontal bent pipe with flanges across upper-mid cavern
            mctx.fillStyle = "#0C0A10";
            mctx.fillRect(0, 128, 960, 18);
            mctx.fillStyle = pipeCol;
            mctx.fillRect(0, 130, 960, 14);
            mctx.fillStyle = "#6B8290";
            mctx.fillRect(0, 132, 960, 4);
            for (i = 0; i < 12; i++) {
              var flX = i * 80 + 24;
              mctx.fillStyle = "#0C0A10";
              mctx.fillRect(flX - 2, 124, 12, 26);
              mctx.fillStyle = scafCol;
              mctx.fillRect(flX, 126, 8, 22);
            }

            for (i = 0; i < 10; i++) {
              var sx = i * 96 + 18;
              var stH = 58 + ((i * 41) % 68);
              mctx.fillStyle = midCol;
              mctx.fillRect(sx + 28, 28, 28, Math.round(stH * 0.5));
              mctx.fillRect(sx + 34, 28 + Math.round(stH * 0.5), 16, Math.round(stH * 0.35));
              mctx.fillRect(sx + 39, 28 + Math.round(stH * 0.85), 6, Math.round(stH * 0.2));

              if (i % 2 === 0) {
                // Rusty vertical scaffold tower
                mctx.fillStyle = "#0C0A10";
                mctx.fillRect(sx - 2, 0, 26, 540);
                mctx.fillStyle = scafCol;
                mctx.fillRect(sx, 0, 5, 540);
                mctx.fillRect(sx + 17, 0, 5, 540);
                var sy;
                for (sy = 16; sy < 540; sy += 36) {
                  mctx.fillStyle = scafCol;
                  mctx.fillRect(sx, sy, 22, 5);
                  mctx.fillRect(sx + 4, sy + 8, 4, 6);
                  mctx.fillRect(sx + 8, sy + 14, 6, 8);
                  mctx.fillRect(sx + 14, sy + 22, 4, 8);
                }
              } else {
                // Hanging pixel-art chain links from ceiling
                var chLen = 115 + ((i * 59) % 120);
                var cy;
                for (cy = 24; cy < chLen; cy += 12) {
                  mctx.fillStyle = "#0C0A10";
                  mctx.fillRect(sx + 8, cy, 8, 10);
                  mctx.fillStyle = "#5A6578";
                  mctx.fillRect(sx + 10, cy + 2, 4, 6);
                }
              }
            }

            // Layer 3: Near layer (0.7x): steel trusses and pipes
            var nearCvs = document.createElement("canvas");
            nearCvs.width = 960;
            nearCvs.height = 540;
            var nctx = nearCvs.getContext("2d");
            nctx.imageSmoothingEnabled = false;
            var nearCol = bm.nearCol || bm.nearColumn || "#1E464E";
            var nearAccent = bm.nearAccent || bm.nearGlow || "#E88B38";

            // Upper steel truss bridge & lower conduit pipe
            nctx.fillStyle = "#0C0A10";
            nctx.fillRect(0, 52, 960, 22);
            nctx.fillStyle = nearCol;
            nctx.fillRect(0, 54, 960, 18);
            nctx.fillStyle = nearAccent;
            for (i = 0; i < 30; i++) {
              nctx.fillRect(i * 32 + 6, 60, 4, 4);
              nctx.fillRect(i * 32 + 22, 60, 4, 4);
            }

            for (i = 0; i < 5; i++) {
              var cx = 64 + i * 192;
              nctx.fillStyle = "#0C0A10";
              nctx.fillRect(cx - 2, 0, 32, 540);
              nctx.fillStyle = nearCol;
              nctx.fillRect(cx, 0, 6, 540);
              nctx.fillRect(cx + 22, 0, 6, 540);
              var ty;
              for (ty = 20; ty < 540; ty += 48) {
                nctx.fillStyle = nearCol;
                nctx.fillRect(cx, ty, 28, 6);
                nctx.fillStyle = nearAccent;
                nctx.fillRect(cx + 2, ty + 2, 3, 3);
                nctx.fillRect(cx + 23, ty + 2, 3, 3);
              }
            }

            // Layer 4: Foreground silhouettes (1.3x): strictly at the top and bottom edges
            var fgCvs = document.createElement("canvas");
            fgCvs.width = 960;
            fgCvs.height = 540;
            var fgctx = fgCvs.getContext("2d");
            fgctx.imageSmoothingEnabled = false;
            fgctx.fillStyle = bm.fgCol || "rgba(7, 12, 16, 0.55)";

            fgctx.fillRect(0, 0, 960, 16);
            for (i = 0; i < 24; i++) {
              var fx = i * 40;
              var topEdgeH = 18 + ((i * 19 + bIdx * 7) % 24);
              fgctx.fillRect(fx, 16, 28, Math.round((topEdgeH - 14) * 0.6));
              fgctx.fillRect(fx + 6, 16 + Math.round((topEdgeH - 14) * 0.6), 14, Math.round((topEdgeH - 14) * 0.4));
            }
            fgctx.fillRect(0, 540 - 16, 960, 16);
            for (i = 0; i < 20; i++) {
              var bx = i * 48;
              var botEdgeH = 18 + ((i * 23 + bIdx * 11) % 22);
              fgctx.fillRect(bx, 540 - botEdgeH, 32, botEdgeH - 16);
            }

            WORLD.biomeParallax[bKey] = {
              farCanvas: farCvs,
              midCanvas: midCvs,
              nearCanvas: nearCvs,
              fgCanvas: fgCvs
            };
          }

          for (zIdx = 0; zIdx < zones.length; zIdx++) {
            var zbKey = zones[zIdx].biomeKey || "rust";
            WORLD.zoneParallax.push(WORLD.biomeParallax[zbKey]);
          }
        },

        // Pre-render a 30x20 tile chunk once and cache it using 16x16 pixel-art tiles
        getChunkCanvas: function (chunkCol, chunkRow) {
          var key = chunkCol + "_" + chunkRow;
          if (WORLD.chunkCache[key]) {
            return WORLD.chunkCache[key];
          }

          var ts = CFG.tileSize;
          var cCols = CFG.chunkCols;
          var cRows = CFG.chunkRows;
          var cvs = document.createElement("canvas");
          cvs.width = cCols * ts;
          cvs.height = cRows * ts;
          var cctx = cvs.getContext("2d");
          cctx.imageSmoothingEnabled = false;

          var startCol = chunkCol * cCols;
          var startRow = chunkRow * cRows;
          var endCol = Math.min(CFG.mapCols - 1, startCol + cCols - 1);
          var endRow = Math.min(CFG.mapRows - 1, startRow + cRows - 1);

          var r, c;
          for (r = startRow; r <= endRow; r++) {
            var rowArr = GAME.tiles[r];
            var dy = (r - startRow) * ts;
            for (c = startCol; c <= endCol; c++) {
              var t = rowArr[c];
              if (t === "." || t === "!") continue;

              var z = WORLD.getZoneForCol(c);
              var atlas = WORLD.zoneTileAtlases[z.id - 1];
              var dx = (c - startCol) * ts;

              if (t === "#") {
                var airAbove = r > 0 && !WORLD.isSolid(c, r - 1);
                var variant = ((c * 3 + r * 5) & 3) + (airAbove ? 4 : 0);
                cctx.drawImage(atlas, variant * ts, 0, ts, ts, dx, dy, ts, ts);
              } else if (t === "=") {
                cctx.drawImage(atlas, 8 * ts, 0, ts, ts, dx, dy, ts, ts);
              } else if (t === "P") {
                cctx.drawImage(atlas, 9 * ts, 0, ts, ts, dx, dy, ts, ts);
              } else if (t === "^") {
                cctx.drawImage(atlas, 10 * ts, 0, ts, ts, dx, dy, ts, ts);
              }
            }
          }

          WORLD.chunkCache[key] = cvs;
          return cvs;
        }
      };

      function createBruteZonesFromTable(eType, isElite, variantDef) {
        var typeKey = eType || "brute";
        var tDef = DATA_TABLES.enemyTypes[typeKey];
        if (!tDef || !tDef.zones) return [];
        var defs = tDef.zones;
        var vArmorMult = (variantDef && variantDef.armorMult) ? variantDef.armorMult : 1.0;
        var mult = (isElite ? CFG.eliteStatMult : 1.0) * vArmorMult;
        var zones = [];
        var i;
        for (i = 0; i < defs.length; i++) {
          var zd = defs[i];
          var scaledArmor = Math.max(1, Math.round(zd.armorHp * mult));
          // Use the variant's dropMaterial on its primary zone (or all zones while preserving baseMaterial archetype)
          var dropMat = zd.material;
          if (variantDef && variantDef.dropMaterial && DATA_TABLES.materials[variantDef.dropMaterial]) {
            var vMatDef = DATA_TABLES.materials[variantDef.dropMaterial];
            if (!vMatDef.baseMaterial || vMatDef.baseMaterial === zd.material || i === 1) {
              dropMat = variantDef.dropMaterial;
            }
          }
          zones.push({
            key: zd.key,
            name: zd.name,
            material: dropMat,
            baseMaterial: zd.material,
            relX: zd.relX,
            relY: zd.relY,
            w: zd.w,
            h: zd.h,
            armor: scaledArmor,
            maxArmor: scaledArmor,
            state: "INTACT", // "INTACT" | "CRACKED" | "BROKEN"
            firstDamageTime: -1,
            breakTime: -1,
            timeToBreak: null,
            flashTimer: 0

      function spawnMaterialPickup(x, y, materialKey, isPristine, isEliteDrop) {
        if (!materialKey || !DATA_TABLES.materials[materialKey]) return null;
        var slot = null;
        var oldestLife = Infinity;
        var oldestIdx = 0;
        var i;
        for (i = 0; i < CFG.maxPickups; i++) {
          var p = GAME.pickups[i];
          if (!p.active) {
            slot = p;
            break;
          }
          if (p.life < oldestLife) {
            oldestLife = p.life;
            oldestIdx = i;
          }
        }
        if (!slot) {
          slot = GAME.pickups[oldestIdx];
        }

        slot.active = true;
        slot.materialKey = materialKey;
        slot.isPristine = !!isPristine;
        slot.isEliteDrop = !!isEliteDrop;
        // Step B6 & B7: Pristine counts as 2 units; Elite doubles drop units (x2)
        slot.units = (isPristine ? 2 : 1) * (isEliteDrop ? CFG.eliteDropMult : 1);
        slot.w = 16;
        slot.h = 16;
        slot.x = Math.round(x - slot.w * 0.5);
        slot.y = Math.round(y - slot.h * 0.5);
        slot.vx = (Math.random() - 0.5) * 140;
        slot.vy = -210 - Math.random() * 75;
        slot.onGround = false;
        slot.onTrainRoof = false;
        slot.magnetized = false;
        slot.life = CFG.pickupLifetime;
        slot.maxLife = CFG.pickupLifetime;
        slot.collectDelay = 0.14;
        slot.bobPhase = Math.random() * Math.PI * 2;
        return slot;

      function updatePickups(dt) {
        var pl = GAME.player;
        var plCx = pl.x + pl.w * 0.5;
        var plCy = pl.y + pl.h * 0.5;
        var playerAlive = !(GAME.playMode === "RUN" && GAME.runState.rebuildTimer > 0) && GAME.mode !== "DEFEAT";
        var trainDx = (GAME.playMode === "RUN" && GAME.bastion.moving) ? GAME.bastion.speed * dt : 0;
        var activeCount = 0;
        var i;

        for (i = 0; i < CFG.maxPickups; i++) {
          var pk = GAME.pickups[i];
          if (!pk.active) continue;

          pk.life -= dt;
          if (pk.life <= 0) {
            pk.active = false;
            continue;
          }
          if (pk.collectDelay > 0) {
            pk.collectDelay = Math.max(0, pk.collectDelay - dt);
          }
          pk.bobPhase += dt * 5;
          activeCount++;

          var pkCx = pk.x + pk.w * 0.5;
          var pkCy = pk.y + pk.h * 0.5;
          var dx = plCx - pkCx;
          var dy = plCy - pkCy;
          var dist = Math.sqrt(dx * dx + dy * dy);

          // Requirement 4: Flies to the player when within 120 px (magnet) or on touch
          if (playerAlive && pk.collectDelay <= 0 && dist <= CFG.pickupMagnetDist) {
            pk.magnetized = true;
          }

          if (pk.magnetized && playerAlive) {
            pk.onGround = false;
            pk.onTrainRoof = false;
            if (dist > 0.001) {
              var stepFly = CFG.pickupMagnetSpeed * dt;
              if (dist <= stepFly + 14) {
                pk.x = plCx - pk.w * 0.5;
                pk.y = plCy - pk.h * 0.5;
              } else {
                pk.x += (dx / dist) * stepFly;
                pk.y += (dy / dist) * stepFly;
              }
            }
          } else {
            if (pk.onTrainRoof && trainDx !== 0) {
              pk.x += trainDx;
            }
            var prevBot = pk.y + pk.h;
            pk.vy = Math.min(CFG.maxFallSpeed, pk.vy + CFG.gravity * 0.78 * dt);
            var stepX = pk.vx * dt;
            var stepY = pk.vy * dt;

            pk.onGround = false;
            pk.onTrainRoof = false;
            if (stepX !== 0) {
              if (moveAndCollideX(pk, stepX)) {
                pk.vx = -pk.vx * 0.4;
              }
            }
            if (stepY !== 0) {
              if (moveAndCollideY(pk, stepY)) {
                if (pk.onGround) {
                  pk.vx *= 0.65;
                  if (Math.abs(pk.vx) < 8) pk.vx = 0;
                }
              }
            }

            // Also land on The Bastion train roof in Run mode
            if (GAME.playMode === "RUN") {
              var b = GAME.bastion;
              if (
                pk.vy >= 0 &&
                pk.x + pk.w > b.rearX + 2 &&
                pk.x < b.engineFrontX - 2 &&
                prevBot <= b.roofY + 12 &&
                pk.y + pk.h >= b.roofY
              ) {
                pk.y = b.roofY - pk.h;
                pk.vy = 0;
                pk.vx *= 0.65;
                pk.onGround = true;
                pk.onTrainRoof = true;
              }
            }
          }

          // Check collection on player touch or magnet arrival
          if (
            playerAlive &&
            pk.collectDelay <= 0 &&
            (dist <= 18 ||
              (pk.x < pl.x + pl.w + 4 &&
                pk.x + pk.w > pl.x - 4 &&
                pk.y < pl.y + pl.h + 4 &&
                pk.y + pk.h > pl.y - 4))
          ) {
            var matDef = DATA_TABLES.materials[pk.materialKey];
            creditMaterialToInventory(pk.materialKey, pk.units);
            var labelText =
              "+" + pk.units + " " + (matDef ? matDef.name : pk.materialKey) + (pk.isPristine ? " [PRISTINE]" : "");
            spawnDmgNumber(
              plCx,
              pl.y - 14,
              labelText,
              pk.isPristine ? "#ffd700" : (matDef ? matDef.color : "#ffffff")
            );
            spawnSparkBurst(pkCx, pkCy, pk.isPristine ? 12 : 7, pk.isPristine ? "#ffd700" : (matDef ? matDef.color : "#ffffff"));
            AUDIO.playPickup(pk.isPristine);
            pk.active = false;
            activeCount--;
            updateDebugPanelUI();
          }
        }

        GAME.activePickupCount = activeCount;
      }

      function handleEnemyKilled(e) {
        if (!e || !e.active) return;
        var ecx = e.x + e.w * 0.5;
        var ecy = e.y + e.h * 0.5;
        spawnEnemyDeathBurst(ecx, ecy);

        // Step R6 Requirement 4: Play 3-frame (or 4-frame for Lobber) pixel-art death animation
        if (!GAME.dyingEnemies) GAME.dyingEnemies = [];
        GAME.dyingEnemies.push({
          type: e.type,
          variantId: e.variantId,
          x: e.x,
          y: e.y,
          w: e.w,
          h: e.h,
          dir: e.dir,
          timer: 0.30,
          maxTimer: 0.30
        });
        if (GAME.dyingEnemies.length > 24) {
          GAME.dyingEnemies.shift();
        }

        e.active = false;
        GAME.crawlersDestroyed++;

        var lEntry = GAME.ledger[e.type];
        if (lEntry) {
          lEntry.met = true;
          lEntry.kills++;
        }
        if (e.variantId && GAME.variantLedger[e.variantId]) {
          GAME.variantLedger[e.variantId].met = true;
          GAME.variantLedger[e.variantId].kills++;
        }

        // Requirement 1 & 2: A Mite drops its variant chitin/scrap material on death (x2 units if Elite)
        if (e.type === "mite") {
          if (GAME.ledger.mite && GAME.ledger.mite.zones.body) {
            GAME.ledger.mite.zones.body.breaks++;
          }
          var miteDropMat = e.dropMaterial || DATA_TABLES.enemyTypes.mite.dropMaterial;
          spawnMaterialPickup(ecx, ecy - 4, miteDropMat, false, !!e.isElite);
        }

        recountActiveEnemies();
        AUDIO.playKillEnemy();
      }

            y: 0,
            vx: 0,
            vy: 0,

            burstRemaining: 0,

            burstTargetX: 0,
            burstTargetY: 0,
            zones: [],
            wanderTimer: 0,

          });
        }
        GAME.activeEnemyCount = 0;
      }

      function resolveEnemyTypeAndVariant(typeOrVariantId) {
        var defaultVariantBySkeleton = {
          mite: "ash_mite",
          brute: "rust_brute",
          glider: "spore_glider",
          lobber: "spore_lobber",
          charger: "rail_charger",
          drone: "sentry_drone"
        };
        var key = typeOrVariantId || "ash_mite";
        if (DATA_TABLES.variants && DATA_TABLES.variants[key]) {
          var vDef = DATA_TABLES.variants[key];
          return {
            eType: vDef.skeleton,
            variantId: vDef.id,
            variantDef: vDef
          };
        }
        var skKey = DATA_TABLES.enemyTypes[key] ? key : "mite";
        var defVarId = defaultVariantBySkeleton[skKey] || "ash_mite";
        return {
          eType: skKey,
          variantId: defVarId,
          variantDef: DATA_TABLES.variants ? DATA_TABLES.variants[defVarId] : null
        };
      }

      function spawnEnemy(x, y, type, dir, isElite) {
        var slot = null;
        var i;
        for (i = 0; i < CFG.maxEnemies; i++) {
          if (!GAME.enemies[i].active) {
            slot = GAME.enemies[i];
            break;
          }
        }
        if (!slot) return null;

        var resolved = resolveEnemyTypeAndVariant(type);
        var eType = resolved.eType;
        var vId = resolved.variantId;
        var vDef = resolved.variantDef;
        var tDef = DATA_TABLES.enemyTypes[eType] || DATA_TABLES.enemyTypes.mite;
        var eliteFlag = !!isElite;
        var vHpMult = (vDef && vDef.hpMult) ? vDef.hpMult : 1.0;
        var hpMult = (eliteFlag ? CFG.eliteStatMult : 1.0) * vHpMult;
        var scaledHp = Math.max(1, Math.round(tDef.hp * hpMult));
        GAME.enemyIdSeq++;

        if (GAME.ledger[eType]) {
          GAME.ledger[eType].met = true;
        }
        if (vId && GAME.variantLedger[vId]) {
          GAME.variantLedger[vId].met = true;
        }

        slot.id = GAME.enemyIdSeq;
        slot.active = true;
        slot.type = eType;
        slot.variantId = vId;
        slot.variantName = vDef ? vDef.name : tDef.name;
        slot.plateShape = (vDef && vDef.plateShape) ? vDef.plateShape : "jagged";
        slot.tintPrimary = (vDef && vDef.tintPrimary) ? vDef.tintPrimary : "#432a59";
        slot.tintSecondary = (vDef && vDef.tintSecondary) ? vDef.tintSecondary : "#2d1b3d";
        slot.tintAccent = (vDef && vDef.tintAccent) ? vDef.tintAccent : "#ff7e21";
        slot.eyeColor = (vDef && vDef.eyeColor) ? vDef.eyeColor : "#ff9b30";
        slot.projColor = (vDef && vDef.projColor) ? vDef.projColor : "#ff9436";
        slot.projectilePattern = (vDef && vDef.projectilePattern) ? vDef.projectilePattern : "none";
        slot.speedMult = (vDef && vDef.speedMult) ? vDef.speedMult : 1.0;
        slot.dmgMult = (vDef && vDef.dmgMult) ? vDef.dmgMult : 1.0;
        slot.dropMaterial = (vDef && vDef.dropMaterial) ? vDef.dropMaterial : (tDef.dropMaterial || "scrap_chitin");
        slot.useArmorZones = tDef.useArmorZonesInCombat !== false;
        slot.isElite = eliteFlag;
        slot.weight = tDef.weight || 1;
        slot.w = tDef.width;
        slot.h = tDef.height;
        slot.x = x;
        slot.y = y;
        slot.vx = 0;
        slot.vy = 0;
        slot.hp = scaledHp;
        slot.maxHp = scaledHp;
        slot.hpBarTimer = 0;
        slot.state = "PATROL";
        slot.dir = dir || 1;
        slot.idleTimer = 0;
        slot.onGround = false;
        slot.flashTimer = 0;
        slot.knockVx = 0;
        slot.animTime = Math.random() * 6;
        slot.burnTimer = 0;
        slot.burnTickTimer = 0;
        slot.lastBladeSwingId = 0;
        slot.telegraphTimer = 0;
        slot.lungeTimer = 0;
        slot.rangedTimer = 1.0 + Math.random() * 1.5; // BB-R7 fix: was never initialised (undefined - dt = NaN) for lobbers & drones
        slot.recoverTimer = 0;
        slot.staggerTimer = 0;
        slot.armorCrackTimer = 0;
        slot.cryoSlowTimer = 0;
        slot.coreChillTimer = 0;
        slot.drillTickTimer = 0;
        slot.freezeTimer = 0;
        slot.tripStunTimer = 0;
        slot.tripExposed = false;
        slot.trippedByWireId = 0;
        slot.shockTickTimer = 0;
        slot.baseY = y;
        slot.flightPhase = Math.random() * Math.PI * 2;
        slot.diveTargetX = x;
        slot.diveTargetY = y;
        slot.diveHitDone = false;
        slot.harpooned = false;
        slot.attackCooldownTimer = 1.1 + Math.random() * 1.4;
        slot.chargeDistMoved = 0;
        slot.burstRemaining = 0;
        slot.burstTickTimer = 0;
        slot.burstTargetX = x;
        slot.burstTargetY = y;
        slot.wanderTimer = 0.6 + Math.random() * 0.8;
        slot.wanderDir = slot.dir;
        slot.zones = createBruteZonesFromTable(eType, eliteFlag, vDef);
        return slot;
      }

      function getBruteZoneByKey(e, key) {
        if (!e || !e.zones) return null;
        var i;
        for (i = 0; i < e.zones.length; i++) {
          if (e.zones[i].key === key) return e.zones[i];
        }
        return null;
      }

      function isBruteZoneBroken(e, key) {
        var z = getBruteZoneByKey(e, key);
        return !!(z && z.state === "BROKEN");
      }

      function getBruteZoneWorldRect(e, z) {
        var rx = e.dir >= 0 ? z.relX : (e.w - z.relX - z.w);
        return {
          x: e.x + rx,
          y: e.y + z.relY,
          w: z.w,
          h: z.h
        };
      }

      function spawnDetachedArmorPiece(e, z, isShatter) {
        var zr = getBruteZoneWorldRect(e, z);
        var pushX = z.key === "head" || z.key === "sensor" ? (e.dir * 95) : (z.key === "limb" || z.key === "wing" ? (-e.dir * 85) : ((Math.random() - 0.5) * 90));
        var mSet = getMonsterSpriteSet(e);
        var detSpr = (mSet && mSet.zones && mSet.zones[z.key]) ? mSet.zones[z.key].detached : null;
        GAME.armorPieces.push({
          key: z.key,
          x: zr.x + zr.w * 0.5,
          y: zr.y + zr.h * 0.5,
          w: zr.w,
          h: zr.h,
          vx: pushX + (Math.random() - 0.5) * 45,
          vy: -155 - Math.random() * 65,
          angle: 0,
          vAngle: (e.dir >= 0 ? 1 : -1) * (4.5 + Math.random() * 3.5),
          dir: e.dir,
          floorY: e.y + e.h,
          life: CFG.armorPieceFadeTime,
          maxLife: CFG.armorPieceFadeTime,
          shattered: !!isShatter,
          detachedSprite: detSpr
        });
      }

      function updateArmorPieces(dt) {
        var i;
        if (GAME.dyingEnemies && GAME.dyingEnemies.length > 0) {
          for (i = GAME.dyingEnemies.length - 1; i >= 0; i--) {
            GAME.dyingEnemies[i].timer -= dt;
            if (GAME.dyingEnemies[i].timer <= 0) {
              GAME.dyingEnemies.splice(i, 1);
            }
          }
        }
        for (i = GAME.armorPieces.length - 1; i >= 0; i--) {
          var ap = GAME.armorPieces[i];
          ap.life -= dt;
          if (ap.life <= 0) {
            GAME.armorPieces.splice(i, 1);
            continue;
          }
          ap.x += ap.vx * dt;
          ap.y += ap.vy * dt;
          ap.vy += CFG.gravity * 0.65 * dt;
          ap.angle += ap.vAngle * dt;

          // Bounce/rest on floor
          if (ap.y + ap.h * 0.35 >= ap.floorY) {
            ap.y = ap.floorY - ap.h * 0.35;
            ap.vy = -Math.abs(ap.vy) * 0.25;
            ap.vx *= 0.75;
            ap.vAngle *= 0.65;
            if (Math.abs(ap.vy) < 18) ap.vy = 0;
          }
        }
      }

      function recordZoneFirstDamage(z) {
        if (z.firstDamageTime < 0) {
          z.firstDamageTime = GAME.time;
        }
      }

      function crackBruteZone(e, z) {
        if (!z || z.state === "BROKEN") return;
        recordZoneFirstDamage(z);
        var halfArmor = Math.ceil(z.maxArmor * 0.5);
        if (z.armor > halfArmor) {
          z.armor = halfArmor;
        }
        if (z.armor <= 0) {
          z.armor = 1;
        }
        z.state = "CRACKED";
        z.flashTimer = 0.14;
        e.hpBarTimer = CFG.enemyHpBarDuration;
      }

      function breakBruteZone(e, z, isShatter) {
        if (!z || z.state === "BROKEN") return;
        recordZoneFirstDamage(z);
        z.armor = 0;
        z.state = "BROKEN";
        z.breakTime = GAME.time;
        z.timeToBreak = Math.max(0, z.breakTime - z.firstDamageTime);
        z.flashTimer = 0.22;
        e.hpBarTimer = CFG.enemyHpBarDuration;
        e.flashTimer = Math.max(e.flashTimer, isShatter ? 0.18 : 0.12);

        // Requirement 3: Pristine Grade if timeToBreak <= getEffectivePristineSeconds() (45s or 4.5s with x0.1 debug)
        var isPristine = z.timeToBreak <= getEffectivePristineSeconds();

        // Update Anatomy Ledger stats for this species & zone
        var ledgerSpecies = GAME.ledger[e.type];
        if (ledgerSpecies) {
          ledgerSpecies.met = true;
          var lz = ledgerSpecies.zones ? ledgerSpecies.zones[z.key] : null;
          if (lz) {
            lz.breaks++;
            if (lz.bestTime === null || z.timeToBreak < lz.bestTime) {
              lz.bestTime = Number(z.timeToBreak.toFixed(2));
            }
            if (isPristine) {
              lz.pristineCount++;
            }
          }
        }
        if (e.variantId && GAME.variantLedger && GAME.variantLedger[e.variantId]) {
          GAME.variantLedger[e.variantId].met = true;
          GAME.variantLedger[e.variantId].breaks++;
        }

        GAME.armorBreakLog.push({
          enemyId: e.id,
          zone: z.key,
          timeToBreak: Number(z.timeToBreak.toFixed(2)),
          pristine: isPristine,
          shattered: !!isShatter
        });
        if (GAME.armorBreakLog.length > 30) {
          GAME.armorBreakLog.shift();
        }

        spawnDetachedArmorPiece(e, z, isShatter);
        var zr = getBruteZoneWorldRect(e, z);
        var zcx = zr.x + zr.w * 0.5;
        var zcy = zr.y + zr.h * 0.5;
        spawnSparkBurst(zcx, zcy, isShatter ? 18 : 12, isPristine ? "#ffd700" : (isShatter ? "#ffffff" : "#ff9436"));

        // Requirement 2 & 3 (B6) + Requirement 3 (B7): Deterministic drop of 1 piece of the zone's material (Pristine if <= pristineSeconds; x2 units if Elite)
        spawnMaterialPickup(zcx, zcy, z.material, isPristine, !!e.isElite);
        if (isPristine) {
          spawnDmgNumber(zcx, zr.y - 24, "PRISTINE", "#ffd700");
        }

        // If Limb breaks while telegraphing or lunging, cancel slam immediately
        if (z.key === "limb" && (e.state === "TELEGRAPH" || e.state === "LUNGE")) {
          e.telegraphTimer = 0;
          e.lungeTimer = 0;
          e.state = "RECOVER";
          e.recoverTimer = 0.4;
        }
      }

      function damageBruteArmorZone(e, z, armorDmg) {
        if (!z || z.state === "BROKEN") return false;
        recordZoneFirstDamage(z);
        z.armor = Math.max(0, z.armor - armorDmg);
        z.flashTimer = 0.12;
        e.hpBarTimer = CFG.enemyHpBarDuration;
        if (z.armor <= 0) {
          breakBruteZone(e, z, false);
          var zr = getBruteZoneWorldRect(e, z);
          spawnDmgNumber(zr.x + zr.w * 0.5, zr.y - 6, "ARMOR BREAK!", "#ffae42");
          return true;
        }
        if (z.armor <= z.maxArmor * 0.5) {
          z.state = "CRACKED";
        }
        return false;
      }

      function forceNearestMiteAttack() {
        var pl = GAME.player;
        var plCx = pl.x + pl.w * 0.5;
        var plCy = pl.y + pl.h * 0.5;
        var best = null;
        var bestDist = Infinity;
        var i;
        for (i = 0; i < CFG.maxEnemies; i++) {
          var e = GAME.enemies[i];
          if (!e.active) continue;
          var dx = (e.x + e.w * 0.5) - plCx;
          var dy = (e.y + e.h * 0.5) - plCy;
          var d = Math.sqrt(dx * dx + dy * dy);
          if (d < bestDist) {
            bestDist = d;
            best = e;
          }
        }
        if (!best || bestDist > 260) {
          var spawnX = Math.round(pl.x + pl.facing * 64);
          var spawnY = Math.round(pl.y + pl.h - CFG.miteHeight);
          best = spawnEnemy(spawnX, spawnY, "mite", -pl.facing, false);
          recountActiveEnemies();
        }
        if (best) {
          if (best.type === "brute" && isBruteZoneBroken(best, "limb")) {
            return;
          }
          best.dir = plCx >= best.x + best.w * 0.5 ? 1 : -1;
          best.staggerTimer = 0;
          best.recoverTimer = 0;
          best.lungeTimer = 0;
          best.state = "TELEGRAPH";
          best.telegraphTimer =
            best.type === "brute"
              ? (isBruteZoneBroken(best, "core") ? CFG.bruteBrokenCoreTelegraphTime : CFG.bruteTelegraphTime)
              : best.type === "glider"
              ? CFG.gliderTelegraphTime
              : best.type === "charger"
              ? CFG.chargerTelegraphTime
              : best.type === "lobber"
              ? CFG.lobberTelegraphTime
              : best.type === "drone"
              ? CFG.droneTelegraphTime
              : CFG.miteTelegraphTime;
          best.vx = 0;
          AUDIO.playMiteTelegraph();
        }
      }

      function getRunZoneKeyForDistance() {
        var km = (GAME.runState && GAME.runState.distanceKm) || 0;
        var cycleKm = km % 15;
        if (cycleKm < 3.5) return "zone1";
        if (cycleKm < 7.5) return "zone2";
        if (cycleKm < 11.5) return "zone3";
        return "foundry";
      }

      function pickWeightedVariantForZone(zoneKey) {
        var table = DATA_TABLES.spawnTables[zoneKey] || DATA_TABLES.spawnTables.zone1;
        if (!table || table.length === 0) return "ash_mite";
        var totalW = 0;
        var i;
        for (i = 0; i < table.length; i++) {
          totalW += table[i].weight;
        }
        var roll = Math.random() * totalW;
        var acc = 0;
        for (i = 0; i < table.length; i++) {
          acc += table[i].weight;
          if (roll <= acc) {
            return table[i].variant;
          }
        }
        return table[table.length - 1].variant;
      }

      function loadInitialEnemies() {
        initEnemyPool();
        initEnemyProjectilePool();
        var spawns = DATA_TABLES.enemySpawns;
        var i;
        for (i = 0; i < spawns.length; i++) {
          var s = spawns[i];
          var spawnKey = s.variant || s.type;
          if (!spawnKey && s.zone) {
            spawnKey = pickWeightedVariantForZone(s.zone);
          }
          spawnEnemy(s.x, s.y, spawnKey || "ash_mite", i % 2 === 0 ? 1 : -1, false);
        }
        recountActiveEnemies();
      }

      function spawnVariantByIdAtCrosshair(variantOrType, isElite) {
        var resolved = resolveEnemyTypeAndVariant(variantOrType || "ash_mite");
        var skelDef = DATA_TABLES.enemyTypes[resolved.skeletonKey] || DATA_TABLES.enemyTypes.mite;
        var w = skelDef.width || CFG.miteWidth;
        var h = skelDef.height || CFG.miteHeight;
        var isFlyer = !!skelDef.flying;
        var mw = logicalToWorld(INPUT.mouseLogicalX, INPUT.mouseLogicalY);
        var wx = mw.x;
        var wy = mw.y;
        if (!INPUT.mouseActive) {
          wx = GAME.player.x + GAME.player.facing * 125;
          wy = isFlyer

      function clearAllEnemyProjectiles() {
        if (!GAME.enemyProjectiles) return;

      function spawnEnemyProjectile(x, y, vx, vy, opts) {
        if (!GAME.enemyProjectiles || GAME.enemyProjectiles.length === 0) {
          initEnemyProjectilePool();
        }
        var slot = null;
        var oldestSlot = GAME.enemyProjectiles[0];
        var i;
        for (i = 0; i < CFG.maxEnemyProjectiles; i++) {
          var ep = GAME.enemyProjectiles[i];
          if (!ep.active) {
            slot = ep;
            break;
          }
          if (ep.life < oldestSlot.life) {
            oldestSlot = ep;
          }
        }
        if (!slot) slot = oldestSlot;
        GAME.enemyProjSeq++;
        slot.id = GAME.enemyProjSeq;
        slot.active = true;
        slot.x = x;
        slot.y = y;
        slot.vx = vx;
        slot.vy = vy;
        slot.r = (opts && opts.r) || 5.5;
        slot.gravity = (opts && opts.gravity) || 0;
        slot.damage = (opts && opts.damage) || 8;
        slot.maxLife = (opts && opts.life) || 2.8;
        slot.life = slot.maxLife;
        slot.pattern = (opts && opts.pattern) || "single";
        slot.color = (opts && opts.color) || "#ff8c42";
        slot.coreColor = (opts && opts.coreColor) || "#fff6d6";
        slot.spawnsCloud = !!(opts && opts.spawnsCloud);
        slot.cloudRadius = (opts && opts.cloudRadius) || CFG.lobberCloudRadius;
        slot.cloudDps = (opts && opts.cloudDps) || CFG.lobberCloudDps;
        slot.cloudDuration = (opts && opts.cloudDuration) || CFG.lobberCloudDuration;
        slot.sourceEnemyId = (opts && opts.sourceEnemyId) || 0;
        return slot;
      }

      function fireEnemyProjectilePattern(e, targetX, targetY, baseDmg) {
        var sx = e.x + e.w * 0.5 + e.dir * (e.w * 0.35);
        var sy = e.y + e.h * 0.38;
        var dx = targetX - sx;
        var dy = targetY - sy;
        var baseAng = Math.atan2(dy, dx);
        var pat = e.projectilePattern || (e.type === "lobber" ? "lob" : (e.type === "drone" ? "burst-3" : "single"));
        var col = e.projectileColor || e.tintAccent || "#7af068";
        var dmg = Math.max(1, Math.round((baseDmg || 8) * (e.dmgMult || 1.0)));

        if (pat === "lob") {
          // Arcing spore blob lobbed toward target
          var flightT = Math.max(0.55, Math.min(1.15, Math.abs(dx) / Math.max(120, CFG.lobberBlobSpeed)));
          var grav = CFG.lobberBlobGravity;
          var vxLob = dx / flightT;
          var vyLob = (dy - 0.5 * grav * flightT * flightT) / flightT;
          vyLob = Math.max(-420, Math.min(-95, vyLob));
          spawnEnemyProjectile(sx, sy - 6, vxLob, vyLob, {
            r: 7,
            gravity: grav,
            damage: dmg,
            life: 2.6,
            pattern: "lob",
            color: col,
            coreColor: "#f0ffd9",
            spawnsCloud: true,
            cloudRadius: CFG.lobberCloudRadius,
            cloudDps: CFG.lobberCloudDps,
            cloudDuration: CFG.lobberCloudDuration,
            sourceEnemyId: e.id
          });
        } else if (pat === "spread-3") {
          var spreadRad = (14 * Math.PI) / 180;
          var spdSpread = 250;
          var sIdx;
          for (sIdx = -1; sIdx <= 1; sIdx++) {
            var aS = baseAng + sIdx * spreadRad;
            spawnEnemyProjectile(sx, sy, Math.cos(aS) * spdSpread, Math.sin(aS) * spdSpread, {
              r: 5.5,
              gravity: e.type === "lobber" ? 180 : 0,
              damage: dmg,
              life: 2.4,
              pattern: "spread-3",
              color: col,
              coreColor: "#ffffff",
              spawnsCloud: e.type === "lobber" && sIdx === 0,
              sourceEnemyId: e.id
            });
          }
        } else if (pat === "burst-3") {
          // 3-shot burst 10 degrees apart (Requirement 1: Husk Drone fires a 3-shot burst every 3 s, 8 damage each, 10 degrees apart)
          var burstRad = ((CFG.droneBurstSpreadDeg || 10) * Math.PI) / 180;
          var spdBurst = CFG.droneShotSpeed || 280;
          var bIdx;
          for (bIdx = -1; bIdx <= 1; bIdx++) {
            var aB = baseAng + bIdx * burstRad;
            spawnEnemyProjectile(sx, sy, Math.cos(aB) * spdBurst, Math.sin(aB) * spdBurst, {
              r: 5,
              gravity: 0,
              damage: dmg,
              life: 2.5,
              pattern: "burst-3",
              color: col,
              coreColor: "#ffffff",
              spawnsCloud: false,
              sourceEnemyId: e.id
            });
          }
        } else if (pat === "line") {
          // Fast linear lance bolt stream (2 inline high-speed bolts)
          var spdLine = 340;
          var lIdx;
          for (lIdx = 0; lIdx < 2; lIdx++) {
            var curSpd = spdLine - lIdx * 45;
            spawnEnemyProjectile(
              sx - Math.cos(baseAng) * (lIdx * 12),
              sy - Math.sin(baseAng) * (lIdx * 12),
              Math.cos(baseAng) * curSpd,
              Math.sin(baseAng) * curSpd,
              {
                r: 5,
                gravity: 0,
                damage: dmg,
                life: 2.2,
                pattern: "line",
                color: col,
                coreColor: "#ffffff",
                spawnsCloud: false,
                sourceEnemyId: e.id
              }
            );
          }
        } else {
          // "single"
          var spdSingle = 265;
          spawnEnemyProjectile(sx, sy, Math.cos(baseAng) * spdSingle, Math.sin(baseAng) * spdSingle, {
            r: 5.5,
            gravity: 0,
            damage: dmg,
            life: 2.5,
            pattern: "single",
            color: col,
            coreColor: "#ffffff",
            spawnsCloud: false,
            sourceEnemyId: e.id
          });
        }
        AUDIO.playShoot();
      }

      function updateEnemyProjectiles(dt) {
        if (!GAME.enemyProjectiles || GAME.enemyProjectiles.length === 0) return;
        var pl = GAME.player;
        var plCx = pl.x + pl.w * 0.5;
        var plCy = pl.y + pl.h * 0.5;
        var playerAlive = GAME.mode === "PLAYING" && !(GAME.playMode === "RUN" && GAME.runState.rebuildTimer > 0);
        var activeCount = 0;
        var i;

        for (i = 0; i < CFG.maxEnemyProjectiles; i++) {
          var ep = GAME.enemyProjectiles[i];
          if (!ep.active) continue;

          ep.life -= dt;
          if (ep.life <= 0) {
            ep.active = false;
            continue;
          }

          if (ep.gravity !== 0) {
            ep.vy = Math.min(CFG.maxFallSpeed, ep.vy + ep.gravity * dt);
          }
          ep.x += ep.vx * dt;
          ep.y += ep.vy * dt;

          // Check solid tile or Run mode floor impact
          var hitFloorOrWall = WORLD.isPointInSolidTile(ep.x, ep.y);
          if (!hitFloorOrWall && GAME.playMode === "RUN" && ep.y + ep.r >= GAME.bastion.floorY) {
            hitFloorOrWall = true;
            ep.y = GAME.bastion.floorY - 2;
          }

          if (hitFloorOrWall) {
            if (ep.spawnsCloud && GAME.sporeClouds) {
              GAME.sporeClouds.push({
                x: ep.x,
                y: ep.y,
                radius: ep.cloudRadius || CFG.lobberCloudRadius,
                dps: ep.cloudDps || CFG.lobberCloudDps,
                timer: ep.cloudDuration || CFG.lobberCloudDuration,
                maxTimer: ep.cloudDuration || CFG.lobberCloudDuration,
                color: ep.color || "#7af068",
                tickAccum: 0
              });
            }
            spawnSparkBurst(ep.x, ep.y, 6, ep.color);
            ep.active = false;
            continue;
          }

          // Check player collision / Vent Parry
          if (
            playerAlive &&
            ep.x + ep.r >= pl.x &&
            ep.x - ep.r <= pl.x + pl.w &&
            ep.y + ep.r >= pl.y &&
            ep.y - ep.r <= pl.y + pl.h
          ) {
            if (pl.parryWindowTimer > 0) {
              ep.active = false;
              executeVentParrySuccess(pl, null);
              continue;
            }
            var hp = GAME.runState ? GAME.runState.harpoon : null;
            var harpoonProtected =
              pl.tetherRecalling ||
              (hp && hp.active && (hp.state === "YANKING" || hp.state === "REELING"));
            if (!harpoonProtected && pl.invulnTimer <= 0) {
              pl.invulnTimer = CFG.playerInvulnTime * 0.75;
              pl.hurtLockTimer = CFG.playerHurtLockTime * 0.65;
              applyDamageToPlayer(pl, ep.damage, plCx, pl.y - 6);
              spawnSparkBurst(ep.x, ep.y, 9, ep.color);
              if (pl.hp <= 0) {
                handlePlayerDeath(pl);
              } else {
                AUDIO.playPlayerHurt();
              }
            }
            if (ep.spawnsCloud && GAME.sporeClouds) {
              GAME.sporeClouds.push({
                x: ep.x,
                y: Math.min(ep.y, pl.y + pl.h - 4),
                radius: ep.cloudRadius || CFG.lobberCloudRadius,
                dps: ep.cloudDps || CFG.lobberCloudDps,
                timer: ep.cloudDuration || CFG.lobberCloudDuration,
                maxTimer: ep.cloudDuration || CFG.lobberCloudDuration,
                color: ep.color || "#7af068",
                tickAccum: 0
              });
            }
            ep.active = false;
            continue;
          }

          // Check Bastion train hull impact in Run mode
          if (GAME.playMode === "RUN" && GAME.mode === "PLAYING") {
            var b = GAME.bastion;
            if (
              ep.x >= b.rearX &&
              ep.x <= b.drillTipX &&
              ep.y + ep.r >= b.roofY &&
              ep.y - ep.r <= b.floorY
            ) {
              applyBastionHullDamage(Math.max(2, Math.round(ep.damage * 0.5)), false);
              spawnSparkBurst(ep.x, ep.y, 6, ep.color);
              ep.active = false;
              continue;
            }
          }

          activeCount++;
        }

        GAME.activeEnemyProjCount = activeCount;

        // Update Spore Hazard Clouds
        if (GAME.sporeClouds && GAME.sporeClouds.length > 0) {
          var cIdx;
          for (cIdx = GAME.sporeClouds.length - 1; cIdx >= 0; cIdx--) {
            var cl = GAME.sporeClouds[cIdx];
            cl.timer -= dt;
            if (cl.timer <= 0) {
              GAME.sporeClouds.splice(cIdx, 1);
              continue;
            }
            if (playerAlive) {
              var cdx = plCx - cl.x;
              var cdy = plCy - cl.y;
              if (cdx * cdx + cdy * cdy <= (cl.radius + 10) * (cl.radius + 10)) {
                cl.tickAccum += dt;
                if (cl.tickAccum >= 0.5) {
                  cl.tickAccum -= 0.5;
                  var tickDmg = Math.max(1, Math.round(cl.dps * 0.5));
                  applyDamageToPlayer(pl, tickDmg, plCx, pl.y - 8);
                  if (pl.hp <= 0) {
                    handlePlayerDeath(pl);
                  }
                }
              }
            }
          }
        }
      }

      function spawnParticle(x, y, vx, vy, life, color, size) {
