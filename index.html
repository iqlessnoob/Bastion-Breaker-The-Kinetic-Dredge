        return WORLD.isSolid(col, footRow);
      }

      function hasWallAhead(ent, dir) {
        var ts = CFG.tileSize;
        var leadX = dir > 0 ? (ent.x + ent.w + 2) : (ent.x - 2);
        var col = Math.floor(leadX / ts);
        var topRow = Math.floor((ent.y + 2) / ts);
        var botRow = Math.floor((ent.y + ent.h - 2) / ts);
        return WORLD.isSolid(col, topRow) || WORLD.isSolid(col, botRow);
      }

      function executeVentParrySuccess(pl, attacker) {
        pl.parryWindowTimer = 0;
        pl.parryLockoutTimer = 0;
        pl.invulnTimer = Math.max(pl.invulnTimer, CFG.parrySuccessInvuln);
        pl.heat = Math.max(CFG.heatMin, pl.heat - CFG.parryHeatDrop);
        pl.heatPoints = Math.round((pl.heat / 100) * (GAME.bladeStats ? GAME.bladeStats.heatCapacity : 100));

        var blastOriginX = pl.x + pl.w * 0.5;
        var blastOriginY = pl.y + pl.h - 20;
        var blastDir = pl.facing >= 0 ? 1 : -1;
        if (attacker) {
          var attCx = attacker.x + attacker.w * 0.5;
          blastDir = attCx >= blastOriginX ? 1 : -1;
          pl.facing = blastDir;
        }
        var blastAngle = blastDir > 0 ? 0 : Math.PI;
        var halfBlastRad = ((CFG.parryBlastArcDeg * 0.5) * Math.PI) / 180;

        pl.parryBlastTimer = CFG.parryBlastVisualTime;
        pl.parryBlastX = blastOriginX;
        pl.parryBlastY = blastOriginY;
        pl.parryBlastDir = blastDir;

        // Cancel attacker lunge/slam and stagger attacker for 1.0 s + crack armor
        var zIdx;
        if (attacker && attacker.active) {
          attacker.state = "STAGGER";
          attacker.staggerTimer = CFG.parryAttackerStaggerTime;
          attacker.lungeTimer = 0;
          attacker.telegraphTimer = 0;
          attacker.recoverTimer = 0;
          attacker.vx = 0;
          attacker.knockVx = blastDir * 220;
          attacker.armorCrackTimer = CFG.armorCrackDuration;
          attacker.flashTimer = CFG.miteFlashDuration;
          if (attacker.zones && attacker.zones.length > 0) {
            for (zIdx = 0; zIdx < attacker.zones.length; zIdx++) {
              crackBruteZone(attacker, attacker.zones[zIdx]);
            }
          }
        }

        // Directional blast (120 px long, 70 degrees wide) staggers enemies for 0.8 s and cracks every zone of every enemy in the blast (Step B5)
        var i;
        for (i = 0; i < CFG.maxEnemies; i++) {
          var other = GAME.enemies[i];
          if (!other.active) continue;
          if (
            isBoxInBladeArc(
              other.x,
              other.y,
              other.w,
              other.h,
              blastOriginX,
              blastOriginY,
              blastAngle,
              CFG.parryBlastLength,
              halfBlastRad
            )
          ) {
            other.lungeTimer = 0;
            other.telegraphTimer = 0;
            other.recoverTimer = 0;
            other.state = "STAGGER";
            other.staggerTimer = Math.max(
              other.staggerTimer,
              other === attacker ? CFG.parryAttackerStaggerTime : CFG.parryBlastStaggerTime
            );
            other.armorCrackTimer = CFG.armorCrackDuration;
            other.knockVx = blastDir * 200;
            other.flashTimer = CFG.miteFlashDuration;
            if (other.zones && other.zones.length > 0) {
              for (zIdx = 0; zIdx < other.zones.length; zIdx++) {
                crackBruteZone(other, other.zones[zIdx]);
              }
            }
            spawnSparkBurst(other.x + other.w * 0.5, other.y + other.h * 0.5, 10, "#5ef2ff");
          }
        }

        spawnDmgNumber(blastOriginX, pl.y - 12, "PARRY!", "#5ef2ff");
        spawnSparkBurst(blastOriginX + blastDir * 18, blastOriginY, 16, "#5ef2ff");
        GAME.hitStopTimer = CFG.parryHitStopTime;
        shake(CFG.parryShakeIntensity, CFG.parryShakeDuration);
        AUDIO.playParrySuccess();
        updateDebugPanelUI();
      }

      function applyContactDamageFromEnemy(e, isLungeAttack) {
        var pl = GAME.player;
        var hp = GAME.runState ? GAME.runState.harpoon : null;
        // Requirement 5 (B12): The player takes no damage from their own harpoon (or while yanking/reeling an enemy)
        if (pl.tetherRecalling || e.harpooned || (hp && hp.active && (hp.state === "YANKING" || hp.state === "REELING"))) {
          return;
        }
        if (pl.parryWindowTimer > 0) {
          executeVentParrySuccess(pl, e);
          return;
        }
        if (pl.invulnTimer > 0) return;

        var isBrute = e.type === "brute";
        var isGlider = e.type === "glider";
        var isCharger = e.type === "charger";
        var isLobber = e.type === "lobber";
        var isDrone = e.type === "drone";
        var baseDmgAmount = isGlider
          ? CFG.gliderDiveDamage
          : isCharger
          ? (isLungeAttack ? CFG.chargerChargeDamage : CFG.chargerContactDamage)
          : isBrute
          ? (isLungeAttack ? CFG.bruteSlamDamage : CFG.bruteContactDamage)
          : isLobber
          ? CFG.lobberContactDamage
          : isDrone
          ? CFG.droneContactDamage
          : (isLungeAttack ? CFG.miteLungeDamage : CFG.miteContactDamage);
        var dmgAmount = Math.max(1, Math.round(baseDmgAmount * (e.dmgMult || 1.0)));
        var plCx = pl.x + pl.w * 0.5;
        var eCx = e.x + e.w * 0.5;
        var pushDir = plCx >= eCx ? 1 : -1;

        pl.vx = pushDir * CFG.playerKnockbackX;
        pl.vy = CFG.playerKnockbackY;
        pl.onGround = false;
        pl.hurtLockTimer = CFG.playerHurtLockTime;
        pl.invulnTimer = CFG.playerInvulnTime;

        if (isLungeAttack) {
          e.lungeTimer = 0;
          e.state = isGlider ? "CLIMB" : "RECOVER";
          e.recoverTimer = isGlider
            ? 0.55
            : isCharger
            ? CFG.chargerRecoverTime
            : isBrute
            ? CFG.bruteRecoverTime
            : CFG.miteRecoverTime;
          e.vx = 0;
          // Step B15 Requirement 2: Rail Charger slam triggers train impact camera shake (6 px, 0.25 s)
          if (isCharger) {
            shake(CFG.trainImpactShakeIntensity, CFG.trainImpactShakeDuration);
          }
        }

        applyDamageToPlayer(pl, dmgAmount, plCx, pl.y - 6);

        spawnSparkBurst(plCx, pl.y + pl.h * 0.5, 10, "#ff5e57");

        if (pl.hp <= 0) {
          handlePlayerDeath(pl);
        } else {
          AUDIO.playPlayerHurt();
        }

        updateDebugPanelUI();
      }

      function isEnemyTouchingBastionHull(e) {
        if (GAME.playMode !== "RUN") return false;
        var b = GAME.bastion;
        var cars = b.cars;
        var i;
        for (i = 0; i < cars.length; i++) {
          var c = cars[i];
          if (
            e.x <= c.x + c.w + 4 &&
            e.x + e.w >= c.x - 4 &&
            e.y <= c.y + c.h &&
            e.y + e.h >= c.y
          ) {
            return true;
          }
        }
        // Also check drill/front hull nose
        if (
          e.x <= b.drillTipX + 2 &&
          e.x + e.w >= b.engineFrontX - 4 &&
          e.y + e.h >= b.roofY
        ) {
          return true;
        }
        return false;
      }

      function updateEnemies(dt) {
        var pl = GAME.player;
        var plCx = pl.x + pl.w * 0.5;
        var plCy = pl.y + pl.h * 0.5;
        var activeCount = 0;
        var camLeft = GAME.camera.x - CFG.enemyActiveMargin;
        var camRight = GAME.camera.x + CFG.logicalWidth + CFG.enemyActiveMargin;
        if (GAME.playMode === "RUN") {
          camLeft = Math.min(camLeft, GAME.bastion.rearX - CFG.runEnemyDespawnBehind - 100);
          camRight = Math.max(camRight, GAME.bastion.drillTipX + CFG.runMiteSpawnMaxDist + 200);
        }
        var gnawingDpsTotal = 0;
        var i, s, zIdx;

        for (i = 0; i < CFG.maxEnemies; i++) {
          var e = GAME.enemies[i];
          if (!e.active) continue;

          // Requirement 7: Enemies more than 1000 px behind the train are removed
          if (
            GAME.playMode === "RUN" &&
            e.x + e.w < GAME.bastion.rearX - CFG.runEnemyDespawnBehind
          ) {
            e.active = false;
            continue;
          }

          activeCount++;

          // Performance: only simulate enemies near the camera / train
          if (e.x + e.w < camLeft || e.x > camRight) {
            continue;
          }

          if (!e.metRecorded) {
            e.metRecorded = true;
            if (GAME.ledger[e.type]) {
              GAME.ledger[e.type].met = true;
            }
            if (e.variantId && GAME.variantLedger && GAME.variantLedger[e.variantId]) {
              GAME.variantLedger[e.variantId].met = true;
            }
          }

          if (e.flashTimer > 0) {
            if (e.type === "glider" && e.flashTimer >= CFG.miteFlashDuration - dt * 1.3) {
              // Step R6 Requirement 4: Crystal Bat drops crystal shards and cyan drips when hit
              spawnParticle(
                e.x + e.w * 0.5 + (Math.random() - 0.5) * 18,
                e.y + e.h * 0.5,
                (Math.random() - 0.5) * 110,
                -40 + Math.random() * 60,
                0.38,
                "#8AF7FF",
                3.5
              );
              spawnParticle(
                e.x + e.w * 0.5 + (Math.random() - 0.5) * 14,
                e.y + e.h * 0.7,
                (Math.random() - 0.5) * 40,
                55 + Math.random() * 60,
                0.42,
                "#35E0F0",
                3.0
              );
            }
            e.flashTimer = Math.max(0, e.flashTimer - dt);
          }
          if (e.hpBarTimer > 0) {
            e.hpBarTimer = Math.max(0, e.hpBarTimer - dt);
          }
          if (e.armorCrackTimer > 0) {
            e.armorCrackTimer = Math.max(0, e.armorCrackTimer - dt);
          }
          if (e.cryoSlowTimer > 0) {
            e.cryoSlowTimer = Math.max(0, e.cryoSlowTimer - dt);
          }
          if (e.coreChillTimer > 0) {
            e.coreChillTimer = Math.max(0, e.coreChillTimer - dt);
          }
          if (e.tripStunTimer > 0) {
            e.tripStunTimer = Math.max(0, e.tripStunTimer - dt);
          }
          var isFrozen = false;
          if (e.freezeTimer > 0) {
            e.freezeTimer = Math.max(0, e.freezeTimer - dt);
            isFrozen = e.freezeTimer > 0;
          }
          if (e.zones && e.zones.length > 0) {
            for (zIdx = 0; zIdx < e.zones.length; zIdx++) {
              if (e.zones[zIdx].flashTimer > 0) {
                e.zones[zIdx].flashTimer = Math.max(0, e.zones[zIdx].flashTimer - dt);
              }
            }
          }

          // Redline Fire Burn DOT: 5 damage per second (10 dmg/s with Magma-Core) for 3 seconds
          if (e.burnTimer > 0) {
            var burnDt = Math.min(dt, e.burnTimer);
            e.burnTimer = Math.max(0, e.burnTimer - dt);
            e.hp -= CFG.burnDps * burnDt;
            e.hpBarTimer = CFG.enemyHpBarDuration;
            e.burnTickTimer -= burnDt;
            if (e.burnTickTimer <= 0) {
              e.burnTickTimer += CFG.burnTickInterval;
              spawnDmgNumber(e.x + e.w * 0.5, e.y - 10, CFG.burnDps, "#ff6826");
            }
            if (e.hp <= 0) {
              handleEnemyKilled(e);
              activeCount--;
              continue;
            }
          }

          // Step B13 Requirement 6: Train Drill Bit 4-tier upgrade deals contact damage to enemies touching the drill
          if (
            GAME.playMode === "RUN" &&
            GAME.mode === "PLAYING" &&
            GAME.bastion.moving &&
            GAME.bladeStats &&
            GAME.bladeStats.drillEnemyDps > 0
          ) {
            var bDr = GAME.bastion;
            if (
              e.x <= bDr.drillTipX + 6 &&
              e.x + e.w >= bDr.engineFrontX - 4 &&
              e.y + e.h >= bDr.floorY - CFG.trainDrillHeight
            ) {
              var drDps = GAME.bladeStats.drillEnemyDps;
              e.hp -= drDps * dt;
              e.hpBarTimer = CFG.enemyHpBarDuration;
              e.drillTickTimer = (e.drillTickTimer || 0) + dt;
              if (e.drillTickTimer >= 0.35) {
                e.drillTickTimer -= 0.35;
                spawnDmgNumber(e.x + e.w * 0.5, e.y - 12, "-" + Math.round(drDps * 0.35) + " DRILL", "#ffae42");
                spawnSparkBurst(e.x + e.w * 0.5, e.y + e.h * 0.5, 5, "#ffae42");
              }
              if (e.hp <= 0) {
                handleEnemyKilled(e);
                activeCount--;
                continue;
              }
            }
          }

          // If currently being yanked by the player's harpoon, updateHarpoon controls its position directly
          if (e.harpooned) {
            e.animTime += dt * 2.0;
            continue;
          }

          if (e.knockVx !== 0) {
            var kDec = CFG.miteKnockbackDamping * dt;
            if (Math.abs(e.knockVx) <= kDec) {
              e.knockVx = 0;
            } else {
              e.knockVx -= (e.knockVx > 0 ? 1 : -1) * kDec;
            }
          }

          // Step B8 Cryo-Vent (60% slow) + Step B13 Cryo-Core Redline chill (30% slow) + variant speedMult
          var cryoMult =
            (e.speedMult || 1.0) *
            (e.cryoSlowTimer > 0 ? (1 - CFG.cryoVentSlowPct) : 1.0) *
            (e.coreChillTimer > 0 ? (1 - ((GAME.bladeStats && GAME.bladeStats.redlineChillPct) || 0.30)) : 1.0);
          var eCx = e.x + e.w * 0.5;
          var eCy = e.y + e.h * 0.5;
          var dxPlayer = plCx - eCx;
          var dyPlayer = plCy - eCy;
          var absDx = Math.abs(dxPlayer);
          var absDy = Math.abs(dyPlayer);
          var playerAlive = !(GAME.playMode === "RUN" && GAME.runState.rebuildTimer > 0);

          // =================================================================
          // SKELETON 6: HUSK DRONE (Step B14 Requirement 1: floating sentry, 60 HP, weight 2;
          // hovers and fires a 3-shot burst every 3 s, 8 damage each, 10 degrees apart)
          // =================================================================
          if (e.type === "drone") {
            var drLimbBroken = isBruteZoneBroken(e, "limb");
            var drHeadBroken = isBruteZoneBroken(e, "head");
            var drHoverSpd = CFG.droneHoverSpeed * (drLimbBroken ? 0.65 : 1.0) * cryoMult;

            e.flightPhase += dt * CFG.droneWaveFreq * cryoMult;
            e.animTime += dt * 2.0;

            if (isFrozen) {
              e.vx = 0;
              e.vy = 0;
            } else if (e.state === "STAGGER") {
              e.staggerTimer -= dt;
              e.vx = e.knockVx;
              e.vy = 20;
              moveAndCollideX(e, e.vx * dt);
              moveAndCollideY(e, e.vy * dt);
              if (e.staggerTimer <= 0) {
                e.staggerTimer = 0;
                e.state = "PATROL";
              }
            } else {
              if (GAME.playMode === "RUN") {
                var idealHoverX = GAME.bastion.engineFrontX - 40;
                if (eCx > idealHoverX + 60) {
                  e.dir = -1;
                  e.vx = -drHoverSpd + (GAME.bastion.moving ? GAME.bastion.speed * 0.45 : 0) + e.knockVx;
                } else if (eCx < GAME.bastion.rearX + 40) {
                  e.dir = 1;
                  e.vx = drHoverSpd + (GAME.bastion.moving ? GAME.bastion.speed : 0) + e.knockVx;
                } else {
                  e.dir = dxPlayer >= 0 ? 1 : -1;
                  e.vx = (GAME.bastion.moving ? GAME.bastion.speed * 0.92 : 0) + Math.cos(e.flightPhase * 0.7) * 28 + e.knockVx;
                }
              } else {
                if (playerAlive && absDx <= 360 && absDy <= 240 && !drHeadBroken) {
                  e.dir = dxPlayer >= 0 ? 1 : -1;
                  if (absDx > 160) {
                    e.vx = e.dir * drHoverSpd + e.knockVx;
                  } else if (absDx < 95) {
                    e.vx = -e.dir * (drHoverSpd * 0.65) + e.knockVx;
                  } else {
                    e.vx = Math.cos(e.flightPhase * 0.8) * 24 + e.knockVx;
                  }
                } else {
                  if (hasWallAhead(e, e.dir)) e.dir = -e.dir;
                  e.vx = e.dir * (drHoverSpd * 0.75) + e.knockVx;
                }
              }

              var drCruiseY = GAME.playMode === "RUN" ? (GAME.bastion.roofY - 78) : e.baseY;
              var drWaveY = drCruiseY + Math.sin(e.flightPhase) * CFG.droneWaveAmp;
              e.vy = Math.max(-120, Math.min(120, (drWaveY - e.y) * 5.0));
              if (moveAndCollideX(e, e.vx * dt)) {
                e.dir = -e.dir;
              }
              moveAndCollideY(e, e.vy * dt);

              // Fire 3-shot burst (or variant pattern) every 3.0 s
              if (GAME.mode === "PLAYING") {
                if (e.state === "TELEGRAPH") {
                  e.telegraphTimer -= dt;
                  if (e.telegraphTimer <= 0) {
                    e.state = "PATROL";
                    e.rangedTimer = CFG.droneBurstInterval;
                    var drTargetX = playerAlive ? plCx : (GAME.bastion.engineFrontX - 80);
                    var drTargetY = playerAlive ? plCy : (GAME.bastion.roofY + 20);
                    fireEnemyProjectilePattern(e, drTargetX, drTargetY, CFG.droneShotDamage);
                  }
                } else {
                  e.rangedTimer -= dt;
                  var inDroneFireRange =
                    (playerAlive && absDx <= CFG.droneRangeX && absDy <= CFG.droneRangeY) ||
                    (GAME.playMode === "RUN" && Math.abs(eCx - GAME.bastion.engineFrontX) <= CFG.droneRangeX);
                  if (e.rangedTimer <= 0 && inDroneFireRange) {
                    e.state = "TELEGRAPH";
                    e.telegraphTimer = CFG.droneTelegraphTime;
                    if (playerAlive) {
                      e.dir = dxPlayer >= 0 ? 1 : -1;
                    }
                    AUDIO.playMiteTelegraph();
                  }
                }
              }
            }

            if (
              GAME.mode === "PLAYING" &&
              playerAlive &&
              e.state !== "STAGGER" &&
              pl.x < e.x + e.w &&
              pl.x + pl.w > e.x &&
              pl.y < e.y + e.h &&
              pl.y + pl.h > e.y
            ) {
              if (pl.parryWindowTimer > 0) {
                executeVentParrySuccess(pl, e);
              } else if (pl.invulnTimer <= 0) {
                applyContactDamageFromEnemy(e, false);
              }
            }
            continue;
          }

          // Step B12 Requirement 1: Glider flying AI
          // Flies a wavy path toward the train (or patrols in Sandbox), dive-bombs the player or the hull for 10 damage, climbs and repeats
          if (e.type === "glider") {
            var wingBroken = isBruteZoneBroken(e, "wing");
            var flySpd = CFG.gliderFlySpeed * (wingBroken ? 0.65 : 1.0) * cryoMult;
            var diveSpd = CFG.gliderDiveSpeed * (wingBroken ? 0.72 : 1.0) * cryoMult;
            var climbSpd = CFG.gliderClimbSpeed * cryoMult;

            e.flightPhase += dt * CFG.gliderWaveFreq * cryoMult;
            e.animTime += dt * (e.state === "DIVE" ? 2.6 : 1.8);

            if (isFrozen) {
              e.vx = 0;
              e.vy = 0;
            } else if (e.state === "STAGGER") {
              e.staggerTimer -= dt;
              e.vx = e.knockVx;
              // If stunned/slammed onto the track, rest on the floor until stagger expires, then climb back up
              var floorLimY = GAME.playMode === "RUN" ? (GAME.bastion.floorY - e.h) : (e.baseY + 90);
              if (e.y < floorLimY) {
                e.vy = Math.min(CFG.maxFallSpeed, e.vy + CFG.gravity * 0.5 * dt);
                moveAndCollideY(e, e.vy * dt);
              } else {
                e.y = floorLimY;
                e.vy = 0;
              }
              if (e.vx !== 0) {
                moveAndCollideX(e, e.vx * dt);
              }
              if (e.staggerTimer <= 0) {
                e.staggerTimer = 0;
                e.state = "CLIMB";
                e.recoverTimer = 0.75;
              }
            } else if (e.state === "TELEGRAPH") {
              e.telegraphTimer -= dt;
              e.vx = 0;
              e.vy = -25;
              if (e.telegraphTimer <= 0) {
                e.telegraphTimer = 0;
                e.state = "DIVE";
                e.lungeTimer = 0.85;
                e.diveHitDone = false;
                var dtx = e.diveTargetX - eCx;
                var dty = e.diveTargetY - eCy;
                var dLen = Math.max(1, Math.sqrt(dtx * dtx + dty * dty));
                e.vx = (dtx / dLen) * diveSpd;
                e.vy = (dty / dLen) * diveSpd;
                e.dir = e.vx >= 0 ? 1 : -1;
                AUDIO.playMiteLunge();
              }
            } else if (e.state === "DIVE") {
              e.lungeTimer -= dt;
              var hitDiveWall = moveAndCollideX(e, (e.vx + e.knockVx) * dt);
              var hitDiveFloor = moveAndCollideY(e, e.vy * dt);

              // Check if Glider dive-bombed the Bastion hull in Run mode (10 damage)
              if (!e.diveHitDone && GAME.playMode === "RUN" && GAME.mode === "PLAYING" && isEnemyTouchingBastionHull(e)) {
                e.diveHitDone = true;
                applyBastionHullDamage(CFG.gliderDiveDamage, false);
                spawnSparkBurst(e.x + e.w * 0.5, e.y + e.h, 12, "#ff8c42");
                spawnDmgNumber(e.x + e.w * 0.5, e.y - 10, "-" + CFG.gliderDiveDamage + " HULL (DIVE)", "#ff7657");
                AUDIO.playHitEnemy();
                e.state = "CLIMB";
                e.recoverTimer = 0.65;
              } else if (hitDiveFloor || hitDiveWall || e.lungeTimer <= 0 || e.y >= e.diveTargetY) {
                e.state = "CLIMB";
                e.recoverTimer = 0.65;
              }
            } else if (e.state === "CLIMB") {
              e.recoverTimer -= dt;
              var targetCruiseY = GAME.playMode === "RUN"
                ? (GAME.bastion.roofY - 86)
                : e.baseY;
              var climbDy = targetCruiseY - e.y;
              e.vx = e.dir * (flySpd * 0.6) + e.knockVx;
              e.vy = Math.max(-climbSpd, Math.min(climbSpd, climbDy * 4.5));
              moveAndCollideX(e, e.vx * dt);
              moveAndCollideY(e, e.vy * dt);
              if (Math.abs(climbDy) <= 10 || e.recoverTimer <= 0) {
                e.baseY = e.y;
                e.state = "PATROL";
              }
            } else {
              // Wavy flight path toward the train (Run mode) or patrolling/chasing player (Sandbox mode)
              if (GAME.playMode === "RUN") {
                var trainTargetX = GAME.bastion.engineFrontX - 90;
                if (eCx > GAME.bastion.rearX - 40) {
                  e.dir = eCx >= trainTargetX ? -1 : 1;
                } else {
                  e.dir = 1;
                }
                e.vx = e.dir * flySpd + (GAME.bastion.moving ? GAME.bastion.speed * 0.25 : 0) + e.knockVx;
              } else {
                if (playerAlive && absDx <= 320 && absDy <= 220) {
                  e.dir = dxPlayer >= 0 ? 1 : -1;
                } else if (hasWallAhead(e, e.dir)) {
                  e.dir = -e.dir;
                }
                e.vx = e.dir * flySpd + e.knockVx;
              }

              var waveTargetY = e.baseY + Math.sin(e.flightPhase) * CFG.gliderWaveAmp;
              var dyWave = waveTargetY - e.y;
              e.vy = Math.max(-160, Math.min(160, dyWave * 6.0));
              if (moveAndCollideX(e, e.vx * dt)) {
                e.dir = -e.dir;
              }
              moveAndCollideY(e, e.vy * dt);

              // Check dive-bomb trigger on player or Bastion hull
              if (GAME.mode === "PLAYING") {
                var canDivePlayer =
                  playerAlive &&
                  absDx <= CFG.gliderDiveTriggerDistX &&
                  dyPlayer >= -10 &&
                  dyPlayer <= 240;
                var canDiveHull =
                  GAME.playMode === "RUN" &&
                  eCx >= GAME.bastion.rearX + 20 &&
                  eCx <= GAME.bastion.engineFrontX + 40 &&
                  (GAME.bastion.roofY - eCy) >= 24 &&
                  (GAME.bastion.roofY - eCy) <= 210;

                if (canDivePlayer || canDiveHull) {
                  e.state = "TELEGRAPH";
                  e.telegraphTimer = CFG.gliderTelegraphTime;
                  if (canDivePlayer) {
                    e.diveTargetX = plCx;
                    e.diveTargetY = plCy;
                  } else {
                    e.diveTargetX = Math.max(GAME.bastion.rearX + 40, Math.min(GAME.bastion.engineFrontX - 30, eCx - 45));
                    e.diveTargetY = GAME.bastion.roofY + 8;
                  }
                  e.dir = e.diveTargetX >= eCx ? 1 : -1;
                  AUDIO.playMiteTelegraph();
                }
              }
            }

            // Contact / Dive-bomb / Parry check against player for Glider
            if (
              GAME.mode === "PLAYING" &&
              playerAlive &&
              e.state !== "STAGGER" &&
              pl.x < e.x + e.w &&
              pl.x + pl.w > e.x &&
              pl.y < e.y + e.h &&
              pl.y + pl.h > e.y
            ) {
              if (pl.parryWindowTimer > 0) {
                executeVentParrySuccess(pl, e);
              } else if (pl.invulnTimer <= 0) {
                e.diveHitDone = true;
                applyContactDamageFromEnemy(e, e.state === "DIVE");
              }
            }
            continue;
          }

          // =================================================================
          // GROUND SKELETONS: MITE, SHELL BRUTE, SPORE LOBBER, RAIL CHARGER
          // =================================================================
          var isBrute = e.type === "brute";
          var isCharger = e.type === "charger";
          var isLobber = e.type === "lobber";
          var headBroken = e.useArmorZones && isBruteZoneBroken(e, "head");
          var coreBroken = e.useArmorZones && isBruteZoneBroken(e, "core");
          var limbBroken = e.useArmorZones && isBruteZoneBroken(e, "limb");

          var baseGroundSpd = isBrute
            ? CFG.bruteSpeed
            : isLobber
            ? CFG.lobberSpeed
            : isCharger
            ? CFG.chargerPatrolSpeed
            : CFG.mitePatrolSpeed;
          var baseChaseSpd = isBrute
            ? CFG.bruteSpeed
            : isLobber
            ? CFG.lobberSpeed
            : isCharger
            ? CFG.chargerPatrolSpeed * 1.15
            : CFG.miteChaseSpeed;

          var patrolSpd = (limbBroken ? baseGroundSpd * 0.5 : baseGroundSpd) * cryoMult;
          var chaseSpd = (limbBroken ? baseChaseSpd * 0.5 : baseChaseSpd) * cryoMult;
          var lungeSpd = (isCharger
            ? CFG.chargerChargeSpeed
            : isBrute
            ? CFG.bruteSlamSpeed
            : CFG.miteLungeSpeed) * cryoMult;
          var telegraphDur = isCharger
            ? CFG.chargerTelegraphTime
            : isLobber
            ? CFG.lobberTelegraphTime
            : isBrute
            ? (coreBroken ? CFG.bruteBrokenCoreTelegraphTime : CFG.bruteTelegraphTime)
            : CFG.miteTelegraphTime;
          var lungeDur = isCharger
            ? (CFG.chargerChargeMaxDist / Math.max(1, CFG.chargerChargeSpeed))
            : isBrute
            ? CFG.bruteSlamTime
            : CFG.miteLungeTime;
          var recoverDur = isCharger
            ? CFG.chargerRecoverTime
            : isBrute
            ? CFG.bruteRecoverTime
            : CFG.miteRecoverTime;

          var chaseRangeX = isLobber
            ? CFG.lobberRangeX
            : isCharger
            ? CFG.chargerTriggerDistX
            : isBrute
            ? CFG.bruteChaseRangeX
            : CFG.miteChaseRangeX;
          var chaseRangeY = isLobber
            ? CFG.lobberRangeY
            : isCharger
            ? CFG.chargerTriggerDistY
            : isBrute
            ? CFG.bruteChaseRangeY
            : CFG.miteChaseRangeY;
          var triggerDistX = isCharger
            ? CFG.chargerTriggerDistX
            : isBrute
            ? CFG.bruteSlamTriggerDist
            : CFG.miteLungeTriggerDist;
          var triggerDistY = isCharger
            ? CFG.chargerTriggerDistY
            : isBrute
            ? CFG.bruteSlamTriggerY
            : CFG.miteLungeTriggerY;

          var inChaseRange =
            playerAlive &&
            absDx <= chaseRangeX &&
            absDy <= chaseRangeY;
          var inLungeRange =
            !isLobber &&
            playerAlive &&
            !limbBroken &&
            absDx <= triggerDistX &&
            absDy <= triggerDistY;

          var touchingHull = !isFrozen && isEnemyTouchingBastionHull(e);
          var aiVx = 0;

          if (isFrozen) {
            aiVx = 0;
            e.knockVx = 0;
          } else if (e.state === "STAGGER") {
            e.staggerTimer -= dt;
            aiVx = 0;
            if (e.staggerTimer <= 0) {
              e.staggerTimer = 0;
              e.state = inChaseRange ? "CHASE" : "PATROL";
            }
          } else if (e.state === "TELEGRAPH") {
            e.telegraphTimer -= dt;
            aiVx = 0;
            // Step R6 Requirement 4: Mite (Spore Beetle look) puffs spores while telegraphing
            if (e.type === "mite" && Math.random() < dt * 20) {
              spawnParticle(
                e.x + e.w * 0.5 + (Math.random() - 0.5) * 16,
                e.y + 4,
                (Math.random() - 0.5) * 45,
                -65 - Math.random() * 45,
                0.36,
                e.tintAccent || "#2FE6A0",
                3.2
              );
            }
            if (e.telegraphTimer <= 0) {
              e.telegraphTimer = 0;
              if (isLobber) {
                // Spore Lobber: lob arcing spore blob (12 dmg + small cloud) every 3 s
                var lobTargetX = playerAlive ? plCx : (GAME.bastion.engineFrontX - 60);
                var lobTargetY = playerAlive ? (pl.y + pl.h) : GAME.bastion.roofY;
                fireEnemyProjectilePattern(e, lobTargetX, lobTargetY, CFG.lobberBlobDamage);
                e.rangedTimer = CFG.lobberFireInterval;
                e.state = "RECOVER";
                e.recoverTimer = 0.45;
              } else {
                e.state = "LUNGE";
                e.lungeTimer = lungeDur;
                e.chargeDistanceMoved = 0;
                AUDIO.playMiteLunge();
              }
            }
          } else if (e.state === "LUNGE") {
            e.lungeTimer -= dt;
            if (e.onGround && !hasFloorAhead(e, e.dir)) {
              aiVx = 0;
            } else {
              aiVx = e.dir * lungeSpd;
              if (isCharger) {
                e.chargeDistanceMoved = (e.chargeDistanceMoved || 0) + Math.abs(aiVx) * dt;
              }
            }
            if (
              e.lungeTimer <= 0 ||
              (isCharger && e.chargeDistanceMoved >= CFG.chargerChargeMaxDist)
            ) {
              e.lungeTimer = 0;
              e.state = "RECOVER";
              e.recoverTimer = recoverDur;
              aiVx = 0;
            }
          } else if (e.state === "RECOVER") {
            e.recoverTimer -= dt;
            aiVx = 0;
            if (e.recoverTimer <= 0) {
              e.recoverTimer = 0;
              e.state = inChaseRange ? "CHASE" : "PATROL";
            }
          } else {
            // Spore Lobber ranged attack timer check (lobs every 3 s)
            if (isLobber && GAME.mode === "PLAYING") {
              e.rangedTimer -= dt;
              var canLobAtTarget =
                (playerAlive && absDx <= CFG.lobberRangeX && absDy <= CFG.lobberRangeY) ||
                (GAME.playMode === "RUN" && Math.abs(eCx - GAME.bastion.engineFrontX) <= CFG.lobberRangeX);
              if (e.rangedTimer <= 0 && canLobAtTarget && e.onGround) {
                if (!headBroken && playerAlive) {
                  e.dir = dxPlayer >= 0 ? 1 : -1;
                }
                e.state = "TELEGRAPH";
                e.telegraphTimer = CFG.lobberTelegraphTime;
                aiVx = 0;
                AUDIO.playMiteTelegraph();
              }
            }

            if (e.state !== "TELEGRAPH") {
              // Normal PATROL / IDLE / CHASE state transitions
              if (inLungeRange && e.onGround && GAME.mode === "PLAYING") {
                if (!headBroken) {
                  e.dir = dxPlayer >= 0 ? 1 : -1;
                }
                e.state = "TELEGRAPH";
                e.telegraphTimer = telegraphDur;
                aiVx = 0;
                AUDIO.playMiteTelegraph();
              } else if (headBroken && e.useArmorZones) {
                // Head/Sensor broken: loses chase accuracy and wanders
                e.state = "PATROL";
                e.wanderTimer -= dt;
                if (e.wanderTimer <= 0) {
                  e.wanderTimer = 0.65 + Math.random() * 1.1;
                  e.wanderDir = Math.random() < 0.5 ? 1 : -1;
                  e.dir = e.wanderDir;
                }
                if (e.onGround && (!hasFloorAhead(e, e.dir) || hasWallAhead(e, e.dir))) {
                  e.dir = -e.dir;
                  e.wanderDir = e.dir;
                  aiVx = 0;
                } else {
                  aiVx = e.dir * patrolSpd;
                }
              } else if (GAME.playMode === "RUN" && touchingHull && !inLungeRange) {
                e.dir = -1;
                aiVx = GAME.bastion.moving ? GAME.bastion.speed * 0.35 : 0;
              } else if (GAME.playMode === "RUN" && !inChaseRange) {
                var trainCenter = (GAME.bastion.rearX + GAME.bastion.engineFrontX) * 0.5;
                e.dir = eCx > trainCenter ? -1 : 1;
                aiVx = e.dir * patrolSpd;
              } else {
                if (inChaseRange) {
                  e.state = "CHASE";
                } else if (e.state === "CHASE") {
                  e.state = "PATROL";
                }

                if (e.state === "IDLE") {
                  e.idleTimer -= dt;
                  if (e.idleTimer <= 0) {
                    e.state = "PATROL";
                  }
                } else if (e.state === "PATROL") {
                  if (e.onGround && (!hasFloorAhead(e, e.dir) || hasWallAhead(e, e.dir))) {
                    e.state = "IDLE";
                    e.idleTimer = CFG.miteIdleTime;
                    e.dir = -e.dir;
                    aiVx = 0;
                  } else {
                    aiVx = e.dir * patrolSpd;
                  }
                } else if (e.state === "CHASE") {
                  if (absDx > 6) {
                    e.dir = dxPlayer > 0 ? 1 : -1;
                  }
                  if (isLobber && absDx < 130) {
                    // Spore Lobber prefers keeping medium range while lobbing
                    aiVx = 0;
                  } else if (e.onGround && (!hasFloorAhead(e, e.dir) || hasWallAhead(e, e.dir))) {
                    aiVx = 0;
                  } else {
                    aiVx = e.dir * chaseSpd;
                  }
                }
              }
            }
          }

          var totalVx = aiVx + e.knockVx;
          if (e.onGround && totalVx !== 0) {
            var moveSign = totalVx > 0 ? 1 : -1;
            if (!hasFloorAhead(e, moveSign)) {
              totalVx = 0;
              e.knockVx = 0;
            }
          }
          e.vx = totalVx;

          e.vy += CFG.gravity * dt;
          if (e.vy > CFG.maxFallSpeed) {
            e.vy = CFG.maxFallSpeed;
          }

          var totalDx = e.vx * dt;
          var totalDy = e.vy * dt;
          var maxStep = 8;
          var steps = Math.max(1, Math.ceil(Math.max(Math.abs(totalDx), Math.abs(totalDy)) / maxStep));
          var stepDx = totalDx / steps;
          var stepDy = totalDy / steps;

          e.onGround = false;
          for (s = 0; s < steps; s++) {
            if (stepDx !== 0) {
              var hitWall = moveAndCollideX(e, stepDx);
              if (hitWall) {
                if (e.state === "PATROL") {
                  e.state = "IDLE";
                  e.idleTimer = CFG.miteIdleTime;
                  e.dir = -e.dir;
                } else if (e.state === "LUNGE") {
                  e.lungeTimer = 0;
                  e.state = "RECOVER";
                  e.recoverTimer = recoverDur;
                  if (isCharger) {
                    shake(CFG.trainImpactShakeIntensity, CFG.trainImpactShakeDuration);
                    spawnSparkBurst(e.x + (e.dir > 0 ? e.w : 0), e.y + e.h * 0.5, 10, "#ffae42");
                  }
                }
                stepDx = 0;
              }
            }
            if (stepDy !== 0) {
              moveAndCollideY(e, stepDy);
            }
          }

          if (Math.abs(e.vx) > 5 || touchingHull) {
            e.animTime += dt * (isBrute ? 0.95 : 1.4);
          } else {
            e.animTime += dt * 0.35;
          }

          // Gnaw hull (or Rail Charger slam hull) while touching it in Run mode
          if (GAME.playMode === "RUN" && GAME.mode === "PLAYING" && e.state !== "STAGGER" && isEnemyTouchingBastionHull(e)) {
            if (isCharger && e.state === "LUNGE") {
              e.lungeTimer = 0;
              e.state = "RECOVER";
              e.recoverTimer = recoverDur;
              applyBastionHullDamage(CFG.chargerChargeDamage, false);
              spawnDmgNumber(e.x + e.w * 0.5, e.y - 12, "-" + CFG.chargerChargeDamage + " HULL (SLAM)", "#ff7657");
              spawnSparkBurst(e.x + e.w * 0.5, e.y + e.h * 0.5, 14, "#ff8c42");
              AUDIO.playHitEnemy();
            } else {
              var gnawRate = isBrute
                ? CFG.bruteHullGnawDps
                : isCharger
                ? CFG.chargerHullGnawDps
                : isLobber
                ? CFG.lobberHullGnawDps
                : CFG.miteHullGnawDps;
              gnawingDpsTotal += gnawRate;
              applyBastionHullDamage(gnawRate * dt);
            }
          }

          // Contact / Lunge / Slam / Parry check against player
          if (
            GAME.mode === "PLAYING" &&
            playerAlive &&
            e.state !== "STAGGER" &&
            pl.x < e.x + e.w &&
            pl.x + pl.w > e.x &&
            pl.y < e.y + e.h &&
            pl.y + pl.h > e.y
          ) {
            if (pl.parryWindowTimer > 0) {
              executeVentParrySuccess(pl, e);
            } else if (pl.invulnTimer <= 0) {
              applyContactDamageFromEnemy(e, e.state === "LUNGE");
            }
          }
        }

        if (GAME.playMode === "RUN" && gnawingDpsTotal > 0) {
          GAME.runState.gnawNumberTimer += dt;
          if (GAME.runState.gnawNumberTimer >= 1.0) {
            GAME.runState.gnawNumberTimer -= 1.0;
            spawnDmgNumber(
              GAME.bastion.engineFrontX - 40,
              GAME.bastion.roofY - 12,
              "-" + Math.round(gnawingDpsTotal) + " HULL",
              "#ff7657"
            );
          }
        }

        GAME.activeEnemyCount = activeCount;
      }

      function updateAimAndGun(dt) {
        var pl = GAME.player;
        if (GAME.playMode === "RUN" && GAME.runState.rebuildTimer > 0) {
          return;
        }
        var shoulderX = pl.x + pl.w * 0.5;
        var shoulderY = pl.y + pl.h - 20;

        // Update Volt-Core lightning arc visuals
        if (GAME.voltArcs && GAME.voltArcs.length > 0) {
          var vIdx;
          for (vIdx = GAME.voltArcs.length - 1; vIdx >= 0; vIdx--) {
            GAME.voltArcs[vIdx].timer -= dt;
            if (GAME.voltArcs[vIdx].timer <= 0) {
              GAME.voltArcs.splice(vIdx, 1);
            }
          }
        }

        if (pl.overheatTimer <= 0) {
          if (INPUT.stickPointerId !== null && INPUT.stickMag > 0.05) {
            pl.aimAngle = INPUT.stickAngle;
            pl.facing = Math.cos(pl.aimAngle) >= -0.01 ? 1 : -1;
          } else if (INPUT.aimMode === "mouse" && INPUT.mouseActive && !INPUT.held.fireKey) {
            var mw = logicalToWorld(INPUT.mouseLogicalX, INPUT.mouseLogicalY);
            var worldMouseX = mw.x;
            var worldMouseY = mw.y;
            pl.aimAngle = Math.atan2(worldMouseY - shoulderY, worldMouseX - shoulderX);
            pl.facing = Math.cos(pl.aimAngle) >= -0.01 ? 1 : -1;
          } else {
            pl.aimAngle = pl.facing >= 0 ? 0 : Math.PI;
          }
        }

        var barrelLen = 15;
        pl.muzzleX = shoulderX + Math.cos(pl.aimAngle) * barrelLen;
        pl.muzzleY = shoulderY + Math.sin(pl.aimAngle) * barrelLen;

        // Vent Parry (Step B2): works at 0% heat and during Redline
        if (pl.parryBlastTimer > 0) {
          pl.parryBlastTimer = Math.max(0, pl.parryBlastTimer - dt);
        }
        if (pl.parryLockoutTimer > 0) {
          pl.parryLockoutTimer = Math.max(0, pl.parryLockoutTimer - dt);
        }
        if (pl.parryWindowTimer > 0) {
          pl.parryWindowTimer = Math.max(0, pl.parryWindowTimer - dt);
          if (pl.parryWindowTimer <= 0) {
            // Missed parry starts 0.35 s lockout before another parry can start
            pl.parryLockoutTimer = CFG.parryLockout;
          }
        }
        if (
          pl.overheatTimer <= 0 &&
          pl.parryWindowTimer <= 0 &&
          pl.parryLockoutTimer <= 0 &&
          INPUT.justPressedParry
        ) {
          pl.parryWindowTimer = CFG.parryWindow;
          AUDIO.playParryStart();
          updateDebugPanelUI();
        }

        var stats = GAME.bladeStats;
        var isBuzzsawEdge = !!(stats && stats.isContinuousHold);

        if (isBuzzsawEdge) {
          // Step B13 Requirement 2 (Buzzsaw): while Blade is held it spins and hits every 0.12 s for 8 damage,
          // reach 44, adds 20 percent heat per second, slows movement 50 percent.
          pl.bladeComboPending = 0;
          if (pl.overheatTimer <= 0 && (INPUT.held.blade || INPUT.justPressedBlade)) {
            if (!pl.buzzsawActive) {
              pl.buzzsawActive = true;
              pl.buzzsawTickTimer = 0;
              if (!pl.onGround && stats && stats.aerialHangTime > 0) {
                pl.bladeHangTimer = stats.aerialHangTime;
              }
              AUDIO.playBladeSwing(pl.heat >= CFG.heatRedlineMin && pl.heat <= CFG.heatRedlineMax);
            }
            pl.bladeAngle = pl.aimAngle;
            pl.facing = Math.cos(pl.bladeAngle) >= -0.01 ? 1 : -1;
            pl.bladeTimer = 0.08;
            pl.buzzsawSpinAngle = (pl.buzzsawSpinAngle || 0) + dt * 28.0 * (stats ? stats.attackSpeedMult : 1.0);
            pl.bladeIsRedline = (pl.heat >= CFG.heatRedlineMin && pl.heat <= CFG.heatRedlineMax);

            var heatPerSec = (stats && stats.buzzsawHeatPerSec) ? stats.buzzsawHeatPerSec : 20;
            addPlayerHeatPoints(pl, heatPerSec * dt);

            if (pl.overheatTimer <= 0) {
              pl.buzzsawTickTimer -= dt;
              var tickInt = (stats && stats.buzzsawTickInterval) ? stats.buzzsawTickInterval : 0.12;
              if (pl.buzzsawTickTimer <= 0) {
                pl.buzzsawTickTimer += tickInt;
                pl.bladeSwingId++;
                pl.bladeHarpoonMult = 1.0;
                checkBladeHitsTargets(pl);
              }
            } else {
              pl.buzzsawActive = false;
              pl.bladeTimer = 0;
            }
          } else {
            pl.buzzsawActive = false;
            if (pl.bladeTimer > 0 && pl.bladeHarpoonMult <= 1.0) {
              pl.bladeTimer = 0;
            }
          }
        } else {
          pl.buzzsawActive = false;
          // Engine-Blade melee swing (Step B1 + Step B13 Cleaver / Twin-Fang / Piercing Lance)
          if (pl.overheatTimer <= 0 && pl.bladeTimer <= 0 && INPUT.justPressedBlade) {
            var preRedline =
              pl.heat >= CFG.heatRedlineMin && pl.heat <= CFG.heatRedlineMax;
            addPlayerHeatPoints(pl, CFG.bladeHeatCost);

            if (pl.overheatTimer <= 0) {
              pl.bladeTimer = CFG.bladeTotalTime;
              pl.bladeAngle = pl.aimAngle;
              pl.facing = Math.cos(pl.bladeAngle) >= -0.01 ? 1 : -1;
              pl.heldItemType = "blade";
              pl.heldItemTimer = 0.30;
              pl.bladeSwingId++;
              pl.bladeHarpoonMult = 1.0;
              pl.bladeComboFlip = false;
              pl.bladeComboPending = (stats && stats.hitsPerPress > 1) ? (stats.hitsPerPress - 1) : 0;
              if (!pl.onGround && stats && stats.aerialHangTime > 0) {
                pl.bladeHangTimer = stats.aerialHangTime;
              }
              pl.bladeIsRedline =
                preRedline ||
                (pl.heat >= CFG.heatRedlineMin && pl.heat <= CFG.heatRedlineMax);
              AUDIO.playBladeSwing(pl.bladeIsRedline);
            }
            updateDebugPanelUI();
          }

          if (pl.bladeTimer > 0) {
            pl.bladeTimer = Math.max(0, pl.bladeTimer - dt);
            var elapsed = CFG.bladeTotalTime - pl.bladeTimer;
            if (
              elapsed >= CFG.bladeWindupTime &&
              elapsed <= CFG.bladeWindupTime + CFG.bladeActiveTime
            ) {
              checkBladeHitsTargets(pl);
            }
            if (pl.bladeTimer <= 0) {
              if (pl.bladeComboPending > 0 && pl.overheatTimer <= 0) {
                // Step B13 Requirement 2 (Twin-Fang): two quick strikes per press (2 x 14 damage), 0.20 s each
                pl.bladeComboPending--;
                pl.bladeComboFlip = !pl.bladeComboFlip;
                pl.bladeTimer = CFG.bladeTotalTime;
                pl.bladeAngle = pl.aimAngle;
                pl.facing = Math.cos(pl.bladeAngle) >= -0.01 ? 1 : -1;
                pl.heldItemType = "blade";
                pl.heldItemTimer = 0.30;
                pl.bladeSwingId++;
                AUDIO.playBladeSwing(pl.bladeIsRedline);
              } else {
                pl.bladeHarpoonMult = 1.0;
              }
            }
          }
        }

        if (pl.fireCooldown > 0) {
          pl.fireCooldown = Math.max(0, pl.fireCooldown - dt);
        }

        // Ember Pistol firing (adds no heat; blocked while Overheated)
        var wantsFire =
          pl.overheatTimer <= 0 &&
          (INPUT.mouseDown || INPUT.stickFiring || INPUT.held.fireKey);
        if (wantsFire && pl.fireCooldown <= 0) {
          pl.fireCooldown = CFG.fireInterval;
          pl.muzzleFlashFrames = CFG.muzzleFlashFrames;
          pl.heldItemType = "pistol";
          pl.heldItemTimer = 0.30;
          spawnBolt(pl.muzzleX, pl.muzzleY, pl.aimAngle);
          AUDIO.playShoot();
        }
      }

      function checkBoltHitsTile(bx, by, r) {
        return (
          WORLD.isPointInSolidTile(bx, by) ||
          WORLD.isPointInSolidTile(bx - r, by) ||
          WORLD.isPointInSolidTile(bx + r, by) ||
          WORLD.isPointInSolidTile(bx, by - r) ||
          WORLD.isPointInSolidTile(bx, by + r)
        );
      }

      function checkBoltHitsDummy(bx, by, r, boltVx) {
        var i;
        for (i = 0; i < GAME.dummies.length; i++) {
          var d = GAME.dummies[i];
          if (
            bx + r >= d.x &&
            bx - r <= d.x + d.w &&
            by + r >= d.y &&
            by - r <= d.y + d.h
          ) {
            d.hits++;
            d.flashTimer = CFG.dummyFlashDuration;
            d.wobbleVel += (boltVx >= 0 ? 1 : -1) * 8.5;
            spawnDmgNumber(d.x + d.w * 0.5, d.y - 6, CFG.boltDamage, "#ffd478");
            return true;
          }
        }
        return false;
      }

      function checkBoltHitsEnemy(bx, by, r, boltVx) {
        var i, zIdx;
        for (i = 0; i < CFG.maxEnemies; i++) {
          var e = GAME.enemies[i];
          if (!e.active) continue;
          if (
            bx + r >= e.x &&
            bx - r <= e.x + e.w &&
            by + r >= e.y &&
            by - r <= e.y + e.h
          ) {
            if (e.useArmorZones && e.zones && e.zones.length > 0) {
              // Bolts move in sub-steps, so the first zone rectangle the bolt touches is hit
              var touchedZone = null;
              for (zIdx = 0; zIdx < e.zones.length; zIdx++) {
                var z = e.zones[zIdx];
                var zr = getBruteZoneWorldRect(e, z);
                if (
                  bx + r >= zr.x &&
                  bx - r <= zr.x + zr.w &&
                  by + r >= zr.y &&
                  by - r <= zr.y + zr.h
                ) {
                  touchedZone = z;
                  break;
                }
              }
              if (!touchedZone) {
                // If bolt grazed corner between zone rects, pick closest zone rectangle
                var bestDist = Infinity;
                for (zIdx = 0; zIdx < e.zones.length; zIdx++) {
                  var zc = e.zones[zIdx];
                  var zcr = getBruteZoneWorldRect(e, zc);
                  var dx = bx - (zcr.x + zcr.w * 0.5);
                  var dy = by - (zcr.y + zcr.h * 0.5);
                  var d2 = dx * dx + dy * dy;
                  if (d2 < bestDist) {
                    bestDist = d2;
                    touchedZone = zc;
                  }
                }
              }

              e.hpBarTimer = CFG.enemyHpBarDuration;
              e.flashTimer = CFG.miteFlashDuration;
              e.knockVx = (boltVx >= 0 ? 1 : -1) * (CFG.miteKnockbackSpeed * 0.45);

              if (touchedZone.state !== "BROKEN") {
                // Requirement 2: Armor takes 40 percent of gun damage
                var armorGunDmg = Math.max(1, Math.round(CFG.boltDamage * CFG.gunArmorDamageMult));
                damageBruteArmorZone(e, touchedZone, armorGunDmg);
                spawnDmgNumber(bx, by - 8, "-" + armorGunDmg + " ARM", "#8ad8ff");
                spawnSparkBurst(bx, by, 6, "#8ad8ff");
                AUDIO.playArmorHit();
              } else {
                // Requirement 3 & 4: Broken zone takes no armor damage; hits go to main HP at x1.5 (Core: x2.0)
                var hpMult = (touchedZone.key === "core" || touchedZone.key === "carapace") ? CFG.brokenCoreHpMult : CFG.brokenZoneHpMult;
                var bruteBoltDmg = Math.round(CFG.boltDamage * hpMult);
                if (e.armorCrackTimer > 0) {
                  bruteBoltDmg = Math.round(bruteBoltDmg * CFG.armorCrackDamageMult);
                  e.armorCrackTimer = 0;
                }
                e.hp -= bruteBoltDmg;
                spawnDmgNumber(
                  bx,
                  by - 8,
                  bruteBoltDmg,
                  (touchedZone.key === "core" || touchedZone.key === "carapace") ? "#ff5252" : "#ffb84d"
                );
                if (e.hp <= 0) {
                  handleEnemyKilled(e);
                } else {
                  spawnSparkBurst(bx, by, 8, "#ff9838");
                  AUDIO.playHitEnemy();
                }
              }
              return true;
            }

            var boltDmg = CFG.boltDamage;
            var wasCracked = e.armorCrackTimer > 0;
            if (wasCracked) {
              boltDmg = Math.round(boltDmg * CFG.armorCrackDamageMult);
              e.armorCrackTimer = 0;
            }
            e.hp -= boltDmg;
            e.hpBarTimer = CFG.enemyHpBarDuration;
            e.flashTimer = CFG.miteFlashDuration;
            e.knockVx = (boltVx >= 0 ? 1 : -1) * CFG.miteKnockbackSpeed;
            spawnDmgNumber(
              e.x + e.w * 0.5,
              e.y - 8,
              boltDmg,
              wasCracked ? "#5ef2ff" : "#ffb84d"
            );

            if (e.hp <= 0) {
              handleEnemyKilled(e);
            } else {
              spawnSparkBurst(bx, by, 7, wasCracked ? "#5ef2ff" : "#ff9838");
              AUDIO.playHitEnemy();
            }
            return true;
          }
        }
        return false;
      }

      function updateBolts(dt) {
        var activeCount = 0;
        var r = CFG.boltRadius;
        var i, s;

        for (i = 0; i < CFG.maxBolts; i++) {
          var b = GAME.bolts[i];
          if (!b.active) continue;

          var totalDx = b.vx * dt;
          var totalDy = b.vy * dt;
          var stepDist = Math.sqrt(totalDx * totalDx + totalDy * totalDy);
          var steps = Math.max(1, Math.ceil(stepDist / CFG.boltSubStep));
          var sdx = totalDx / steps;
          var sdy = totalDy / steps;
          var ds = stepDist / steps;

          var destroyed = false;
          for (s = 0; s < steps; s++) {
            b.x += sdx;
            b.y += sdy;
            b.dist += ds;

            if (b.x < 0 || b.x > GAME.worldWidth || b.y < 0 || b.y > GAME.worldHeight) {
              b.active = false;
              destroyed = true;
              break;
            }

            if (checkBoltHitsTile(b.x, b.y, r)) {
              spawnSparkBurst(b.x, b.y, 7, "#ff9436");
              b.active = false;
              destroyed = true;
              break;
            }

            if (checkBoltHitsEnemy(b.x, b.y, r, b.vx)) {
              b.active = false;
              destroyed = true;
              break;
            }

            if (checkBoltHitsDummy(b.x, b.y, r, b.vx)) {
              spawnSparkBurst(b.x, b.y, 9, "#ffd27d");
              AUDIO.playHitDummy();
              b.active = false;
              destroyed = true;
              break;
            }

            if (b.dist >= CFG.boltMaxRange) {
              b.active = false;
              destroyed = true;
              break;
            }
          }

          if (!destroyed) {
            b.life += dt;
            if (b.life >= CFG.boltMaxLife) {
              b.active = false;
            } else {
              activeCount++;
            }
          }
        }

        GAME.activeBoltCount = activeCount;
      }

      function updateDummies(dt) {
        var i;
        for (i = 0; i < GAME.dummies.length; i++) {
          var d = GAME.dummies[i];
          if (d.flashTimer > 0) {
            d.flashTimer = Math.max(0, d.flashTimer - dt);
          }
          if (d.burnTimer > 0) {
            var bDt = Math.min(dt, d.burnTimer);
            d.burnTimer = Math.max(0, d.burnTimer - dt);
            d.burnTickTimer -= bDt;
            if (d.burnTickTimer <= 0) {
              d.burnTickTimer += CFG.burnTickInterval;
              d.hits++;
              spawnDmgNumber(d.x + d.w * 0.5, d.y - 10, CFG.burnDps, "#ff6826");
            }
          }
          var stiffness = 190;
          var damping = 12;
          var accel = -stiffness * d.wobbleAngle - damping * d.wobbleVel;
          d.wobbleVel += accel * dt;
          d.wobbleAngle += d.wobbleVel * dt;
          if (Math.abs(d.wobbleAngle) < 0.001 && Math.abs(d.wobbleVel) < 0.01) {
            d.wobbleAngle = 0;
            d.wobbleVel = 0;
          } else if (d.wobbleAngle > 0.35) {
            d.wobbleAngle = 0.35;
          } else if (d.wobbleAngle < -0.35) {
            d.wobbleAngle = -0.35;
          }
        }
      }

      function updateDmgNumbers(dt) {
        var i;
        for (i = 0; i < CFG.maxDmgNumbers; i++) {
          var dn = GAME.dmgNumbers[i];
          if (!dn.active) continue;
          dn.x += dn.vx * dt;
          dn.y += dn.vy * dt;
          dn.life -= dt;
          if (dn.life <= 0) {
            dn.active = false;
          }
        }
      }

      function updateCamera() {
        var pl = GAME.player;
        var zoom = getEffectiveZoom();
        var viewW = CFG.logicalWidth / zoom;
        var viewH = CFG.logicalHeight / zoom;
        var plCx = pl.x + pl.w * 0.5;
        var plCy = pl.y + pl.h * 0.5;

        // Step R1 Requirement 3: Horizontal framing — follow player with look-ahead of 80 world px in facing direction
        var lookAhead = (pl.facing >= 0 ? 1 : -1) * (CFG.cameraLookAheadX || 80);
        var targetX = plCx + lookAhead - viewW * 0.5;

        // In Run mode the camera also keeps the drill head visible when the player is within 600 px of the train
        if (GAME.playMode === "RUN" && GAME.bastion) {
          var b = GAME.bastion;
          var drillX = b.drillTipX;
          var distToTrain = plCx < b.rearX
            ? (b.rearX - plCx)
            : (plCx > drillX ? (plCx - drillX) : 0);
          if (distToTrain <= (CFG.runDrillKeepVisibleDist || 600)) {
            var marginX = 56;
            var minFocusX = Math.min(plCx, drillX) - marginX;
            var maxFocusX = Math.max(plCx, drillX) + marginX;
            if (maxFocusX - minFocusX <= viewW) {
              if (targetX > minFocusX) targetX = minFocusX;
              if (targetX + viewW < maxFocusX) {
                targetX = maxFocusX - viewW;
              }
            } else {
              // Player and drill are further apart than viewW: keep drill head visible while framing toward player
              if (drillX >= plCx) {
                targetX = Math.max(plCx - marginX, drillX + marginX - viewW);
              } else {
                targetX = Math.min(plCx + marginX - viewW, drillX - marginX);
              }
            }
          }
        }

        // Step R1 Requirement 3: Vertical framing — ground or rail line sits at 70 percent of the screen height.
        // Follow vertically only when the player goes above 35 percent or below 85 percent of the screen.
        var railWorldY = CFG.trainFloorY; // 1088 world px (rail line in Run & main floor in Sandbox)
        var baseCamY = railWorldY - (CFG.railScreenFractionY || 0.70) * viewH;
        var targetY = GAME.camera.y || baseCamY;
        var topBandWorldH = (CFG.camDeadzoneTopFrac || 0.35) * viewH;
        var botBandWorldH = (CFG.camDeadzoneBotFrac || 0.85) * viewH;

        // Check player feet/center against 35%..85% vertical band; when on the ground or train roof, anchor rail at 70%
        var checkTopY = (GAME.playMode === "RUN" && pl.onTrainRoof) ? (pl.y + pl.h) : plCy;
        if (checkTopY < baseCamY + topBandWorldH) {
          targetY = checkTopY - topBandWorldH;
        } else if (plCy > baseCamY + botBandWorldH) {
          targetY = plCy - botBandWorldH;
        } else {
          targetY = baseCamY;
        }

        var maxCamX = Math.max(0, GAME.worldWidth - viewW);
        var maxCamY = Math.max(0, GAME.worldHeight - viewH);
        var minCamX = 0;
        if (GAME.playMode === "RUN" && GAME.runState.activeSegments.length > 0) {
          minCamX = GAME.runState.activeSegments[0].startX;
        }

        if (targetX < minCamX) targetX = minCamX;
        if (targetX > maxCamX) targetX = maxCamX;
        if (targetY < 0) targetY = 0;
        if (targetY > maxCamY) targetY = maxCamY;

        GAME.camera.x += (targetX - GAME.camera.x) * CFG.cameraLerp;
        GAME.camera.y += (targetY - GAME.camera.y) * CFG.cameraLerp;

        if (GAME.camera.x < minCamX) GAME.camera.x = minCamX;
        if (GAME.camera.x > maxCamX) GAME.camera.x = maxCamX;
        if (GAME.camera.y < 0) GAME.camera.y = 0;
        if (GAME.camera.y > maxCamY) GAME.camera.y = maxCamY;
      }

      function updateParticles(dt) {
        var active = 0;
        var i;
        for (i = 0; i < CFG.maxParticles; i++) {
          var p = GAME.particles[i];
          if (p.active) {
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.vy += 180 * dt;
            p.life -= dt;
            if (p.life <= 0) {
              p.active = false;
            } else {
              active++;
            }
          }
        }
        GAME.activeParticleCount = active;
      }

      /* =====================================================================
       * RENDER
       * ===================================================================== */
      // Reusable camera shake helper in RENDER section (Step B2 & Step B15 Requirement 2)
      function shake(intensity, duration) {
        RENDER.shake(intensity, duration);
      }

      var RENDER = {
        canvas: null,
        ctx: null,

        // BB-R7 fix (extra, found while testing): the HUD, Foundry and title menus call these two helpers
        // 70+ times but they were never defined, so every menu draw threw "fillRoundRect is not a function".
        fillRoundRect: function (ctx, x, y, w, h, r) {
          var rad = Math.max(0, Math.min(r || 0, w * 0.5, h * 0.5));
          ctx.beginPath();
          ctx.moveTo(x + rad, y);
          ctx.arcTo(x + w, y, x + w, y + h, rad);
          ctx.arcTo(x + w, y + h, x, y + h, rad);
          ctx.arcTo(x, y + h, x, y, rad);
          ctx.arcTo(x, y, x + w, y, rad);
          ctx.closePath();
          ctx.fill();
        },
        strokeRoundRect: function (ctx, x, y, w, h, r) {
          var rad = Math.max(0, Math.min(r || 0, w * 0.5, h * 0.5));
          ctx.beginPath();
          ctx.moveTo(x + rad, y);
          ctx.arcTo(x + w, y, x + w, y + h, rad);
          ctx.arcTo(x + w, y + h, x, y + h, rad);
          ctx.arcTo(x, y + h, x, y, rad);
          ctx.arcTo(x, y, x + w, y, rad);
          ctx.closePath();
          ctx.stroke();
        },
        zoneSkyGrads: [],
        zoneEmberGrads: [],
        biomeSkyGrads: {},
        biomeEmberGrads: {},

        // Step B15 Requirement 2: shake(intensity, duration) with decay, capped at 10 px,
        // applied only to the camera, and respects Reduce shake setting
        shake: function (intensity, duration) {
          if (GAME.settings && GAME.settings.reduceShake) {
            GAME.shakeTimer = 0;
            GAME.shakeIntensity = 0;
            return;
          }
          var rawInt = typeof intensity === "number" ? intensity : CFG.parryShakeIntensity;
          var cappedInt = Math.max(0, Math.min(CFG.maxShakePx || 10, rawInt));
          var dur = typeof duration === "number" && duration > 0 ? duration : CFG.parryShakeDuration;
          // If a stronger shake is already active, preserve the stronger current magnitude
          if (GAME.shakeTimer > 0 && GAME.shakeDuration > 0) {
            var curRemMag = GAME.shakeIntensity * (GAME.shakeTimer / GAME.shakeDuration);
            if (curRemMag > cappedInt) {
              cappedInt = Math.min(CFG.maxShakePx || 10, curRemMag);
            }
          }
          GAME.shakeIntensity = cappedInt;
          GAME.shakeDuration = dur;
          GAME.shakeTimer = dur;
        },

        buildGradients: function () {
          var ctx = RENDER.ctx;
          if (!ctx) return;
          var zones = DATA_TABLES.zones;
          RENDER.zoneSkyGrads = [];
          RENDER.zoneEmberGrads = [];
          RENDER.biomeSkyGrads = {};
          RENDER.biomeEmberGrads = {};

          var i;
          for (i = 0; i < zones.length; i++) {
            var z = zones[i];
            var sg = ctx.createLinearGradient(0, 0, 0, CFG.logicalHeight);
            sg.addColorStop(0, z.skyTop);
            sg.addColorStop(0.55, z.skyMid);
            sg.addColorStop(1, z.skyBot);
            RENDER.zoneSkyGrads.push(sg);

            var eg = ctx.createRadialGradient(
              CFG.logicalWidth * 0.5,
              CFG.logicalHeight * 0.92,
              20,
              CFG.logicalWidth * 0.5,
              CFG.logicalHeight * 0.92,
              460
            );
            eg.addColorStop(0, z.glowRgba);
            eg.addColorStop(1, "rgba(0, 0, 0, 0)");
            RENDER.zoneEmberGrads.push(eg);
          }

          var biomeOrder = DATA_TABLES.biomeOrder;
          for (i = 0; i < biomeOrder.length; i++) {
            var bKey = biomeOrder[i];
            var bm = DATA_TABLES.biomes[bKey];
            var bsg = ctx.createLinearGradient(0, 0, 0, CFG.logicalHeight);
            bsg.addColorStop(0, bm.skyTop);
            bsg.addColorStop(0.55, bm.skyMid);
            bsg.addColorStop(1, bm.skyBot);
            RENDER.biomeSkyGrads[bKey] = bsg;

            var beg = ctx.createRadialGradient(
              CFG.logicalWidth * 0.5,
              CFG.logicalHeight * 0.92,
              20,
              CFG.logicalWidth * 0.5,
              CFG.logicalHeight * 0.92,
              480
            );
            beg.addColorStop(0, bm.glowRgba);
            beg.addColorStop(1, "rgba(0, 0, 0, 0)");
            RENDER.biomeEmberGrads[bKey] = beg;
          }
        },

        init: function () {
          RENDER.canvas = document.getElementById("game-canvas");
          RENDER.ctx = RENDER.canvas.getContext("2d");

          RENDER.resize();
          RENDER.buildGradients();

          window.addEventListener("resize", RENDER.resize);
          window.addEventListener("orientationchange", function () {
            setTimeout(RENDER.resize, 80);
          });
          // Step R1 Requirement 1: Handle window.visualViewport when it exists
          if (window.visualViewport) {
            window.visualViewport.addEventListener("resize", RENDER.resize);
            window.visualViewport.addEventListener("scroll", RENDER.resize);
          }
        },

        resize: function () {
          if (!RENDER.canvas) return;
          var vp = window.visualViewport;
          var winW = Math.max(1, Math.round(vp ? vp.width : window.innerWidth));
          var winH = Math.max(1, Math.round(vp ? vp.height : window.innerHeight));

          // Addendum Rule 1: Landscape only — in portrait show ROTATE YOUR PHONE and pause the game
          var isPortrait = winH > winW;
          GAME.isPortrait = isPortrait;
          var rotOverlay = document.getElementById("rotate-overlay");
          if (rotOverlay) {
            rotOverlay.classList.toggle("visible", isPortrait);
          }

          // Addendum Rule 1 + Step R1 Req 1: Logical height is always 540; logical width follows screen shape
          // (width = 540 x window width / window height, limited to 720 through 1300). No letterbox bars.
          CFG.logicalHeight = 540;
          var rawLogicalW = Math.round(540 * (winW / Math.max(1, winH)));
          CFG.logicalWidth = Math.max(720, Math.min(1300, rawLogicalW));

          var dpr = Math.min(window.devicePixelRatio || 1, CFG.maxDpr || 2);
          RENDER.canvas.width = Math.round(CFG.logicalWidth * dpr);
          RENDER.canvas.height = Math.round(CFG.logicalHeight * dpr);
          RENDER.canvas.style.width = winW + "px";
          RENDER.canvas.style.height = winH + "px";

          RENDER.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          RENDER.buildGradients();
        },

        drawAmbientParticles: function (ctx, curBiome) {
          var bm = curBiome || DATA_TABLES.biomes.rust;
          var ambType = bm.ambientType || "spores";
          var i;
          ctx.save();

          // Step R7 Requirement 3: Draw a few soft glow blobs floating in the cavern
          if (GAME.ambientGlowBlobs && GAME.ambientGlowBlobs.length > 0) {
            var blobCol = bm.ambientColorA || "#4EF2E8";
            for (i = 0; i < GAME.ambientGlowBlobs.length; i++) {
              var gb = GAME.ambientGlowBlobs[i];
              var gPulse = 0.06 + 0.05 * Math.sin(gb.phase * 1.4);
              ctx.globalAlpha = gPulse;
              ctx.fillStyle = blobCol;
              ctx.beginPath();
              ctx.arc(Math.round(gb.x), Math.round(gb.y), gb.r, 0, Math.PI * 2);
              ctx.fill();
              ctx.globalAlpha = gPulse * 1.5;
              ctx.beginPath();
              ctx.arc(Math.round(gb.x), Math.round(gb.y), gb.r * 0.48, 0, Math.PI * 2);
              ctx.fill();
            }
          }

          // Step R7 Requirement 3 & 10: Up to 60 floating cyan spores (total particles strictly < 150)
          if (GAME.ambientParticles && GAME.ambientParticles.length > 0) {
            var cap = GAME.settings && GAME.settings.reduceParticles
              ? Math.floor(CFG.maxAmbientParticles * 0.45)
              : CFG.maxAmbientParticles;
            for (i = 0; i < Math.min(cap, GAME.ambientParticles.length); i++) {
              var p = GAME.ambientParticles[i];
              var col = p.altColor ? bm.ambientColorB : bm.ambientColorA;
              var px = Math.round(p.x);
              var py = Math.round(p.y);
              var sz = Math.max(2, Math.round(p.size));
              if (ambType === "sparks") {
                ctx.globalAlpha = 0.55 + 0.35 * Math.sin(p.phase * 3.0);
                ctx.fillStyle = col;
                ctx.fillRect(px - 1, py - sz, 3, sz * 2);
              } else {
                var pulse = 0.42 + 0.48 * (0.5 + 0.5 * Math.sin(p.phase * 2.0));
                ctx.globalAlpha = pulse * 0.32;
                ctx.fillStyle = col;
                ctx.fillRect(px - sz, py - sz, sz * 2 + 2, sz * 2 + 2);
                ctx.globalAlpha = pulse;
                ctx.fillStyle = "#E6FBFF";
                ctx.fillRect(px, py, sz, sz);
              }
            }
          }
          ctx.restore();
        },

        // Step R7 Requirement 4: Draw non-colliding cavern props (wooden crates 1..3, blue glowing crate,
        // bent pipes with flanges, hanging yellow lamps with glow, mushroom clusters in 3 sizes, crystals, barrels, warning signs)
        drawProps: function (ctx, camX, camY, viewW, viewH) {
          var pulse = 0.78 + Math.sin(GAME.time * 4.5) * 0.22;
          var i, sIdx;
          if (GAME.playMode === "RUN") {
            var activeSegs = GAME.runState.activeSegments;
            for (sIdx = 0; sIdx < activeSegs.length; sIdx++) {
              var seg = activeSegs[sIdx];
              var sx = seg.startX - camX;
              var sy = 20 * CFG.tileSize - camY;
              if (sx + 960 < -48 || sx > viewW + 48) continue;
              var segProps = WORLD.runSegmentProps ? WORLD.runSegmentProps[seg.templateIdx] : null;
              if (!segProps) continue;
              for (i = 0; i < segProps.length; i++) {
                var pr = segProps[i];
                var pDef = pr.def;
                if (!pDef) continue;
                var px = Math.round(sx + pr.relX);
                var py = Math.round(sy + pr.relY);
                var pw = pDef.artW * 2;
                var ph = pDef.artH * 2;
                if (px + pw < -24 || px > viewW + 24) continue;
                if (pDef.glowCol) {
                  ctx.save();
                  ctx.fillStyle = pDef.glowCol;
                  ctx.globalAlpha = pulse;
                  ctx.beginPath();
                  ctx.arc(px + pw * 0.5, py + ph * 0.5, (pDef.glowR || 24), 0, Math.PI * 2);
                  ctx.fill();
                  ctx.restore();
                }
                drawSprite(ctx, pDef.sprite, 0, px, py, false, 2);
                if (GAME.showPropBoxesDebug) {
                  ctx.save();
                  ctx.strokeStyle = "#4CF5C8";
                  ctx.lineWidth = 1.5;
                  ctx.setLineDash([3, 2]);
                  ctx.strokeRect(px, py, pw, ph);
                  ctx.setLineDash([]);
                  ctx.fillStyle = "#4CF5C8";
                  ctx.font = "bold 8px monospace";
                  ctx.fillText(pr.id, px, py - 3);
                  ctx.restore();
                }
              }
            }
          } else {
            var sbProps = WORLD.sandboxProps || [];
            for (i = 0; i < sbProps.length; i++) {
              var sp = sbProps[i];
              var sDef = sp.def;
              if (!sDef) continue;
              var spx = Math.round(sp.x - camX);
              var spy = Math.round(sp.y - camY);
              var spw = sDef.artW * 2;
              var sph = sDef.artH * 2;
              if (spx + spw < -24 || spx > viewW + 24 || spy + sph < -24 || spy > viewH + 24) continue;
              if (sDef.glowCol) {
                ctx.save();
                ctx.fillStyle = sDef.glowCol;
                ctx.globalAlpha = pulse;
                ctx.beginPath();
                ctx.arc(spx + spw * 0.5, spy + sph * 0.5, (sDef.glowR || 24), 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
              }
              drawSprite(ctx, sDef.sprite, 0, spx, spy, false, 2);
              if (GAME.showPropBoxesDebug) {
                ctx.save();
                ctx.strokeStyle = "#4CF5C8";
                ctx.lineWidth = 1.5;
                ctx.setLineDash([3, 2]);
                ctx.strokeRect(spx, spy, spw, sph);
                ctx.setLineDash([]);
                ctx.fillStyle = "#4CF5C8";
                ctx.font = "bold 8px monospace";
                ctx.fillText(sp.id, spx, spy - 3);
                ctx.restore();
              }
            }
          }
        },

        drawWorld: function (ctx) {
          // Step B15 Requirement 2: Camera shake with decay, capped at 10 px, applied ONLY to the camera
          var shakeX = 0;
          var shakeY = 0;
          if (
            !(GAME.settings && GAME.settings.reduceShake) &&
            GAME.shakeTimer > 0 &&
            GAME.shakeDuration > 0
          ) {
            var decay = Math.max(0, Math.min(1, GAME.shakeTimer / GAME.shakeDuration));
            var mag = Math.min(CFG.maxShakePx || 10, GAME.shakeIntensity) * decay;
            shakeX = Math.max(-10, Math.min(10, Math.round((Math.random() * 2 - 1) * mag)));
            shakeY = Math.max(-10, Math.min(10, Math.round((Math.random() * 2 - 1) * mag)));
          }
          var zoom = getEffectiveZoom();
          var viewW = CFG.logicalWidth / zoom;
          var viewH = CFG.logicalHeight / zoom;
          var camX = Math.floor(GAME.camera.x) - shakeX;
          var camY = Math.floor(GAME.camera.y) - shakeY;
          var centerCol = Math.floor((camX + viewW * 0.5) / CFG.tileSize);
          var curZone = WORLD.getZoneForCol(centerCol);
          var curBiome = WORLD.getBiomeForCol(centerCol);
          var bKey = curBiome ? curBiome.id : "rust";

          // 1. Biome-tinted cave sky & glow (full logical screen)
          ctx.fillStyle = RENDER.biomeSkyGrads[bKey] || RENDER.zoneSkyGrads[curZone.id - 1];
          ctx.fillRect(0, 0, CFG.logicalWidth, CFG.logicalHeight);
          ctx.fillStyle = RENDER.biomeEmberGrads[bKey] || RENDER.zoneEmberGrads[curZone.id - 1];
          ctx.fillRect(0, 0, CFG.logicalWidth, CFG.logicalHeight);

          // 2. Step R7 Requirement 3 & 10: 3 Background Parallax Layers (far 0.2x, middle 0.45x, near 0.7x) tiled across full logicalWidth
          var bp = WORLD.biomeParallax[bKey] || WORLD.zoneParallax[curZone.id - 1];
          var lw = CFG.logicalWidth;
          if (bp && bp.farCanvas) {
            var tileW = bp.farCanvas.width || 960;
            var tx;
            if (GAME.layer1Visible !== false) {
              var farShift = -(((camX * 0.2) % tileW + tileW) % tileW);
              for (tx = farShift; tx < lw; tx += tileW) {
                ctx.drawImage(bp.farCanvas, tx, 0);
              }
            }
            if (GAME.layer2Visible !== false && bp.midCanvas) {
              var midShift = -(((camX * 0.45) % tileW + tileW) % tileW);
              for (tx = midShift; tx < lw; tx += tileW) {
                ctx.drawImage(bp.midCanvas, tx, 0);
              }
            }
            if (GAME.layer3Visible !== false && bp.nearCanvas) {
              var nearShift = -(((camX * 0.7) % tileW + tileW) % tileW);
              for (tx = nearShift; tx < lw; tx += tileW) {
                ctx.drawImage(bp.nearCanvas, tx, 0);
              }
            }
          }

          // Step R1 Requirement 2: Draw the world scaled by CFG.zoom around the camera
          ctx.save();
          ctx.scale(zoom, zoom);

          // 3. Pre-rendered Tile Chunks (Sandbox) or Repeating Track Segments + The Bastion (Run Mode)
          if (GAME.playMode === "RUN") {
            // Ensure no empty dark gap above row 20 in Run mode when camera looks high
            var ceilTopY = 20 * CFG.tileSize - camY;
            if (ceilTopY > 0) {
              ctx.fillStyle = "#1E1924";
              ctx.fillRect(0, 0, viewW + 4, ceilTopY + 2);
              var tsFill = CFG.tileSize;
              var startFillCol = Math.floor(camX / tsFill);
              var endFillCol = Math.ceil((camX + viewW) / tsFill);
              var fc, fr;
              for (fr = Math.max(0, Math.floor(camY / tsFill)); fr < 20; fr++) {
                var fry = fr * tsFill - camY;
                for (fc = startFillCol; fc <= endFillCol; fc++) {
                  var fcx = fc * tsFill - camX;
                  var rSpr = SPRITES["tile_rock_" + (((fc * 3 + fr * 5) % 3 + 3) % 3)];
                  if (rSpr && rSpr[0]) {
                    ctx.drawImage(rSpr[0], fcx, fry, tsFill, tsFill);
                  }
                }
              }
            }

            var activeSegs = GAME.runState.activeSegments;
            var visSegs = 0;
            var sIdx;
            for (sIdx = 0; sIdx < activeSegs.length; sIdx++) {
              var seg = activeSegs[sIdx];
              var sx = seg.startX - camX;
              var sy = 20 * CFG.tileSize - camY;
              if (sx + 960 < -32 || sx > viewW + 32) continue;
              var segCvs = WORLD.runSegmentCanvases[seg.templateIdx];
              if (segCvs) {
                ctx.drawImage(segCvs, sx, sy);
                visSegs++;
              }
            }
            GAME.visibleChunkCount = visSegs;

            // Step R7 Requirement 4: Non-colliding props on Run track segments
            RENDER.drawProps(ctx, camX, camY, viewW, viewH);

            // Draw glowing Ore nodes embedded in track walls and ceiling (Step B7 & R7)
            RENDER.drawOreNodes(ctx, camX, camY);

            // Draw The Bastion drill-train
            RENDER.drawBastion(ctx, camX, camY);

            // Draw thin speed streaks scaling with current Throttle notch (Step B7 Requirement 5)
            RENDER.drawSpeedStreaks(ctx);
          } else {
            var chunkPixelW = CFG.chunkCols * CFG.tileSize;
            var chunkPixelH = CFG.chunkRows * CFG.tileSize;
            var startChunkX = Math.max(0, Math.floor(camX / chunkPixelW));
            var endChunkX = Math.min(Math.ceil(CFG.mapCols / CFG.chunkCols) - 1, Math.floor((camX + viewW) / chunkPixelW));
            var startChunkY = Math.max(0, Math.floor(camY / chunkPixelH));
            var endChunkY = Math.min(Math.ceil(CFG.mapRows / CFG.chunkRows) - 1, Math.floor((camY + viewH) / chunkPixelH));

            var visChunks = 0;
            var cy, cx;
            for (cy = startChunkY; cy <= endChunkY; cy++) {
              for (cx = startChunkX; cx <= endChunkX; cx++) {
                var chunkCvs = WORLD.getChunkCanvas(cx, cy);
                ctx.drawImage(chunkCvs, cx * chunkPixelW - camX, cy * chunkPixelH - camY);
                visChunks++;
              }
            }
            GAME.visibleChunkCount = visChunks;

            // Step R7 Requirement 4: Non-colliding props in Sandbox sections
            RENDER.drawProps(ctx, camX, camY, viewW, viewH);

            // 4. Checkpoint Flags ('!')
            RENDER.drawCheckpoints(ctx, camX, camY);

            // 5. Training Dummies & Chief Engineer Mara (Sandbox start)
            RENDER.drawDummies(ctx, camX, camY);
            RENDER.drawMaraAndWorkbench(ctx, camX, camY, "SANDBOX");
          }

          // 6. Enemies, Detached Armor Pieces, Material Pickups & Enemy Health Bars / Armor Pips
          RENDER.drawEnemies(ctx, camX, camY);
          RENDER.drawArmorPieces(ctx, camX, camY);
          RENDER.drawPickups(ctx, camX, camY);

          // 6b. Step R4: Active Tripwire spike posts & wire, active Harpoon cyan link chain, and Hook Range debug overlay (no Leash cable)
          if (GAME.mode !== "DEFEAT" && !(GAME.playMode === "RUN" && GAME.runState.rebuildTimer > 0)) {
            RENDER.drawKineticTether(ctx, camX, camY);
          }

          // 7. Vanguard-07 Player (also drawn in DEFEAT for 3-frame hero_defeat sequence)
          if (!(GAME.playMode === "RUN" && GAME.runState.rebuildTimer > 0)) {
            RENDER.drawPlayer(ctx, camX, camY);
          }
