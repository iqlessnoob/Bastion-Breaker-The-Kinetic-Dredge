        pl.tripwireCooldownMax = CFG.tripwireCooldownFull;
        pl.harpoonCooldownTimer = 0;
        pl.harpoonCooldownMax = CFG.harpoonCooldown;
        pl.bladeHarpoonMult = 1.0;
        pl.shield = CFG.tetherShieldMax;
        pl.maxShield = CFG.tetherShieldMax;
        pl.tetherDist = 0;
        pl.tetherInShieldRange = true;
        pl.shieldHitFlashTimer = 0;
        pl.shieldBreakFlashTimer = 0;
        pl.tetherRecalling = false;
        pl.returnFadeTimer = 0;
        pl.returnFadeMax = CFG.returnFadeDuration;
        pl.returnIsAutoOut = false;
        pl.tetherRecallCooldownTimer = 0;
        pl.tetherRecallCooldownMax = CFG.tetherRecallCooldown;
        if (GAME.runState && GAME.runState.tripwire) {
          GAME.runState.tripwire.active = false;
          GAME.runState.tripwire.timer = 0;
          GAME.runState.tripwire.tripFlashTimer = 0;
        }
        if (GAME.runState && GAME.runState.harpoon) {
          GAME.runState.harpoon.active = false;
          GAME.runState.harpoon.state = "IDLE";
          GAME.runState.harpoon.timer = 0;
          GAME.runState.harpoon.targetEnemy = null;
          GAME.runState.harpoon.targetZoneKey = null;
        }
        GAME.voltArcs = [];
        GAME.hitStopTimer = 0;
        GAME.shakeTimer = 0;
        recomputeStats(GAME.loadout);
        updateTetherButtonUI();
      }

      /* =====================================================================
       * STEP B13: MODULAR ENGINE-BLADE & FORGE (recomputeStats & Helpers)
       * ===================================================================== */
      function getPartDef(slotKey, partId) {
        var list = DATA_TABLES.parts[slotKey];
        if (!list) return null;
        var i;
        for (i = 0; i < list.length; i++) {
          if (list[i].id === partId) return list[i];
        }
        return list[0] || null;
      }

      function getPartTierDef(tierNum) {
        var clamped = Math.max(1, Math.min(4, Math.round(tierNum || 1)));
        return DATA_TABLES.partTiers[clamped - 1] || DATA_TABLES.partTiers[0];
      }

      function getDrillBitTierDef(tierNum) {
        var clamped = Math.max(1, Math.min(4, Math.round(tierNum || 1)));
        return DATA_TABLES.drillBitTiers[clamped - 1] || DATA_TABLES.drillBitTiers[0];
      }

      // Requirement 1: All final stats come from one function recomputeStats(loadout)
      // so changing any part or tier updates every number at once.
      function recomputeStats(loadout) {
        var lo = loadout || GAME.loadout;
        if (!lo) {
          lo = { edge: "cleaver", counterweight: "standard", core: "standard", coil: "standard" };
          GAME.loadout = lo;
        }

        // Sync part object .tier fields from GAME.partTiers
        var slotKeys = ["edge", "counterweight", "core", "coil"];
        var sIdx, pIdx;
        for (sIdx = 0; sIdx < slotKeys.length; sIdx++) {
          var sk = slotKeys[sIdx];
          var arr = DATA_TABLES.parts[sk] || [];
          for (pIdx = 0; pIdx < arr.length; pIdx++) {
            var pObj = arr[pIdx];
            if (GAME.partTiers && GAME.partTiers[sk] && GAME.partTiers[sk][pObj.id]) {
              pObj.tier = GAME.partTiers[sk][pObj.id];
            }
          }
        }

        var edgeDef = getPartDef("edge", lo.edge);
        var cwDef = getPartDef("counterweight", lo.counterweight);
        var coreDef = getPartDef("core", lo.core);
        var coilDef = getPartDef("coil", lo.coil);

        var edgeTier = (GAME.partTiers.edge && GAME.partTiers.edge[edgeDef.id]) || edgeDef.tier || 1;
        var cwTier = (GAME.partTiers.counterweight && GAME.partTiers.counterweight[cwDef.id]) || cwDef.tier || 1;
        var coreTier = (GAME.partTiers.core && GAME.partTiers.core[coreDef.id]) || coreDef.tier || 1;
        var coilTier = (GAME.partTiers.coil && GAME.partTiers.coil[coilDef.id]) || coilDef.tier || 1;
        var drillTier = GAME.drillBitTier || 1;

        var edgeTierDef = getPartTierDef(edgeTier);
        var cwTierDef = getPartTierDef(cwTier);
        var coreTierDef = getPartTierDef(coreTier);
        var coilTierDef = getPartTierDef(coilTier);
        var drillTierDef = getDrillBitTierDef(drillTier);

        var edgeMult = edgeTierDef.mult;
        var cwMult = cwTierDef.mult;
        var coreMult = coreTierDef.mult;
        var coilMult = coilTierDef.mult;

        // 1. Blade Edge stats (main stat scaled by tier: damage)
        var baseDamage = Math.round(edgeDef.stats.damage * edgeMult);
        var reach = edgeDef.stats.reach;
        var arcDeg = edgeDef.stats.arcDeg;
        var hitsPerPress = edgeDef.stats.hitsPerPress || 1;
        var isLineThrust = !!edgeDef.stats.isLineThrust;
        var isContinuousHold = !!edgeDef.stats.isContinuousHold;
        var moveSpeedMult = edgeDef.stats.moveSpeedMult || 0.60;

        // 2. Counterweight stats (attack speed, knockback, aerial hang-time)
        // Heavy scales knockback as its main stat; Light & Standard scale attack speed as their main stat
        var attackSpeedMult = cwDef.id === "heavy"
          ? Number((cwDef.stats.attackSpeedMult * (1 + (cwMult - 1) * 0.35)).toFixed(2))
          : Number((cwDef.stats.attackSpeedMult * cwMult).toFixed(2));
        var knockbackMult = cwDef.id === "heavy"
          ? Number((cwDef.stats.knockbackMult * cwMult).toFixed(2))
          : Number(cwDef.stats.knockbackMult.toFixed(2));
        var knockbackPx = Math.round(200 * knockbackMult);
        var aerialHangTime = cwDef.stats.aerialHangTime;

        var rawSwingTime = edgeDef.stats.swingTime || 0.28;
        var swingTime = Number((rawSwingTime / attackSpeedMult).toFixed(3));
        var windupTime = Number((swingTime * (0.08 / 0.28)).toFixed(3));
        var activeTime = Number((swingTime * (0.10 / 0.28)).toFixed(3));
        var recoveryTime = Number(Math.max(0.02, swingTime - windupTime - activeTime).toFixed(3));
        var buzzsawTickInterval = Number(((edgeDef.stats.tickInterval || 0.12) / attackSpeedMult).toFixed(3));
        var buzzsawHeatPerSec = edgeDef.stats.heatPerSec || 20;

        // 3. Motor Core stats (Thermal Gauge capacity in heat points, and Redline bonus)
        var heatCapacity = Math.round(coreDef.stats.heatCapacity * coreMult);
        var heatScale = 100 / Math.max(1, heatCapacity);
        var redlineDamageMult = coreDef.stats.redlineDamageMult;
        var redlineType = coreDef.stats.redlineType;
        var burnDps = coreDef.stats.burnDps || 0;
        var chillSlowPct = coreDef.stats.chillSlowPct || 0;
        var voltArcRange = coreDef.stats.voltArcRange || 0;
        var voltArcDamagePct = coreDef.stats.voltArcDamagePct || 0;

        // 4. Tether Coil stats (Harpoon range, Tripwire duration, Harpoon pull speed)
        var tetherLength = Math.round(coilDef.stats.tetherLength * coilMult);
        var tripwireDuration = Number((coilDef.stats.tripwireDuration * coilMult).toFixed(1));
        var harpoonReelSpeed = Math.round(coilDef.stats.harpoonReelSpeed * coilMult);

        var stats = {
          edgeId: edgeDef.id,
          edgeName: edgeDef.name,
          edgeTier: edgeTier,
          edgeTierName: edgeTierDef.name,
          edgeTierMult: edgeMult,
          edgeColour: edgeDef.colour,
          baseDamage: baseDamage,
          reach: reach,
          arcDeg: arcDeg,
          hitsPerPress: hitsPerPress,
          isLineThrust: isLineThrust,
          isContinuousHold: isContinuousHold,
          buzzsawTickInterval: buzzsawTickInterval,
          buzzsawHeatPerSec: buzzsawHeatPerSec,
          moveSpeedMult: moveSpeedMult,

          counterweightId: cwDef.id,
          counterweightName: cwDef.name,
          counterweightTier: cwTier,
          counterweightTierName: cwTierDef.name,
          counterweightTierMult: cwMult,
          counterweightColour: cwDef.colour,
          attackSpeedMult: attackSpeedMult,
          knockbackMult: knockbackMult,
          knockbackPx: knockbackPx,
          aerialHangTime: aerialHangTime,
          swingTime: swingTime,
          windupTime: windupTime,
          activeTime: activeTime,
          recoveryTime: recoveryTime,

          coreId: coreDef.id,
          coreName: coreDef.name,
          coreTier: coreTier,
          coreTierName: coreTierDef.name,
          coreTierMult: coreMult,
          coreColor: coreDef.stats.coreColor,
          coreGlow: coreDef.stats.coreGlow,
          heatCapacity: heatCapacity,
          heatScale: heatScale,
          redlineDamageMult: redlineDamageMult,
          redlineBonusPct: Math.round((redlineDamageMult - 1) * 100),
          redlineType: redlineType,
          burnDps: burnDps,
          chillSlowPct: chillSlowPct,
          voltArcRange: voltArcRange,
          voltArcDamagePct: voltArcDamagePct,

          coilId: coilDef.id,
          coilName: coilDef.name,
          coilTier: coilTier,
          coilTierName: coilTierDef.name,
          coilTierMult: coilMult,
          coilColor: coilDef.stats.coilColor,
          tetherLength: tetherLength,
          tripwireDuration: tripwireDuration,
          harpoonReelSpeed: harpoonReelSpeed,

          drillBitTier: drillTier,
          drillBitTierName: drillTierDef.name,
          drillOreYieldMult: drillTierDef.oreYieldMult,
          drillEnemyDps: drillTierDef.drillEnemyDps,
          drillColour: drillTierDef.colour
        };

        // BB-R7 fix: every stat shown in the menus always exists (default 0) so a missing stat can never crash a readout.
        // Hook range is stored as tetherLength (old cable length); hookRange is kept as the same value.
        stats.hookRange = stats.tetherLength;
        var requiredStatKeys = [
          "baseDamage", "reach", "arcDeg", "edgeTier",
          "attackSpeedMult", "knockbackMult", "counterweightTier",
          "heatCapacity", "redlineDamageMult", "redlineBonusPct", "coreTier",
          "tetherLength", "hookRange", "tripwireDuration", "harpoonReelSpeed", "coilTier",
          "drillBitTier", "drillOreYieldMult", "drillEnemyDps"
        ];
        var rkI;
        for (rkI = 0; rkI < requiredStatKeys.length; rkI++) {
          var rk = requiredStatKeys[rkI];
          if (typeof stats[rk] !== "number" || !isFinite(stats[rk])) {
            stats[rk] = 0;
          }
        }

        GAME.bladeStats = stats;

        // Sync CFG live combat & tool parameters so all existing systems use the recomputed stats immediately
        CFG.bladeDamage = stats.baseDamage;
        CFG.bladeReach = stats.reach;
        CFG.bladeArcDeg = stats.arcDeg;
        CFG.bladeTotalTime = stats.swingTime;
        CFG.bladeWindupTime = stats.windupTime;
        CFG.bladeActiveTime = stats.activeTime;
        CFG.bladeRecoveryTime = stats.recoveryTime;
        CFG.bladeKnockback = stats.knockbackPx;
        CFG.bladeGroundSpeedMult = stats.moveSpeedMult;
        CFG.redlineDamageMult = stats.redlineDamageMult;
        CFG.burnDps = stats.burnDps > 0 ? stats.burnDps : 5;
        CFG.tetherLength = stats.tetherLength;
        CFG.harpoonRange = stats.tetherLength;
        CFG.tripwireDuration = GAME.tripwireLongDurationDebug ? 20.0 : stats.tripwireDuration;
        CFG.harpoonReelSpeed = stats.harpoonReelSpeed;

        if (GAME.player) {
          GAME.player.heatCapacity = stats.heatCapacity;
          GAME.player.heatPoints = Math.round((GAME.player.heat / 100) * stats.heatCapacity);
        }

        var lenBtn = document.getElementById("dbg-tether-len");
        if (lenBtn) {
          lenBtn.textContent = "Set tether length: " + CFG.tetherLength;
        }

        return stats;
      }

      function addPlayerHeatPoints(pl, rawHeatPoints) {
        var stats = GAME.bladeStats || recomputeStats(GAME.loadout);
        var scaledDelta = rawHeatPoints * stats.heatScale;
        pl.heat = Math.min(CFG.heatMax, pl.heat + scaledDelta);
        pl.heatPoints = Math.round((pl.heat / 100) * stats.heatCapacity);
      }

      function canAffordCostObj(cost) {
        if (!cost) return true;
        if (GAME.partsUnlockedAllDebug) return true;
        if (cost.ore && GAME.ore < cost.ore) return false;
        if (cost.materials) {
          var mKey;
          for (mKey in cost.materials) {
            if (Object.prototype.hasOwnProperty.call(cost.materials, mKey)) {
              var need = cost.materials[mKey];
              if ((GAME.inventory[mKey] || 0) < need) return false;
            }
          }
        }
        return true;
      }

      function spendCostObj(cost) {
        if (!cost || GAME.partsUnlockedAllDebug) return;
        if (cost.ore) {
          GAME.ore = Math.max(0, GAME.ore - cost.ore);
        }
        if (cost.materials) {
          var mKey;
          for (mKey in cost.materials) {
            if (Object.prototype.hasOwnProperty.call(cost.materials, mKey)) {
              var need = cost.materials[mKey];
              GAME.inventory[mKey] = Math.max(0, (GAME.inventory[mKey] || 0) - need);
            }
          }
        }
      }

      function buyOrEquipPart(slotKey, partId) {
        var pDef = getPartDef(slotKey, partId);
        if (!pDef) return false;
        var isOwned = !!(GAME.ownedParts[slotKey] && GAME.ownedParts[slotKey][partId]);
        if (!isOwned) {
          if (!canAffordCostObj(pDef.cost)) {
            GAME.foundryStatusMsg = "Need " + pDef.costText + " to unlock " + pDef.name + ".";
            AUDIO.playBeep(210, 0.06, "sawtooth", 0.06);
            return false;
          }
          spendCostObj(pDef.cost);
          GAME.ownedParts[slotKey][partId] = true;
        }
        GAME.loadout[slotKey] = partId;
        GAME.player.buzzsawActive = false;
        GAME.player.bladeComboPending = 0;
        recomputeStats(GAME.loadout);
        GAME.foundryStatusMsg = (isOwned ? "Equipped " : "Purchased & Equipped ") + pDef.name + " [" + slotKey.toUpperCase() + "]!";
        AUDIO.playWagonBuild();
        updateDebugPanelUI();
        return true;
      }

      function upgradePartTier(slotKey, partId) {
        var pDef = getPartDef(slotKey, partId);
        if (!pDef) return false;
        var isOwned = !!(GAME.ownedParts[slotKey] && GAME.ownedParts[slotKey][partId]);
        if (!isOwned) {
          GAME.foundryStatusMsg = "Buy/Unlock " + pDef.name + " first before upgrading its tier.";
          AUDIO.playBeep(210, 0.06, "sawtooth", 0.06);
          return false;
        }
        var curTier = (GAME.partTiers[slotKey] && GAME.partTiers[slotKey][partId]) || 1;
        if (curTier >= 4) {
          GAME.foundryStatusMsg = pDef.name + " is already at Max Tier 4 (Mythril-Alloy x1.7).";
          return false;
        }
        var nextTierDef = getPartTierDef(curTier + 1);
        if (!canAffordCostObj(nextTierDef.cost)) {
          GAME.foundryStatusMsg = "Need " + nextTierDef.costText + " for Tier " + nextTierDef.tier + " (" + nextTierDef.name + ").";
          AUDIO.playBeep(210, 0.06, "sawtooth", 0.06);
          return false;
        }
        spendCostObj(nextTierDef.cost);
        GAME.partTiers[slotKey][partId] = curTier + 1;
        pDef.tier = curTier + 1;
        recomputeStats(GAME.loadout);
        GAME.foundryStatusMsg = "Upgraded " + pDef.name + " to Tier " + (curTier + 1) + " (" + nextTierDef.name + " x" + nextTierDef.mult + ")!";
        AUDIO.playWagonBuild();
        updateDebugPanelUI();
        return true;
      }

      function upgradeDrillBitTier() {
        var curTier = GAME.drillBitTier || 1;
        if (curTier >= 4) {
          GAME.foundryStatusMsg = "Train Drill Bit is already at Max Tier 4 (Mythril-Alloy x1.7).";
          return false;
        }
        var nextDef = getDrillBitTierDef(curTier + 1);
        if (!canAffordCostObj(nextDef.cost)) {
          GAME.foundryStatusMsg = "Need " + nextDef.costText + " to upgrade Drill Bit to Tier " + nextDef.tier + ".";
          AUDIO.playBeep(210, 0.06, "sawtooth", 0.06);
          return false;
        }
        spendCostObj(nextDef.cost);
        GAME.drillBitTier = curTier + 1;
        recomputeStats(GAME.loadout);
        GAME.foundryStatusMsg = "Upgraded Train Drill Bit to Tier " + GAME.drillBitTier + " (" + nextDef.name + ": Ore x" + nextDef.oreYieldMult + ", " + nextDef.drillEnemyDps + " Enemy DPS)!";
        AUDIO.playWagonBuild();
        updateDebugPanelUI();
        return true;
      }

      function unlockAllPartsDebug(btnEl) {
        var slotKeys = ["edge", "counterweight", "core", "coil"];
        var sIdx, pIdx;
        for (sIdx = 0; sIdx < slotKeys.length; sIdx++) {
          var sk = slotKeys[sIdx];
          var arr = DATA_TABLES.parts[sk] || [];
          for (pIdx = 0; pIdx < arr.length; pIdx++) {
            GAME.ownedParts[sk][arr[pIdx].id] = true;
          }
        }
        GAME.partsUnlockedAllDebug = true;
        recomputeStats(GAME.loadout);
        GAME.foundryStatusMsg = "DEBUG: Unlocked all 14 Engine-Blade parts!";

        if (btnEl) btnEl.classList.add("active");
        AUDIO.playWagonBuild();
      }

      function maxAllTiersDebug(btnEl) {
        var slotKeys = ["edge", "counterweight", "core", "coil"];
        var sIdx, pIdx;
        for (sIdx = 0; sIdx < slotKeys.length; sIdx++) {
          var sk = slotKeys[sIdx];
          var arr = DATA_TABLES.parts[sk] || [];
          for (pIdx = 0; pIdx < arr.length; pIdx++) {
            var pid = arr[pIdx].id;
            GAME.ownedParts[sk][pid] = true;
            GAME.partTiers[sk][pid] = 4;
            arr[pIdx].tier = 4;
          }
        }

        spawnDmgNumber(GAME.player.x + GAME.player.w * 0.5, GAME.player.y - 18, "ALL TIERS MAXED (T4 x1.7)", "#ffd166");
        if (btnEl) btnEl.classList.add("active");

      function resetLoadoutDebug() {
        GAME.loadout = {
          edge: "cleaver",
          counterweight: "standard",
          core: "standard",
          coil: "standard"
        };
        GAME.ownedParts = {

        };

        };

      }

      function handleFoundryForgeTabClick(px, py) {
        var i;
        // 1. Check 4 Weapon Slot Cards at top of Forge tab
        if (GAME.forgeSlotRects) {
          for (i = 0; i < GAME.forgeSlotRects.length; i++) {
            var sr = GAME.forgeSlotRects[i];
            if (sr && px >= sr.x && px <= sr.x + sr.w && py >= sr.y && py <= sr.y + sr.h) {
              GAME.selectedForgeSlot = sr.slotKey;
              GAME.foundryStatusMsg = "Viewing " + sr.label + " parts.";
              AUDIO.playLedgerToggle();
              return;
            }
          }
        }

        // 2. Check Train Drill Bit Upgrade Button
        var drRect = GAME.forgeDrillUpgradeRect;
        if (drRect && px >= drRect.x && px <= drRect.x + drRect.w && py >= drRect.y && py <= drRect.y + drRect.h) {
          upgradeDrillBitTier();
          return;
        }

        // 3. Check Part Row Equip/Buy & Tier Upgrade buttons
        if (GAME.forgePartActionRects) {
          for (i = 0; i < GAME.forgePartActionRects.length; i++) {
            var ar = GAME.forgePartActionRects[i];
            if (!ar) continue;
            if (ar.equipRect && px >= ar.equipRect.x && px <= ar.equipRect.x + ar.equipRect.w && py >= ar.equipRect.y && py <= ar.equipRect.y + ar.equipRect.h) {
              buyOrEquipPart(ar.slotKey, ar.partId);
              return;
            }
            if (ar.upgradeRect && px >= ar.upgradeRect.x && px <= ar.upgradeRect.x + ar.upgradeRect.w && py >= ar.upgradeRect.y && py <= ar.upgradeRect.y + ar.upgradeRect.h) {
              upgradePartTier(ar.slotKey, ar.partId);
              return;
            }
            if (ar.rowRect && px >= ar.rowRect.x && px <= ar.rowRect.x + ar.rowRect.w && py >= ar.rowRect.y && py <= ar.rowRect.y + ar.rowRect.h) {
              var owned = !!(GAME.ownedParts[ar.slotKey] && GAME.ownedParts[ar.slotKey][ar.partId]);
              if (owned) {
                buyOrEquipPart(ar.slotKey, ar.partId);
              }
              return;
            }
          }
        }
      }

      function getWagonDef(wagonId) {
        if (!wagonId) return null;
        var list = DATA_TABLES.wagons;
        var i;
        for (i = 0; i < list.length; i++) {
          if (list[i].id === wagonId) return list[i];
        }
        return null;
      }

      function createDefaultDroneState(index) {
        return {
          id: index,
          initialized: false,
          x: 0,
          y: 0,
          vx: 0,
          vy: 0,
          bobPhase: index * Math.PI,
          state: "ORBIT", // "ORBIT" | "SEEK_PICKUP" | "SEEK_ORE" | "RETURN"
          targetPickup: null,
          targetOre: null,
          cargoType: null, // "material" | "ore" | null
          cargoKey: null,
          cargoUnits: 0,
          cargoPristine: false
        };
      }

      function createDefaultWagonSlotState() {
        return {
          smeltTimer: 0,
          artilleryTimer: 0.8,
          barrelAngle: -0.25,
          recoilTimer: 0,
          cryoCycleTimer: 6.5,
          cryoActiveTimer: 0,
          domeHp: CFG.shieldPylonCapacity,
          domeMaxHp: CFG.shieldPylonCapacity,
          domeRechargeTimer: 0,
          domeHitFlashTimer: 0,
          drones: [createDefaultDroneState(0), createDefaultDroneState(1)],
          medPlayerHealing: false,
          medPlayerFloatTimer: 0,
          medHullFloatTimer: 0
        };
      }

      function countActiveWagons(wagonId) {
        if (GAME.playMode !== "RUN" || !GAME.bastion || !GAME.bastion.wagonSlots) return 0;
        var count = 0;
        var i;
        for (i = 0; i < CFG.wagonSlotCount; i++) {
          if (GAME.bastion.wagonSlots[i] === wagonId) {
            count++;
          }
        }
        return count;
      }

      function getEffectiveLeashShieldMax() {
        var plasmaCount = countActiveWagons("plasma_shield");
        return CFG.tetherShieldMax + plasmaCount * CFG.plasmaShieldBonus;
      }

      function getEffectiveHeatCoolRate() {
        var conduitCount = countActiveWagons("thermal_conduit");
        return CFG.heatCoolRate * (1 + conduitCount * CFG.thermalConduitCoolBonusPct);
      }

      function getEffectiveHullDamageMultiplier() {
        var plasmaCount = countActiveWagons("plasma_shield");
        if (plasmaCount <= 0) return 1.0;
        return Math.max(0.20, 1 - plasmaCount * CFG.plasmaHullDamageReduction);
      }

      function findAdjacencyComboForPair(wA, wB) {
        if (!wA || !wB) return null;
        var list = DATA_TABLES.adjacency;
        var i;
        for (i = 0; i < list.length; i++) {
          var c = list[i];
          var p0 = c.pair[0];
          var p1 = c.pair[1];
          if ((wA === p0 && wB === p1) || (wA === p1 && wB === p0)) {
            return c;
          }
        }
        return null;
      }

      function recomputeWagonCombos() {
        var b = GAME.bastion;
        b.activeCombos = [];
        b.slotCombos = [[], [], [], []];
        if (!b.wagonSlots) return;

        var i, cIdx;
        // Requirement 1: Two wagons are adjacent if they sit in neighbouring slots (1-2, 2-3, 3-4).
        // Order inside a pair does not matter.
        for (i = 0; i < CFG.wagonSlotCount - 1; i++) {
          var wA = b.wagonSlots[i];
          var wB = b.wagonSlots[i + 1];
          var match = findAdjacencyComboForPair(wA, wB);
          if (match) {
            b.activeCombos.push({
              slotA: i,
              slotB: i + 1,
              comboId: match.id,
              comboDef: match
            });
            if (b.slotCombos[i].indexOf(match.id) < 0) b.slotCombos[i].push(match.id);
            if (b.slotCombos[i + 1].indexOf(match.id) < 0) b.slotCombos[i + 1].push(match.id);
          }
        }

        // If debug "Force combos on" is enabled, grant every occupied wagon its corresponding combo effect
        if (GAME.forceCombosOn) {
          for (i = 0; i < CFG.wagonSlotCount; i++) {
            var wId = b.wagonSlots[i];
            if (!wId) continue;
            for (cIdx = 0; cIdx < DATA_TABLES.adjacency.length; cIdx++) {
              var cd = DATA_TABLES.adjacency[cIdx];
              if (cd.pair[0] === wId || cd.pair[1] === wId) {
                if (b.slotCombos[i].indexOf(cd.id) < 0) {
                  b.slotCombos[i].push(cd.id);
                }
              }
            }
          }
        }
      }

      function isSlotInCombo(slotIdx, comboId) {
        if (GAME.forceCombosOn) return true;
        var b = GAME.bastion;
        if (!b || !b.slotCombos || !b.slotCombos[slotIdx]) return false;
        return b.slotCombos[slotIdx].indexOf(comboId) >= 0;
      }

      function getAdjacentComboBetweenSlots(slotA, slotB) {
        if (slotA < 0 || slotB < 0 || Math.abs(slotA - slotB) !== 1) return null;
        var lo = Math.min(slotA, slotB);
        var hi = Math.max(slotA, slotB);
        var b = GAME.bastion;
        if (!b || !b.activeCombos) return null;
        var i;
        for (i = 0; i < b.activeCombos.length; i++) {
          var ac = b.activeCombos[i];
          if (ac.slotA === lo && ac.slotB === hi) {
            return ac.comboDef;
          }
        }
        if (GAME.forceCombosOn && b.wagonSlots && b.wagonSlots[lo] && b.wagonSlots[hi]) {
          // When Force combos on is active, highlight adjacent occupied slots with a combo arc
          var wLo = b.wagonSlots[lo];
          for (i = 0; i < DATA_TABLES.adjacency.length; i++) {
            var cd = DATA_TABLES.adjacency[i];
            if (cd.pair[0] === wLo || cd.pair[1] === wLo) return cd;
          }
          return DATA_TABLES.adjacency[0];
        }
        return null;
      }

      function getActiveCombosSummaryList() {
        var b = GAME.bastion;
        if (!b) return [];
        var list = [];
        var i;
        if (b.activeCombos && b.activeCombos.length > 0) {
          for (i = 0; i < b.activeCombos.length; i++) {
            var ac = b.activeCombos[i];
            list.push("Slots " + (ac.slotA + 1) + "-" + (ac.slotB + 1) + ": " + ac.comboDef.name);
          }
        }
        if (GAME.forceCombosOn && list.length === 0) {
          list.push("FORCED ON: All 3 Combos Active");
        }
        return list;
      }

      function syncActiveWagonPassives() {
        recomputeWagonCombos();
        var pl = GAME.player;
        var prevMax = pl.maxShield || CFG.tetherShieldMax;
        var nextMax = getEffectiveLeashShieldMax();
        pl.maxShield = nextMax;
        if (nextMax > prevMax) {
          pl.shield = Math.min(nextMax, pl.shield + (nextMax - prevMax));
        } else if (pl.shield > nextMax) {
          pl.shield = nextMax;
        }
      }

      function getActiveWagonEffectsSummary() {
        if (GAME.playMode !== "RUN" || !GAME.bastion || !GAME.bastion.wagonSlots) {
          return "None (Run Mode only)";
        }
        var counts = {};
        var order = [];
        var i;
        for (i = 0; i < CFG.wagonSlotCount; i++) {
          var wId = GAME.bastion.wagonSlots[i];
          if (wId) {
            if (!counts[wId]) {
              counts[wId] = 0;
              order.push(wId);
            }
            counts[wId]++;
          }
        }
        if (order.length === 0 && !GAME.forceCombosOn) {
          return "None (All 4 wagon slots are empty flatbeds)";
        }
        var parts = [];
        // First list active adjacency combos (Requirement 3: Active combos also appear in the status line)
        var b = GAME.bastion;
        if (b.activeCombos && b.activeCombos.length > 0) {
          var cNames = [];
          for (i = 0; i < b.activeCombos.length; i++) {
            var ac = b.activeCombos[i];
            cNames.push("[" + (ac.slotA + 1) + "-" + (ac.slotB + 1) + " " + ac.comboDef.shortName + "]");
          }
          parts.push("COMBOS: " + cNames.join(" "));
        } else if (GAME.forceCombosOn) {
          parts.push("COMBOS: [FORCED ON]");
        }

        for (i = 0; i < order.length; i++) {
          var id = order[i];
          var c = counts[id];
          var multStr = c > 1 ? (" x" + c) : "";
          if (id === "smelter") {
            parts.push("Smelter" + multStr);
          } else if (id === "artillery") {
            parts.push("Artillery" + multStr);
          } else if (id === "cryo_vent") {
            parts.push("Cryo-Vent" + multStr);
          } else if (id === "shield_pylon") {
            parts.push("Pylon" + multStr);
          } else if (id === "drone_bay") {
            parts.push("Drones x" + (2 * c));
          } else if (id === "med_station") {
            parts.push("Med" + multStr);
          } else if (id === "plasma_shield") {
            parts.push("Plasma" + multStr + " (+" + (50 * c) + " Shd, -" + Math.min(80, 20 * c) + "% Hull Dmg)");
          } else if (id === "thermal_conduit") {
            var coolRate = Math.round(CFG.heatCoolRate * (1 + 0.5 * c));
            parts.push("Conduit" + multStr + " (" + coolRate + "%/s)");
          }
        }
        return parts.join(" · ");
      }

      function initWagonStates() {
        var b = GAME.bastion;
        b.wagonSlots = [null, null, null, null];
        b.wagonStates = [
          createDefaultWagonSlotState(),
          createDefaultWagonSlotState(),
          createDefaultWagonSlotState(),
          createDefaultWagonSlotState()
        ];
        GAME.runState.artilleryShells = [];
        GAME.runState.moltenPuddles = [];
        GAME.runState.wagonExplosions = [];
        syncActiveWagonPassives();
      }

      function formatWagonCostText(wDef) {
        if (!wDef || !wDef.cost) return "Free";
        var parts = [];
        if (wDef.cost.ore) {
          parts.push(wDef.cost.ore + " Ore");
        }
        if (wDef.cost.materials) {
          var mKey;
          for (mKey in wDef.cost.materials) {
            if (Object.prototype.hasOwnProperty.call(wDef.cost.materials, mKey)) {
              var amt = wDef.cost.materials[mKey];
              var mInfo = DATA_TABLES.materials[mKey];
              parts.push(amt + " " + (mInfo ? mInfo.name : mKey));
            }
          }
        }
        return parts.join(" + ");
      }

      function canAffordWagon(wDef) {
        if (!wDef) return false;
        if (!wDef.availableInB8) return false;
        if (GAME.wagonsUnlockedAll) return true;
        var cost = wDef.cost || {};
        if (cost.ore && GAME.ore < cost.ore) return false;
        if (cost.materials) {
          var mKey;
          for (mKey in cost.materials) {
            if (Object.prototype.hasOwnProperty.call(cost.materials, mKey)) {
              var needed = cost.materials[mKey];
              if ((GAME.inventory[mKey] || 0) < needed) return false;
            }
          }
        }
        return true;
      }

      function spendWagonCost(wDef) {
        if (!wDef || GAME.wagonsUnlockedAll) return;
        var cost = wDef.cost || {};
        if (cost.ore) {
          GAME.ore = Math.max(0, GAME.ore - cost.ore);
        }
        if (cost.materials) {
          var mKey;
          for (mKey in cost.materials) {
            if (Object.prototype.hasOwnProperty.call(cost.materials, mKey)) {
              var needed = cost.materials[mKey];
              GAME.inventory[mKey] = Math.max(0, (GAME.inventory[mKey] || 0) - needed);
            }
          }
        }
      }

      function buildWagonInSlot(slotIdx, wagonId) {
        var b = GAME.bastion;
        if (slotIdx < 0 || slotIdx >= CFG.wagonSlotCount) return false;
        var wDef = getWagonDef(wagonId);
        if (!wDef || !wDef.availableInB8) {
          GAME.foundryStatusMsg = "Wagon design unavailable.";
          return false;
        }
        if (b.wagonSlots[slotIdx] !== null) {
          GAME.foundryStatusMsg = "Slot " + (slotIdx + 1) + " is occupied. Remove or choose an empty slot.";
          return false;
        }
        if (!canAffordWagon(wDef)) {
          GAME.foundryStatusMsg = "Insufficient resources for " + wDef.name + " (" + formatWagonCostText(wDef) + ").";
          return false;
        }

        spendWagonCost(wDef);
        b.wagonSlots[slotIdx] = wDef.id;
        b.wagonStates[slotIdx] = createDefaultWagonSlotState();
        syncBastionGeometry(true);
        GAME.foundryStatusMsg = "Built " + wDef.name + " in Slot " + (slotIdx + 1) + "!";
        AUDIO.playWagonBuild();
        updateDebugPanelUI();
        return true;
      }

      function removeWagonFromSlot(slotIdx) {
        var b = GAME.bastion;
        if (slotIdx < 0 || slotIdx >= CFG.wagonSlotCount) return false;
        if (!b.wagonSlots[slotIdx]) {
          GAME.foundryStatusMsg = "Slot " + (slotIdx + 1) + " is already an empty flatbed.";
          return false;
        }
        var oldDef = getWagonDef(b.wagonSlots[slotIdx]);
        b.wagonSlots[slotIdx] = null;
        b.wagonStates[slotIdx] = createDefaultWagonSlotState();
        GAME.wagonSwapSourceSlot = -1;
        syncBastionGeometry(true);
        GAME.foundryStatusMsg = "Removed " + (oldDef ? oldDef.name : "Wagon") + " from Slot " + (slotIdx + 1) + ".";
        AUDIO.playLedgerToggle();
        updateDebugPanelUI();
        return true;
      }

      function swapWagonSlots(slotA, slotB) {
        var b = GAME.bastion;
        if (
          slotA < 0 ||
          slotA >= CFG.wagonSlotCount ||
          slotB < 0 ||
          slotB >= CFG.wagonSlotCount ||
          slotA === slotB
        ) {
          return false;
        }
        var tmpId = b.wagonSlots[slotA];
        b.wagonSlots[slotA] = b.wagonSlots[slotB];
        b.wagonSlots[slotB] = tmpId;

        var tmpState = b.wagonStates[slotA];
        b.wagonStates[slotA] = b.wagonStates[slotB];
        b.wagonStates[slotB] = tmpState;

        syncBastionGeometry(true);
        GAME.foundryStatusMsg = "Swapped Slot " + (slotA + 1) + " and Slot " + (slotB + 1) + ".";
        AUDIO.playWagonBuild();
        updateDebugPanelUI();
        return true;
      }

      function unlockAllWagonsDebug() {
        if (GAME.playMode !== "RUN") {
          startRunMode();
        }
        GAME.wagonsUnlockedAll = true;
        var b = GAME.bastion;
        var workingIds = ["smelter", "artillery", "cryo_vent", "shield_pylon"];
        var i;
        for (i = 0; i < CFG.wagonSlotCount; i++) {
          if (!b.wagonSlots[i]) {
            b.wagonSlots[i] = workingIds[i];
            b.wagonStates[i] = createDefaultWagonSlotState();
          }
        }
        syncBastionGeometry(true);
        GAME.foundryStatusMsg = "Unlocked all 8 wagons (free build in Foundry)!";
        AUDIO.playWagonBuild();
      }

      function equipB9WagonsDebug() {
        if (GAME.playMode !== "RUN") {
          startRunMode();
        }
        GAME.wagonsUnlockedAll = true;
        var b = GAME.bastion;
        var b9Ids = ["drone_bay", "med_station", "plasma_shield", "thermal_conduit"];
        var i;
        for (i = 0; i < CFG.wagonSlotCount; i++) {
          b.wagonSlots[i] = b9Ids[i];
          b.wagonStates[i] = createDefaultWagonSlotState();
        }
        syncBastionGeometry(true);
        GAME.foundryStatusMsg = "Equipped Drone Bay, Med-Station, Plasma Shield & Thermal Conduit!";
        AUDIO.playWagonBuild();
      }

      function toggleForceCombosDebug(btnEl) {
        if (GAME.playMode !== "RUN") {
          startRunMode();
        }
        GAME.forceCombosOn = !GAME.forceCombosOn;
        if (GAME.forceCombosOn) {
          GAME.wagonsUnlockedAll = true;
          var b = GAME.bastion;
          var hasAny = false;
          var i;
          for (i = 0; i < CFG.wagonSlotCount; i++) {
            if (b.wagonSlots[i]) hasAny = true;
          }
          if (!hasAny) {
            var preset = ["smelter", "artillery", "cryo_vent", "shield_pylon"];
            for (i = 0; i < CFG.wagonSlotCount; i++) {
              b.wagonSlots[i] = preset[i];
              b.wagonStates[i] = createDefaultWagonSlotState();
            }
          }
          syncBastionGeometry(true);
          GAME.foundryStatusMsg = "Force combos ON: All active wagons gain combo effects!";
          spawnDmgNumber(GAME.player.x, GAME.player.y - 18, "FORCE COMBOS: ON", "#ffd166");
        } else {
          syncBastionGeometry(true);
          GAME.foundryStatusMsg = "Force combos OFF: Standard neighbouring slot adjacency rules.";
          spawnDmgNumber(GAME.player.x, GAME.player.y - 18, "FORCE COMBOS: OFF", "#cfc3b0");
        }
        if (btnEl) {
          btnEl.textContent = "Force combos on: " + (GAME.forceCombosOn ? "ON" : "OFF");
          btnEl.classList.toggle("active", GAME.forceCombosOn);
        }
        AUDIO.playWagonBuild();
      }

      function listActiveCombosDebug() {
        recomputeWagonCombos();
        var list = getActiveCombosSummaryList();
        var summary = list.length > 0 ? list.join(" | ") : "None (Place combo pairs in adjacent slots 1-2, 2-3, or 3-4)";
        GAME.comboListNote = summary;
        GAME.foundryStatusMsg = "Active Combos: " + summary;
        spawnDmgNumber(
          GAME.player.x + GAME.player.w * 0.5,
          GAME.player.y - 20,
          list.length > 0 ? ("COMBOS (" + list.length + "): " + list.join(" · ")) : "ACTIVE COMBOS: NONE",
          list.length > 0 ? "#48f0e4" : "#ffcc80"
        );
        AUDIO.playLedgerToggle();
      }

      function handleFoundryTrainTabClick(px, py) {
        var i;
        // 1. Check 4 Wagon Slot boxes
        for (i = 0; i < GAME.foundrySlotRects.length; i++) {
          var sr = GAME.foundrySlotRects[i];
          if (sr && px >= sr.x && px <= sr.x + sr.w && py >= sr.y && py <= sr.y + sr.h) {
            if (GAME.wagonSwapSourceSlot >= 0 && GAME.wagonSwapSourceSlot !== i) {
              var src = GAME.wagonSwapSourceSlot;
              GAME.wagonSwapSourceSlot = -1;
              GAME.selectedWagonSlot = i;
              swapWagonSlots(src, i);
              return;
            }
            GAME.selectedWagonSlot = i;
            GAME.wagonSwapSourceSlot = -1;
            AUDIO.playLedgerToggle();
            return;
          }
        }

        // 2. Check Build / Swap / Remove action buttons
        var bBtn = GAME.foundryBuildBtnRect;
        if (bBtn && px >= bBtn.x && px <= bBtn.x + bBtn.w && py >= bBtn.y && py <= bBtn.y + bBtn.h) {
          if (GAME.playMode !== "RUN") {
            GAME.foundryStatusMsg = "Wagons operate in RUN mode only.";
            return;
          }
          buildWagonInSlot(GAME.selectedWagonSlot, GAME.selectedWagonId);
          return;
        }

        var sBtn = GAME.foundrySwapBtnRect;
        if (sBtn && px >= sBtn.x && px <= sBtn.x + sBtn.w && py >= sBtn.y && py <= sBtn.y + sBtn.h) {
          if (GAME.playMode !== "RUN") {
            GAME.foundryStatusMsg = "Wagons operate in RUN mode only.";
            return;
          }
          if (GAME.wagonSwapSourceSlot === GAME.selectedWagonSlot) {
            GAME.wagonSwapSourceSlot = -1;
            GAME.foundryStatusMsg = "Swap cancelled.";
          } else if (GAME.wagonSwapSourceSlot >= 0) {
            var fromSlot = GAME.wagonSwapSourceSlot;
            GAME.wagonSwapSourceSlot = -1;
            swapWagonSlots(fromSlot, GAME.selectedWagonSlot);
          } else {
            GAME.wagonSwapSourceSlot = GAME.selectedWagonSlot;
            GAME.foundryStatusMsg = "Swap active: click another Slot (1-4) to swap with Slot " + (GAME.selectedWagonSlot + 1) + ".";
          }
          AUDIO.playLedgerToggle();
          return;
        }

        var rBtn = GAME.foundryRemoveBtnRect;
        if (rBtn && px >= rBtn.x && px <= rBtn.x + rBtn.w && py >= rBtn.y && py <= rBtn.y + rBtn.h) {
          if (GAME.playMode !== "RUN") {
            GAME.foundryStatusMsg = "Wagons operate in RUN mode only.";
            return;
          }
          removeWagonFromSlot(GAME.selectedWagonSlot);
          return;
        }

        // 3. Check 8 Wagon Design Cards (and each card's direct BUILD button)
        for (i = 0; i < GAME.foundryWagonCardRects.length; i++) {
          var cr = GAME.foundryWagonCardRects[i];
          if (cr && px >= cr.x && px <= cr.x + cr.w && py >= cr.y && py <= cr.y + cr.h) {
            var wDef = getWagonDef(cr.wagonId);
            if (wDef && wDef.availableInB8) {
              GAME.selectedWagonId = wDef.id;
              if (
                cr.buildBtnRect &&
                px >= cr.buildBtnRect.x &&
                px <= cr.buildBtnRect.x + cr.buildBtnRect.w &&
                py >= cr.buildBtnRect.y &&
                py <= cr.buildBtnRect.y + cr.buildBtnRect.h
              ) {
                if (GAME.playMode !== "RUN") {
                  GAME.foundryStatusMsg = "Wagons operate in RUN mode only.";
                  AUDIO.playBeep(220, 0.05, "sawtooth", 0.06);
                  return;
                }
                var targetSlot = GAME.selectedWagonSlot;
                if (GAME.bastion.wagonSlots && GAME.bastion.wagonSlots[targetSlot] !== null) {
                  var s;
                  for (s = 0; s < CFG.wagonSlotCount; s++) {
                    if (GAME.bastion.wagonSlots[s] === null) {
                      targetSlot = s;
                      GAME.selectedWagonSlot = s;
                      break;
                    }
                  }
                }
                buildWagonInSlot(targetSlot, wDef.id);
                return;
              }
              GAME.foundryStatusMsg = "Selected " + wDef.name + " (" + formatWagonCostText(wDef) + ").";
              AUDIO.playLedgerToggle();
            }
            return;
          }
        }
      }

      function syncBastionGeometry(keepEngineAnchored) {
        var b = GAME.bastion;
        var prevEngineFrontX = b.engineFrontX;
        var carLen = CFG.trainCarLength; // 180 px for built wagons, Foundry Car, and Engine
        var flatLen = CFG.emptyFlatbedLength; // 120 px for empty flatbed slots (so train gets longer as wagons are built)
        var carH = CFG.trainCarHeight;   // 120 px
        var gap = CFG.trainCouplerGap;   // 14 px
        b.floorY = CFG.trainFloorY;
        b.roofY = b.floorY - carH;

        if (!b.wagonSlots || b.wagonSlots.length < CFG.wagonSlotCount) {
          b.wagonSlots = [null, null, null, null];
        }
        if (!b.wagonStates || b.wagonStates.length < CFG.wagonSlotCount) {
          b.wagonStates = [
            createDefaultWagonSlotState(),
            createDefaultWagonSlotState(),
            createDefaultWagonSlotState(),
            createDefaultWagonSlotState()
          ];
        }

        // 6 cars ordered from rear (left, index 0) to front (right, index 5):
        // Left-to-right behind Foundry Car: Slot 4, Slot 3, Slot 2, Slot 1, Foundry Car, Bastion Engine
        var defs = [];
        var sIdx;
        for (sIdx = CFG.wagonSlotCount - 1; sIdx >= 0; sIdx--) {
          var wId = b.wagonSlots[sIdx];
          var wDef = getWagonDef(wId);
          defs.push({
            key: "wagon" + (sIdx + 1),
            wagonSlotIndex: sIdx,
            wagonId: wDef ? wDef.id : null,
            wagonDef: wDef,
            name: wDef ? wDef.name.toUpperCase() : ("WAGON SLOT " + (sIdx + 1)),
            isFlatbed: !wDef,
            w: wDef ? carLen : flatLen
          });
        }
        defs.push({
          key: "foundry",
          wagonSlotIndex: -1,
          wagonId: null,
          wagonDef: null,
          name: "FOUNDRY CAR",
          isFlatbed: false,
          w: carLen
        });
        defs.push({
          key: "engine",
          wagonSlotIndex: -1,
          wagonId: null,
          wagonDef: null,
          name: "BASTION ENGINE",
          isFlatbed: false,
          w: 184 // 46 art px * 4 = 184 world px
        });

        b.cars = [];
        var curX = b.rearX;
        var i;
        for (i = 0; i < defs.length; i++) {
          var d = defs[i];
          b.cars.push({
            slotIndex: i,
            wagonSlotIndex: d.wagonSlotIndex,
            wagonId: d.wagonId,
            wagonDef: d.wagonDef,
            key: d.key,
            name: d.name,
            isFlatbed: d.isFlatbed,
            x: curX,
            y: b.roofY,
            w: d.w,
            h: carH,
            roofY: b.roofY
          });
          curX += d.w + gap;
        }
        var engineCar = b.cars[b.cars.length - 1];
        b.engineFrontX = engineCar.x + engineCar.w;
        b.drillTipX = b.engineFrontX + CFG.trainDrillLength;

        if (keepEngineAnchored && prevEngineFrontX > 0) {
          var deltaFront = prevEngineFrontX - b.engineFrontX;
          if (Math.abs(deltaFront) > 0.01) {
            b.rearX += deltaFront;
            GAME.runState.startRearX += deltaFront;
            for (i = 0; i < b.cars.length; i++) {
              b.cars[i].x += deltaFront;
            }
            b.engineFrontX += deltaFront;
            b.drillTipX += deltaFront;
          }
        }

        syncActiveWagonPassives();
      }

      function getFoundryCar() {
        var cars = GAME.bastion.cars;
        var i;
        for (i = 0; i < cars.length; i++) {
          if (cars[i].key === "foundry") return cars[i];
        }
        return cars[0] || null;
      }

      function getTetherAnchor() {
        var fCar = getFoundryCar();
        var ax = fCar ? fCar.x + fCar.w * 0.5 : GAME.bastion.rearX + 670;
        var ay = GAME.bastion.roofY - 4;
        return { x: ax, y: ay };
      }

      function updateTetherButtonUI() {
        // Legacy DOM HUD is hidden (canvas controls read directly from DATA_TABLES.controls and GAME.player cooldown timers)
      }

      // Helper to find ground surface Y near (worldX, refFootY) in both Run mode and Sandbox
      function findGroundYNear(worldX, refFootY) {
        if (GAME.playMode === "RUN") {
          return GAME.bastion.floorY - 2;
        }
        var ts = CFG.tileSize;
        var col = Math.max(1, Math.min(CFG.mapCols - 2, Math.floor(worldX / ts)));
        var startRow = Math.max(2, Math.min(CFG.mapRows - 2, Math.floor((refFootY || CFG.trainFloorY) / ts)));
        var r;
        // Search downward from just above refFootY for a solid or platform top surface
        for (r = Math.max(2, startRow - 2); r < CFG.mapRows; r++) {
          if ((WORLD.isSolid(col, r) || WORLD.isPlatform(col, r)) && !WORLD.isSolid(col, r - 1)) {
            return r * ts - 2;
          }
        }
        // Fallback upward search if refFootY was inside ground
        for (r = startRow - 1; r >= 2; r--) {
          if ((WORLD.isSolid(col, r) || WORLD.isPlatform(col, r)) && !WORLD.isSolid(col, r - 1)) {
            return r * ts - 2;
          }
        }
        return CFG.trainFloorY - 2;
      }

      // Step R4 Requirement 5: Retract both Tripwire spike posts and start the 8 s cooldown
      function retractTripwire(isEarly) {
        var rs = GAME.runState;
        var tw = rs ? rs.tripwire : null;
        var pl = GAME.player;
        if (!tw || !tw.active) return;
        tw.active = false;
        tw.timer = 0;
        var cd = isEarly ? CFG.tripwireCooldownEarly : CFG.tripwireCooldownFull;
        pl.tripwireCooldownTimer = cd;
        pl.tripwireCooldownMax = cd;
        spawnSparkBurst(tw.x1, tw.y1 - 8, 8, "#5ef2ff");
        spawnSparkBurst(tw.x2, tw.y2 - 8, 8, "#5ef2ff");
        spawnDmgNumber(
          (tw.x1 + tw.x2) * 0.5,
          Math.min(tw.y1, tw.y2) - 20,
          isEarly ? "TRIPWIRE RETRACTED" : "TRIPWIRE ENDED",
          "#ffd166"
        );
        AUDIO.playBeep(360, 0.08, "sawtooth", 0.07);
        updateDebugPanelUI();
      }

      // Step R4 Requirement 5: TRIPWIRE button (key T): drops two spike posts, one at the player's feet
      // and one 220 px ahead in the facing direction (or toward the aim direction if the Aim stick is held, limited to the ground),
      // with a thin crackling electric wire stretched between them at knee height. Works in Run mode and Sandbox.
      function placeTripwireSpike(pl, ignoreCooldown) {
        if (GAME.playMode === "RUN" && GAME.runState.rebuildTimer > 0) return false;
        var rs = GAME.runState;
        var tw = rs.tripwire;
        if (!ignoreCooldown) {
          if (pl.overheatTimer > 0 || pl.returnFadeTimer > 0 || pl.tripwireCooldownTimer > 0) {
            return false;
          }
        }
        // Only one wire at a time
        if (tw.active) {
          retractTripwire(true);
          if (!ignoreCooldown) return true;
        }

        var dir = pl.facing >= 0 ? 1 : -1;
        if (INPUT.stickMag > 0.15 && Math.abs(INPUT.stickX) > 0.08) {
          dir = INPUT.stickX >= 0 ? 1 : -1;
        } else if (INPUT.mouseActive && INPUT.aimMode === "mouse") {
          dir = Math.cos(pl.aimAngle) >= 0 ? 1 : -1;
        }

        var footX = Math.round(pl.x + pl.w * 0.5);
        var footRefY = Math.round(pl.y + pl.h);
        if (GAME.playMode === "RUN" && pl.onTrainRoof) {
          footRefY = GAME.bastion.floorY;
        }
        var post1X = footX;
        var post1Y = findGroundYNear(post1X, footRefY);

        var span = CFG.tripwireSpanPx || 220;
        var rawPost2X = post1X + dir * span;
        if (GAME.playMode !== "RUN") {
          var minWorldX = CFG.tileSize + 16;
          var maxWorldX = (CFG.mapCols - 1) * CFG.tileSize - 16;
          rawPost2X = Math.max(minWorldX, Math.min(maxWorldX, rawPost2X));
        }
        var post2X = Math.round(rawPost2X);
        var post2Y = findGroundYNear(post2X, post1Y);

        tw.id = (tw.id || 0) + 1;
        tw.active = true;
        tw.x1 = post1X;
        tw.y1 = post1Y;
        tw.x2 = post2X;
        tw.y2 = post2Y;
        tw.x = Math.round((post1X + post2X) * 0.5);
        tw.y = Math.round((post1Y + post2Y) * 0.5);
        tw.timer = CFG.tripwireDuration;
        tw.maxTimer = CFG.tripwireDuration;
        tw.sparkTimer = 0;
        tw.tripFlashTimer = 0.18;
        tw.lastTripX = tw.x;
        tw.lastTripY = tw.y - 12;

        // Adds 6 percent heat (scaled by Motor Core capacity)
        if (!ignoreCooldown) {
          addPlayerHeatPoints(pl, CFG.tripwireHeatCost);
          if (pl.heat >= CFG.heatMax) {
            triggerPlayerOverheat(pl);
          }
        }

        spawnSparkBurst(tw.x1, tw.y1 - 8, 10, "#ffd166");
        spawnSparkBurst(tw.x2, tw.y2 - 8, 10, "#ffd166");
        spawnDmgNumber(tw.x, Math.min(tw.y1, tw.y2) - 22, "TRIPWIRE SET!", "#ffd166");
        AUDIO.playTripwirePlace();
        updateDebugPanelUI();
        return true;
      }

      function getEffectiveHarpoonRange() {
        return GAME.harpoonRange800Debug ? 800 : CFG.harpoonRange;
      }

      function toggleHarpoonRange800Debug(btnEl) {
        GAME.harpoonRange800Debug = !GAME.harpoonRange800Debug;
        var baseRng = CFG.harpoonRange || 420;
        if (btnEl) {
          btnEl.textContent = "Harpoon range 800: " + (GAME.harpoonRange800Debug ? "ON (800px)" : ("OFF (" + baseRng + "px)"));
          btnEl.classList.toggle("active", GAME.harpoonRange800Debug);
        }
        spawnDmgNumber(
          GAME.player.x + GAME.player.w * 0.5,
          GAME.player.y - 18,
          GAME.harpoonRange800Debug ? "HARPOON RANGE: 800px" : ("HARPOON RANGE: " + baseRng + "px"),
          "#ff8c42"
        );
        updateDebugPanelUI();
      }

      // Normalize angle difference into [-PI, PI]
      function shortestAngleDiff(a, b) {
        var d = b - a;
        while (d > Math.PI) d -= Math.PI * 2;
        while (d < -Math.PI) d += Math.PI * 2;
        return d;
      }

      // Step R4 Requirement 4: Small aim-assist snaps to the nearest valid target inside a 20 degree cone
      function getAimAssistedHarpoonAngle(shoulderX, shoulderY, rawAng, maxRange) {
        var halfConeRad = ((CFG.harpoonAimAssistDeg || 20) * 0.5) * (Math.PI / 180);
        var bestAng = rawAng;
        var bestDist = Infinity;
        var foundPriorityEnemy = false;
        var i, zIdx;

        // 1. Check active enemies within maxRange and inside the 20-degree cone
        for (i = 0; i < CFG.maxEnemies; i++) {
          var e = GAME.enemies[i];
          if (!e.active) continue;
          var eWeight = e.weight || (DATA_TABLES.enemyTypes[e.type] ? DATA_TABLES.enemyTypes[e.type].weight : 1);
          var candX = e.x + e.w * 0.5;
          var candY = e.y + e.h * 0.5;
          var isPriority = eWeight <= 1;

          if (eWeight >= 2 && e.zones && e.zones.length > 0) {
            for (zIdx = 0; zIdx < e.zones.length; zIdx++) {
              var z = e.zones[zIdx];
              if (z.state === "CRACKED" || z.state === "BROKEN") {
                var zr = getBruteZoneWorldRect(e, z);
                candX = zr.x + zr.w * 0.5;
                candY = zr.y + zr.h * 0.5;
                isPriority = true;
                break;
              }
            }
          }

          var dx = candX - shoulderX;
          var dy = candY - shoulderY;
          var dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 12 || dist > maxRange) continue;

          var targetAng = Math.atan2(dy, dx);
          var diff = Math.abs(shortestAngleDiff(rawAng, targetAng));
          if (diff <= halfConeRad) {
            if ((isPriority && !foundPriorityEnemy) || (isPriority === foundPriorityEnemy && dist < bestDist)) {
              foundPriorityEnemy = isPriority;
              bestDist = dist;
              bestAng = targetAng;
            }
          }
        }

        if (bestDist < Infinity) {
          return bestAng;
        }

        // 2. If no enemy in cone, check if a ray within the 20-degree cone snaps to a solid grapple tile
        var testDegOffsets = [0, -3, 3, -6, 6, -10, 10];
        var dIdx, stepDist;
        for (dIdx = 0; dIdx < testDegOffsets.length; dIdx++) {
          var testAng = rawAng + testDegOffsets[dIdx] * (Math.PI / 180);
          var cosA = Math.cos(testAng);
          var sinA = Math.sin(testAng);
          for (stepDist = 24; stepDist <= maxRange; stepDist += 16) {
            var tx = shoulderX + cosA * stepDist;
            var ty = shoulderY + sinA * stepDist;
            if (WORLD.isPointInSolidTile(tx, ty)) {
              return testAng;
            }
          }
        }

        return rawAng;
      }

      // Step R4 Requirement 4: HOOK button (key H): fires the harpoon toward the aim direction
      // (Aim stick, or mouse, or facing direction if neither is used) with 20-deg cone aim-assist.
      // Works in Run mode and Sandbox.
      function fireHarpoonBolt(pl) {
        if (GAME.playMode === "RUN" && GAME.runState.rebuildTimer > 0) return false;
        var hp = GAME.runState.harpoon;
        if (!hp || hp.active) return false;
        if (pl.overheatTimer > 0 || pl.returnFadeTimer > 0 || pl.harpoonCooldownTimer > 0) {
          return false;
        }

        var shoulderX = pl.x + pl.w * 0.5;
        var shoulderY = pl.y + pl.h - 20;
        var rawAng;
        if (INPUT.stickMag > 0.15) {
          rawAng = Math.atan2(INPUT.stickY, INPUT.stickX);
        } else if (INPUT.mouseActive && INPUT.aimMode === "mouse") {
          rawAng = pl.aimAngle;
        } else {
          rawAng = pl.facing >= 0 ? 0 : Math.PI;
        }

        var maxRange = getEffectiveHarpoonRange();
        var ang = getAimAssistedHarpoonAngle(shoulderX, shoulderY, rawAng, maxRange);
        pl.aimAngle = ang;
        pl.facing = Math.cos(ang) >= -0.01 ? 1 : -1;

        hp.active = true;
        hp.state = "FLYING";
        hp.x = shoulderX + Math.cos(ang) * 14;
        hp.y = shoulderY + Math.sin(ang) * 14;
        hp.vx = Math.cos(ang) * CFG.harpoonBoltSpeed;
        hp.vy = Math.sin(ang) * CFG.harpoonBoltSpeed;
        hp.dist = 0;
        hp.maxRange = maxRange;
        hp.timer = 0;
        hp.targetEnemy = null;
        hp.targetZoneKey = null;
        hp.reelTargetX = 0;
        hp.reelTargetY = 0;
        hp.reelIsEnemy = false;

        // Cooldown 3 s with a ring; adds 8 percent heat; resets air jump
        pl.harpoonCooldownTimer = CFG.harpoonCooldown;
        pl.harpoonCooldownMax = CFG.harpoonCooldown;
        pl.airJumpsLeft = Math.max(pl.airJumpsLeft || 0, CFG.maxAirJumps);
        addPlayerHeatPoints(pl, CFG.harpoonHeatCost);
        if (pl.heat >= CFG.heatMax) {
          triggerPlayerOverheat(pl);
        }

        spawnSparkBurst(hp.x, hp.y, 10, "#35E0F0");
        AUDIO.playHarpoonFire();
        updateDebugPanelUI();
        return true;
      }

      function finishHarpoonAndReattach(pl, hp) {
        if (!hp) return;
        if (hp.targetEnemy) {
          hp.targetEnemy.harpooned = false;
        }
        hp.active = false;
        hp.state = "IDLE";
        hp.timer = 0;
        hp.targetEnemy = null;
        hp.targetZoneKey = null;
        // Air jump resets after a Hook
        pl.airJumpsLeft = Math.max(pl.airJumpsLeft || 0, CFG.maxAirJumps);
        updateDebugPanelUI();
      }

      function executeHarpoonAerialStrike(pl, targetEnemy) {
        // Automatically performs one aerial blade strike at x1.5 damage on arrival
        var shoulderX = pl.x + pl.w * 0.5;
        var shoulderY = pl.y + pl.h - 20;
        var aimAng = pl.aimAngle;
        if (targetEnemy && targetEnemy.active) {
          var eCx = targetEnemy.x + targetEnemy.w * 0.5;
          var eCy = targetEnemy.y + targetEnemy.h * 0.5;
          aimAng = Math.atan2(eCy - shoulderY, eCx - shoulderX);
        }
        pl.facing = Math.cos(aimAng) >= -0.01 ? 1 : -1;
        pl.bladeTimer = CFG.bladeTotalTime;
        pl.bladeAngle = aimAng;
        pl.bladeSwingId++;
        pl.bladeIsRedline = pl.heat >= CFG.heatRedlineMin && pl.heat <= CFG.heatRedlineMax;
        pl.bladeHarpoonMult = CFG.harpoonAerialBladeMult; // x1.5 aerial blade strike
        pl.vy = -190;
        spawnDmgNumber(pl.x + pl.w * 0.5, pl.y - 22, "AERIAL STRIKE x1.5!", "#ff8c42");
        AUDIO.playBladeSwing(true);
        checkBladeHitsTargets(pl);
      }

      function updateHarpoon(dt) {
        var rs = GAME.runState;
        var hp = rs ? rs.harpoon : null;
        var pl = GAME.player;
        if (!hp || !hp.active) return;

        var floorY = GAME.playMode === "RUN" ? GAME.bastion.floorY : findGroundYNear(pl.x + pl.w * 0.5, pl.y + pl.h) + 2;
        var plCx = pl.x + pl.w * 0.5;
        var plCy = pl.y + pl.h - 18;

        if (hp.state === "FLYING") {
          var stepDist = CFG.harpoonBoltSpeed * dt;
          var steps = Math.max(1, Math.ceil(stepDist / 10));
          var subDx = (hp.vx * dt) / steps;
          var subDy = (hp.vy * dt) / steps;
          var subStepLen = stepDist / steps;
          var s, i, zIdx;

          for (s = 0; s < steps; s++) {
            hp.x += subDx;
            hp.y += subDy;
            hp.dist += subStepLen;

            // 1. Check enemy hit
            var hitEnemy = null;
            for (i = 0; i < CFG.maxEnemies; i++) {
              var e = GAME.enemies[i];
              if (!e.active) continue;
              if (
                hp.x + 6 >= e.x &&
                hp.x - 6 <= e.x + e.w &&
                hp.y + 6 >= e.y &&
                hp.y - 6 <= e.y + e.h
              ) {
                hitEnemy = e;
                break;
              }
            }

            if (hitEnemy) {
              var eWeight = hitEnemy.weight || (DATA_TABLES.enemyTypes[hitEnemy.type] ? DATA_TABLES.enemyTypes[hitEnemy.type].weight : 1);
              if (eWeight <= 1) {
                // Weight 1 enemy: yanked to the player and slammed onto the track for 40 damage and a 1 s stun
                hp.state = "YANKING";
                hp.targetEnemy = hitEnemy;
                hp.timer = 0.65;
                hitEnemy.harpooned = true;
                hitEnemy.lungeTimer = 0;
                hitEnemy.telegraphTimer = 0;
                hitEnemy.state = "STAGGER";
                hitEnemy.staggerTimer = CFG.harpoonYankStunTime;
                spawnSparkBurst(hp.x, hp.y, 14, "#35E0F0");
                spawnDmgNumber(hitEnemy.x + hitEnemy.w * 0.5, hitEnemy.y - 16, "HARPOON YANK!", "#35E0F0");
                AUDIO.playHarpoonHit();
                return;
              } else {
                // Enemy of weight 2 or more: inspect which zone was hit
                var touchedZone = null;
                if (hitEnemy.zones && hitEnemy.zones.length > 0) {
                  for (zIdx = 0; zIdx < hitEnemy.zones.length; zIdx++) {
                    var z = hitEnemy.zones[zIdx];
                    var zr = getBruteZoneWorldRect(hitEnemy, z);
                    if (
                      hp.x + 8 >= zr.x &&
                      hp.x - 8 <= zr.x + zr.w &&
                      hp.y + 8 >= zr.y &&
                      hp.y - 8 <= zr.y + zr.h
                    ) {
                      touchedZone = z;
                      break;
                    }
                  }
                  if (!touchedZone) {
                    var bestD = Infinity;
                    for (zIdx = 0; zIdx < hitEnemy.zones.length; zIdx++) {
                      var zc = hitEnemy.zones[zIdx];
                      var zcr = getBruteZoneWorldRect(hitEnemy, zc);
                      var zdx = hp.x - (zcr.x + zcr.w * 0.5);
                      var zdy = hp.y - (zcr.y + zcr.h * 0.5);
                      var d2 = zdx * zdx + zdy * zdy;
                      if (d2 < bestD) {
                        bestD = d2;
                        touchedZone = zc;
                      }
                    }
                  }
                  if (touchedZone && touchedZone.state === "INTACT") {
                    for (zIdx = 0; zIdx < hitEnemy.zones.length; zIdx++) {
                      var za = hitEnemy.zones[zIdx];
                      if (za.state === "CRACKED" || za.state === "BROKEN") {
                        var zar = getBruteZoneWorldRect(hitEnemy, za);
                        if (
                          hp.x + 22 >= zar.x &&
                          hp.x - 22 <= zar.x + zar.w &&
                          hp.y + 22 >= zar.y &&
                          hp.y - 22 <= zar.y + zar.h
                        ) {
                          touchedZone = za;
                          break;
                        }
                      }
                    }
                  }
                }

                if (touchedZone && (touchedZone.state === "CRACKED" || touchedZone.state === "BROKEN")) {
                  // Heavy enemy with a Cracked or Broken zone: pull the player in at 900 px/s for an aerial blade strike
                  hp.state = "REELING";
                  hp.reelIsEnemy = true;
                  hp.targetEnemy = hitEnemy;
                  hp.targetZoneKey = touchedZone.key;
                  hp.timer = CFG.harpoonMaxReelTime;
                  var tzr = getBruteZoneWorldRect(hitEnemy, touchedZone);
                  hp.reelTargetX = tzr.x + tzr.w * 0.5;
                  hp.reelTargetY = tzr.y + tzr.h * 0.5;
                  hp.x = hp.reelTargetX;
                  hp.y = hp.reelTargetY;
                  pl.onGround = false;
                  pl.onTrainRoof = false;
                  spawnSparkBurst(hp.x, hp.y, 16, "#35E0F0");
                  spawnDmgNumber(hp.x, tzr.y - 16, "HARPOON REEL!", "#35E0F0");
                  AUDIO.playHarpoonHit();
                  return;
                } else {
                  if (touchedZone) {
                    damageBruteArmorZone(hitEnemy, touchedZone, 8);
                  }
                  spawnSparkBurst(hp.x, hp.y, 10, "#9beeff");
                  spawnDmgNumber(hp.x, hitEnemy.y - 14, "ARMOR DEFLECT (CRACK FIRST!)", "#9beeff");
                  AUDIO.playArmorHit();
                  hp.state = "RETRACTING";
                  hp.timer = 0.25;
                  return;
                }
              }
            }

            // 2. Check solid tile hit (grapple point)
            if (WORLD.isPointInSolidTile(hp.x, hp.y)) {
              hp.state = "REELING";
              hp.reelIsEnemy = false;
              hp.targetEnemy = null;
              hp.targetZoneKey = null;
              hp.reelTargetX = hp.x;
              hp.reelTargetY = hp.y;
              hp.timer = CFG.harpoonMaxReelTime;
              pl.onGround = false;
              pl.onTrainRoof = false;
              spawnSparkBurst(hp.x, hp.y, 12, "#5ef2ff");
              spawnDmgNumber(hp.x, hp.y - 12, "GRAPPLE!", "#5ef2ff");
              AUDIO.playHarpoonHit();
              return;
            }

            // 3. Check max range -> harpoon retracts
            if (hp.dist >= hp.maxRange) {
              hp.state = "RETRACTING";
              hp.timer = CFG.harpoonMissRetractTime;
              spawnSparkBurst(hp.x, hp.y, 6, "#35E0F0");
              return;
            }
          }
        } else if (hp.state === "YANKING") {
          var ye = hp.targetEnemy;
          if (!ye || !ye.active) {
            finishHarpoonAndReattach(pl, hp);
            return;
          }
          hp.timer -= dt;
          var yankDestX = plCx + (pl.facing >= 0 ? 34 : -34) - ye.w * 0.5;
          var yankGroundY = GAME.playMode === "RUN" ? GAME.bastion.floorY : (findGroundYNear(yankDestX + ye.w * 0.5, pl.y + pl.h) + 2);
          var yankDestY = Math.min(yankGroundY - ye.h, pl.y + pl.h - ye.h);
          var ydx = yankDestX - ye.x;
          var ydy = yankDestY - ye.y;
          var yDist = Math.sqrt(ydx * ydx + ydy * ydy);
          var yStep = CFG.harpoonYankSpeed * dt;

          if (yDist <= yStep + 14 || hp.timer <= 0) {
            ye.x = yankDestX;
            ye.y = yankGroundY - ye.h;
            ye.vx = 0;
            ye.vy = 0;
            ye.onGround = true;
            ye.harpooned = false;
            ye.state = "STAGGER";
            ye.staggerTimer = CFG.harpoonYankStunTime;
            ye.hpBarTimer = CFG.enemyHpBarDuration;
            ye.flashTimer = 0.22;
            ye.hp -= CFG.harpoonYankDamage;

            var slamX = ye.x + ye.w * 0.5;
            var slamY = ye.y + ye.h;
            spawnSparkBurst(slamX, slamY - 6, 18, "#ff8c42");
            spawnDust(slamX, slamY, 8, "#d99b66");
            spawnDmgNumber(slamX, ye.y - 16, "SLAM! -" + CFG.harpoonYankDamage + " (1s STUN)", "#ff8c42");
            shake(4.5, 0.14);
            AUDIO.playHarpoonSlam();

            if (ye.hp <= 0) {
              handleEnemyKilled(ye);
            }
            finishHarpoonAndReattach(pl, hp);
          } else {
            ye.x += (ydx / yDist) * yStep;
            ye.y += (ydy / yDist) * yStep;
            ye.vx = 0;
            ye.vy = 0;
            hp.x = ye.x + ye.w * 0.5;
            hp.y = ye.y + ye.h * 0.5;
          }
        } else if (hp.state === "REELING") {
          hp.timer -= dt;
          if (hp.reelIsEnemy) {
            var re = hp.targetEnemy;
            if (!re || !re.active) {
              finishHarpoonAndReattach(pl, hp);
              return;
            }
            var rz = hp.targetZoneKey ? getBruteZoneByKey(re, hp.targetZoneKey) : null;
            if (rz) {
              var rzr = getBruteZoneWorldRect(re, rz);
              hp.reelTargetX = rzr.x + rzr.w * 0.5;
              hp.reelTargetY = rzr.y + rzr.h * 0.5;
            } else {
              hp.reelTargetX = re.x + re.w * 0.5;
              hp.reelTargetY = re.y + re.h * 0.5;
            }
            hp.x = hp.reelTargetX;
            hp.y = hp.reelTargetY;
          }

          var destPlX = hp.reelTargetX - pl.w * 0.5;
          var destPlY = hp.reelIsEnemy
            ? (hp.reelTargetY - pl.h * 0.65)
            : (hp.reelTargetY - pl.h * 0.5);
          var rdx = destPlX - pl.x;
          var rdy = destPlY - pl.y;
          var rDist = Math.sqrt(rdx * rdx + rdy * rdy);
          var reelStep = CFG.harpoonReelSpeed * dt;

          pl.invulnTimer = Math.max(pl.invulnTimer, 0.18);

          if (Math.random() < 0.75) {
            spawnDust(plCx, plCy, 1, "#35E0F0");
          }

          if (rDist <= reelStep + (hp.reelIsEnemy ? 26 : 18) || hp.timer <= 0) {
            if (hp.reelIsEnemy && hp.targetEnemy && hp.targetEnemy.active) {
              pl.x = destPlX - (pl.facing >= 0 ? 18 : -18);
              pl.y = Math.min(floorY - pl.h, destPlY);
              pl.vx = 0;
              pl.vy = -160;
              executeHarpoonAerialStrike(pl, hp.targetEnemy);
            } else {
              var tileCol = Math.floor(hp.reelTargetX / CFG.tileSize);
              var tileRow = Math.floor(hp.reelTargetY / CFG.tileSize);
              if (tileRow === 25 && !WORLD.isSolid(tileCol, 24) && !WORLD.isSolid(tileCol, 23)) {
                pl.x = tileCol * CFG.tileSize + 2;
                pl.y = 25 * CFG.tileSize - pl.h;
                pl.vx = 0;
                pl.vy = 0;
                pl.onGround = true;
              } else {
                pl.vx = 0;
                pl.vy = -120;
              }
              spawnSparkBurst(pl.x + pl.w * 0.5, pl.y + pl.h * 0.5, 10, "#5ef2ff");
            }
            finishHarpoonAndReattach(pl, hp);
          } else {
            var moveX = (rdx / rDist) * reelStep;
            var moveY = (rdy / rDist) * reelStep;
            if (!hp.reelIsEnemy) {
              var hitX = moveAndCollideX(pl, moveX);
              var hitY = moveAndCollideY(pl, moveY);
              if (hitX || hitY) {
                var gCol = Math.floor(hp.reelTargetX / CFG.tileSize);
                var gRow = Math.floor(hp.reelTargetY / CFG.tileSize);
                if (gRow === 25 && !WORLD.isSolid(gCol, 24) && !WORLD.isSolid(gCol, 23)) {
                  pl.x = gCol * CFG.tileSize + 2;
                  pl.y = 25 * CFG.tileSize - pl.h;
                  pl.onGround = true;
                }
                pl.vx = 0;
                pl.vy = 0;
                finishHarpoonAndReattach(pl, hp);
                return;
              }
            } else {
              pl.x += moveX;
              pl.y += moveY;
            }
            pl.vx = 0;
            pl.vy = 0;
          }
        } else if (hp.state === "RETRACTING") {
          hp.timer -= dt;
          var lerpFactor = Math.min(1, dt * 10);
          hp.x += (plCx - hp.x) * lerpFactor;
          hp.y += (plCy - hp.y) * lerpFactor;
          if (hp.timer <= 0) {
            finishHarpoonAndReattach(pl, hp);
          }
        }
      }

      // Exact line segment vs axis-aligned rectangle intersection (Liang-Barsky)
      function lineSegmentIntersectsRect(x1, y1, x2, y2, rx, ry, rw, rh) {
        var dx = x2 - x1;
        var dy = y2 - y1;
        var p = [-dx, dx, -dy, dy];
        var q = [x1 - rx, rx + rw - x1, y1 - ry, ry + rh - y1];
        var u1 = 0.0;
        var u2 = 1.0;
        var i, r;
        for (i = 0; i < 4; i++) {
          if (Math.abs(p[i]) < 1e-7) {
            if (q[i] < 0) return false;
          } else {
            r = q[i] / p[i];
            if (p[i] < 0) {
              if (r > u2) return false;
              if (r > u1) u1 = r;
            } else {
              if (r < u1) return false;
              if (r < u2) u2 = r;
            }
          }
        }
        return u1 <= u2;
      }

      // Step R4 Requirement 3: RETURN button (key L) & R3 automatic return effect:
      // The player fades into a blue flash and reappears on the roof of the Foundry Car (nearest safe standing spot)
      // or at the start / last checkpoint in Sandbox after 0.2 s, invulnerable during it.
      // Cooldown 3 s, shown as a ring on the button. Adds 8% heat. No wire or line is drawn.
      function startTetherRecall(pl, isAutoOut) {
        if (GAME.playMode === "RUN" && GAME.runState.rebuildTimer > 0) return false;
        if (!isAutoOut) {
          if (pl.overheatTimer > 0 || pl.tetherRecalling || pl.returnFadeTimer > 0 || pl.tetherRecallCooldownTimer > 0) {
            return false;
          }
        }
        var hp = GAME.runState ? GAME.runState.harpoon : null;
        if (hp && hp.active) {
          finishHarpoonAndReattach(pl, hp);
        }

        pl.tetherRecalling = true;
        pl.returnIsAutoOut = !!isAutoOut;
        pl.returnFadeMax = CFG.returnFadeDuration || 0.20;
        pl.returnFadeTimer = pl.returnFadeMax;
        if (!isAutoOut) {
          pl.tetherRecallCooldownTimer = CFG.tetherRecallCooldown;
          pl.tetherRecallCooldownMax = CFG.tetherRecallCooldown;
          addPlayerHeatPoints(pl, CFG.tetherRecallHeatCost);
        }
        pl.invulnTimer = Math.max(pl.invulnTimer, pl.returnFadeMax + 0.35);
        pl.drillImmuneTimer = Math.max(pl.drillImmuneTimer, CFG.drillImmuneTime);
        pl.inDrillZone = false;
        pl.hurtLockTimer = 0;
        pl.bladeTimer = 0;
        pl.parryWindowTimer = 0;
        pl.vx = 0;
        pl.vy = 0;
        pl.airJumpsLeft = Math.max(pl.airJumpsLeft || 0, CFG.maxAirJumps);

        if (GAME.runState) {
          GAME.runState.returningFlashTimer = 0.25;
          if (isAutoOut) {
            GAME.runState.returningBannerTimer = 1.4;
          }
        }

        spawnSparkBurst(pl.x + pl.w * 0.5, pl.y + pl.h * 0.5, 18, "#35E0F0");
        AUDIO.playTetherRecall();
        updateDebugPanelUI();
        return true;
      }

      // Step R4 Requirement 2: Shield without a wire — 30-pt shield (+50 with Plasma Shield Generator)
      // absorbs damage first at any distance or mode; hits show a brief blue bubble flash.
      function applyDamageToPlayer(pl, dmgAmount, numX, numY) {
        if (GAME.godmode) {
          spawnDmgNumber(numX, numY, "0", "#68e8de");
          return;
        }
        var remaining = dmgAmount;
        if (pl.shieldEnabled && pl.shield > 0) {
          var absorbed = Math.min(pl.shield, remaining);
          pl.shield = Math.max(0, pl.shield - absorbed);
          remaining -= absorbed;
          pl.shieldHitFlashTimer = 0.24;

          if (pl.shield <= 0) {
            pl.shield = 0;
            pl.shieldBreakFlashTimer = CFG.tetherShieldBreakFlashTime;
            spawnSparkBurst(pl.x + pl.w * 0.5, pl.y + pl.h * 0.5, 18, "#42c6ff");
            spawnDmgNumber(numX, numY - 12, "SHIELD BREAK!", "#5ef2ff");
            AUDIO.playShieldBreak();
          } else {
            spawnSparkBurst(pl.x + pl.w * 0.5, pl.y + pl.h * 0.5, 8, "#42c6ff");
            AUDIO.playShieldHit();
          }

          if (remaining <= 0) {
            spawnDmgNumber(numX, numY, "-" + Math.round(absorbed) + " SHD", "#5ef2ff");
            return;
          }
        }

        pl.hp = Math.max(0, pl.hp - remaining);
        spawnDmgNumber(numX, numY, Math.round(remaining), "#ff5e57");
      }

      function getCurrentThrottleConfig() {
        var idx = Math.max(0, Math.min(CFG.throttleTable.length - 1, (GAME.bastion.throttleNotch || 1) - 1));

      function setBastionThrottleNotch(notch) {
        var clamped = Math.max(1, Math.min(3, Math.round(notch)));
        var b = GAME.bastion;
        if (b.throttleNotch === clamped && b.throttleEaseTimer <= 0) {

        var tCfg = CFG.throttleTable[clamped - 1];
        b.easeStartSpeed = b.speed;

        b.throttleEaseTimer = CFG.throttleEaseTime;

        var streaks = [];

        for (i = 0; i < 36; i++) {

      function spawnRunOreNodesUpTo(maxX) {
        var rs = GAME.runState;
        var b = GAME.bastion;
        while (rs.nextOreSpawnX <= maxX) {
          rs.oreIdSeq++;
          var isCeiling = (rs.oreIdSeq % 3 === 0);
          var jitterX = ((rs.oreIdSeq * 53) % 70) - 35;
          var nodeX = Math.round(rs.nextOreSpawnX + jitterX);
          // Wall nodes sit on the background rock wall at player/drill height; ceiling nodes hang from the low rock ceiling/arch
          var nodeY = isCeiling
            ? (b.roofY - 18 + ((rs.oreIdSeq * 17) % 24))
            : (b.floorY - 38 - ((rs.oreIdSeq * 29) % 52));
          rs.oreNodes.push({
            id: rs.oreIdSeq,
            x: nodeX,
            y: nodeY,
            r: 16,
            mount: isCeiling ? "ceiling" : "wall",
            active: true,
            crystalSeed: rs.oreIdSeq,
            lastBladeSwingId: 0
          });
          rs.nextOreSpawnX += CFG.oreNodeSpacingPx;
        }

        // Remove old ore nodes far behind the train
        var minKeepX = b.rearX - CFG.runEnemyDespawnBehind;
        while (rs.oreNodes.length > 0 && (!rs.oreNodes[0].active || rs.oreNodes[0].x < minKeepX)) {
          rs.oreNodes.shift();
        }
      }

        if (!node || !node.active) return;

        var drillMult = (GAME.bladeStats && GAME.bladeStats.drillOreYieldMult) ? GAME.bladeStats.drillOreYieldMult : 1.0;
        var gained = Math.max(1, Math.round(CFG.baseOrePerNode * tCfg.oreYieldMult * drillMult));
        GAME.ore += gained;
        spawnDmgNumber(node.x, node.y - 12, "+" + gained + " Ore", "#48f0e4");
        spawnSparkBurst(node.x, node.y, byDrill ? 14 : 11, "#48f0e4");
        // Step B15 Requirement 2: Train impact shake (6 px, 0.25 s) when the drill smashes a big ore node
        if (byDrill) {
          shake(CFG.trainImpactShakeIntensity, CFG.trainImpactShakeDuration);
        }
        AUDIO.playOreHarvest();
        updateDebugPanelUI();
      }

      // Step R3 Requirement 7: Safe Foundry Car roof spawn X near the middle of the car, at least 150 px from the drill
      function getSafeFoundryRoofSpawnX() {

      // Step R3 Requirement 4: Drill hitbox is ONLY the front 70% of the spinning cone (never roof, engine body, or above roofline)
      function getDrillHitboxRect() {
        var b = GAME.bastion;

        var coneEndX = Math.round(b.drillTipX);
        var coneTopY = Math.round(b.roofY + 8);
        var coneBotY = Math.round(b.floorY - 4);
        return {
          x: coneStartX,
          y: coneTopY,
          w: Math.max(8, coneEndX - coneStartX),
          h: Math.max(16, coneBotY - coneTopY)
        };

            p.vx = -25 - Math.random() * 45;
            p.vy = -55 - Math.random() * 55;

      function spawnDrillSparksAndChips(tipX, centerY) {
        var spawned = 0;
        var i;
        for (i = 0; i < GAME.particleCap; i++) {
          var p = GAME.particles[i];
          if (!p.active) {
            var isSpark = Math.random() < 0.55;
            p.active = true;

            p.color = isSpark ? (Math.random() < 0.5 ? "#ffe394" : "#ff8826") : "#6e534b";

            if (spawned >= 2) break;
