          for (i = 0; i < CFG.maxBolts; i++) {
            var b = GAME.bolts[i];
            if (!b.active) continue;

              var cdFrac = 0;
              if (def.id === "hook" && pl.harpoonCooldownTimer > 0) {
                cdFrac = pl.harpoonCooldownTimer / Math.max(0.1, pl.harpoonCooldownMax || CFG.harpoonCooldown);
              } else if (def.id === "return" && pl.tetherRecallCooldownTimer > 0) {
                cdFrac = pl.tetherRecallCooldownTimer / Math.max(0.1, CFG.tetherRecallCooldown);
              } else if (def.id === "tripwire" && pl.tripwireCooldownTimer > 0) {
                cdFrac = pl.tripwireCooldownTimer / Math.max(0.1, pl.tripwireCooldownMax || CFG.tripwireCooldownFull);
              }
              if (cdFrac > 0) {
                var clampedCd = Math.min(1, cdFrac);
                ctx.beginPath();
                ctx.moveTo(geom.cx, geom.cy);
                ctx.arc(geom.cx, geom.cy, geom.r - 2, -Math.PI * 0.5, -Math.PI * 0.5 + Math.PI * 2 * clampedCd);
                ctx.closePath();
                ctx.fillStyle = "rgba(8, 6, 12, 0.68)";
                ctx.fill();

                // Bright cooldown ring arc ONLY while cooling down
                ctx.beginPath();
                ctx.arc(geom.cx, geom.cy, geom.r, -Math.PI * 0.5, -Math.PI * 0.5 + Math.PI * 2 * clampedCd);
                ctx.strokeStyle = "#FFC53A";
                ctx.lineWidth = 4;
                ctx.stroke();
              }

              var icSz = Math.round(geom.r * 1.05);
              RENDER.drawIcon(ctx, def.icon, geom.cx - icSz * 0.5, geom.cy - icSz * 0.5, icSz);

              // Step R3 Requirement 2: Small pip on the Jump button showing whether the air jump is available
              if (def.id === "jump") {
                var airAvail = (pl.airJumpsLeft || 0) > 0;
                var pipX = geom.cx + geom.r * 0.62;
                var pipY = geom.cy - geom.r * 0.62;
                ctx.beginPath();
                ctx.arc(pipX, pipY, 5.5, 0, Math.PI * 2);
                ctx.fillStyle = airAvail ? "#2FE6A0" : "#2B2B33";
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = "#0C0A10";
                ctx.stroke();
                if (airAvail) {
                  ctx.beginPath();
                  ctx.arc(pipX, pipY, 2.2, 0, Math.PI * 2);
                  ctx.fillStyle = "#ffffff";
                  ctx.fill();
                }
              }

              // Label under every round button in 14 px white text (+ key name only after keyboard/mouse used)
              var lblText = def.label;
              if (def.id === "tripwire" && tw && tw.active) {
                lblText = "RETRACT";
              } else if (def.id === "hook" && hp && hp.active) {
                lblText = hp.state;
              }
              if (showKeys && def.key) {
                lblText += " [" + def.key + "]";
              }
              RENDER.drawOutlinedHudText(ctx, lblText, geom.cx, geom.cy + geom.r + 15, "#ffffff", "center", 14);
            }

            // Edit Controls outline & selection ring
            if (isEditMode) {
              ctx.globalAlpha = 1.0;
              var isSel = selId === def.id;
              ctx.strokeStyle = isSel ? "#FFC53A" : "rgba(255, 255, 255, 0.55)";
              ctx.lineWidth = isSel ? 2.8 : 1.4;
              ctx.setLineDash(isSel ? [] : [4, 3]);
              if (def.shape === "circle" || def.shape === "stick") {
                ctx.beginPath();
                ctx.arc(geom.cx, geom.cy, geom.r + 3, 0, Math.PI * 2);
                ctx.stroke();
              } else {
                ctx.strokeRect(geom.x - 2, geom.y - 2, geom.w + 4, geom.h + 4);
              }
              ctx.setLineDash([]);
            }

            // Debug: Show hit areas
            if (GAME.showHitAreasDebug || GAME.showTouchZonesDebug) {
              ctx.globalAlpha = 0.95;
              ctx.strokeStyle = "#2FE6A0";
              ctx.lineWidth = 2;
              ctx.setLineDash([3, 3]);
              if (def.shape === "circle" || def.shape === "stick") {
                ctx.beginPath();
                ctx.arc(geom.cx, geom.cy, geom.r, 0, Math.PI * 2);
                ctx.stroke();
              } else {
                ctx.strokeRect(geom.x, geom.y, geom.w, geom.h);
              }
              ctx.setLineDash([]);
            }

            ctx.restore();
          }
        },

        // Helper: draw riveted dark-steel plate with brass border (reused by Foundry, Pause, and Settings)
        drawRivetedSteelPanel: function (ctx, x, y, w, h, titleText, showAnvilIcon) {
          ctx.save();
          // Outer dark outline
          ctx.fillStyle = "#0C0A10";
          RENDER.fillRoundRect(ctx, x - 3, y - 3, w + 6, h + 6, 10);
          // Main dark steel body
          ctx.fillStyle = "#1B1E28";
          RENDER.fillRoundRect(ctx, x, y, w, h, 8);
          // Inner steel plate bevel
          ctx.fillStyle = "#232734";
          ctx.fillRect(x + 6, y + 6, w - 12, h - 12);
          ctx.strokeStyle = "#C9962E";
          ctx.lineWidth = 2.2;
          RENDER.strokeRoundRect(ctx, x, y, w, h, 8);
          ctx.strokeStyle = "#3A4154";
          ctx.lineWidth = 1;
          ctx.strokeRect(x + 6, y + 6, w - 12, h - 12);

          // Corner & edge rivets along the steel plate
          var rivetPts = [
            [x + 12, y + 12],
            [x + w - 12, y + 12],
            [x + 12, y + h - 12],
            [x + w - 12, y + h - 12],
            [x + Math.round(w * 0.33), y + 10],
            [x + Math.round(w * 0.67), y + 10],
            [x + Math.round(w * 0.33), y + h - 10],
            [x + Math.round(w * 0.67), y + h - 10],
            [x + 10, y + Math.round(h * 0.5)],
            [x + w - 10, y + Math.round(h * 0.5)]
          ];
          var ri;
          for (ri = 0; ri < rivetPts.length; ri++) {
            var rx = rivetPts[ri][0];
            var ry = rivetPts[ri][1];
            ctx.fillStyle = "#0C0A10";
            ctx.fillRect(rx - 3, ry - 3, 6, 6);
            ctx.fillStyle = "#8C95A3";
            ctx.fillRect(rx - 2, ry - 2, 4, 4);
            ctx.fillStyle = "#D8E2F0";
            ctx.fillRect(rx - 2, ry - 2, 2, 2);
          }

          if (titleText) {
            var tbX = x + 10;
            var tbY = y + 8;
            var tbW = w - 20;
            var tbH = 38;
            ctx.fillStyle = "#2A2018";
            ctx.fillRect(tbX, tbY, tbW, tbH);
            ctx.fillStyle = "#C9962E";
            ctx.fillRect(tbX, tbY, tbW, 3);
            ctx.fillRect(tbX, tbY + tbH - 2, tbW, 2);
            ctx.strokeStyle = "#FFC53A";
            ctx.lineWidth = 1.5;
            ctx.strokeRect(tbX, tbY, tbW, tbH);

            var titleStartX = tbX + 14;
            if (showAnvilIcon) {
              RENDER.drawIcon(ctx, "anvil", tbX + 12, tbY + 7, 24);
              titleStartX = tbX + 44;
            }
            ctx.textAlign = "left";
            ctx.font = "bold 20px monospace";
            ctx.fillStyle = "#FFC53A";
            ctx.fillText(titleText, titleStartX, tbY + 26);
          }
          ctx.restore();
        },

        // Step R1 Requirement 6 & Step R7 Requirement 6:
        // Pixel-style bar fills with a 2 px highlight, pixel icons, and brass/dark-metal framing
        drawBar: function (ctx, x, y, w, h, fraction, colour, icon, text, fontPx) {
          var frac = Math.max(0, Math.min(1, Number(fraction) || 0));
          var rx = Math.round(x);
          var ry = Math.round(y);
          var rw = Math.round(w);
          var rh = Math.round(h);
          ctx.save();
          // Dark metal backing with pixel border
          ctx.fillStyle = "#0C0A10";
          ctx.fillRect(rx - 1, ry - 1, rw + 2, rh + 2);
          ctx.fillStyle = "#171422";
          ctx.fillRect(rx, ry, rw, rh);

          var fillW = Math.round((rw - 4) * frac);
          if (fillW > 0) {
            ctx.fillStyle = colour || "#2FE6A0";
            ctx.fillRect(rx + 2, ry + 2, fillW, rh - 4);
            // Step R7 Requirement 6: Pixel-style bar fill with a crisp 2 px top highlight
            ctx.fillStyle = "rgba(255, 255, 255, 0.36)";
            ctx.fillRect(rx + 2, ry + 2, fillW, 2);
            // Subtle bottom shade strip for chunky pixel depth
            if (rh >= 14) {
              ctx.fillStyle = "rgba(12, 10, 16, 0.28)";
              ctx.fillRect(rx + 2, ry + rh - 4, fillW, 2);
            }
          }

          // Thin brass border
          ctx.strokeStyle = "#C9962E";
          ctx.lineWidth = 1.5;
          ctx.strokeRect(rx + 0.5, ry + 0.5, rw - 1, rh - 1);

          var textStartX = rx + 8;
          if (icon) {
            var icSz = Math.min(20, Math.max(14, rh - 2));
            RENDER.drawIcon(ctx, icon, rx + 4, ry + Math.round((rh - icSz) * 0.5), icSz);
            textStartX = rx + icSz + 8;
          }

          if (text) {
            var fPx = fontPx || 18;
            var textY = ry + Math.round(rh * 0.5) + Math.round(fPx * 0.34);
            RENDER.drawOutlinedHudText(ctx, text, textStartX, textY, "#ffffff", "left", fPx);
          }

          if (GAME.hudBoxes) {
            GAME.hudBoxes.push({ x: rx, y: ry, w: rw, h: rh });
          }
          ctx.restore();
        },

        drawHudStatus: function (ctx, curZone, curBiome) {
          var pl = GAME.player;
          var b = GAME.bastion;
          var rs = GAME.runState;
          var tCfg = getCurrentThrottleConfig();
          var lw = CFG.logicalWidth;
          var lh = CFG.logicalHeight;
          GAME.hudBoxes = [];

          // Step R3 Requirement 8 + Step R4 Requirement 3: Blue flash when teleporting via Return or out-of-bounds return
          if (rs && rs.returningFlashTimer > 0) {
            ctx.save();
            ctx.fillStyle = "rgba(53, 224, 240, " + (Math.min(1, rs.returningFlashTimer / 0.45) * 0.38).toFixed(2) + ")";
            ctx.fillRect(0, 0, lw, lh);
            ctx.restore();
          }

          // ===================================================================
          // 1. TOP-LEFT STACK (x = 16, y = 12):
          //    Step R7 Requirement 6: Dark metal rounded back with a thin brass
          //    border behind each bar group, pixel hearts, shield bar, thermal bar.
          // ===================================================================
          var lx = 16;
          var barW = 240;
          var hpY = 12;
          var hpH = 24;
          var shY = hpY + hpH + 5; // y = 41
          var shH = 16;
          var htY = shY + shH + 5; // y = 62
          var htH = 18;

          // Dark metal rounded back with thin brass border behind Top-Left bar group
          ctx.save();
          ctx.fillStyle = "rgba(18, 16, 28, 0.90)";
          ctx.strokeStyle = "#C9962E";
          ctx.lineWidth = 1.6;
          RENDER.fillRoundRect(ctx, lx - 5, hpY - 4, barW + 10, (htY + htH) - hpY + 8, 7);
          RENDER.strokeRoundRect(ctx, lx - 5, hpY - 4, barW + 10, (htY + htH) - hpY + 8, 7);
          ctx.restore();

          // 1a. Health Bar (240 x 24) with pixel hearts and HP numbers
          var hpPct = Math.max(0, Math.min(1, pl.hp / Math.max(1, pl.maxHp)));
          var hpCol = hpPct < 0.25 ? "#e74c3c" : (hpPct < 0.50 ? "#FFC53A" : "#E03C32");
          var hpText = Math.ceil(pl.hp) + " / " + pl.maxHp + (GAME.godmode ? " GOD" : "");
          drawBar(lx, hpY, barW, hpH, hpPct, hpCol, "heart", hpText);

          // Draw row of 5 small pixel hearts on the right side of the HP bar
          var heartCount = 5;
          var filledHearts = Math.ceil(hpPct * heartCount - 0.01);
          var hi;
          for (hi = 0; hi < heartCount; hi++) {
            var hSpr = hi < filledHearts ? "icon_heart" : "icon_heart_empty";
            if (SPRITES[hSpr] && SPRITES[hSpr][0]) {
              drawSprite(ctx, hSpr, 0, lx + barW - (heartCount - hi) * 14 - 4, hpY + 6, false, 1);
            }
          }

          // 1b. Shield Bar (240 x 16) — Blue droplet/shield bar
          var hudMaxShield = pl.maxShield || CFG.tetherShieldMax;
          var shPct = pl.shieldEnabled ? Math.max(0, Math.min(1, pl.shield / Math.max(1, hudMaxShield))) : 0;
          var shCol = !pl.shieldEnabled ? "#5A6270" : (pl.tetherInShieldRange ? "#35E0F0" : "#28a8c4");
          var shText = !pl.shieldEnabled
            ? "OFF"
            : (Math.floor(pl.shield) + " / " + hudMaxShield);
          drawBar(lx, shY, barW, shH, shPct, shCol, "shield", shText);

          // 1c. Thermal Gauge Bar (240 x 18) with Redline band (75%..95%) marked and percent
          var heatPct = Math.max(0, Math.min(1, pl.heat / CFG.heatMax));
          var isOverheat = pl.overheatTimer > 0;
          var flashOn = isOverheat && Math.floor(GAME.time * 14) % 2 === 0;
          var coreStats = GAME.bladeStats;
          var heatCol = "#35E0F0";
          if (isOverheat || pl.heat >= CFG.heatRedlineMax) {
            heatCol = flashOn ? "#FFC53A" : "#FF6A1A";
          } else if (pl.heat >= CFG.heatRedlineMin) {
            heatCol = coreStats ? coreStats.coreColor : "#FF8A1E";
          }
          var heatText = isOverheat
            ? ("OVERHEAT " + Math.round(pl.heat) + "%")
            : (Math.round(pl.heat) + "%" + (pl.heat >= CFG.heatRedlineMin ? " REDLINE" : ""));
          drawBar(lx, htY, barW, htH, heatPct, heatCol, "flame", "");

          // Mark Redline band (75% to 95%) on the Thermal Gauge bar
          var rlX1 = lx + 2 + Math.round((barW - 4) * (CFG.heatRedlineMin / CFG.heatMax));
          var rlX2 = lx + 2 + Math.round((barW - 4) * (CFG.heatRedlineMax / CFG.heatMax));
          ctx.save();
          ctx.fillStyle = "rgba(255, 138, 30, 0.28)";
          ctx.fillRect(rlX1, htY + 2, rlX2 - rlX1, htH - 4);
          ctx.fillStyle = "#FFC53A";
          ctx.fillRect(rlX1, htY, 2, htH);
          ctx.fillStyle = "#FF6A1A";
          ctx.fillRect(rlX2, htY, 2, htH);
          ctx.restore();
          RENDER.drawOutlinedHudText(ctx, heatText, lx + 25, htY + htH - 2, "#ffffff", "left", 18);

          // ===================================================================
          // 2. TOP-CENTER: Slim bar 280 x 14 showing kilometre progress
          //    with the zone name under it (16 px text) inside a dark metal
          //    rounded back with a thin brass border.
          // ===================================================================
          var cw = 280;
          var ch = 14;
          var cx = Math.round((lw - cw) * 0.5);
          var cy = 12;
          var curKm = GAME.playMode === "RUN"
            ? rs.distanceKm
            : ((pl.x + pl.w * 0.5) / CFG.kmLengthPx);
          var maxKm = GAME.playMode === "RUN"
            ? rs.targetKm
            : (GAME.worldWidth / CFG.kmLengthPx);
          var kmPct = Math.max(0, Math.min(1, curKm / Math.max(0.01, maxKm)));
          var progCol = GAME.playMode === "RUN" ? tCfg.color : "#FF8A1E";

          ctx.save();
          ctx.fillStyle = "rgba(18, 16, 28, 0.90)";
          ctx.strokeStyle = "#C9962E";
          ctx.lineWidth = 1.5;
          RENDER.fillRoundRect(ctx, cx - 6, cy - 4, cw + 12, ch + 28, 7);
          RENDER.strokeRoundRect(ctx, cx - 6, cy - 4, cw + 12, ch + 28, 7);
          ctx.restore();

          drawBar(cx, cy, cw, ch, kmPct, progCol, null, "");
          var kmLabel = fmt(curKm, 1) + " / " + (GAME.playMode === "RUN" ? maxKm : fmt(maxKm, 1)) + " km";
          RENDER.drawOutlinedHudText(ctx, kmLabel, cx + cw * 0.5, cy + ch - 1, "#ffffff", "center", 18);

          var zoneNameRaw = curBiome
            ? curBiome.name.toUpperCase()
            : (curZone ? curZone.name.toUpperCase() : "RUST CAVERN");
          RENDER.drawOutlinedHudText(ctx, zoneNameRaw, cx + cw * 0.5, cy + ch + 18, "#f5e8d3", "center", 16);
          GAME.hudBoxes.push({ x: cx, y: cy + ch + 2, w: cw, h: 20 });

          // Checkpoint Banner (at least 20 px text)
          var bannerOffsetY = 56;
          if (GAME.playMode === "SANDBOX" && GAME.checkpointBannerTimer > 0) {
            var bAlpha = Math.min(1, GAME.checkpointBannerTimer * 2.5);
            ctx.save();
            ctx.globalAlpha = bAlpha;
            ctx.fillStyle = "rgba(12, 10, 16, 0.92)";
            ctx.strokeStyle = "#2FE6A0";
            ctx.lineWidth = 2;
            ctx.fillRect(lw * 0.5 - 130, bannerOffsetY, 260, 34);
            ctx.strokeRect(lw * 0.5 - 130, bannerOffsetY, 260, 34);
            RENDER.drawOutlinedHudText(ctx, "CHECKPOINT", lw * 0.5, bannerOffsetY + 24, "#2FE6A0", "center", 20);
            ctx.restore();
            bannerOffsetY += 40;
          }

          // Step R3 Requirement 8: RETURNING banner when player is > 1400 px behind train or > 900 px ahead of drill
          if (GAME.playMode === "RUN" && (rs.returningBannerTimer > 0 || rs.outOfBoundsTimer > 0.25)) {
            var retText = rs.returningBannerTimer > 0
              ? "RETURNING"
              : ("RETURNING IN " + fmt(Math.max(0, CFG.outOfBoundsReturnTime - rs.outOfBoundsTimer), 1) + "s");
            ctx.save();
            ctx.fillStyle = "rgba(12, 10, 16, 0.92)";
            ctx.strokeStyle = "#35E0F0";
            ctx.lineWidth = 2;
            ctx.fillRect(lw * 0.5 - 140, bannerOffsetY, 280, 34);
            ctx.strokeRect(lw * 0.5 - 140, bannerOffsetY, 280, 34);
            RENDER.drawOutlinedHudText(ctx, retText, lw * 0.5, bannerOffsetY + 24, "#35E0F0", "center", 20);
            ctx.restore();
            bannerOffsetY += 40;
          }

          // Step R4 Requirement 6: SWITCH button (key Q) shows the equipped Blade Edge name and icon for 1 s (or NO OTHER EDGE)
          if (GAME.switchEdgeFlashTimer > 0) {
            var swAlpha = Math.min(1, GAME.switchEdgeFlashTimer * 3.0);
            var swTxt = GAME.switchEdgeFlashText || "CLEAVER";
            var isNoOther = swTxt === "NO OTHER EDGE";
            var swBoxW = 280;
            var swBoxH = 36;
            var swBoxX = Math.round(lw * 0.5 - swBoxW * 0.5);
            var swBoxY = bannerOffsetY;
            ctx.save();
            ctx.globalAlpha = swAlpha;
            ctx.fillStyle = "rgba(12, 10, 16, 0.92)";
            ctx.strokeStyle = isNoOther ? "#8C95A3" : "#FFC53A";
            ctx.lineWidth = 2;
            ctx.fillRect(swBoxX, swBoxY, swBoxW, swBoxH);
            ctx.strokeRect(swBoxX, swBoxY, swBoxW, swBoxH);
            RENDER.drawIcon(ctx, isNoOther ? "cycle" : "sword", swBoxX + 14, swBoxY + 7, 22);
            RENDER.drawOutlinedHudText(
              ctx,
              swTxt,
              swBoxX + swBoxW * 0.5 + 10,
              swBoxY + 25,
              isNoOther ? "#D9E6F2" : "#FFC53A",
              "center",
              20
            );
            ctx.restore();
          }

          // ===================================================================
          // 3. TOP-RIGHT STACK (ends at x = width - 16):
          //    - Dark metal rounded back with thin brass border behind bar group
          //    - Hull bar 240 x 24 with train icon
          //    - Small pixel-art wagon icons under the Hull bar once wagons exist
          //    - Ember-Heart bar 240 x 16 with ember icon
          //    - Row of 3 resource chips (Ore, Ingots, Materials) with 12x12 pixel icons
          //    - Framed weapon slot showing the equipped Blade Edge & key letter
          //    - Throttle: vertical 3-step indicator with Up/Down buttons
          // ===================================================================
          var rw = 240;
          var rx = lw - 16 - rw;
          var hullY = 12;
          var hullH = 24;

          var hasWagons = false;
          var wi;
          if (b.wagonSlots) {
            for (wi = 0; wi < CFG.wagonSlotCount; wi++) {
              if (b.wagonSlots[wi]) {
                hasWagons = true;
                break;
              }
            }
          }
          var groupRightH = hullH + (hasWagons ? 18 : 0) + 4 + 16 + 5 + 26;
          ctx.save();
          ctx.fillStyle = "rgba(18, 16, 28, 0.90)";
          ctx.strokeStyle = "#C9962E";
          ctx.lineWidth = 1.6;
          RENDER.fillRoundRect(ctx, rx - 5, hullY - 4, rw + 10, groupRightH + 8, 7);
          RENDER.strokeRoundRect(ctx, rx - 5, hullY - 4, rw + 10, groupRightH + 8, 7);
          ctx.restore();

          // 3a. Hull Bar (240 x 24) with train icon
          var hullPct = Math.max(0, Math.min(1, b.hull / Math.max(1, b.maxHull)));
          var hullCol = hullPct < 0.25 ? "#e74c3c" : (hullPct < 0.50 ? "#FFC53A" : "#C9962E");
          var hullText = Math.ceil(b.hull) + " / " + b.maxHull;
          drawBar(rx, hullY, rw, hullH, hullPct, hullCol, "train", hullText);

          var curRightY = hullY + hullH + 4;
          // Once wagons exist, show them as 12x12 pixel-art icons under the Hull bar
          if (hasWagons) {
            var wIconW = 28;
            var wIconH = 14;
            var wGap = 6;
            var wRowX = rx;
            for (wi = 0; wi < CFG.wagonSlotCount; wi++) {
              var wId = b.wagonSlots[wi];
              var wDef = wId ? getWagonDef(wId) : null;
              var wx = wRowX + wi * (wIconW + wGap);
              ctx.save();
              ctx.fillStyle = "#171422";
              ctx.fillRect(wx, curRightY, wIconW, wIconH);
              ctx.strokeStyle = wDef ? wDef.colour : "#5A6270";
              ctx.lineWidth = 1.4;
              ctx.strokeRect(wx, curRightY, wIconW, wIconH);
              if (wId && SPRITES["icon_wagon_" + wId] && SPRITES["icon_wagon_" + wId][0]) {
                drawSprite(ctx, "icon_wagon_" + wId, 0, wx + 8, curRightY + 1, false, 1);
              }
              ctx.restore();
            }
            GAME.hudBoxes.push({ x: rx, y: curRightY, w: CFG.wagonSlotCount * (wIconW + wGap) - wGap, h: wIconH });
            curRightY += wIconH + 4;
          }

          // 3b. Ember-Heart Bar (240 x 16) with ember icon
          var heartY = curRightY;
          var heartH = 16;
          var heartPct = Math.max(0, Math.min(1, b.emberHeart / Math.max(1, b.maxEmberHeart)));
          var heartCol = heartPct < 0.25 ? "#e74c3c" : "#FF6A1A";
          var heartText = Math.ceil(b.emberHeart) + "%";
          drawBar(rx, heartY, rw, heartH, heartPct, heartCol, "ember", heartText);

          // 3c. Row of 3 resource chips (Ore, Ingots, Materials), each with a 12x12 pixel icon and a number
          var resY = heartY + heartH + 5;
          var resH = 26;
          var chipGap = 6;
          var chipW = Math.floor((rw - chipGap * 2) / 3); // 76 px each
          var chips = [
            { icon: "ore", val: GAME.ore, border: "#35E0F0", textCol: "#e8fcff" },
            { icon: "ingot", val: GAME.inventory.ingot || 0, border: "#C9962E", textCol: "#ffe8a3" },
            { icon: "materials", val: getTotalInventoryUnits(), border: "#2FE6A0", textCol: "#d9ffef" }
          ];
          var ci;
          for (ci = 0; ci < chips.length; ci++) {
            var chp = chips[ci];
            var chX = rx + ci * (chipW + chipGap);
            ctx.save();
            ctx.fillStyle = "#171422";
            ctx.fillRect(chX, resY, chipW, resH);
            ctx.strokeStyle = chp.border;
            ctx.lineWidth = 1.6;
            ctx.strokeRect(chX, resY, chipW, resH);
            ctx.restore();

            RENDER.drawIcon(ctx, chp.icon, chX + 4, resY + 4, 18);
            RENDER.drawOutlinedHudText(
              ctx,
              String(chp.val),
              chX + chipW - 5,
              resY + resH - 6,
              chp.textCol,
              "right",
              18
            );
            GAME.hudBoxes.push({ x: chX, y: resY, w: chipW, h: resH });
          }
          // Clicking/tapping the resource chips row opens Foundry / Ledger
          GAME.hudMatCounterRect = { x: rx, y: resY, w: rw, h: resH };

          // 3d. Step R7 Requirement 6: Framed weapon slot at the top-right showing the equipped Blade Edge + small key letter
          var thY = resY + resH + 8;
          var thH = 44;
          var indW = 24;
          var indX = lw - 16 - indW; // Right edge at x = width - 16
          var btnW = 36;
          var btnH = 20;
          var btnX = indX - btnW - 4;

          var wsW = 46;
          var wsH = 44;
          var wsX = btnX - wsW - 8;
          var wsY = thY;
          var eqEdgeId = (GAME.loadout && GAME.loadout.edge) || "cleaver";
          var eqEdgeDef = getPartDef("edge", eqEdgeId);
          GAME.hudWeaponSlotRect = { x: wsX, y: wsY, w: wsW, h: wsH };

          ctx.save();
          ctx.fillStyle = "#171422";
          RENDER.fillRoundRect(ctx, wsX, wsY, wsW, wsH, 6);
          ctx.strokeStyle = "#0C0A10";
          ctx.lineWidth = 3;
          RENDER.strokeRoundRect(ctx, wsX, wsY, wsW, wsH, 6);
          ctx.strokeStyle = eqEdgeDef ? eqEdgeDef.color : "#C9962E";
          ctx.lineWidth = 2;
          RENDER.strokeRoundRect(ctx, wsX, wsY, wsW, wsH, 6);
          // Corner brass rivets on the weapon frame
          ctx.fillStyle = "#FFC53A";
          ctx.fillRect(wsX + 3, wsY + 3, 2, 2);
          ctx.fillRect(wsX + wsW - 5, wsY + 3, 2, 2);
          ctx.fillRect(wsX + 3, wsY + wsH - 5, 2, 2);
          ctx.fillRect(wsX + wsW - 5, wsY + wsH - 5, 2, 2);

          // Draw 12x12 Blade Edge icon at 2x (24x24) in the center of the framed slot
          var edgeIconKey = "icon_edge_" + eqEdgeId;
          if (SPRITES[edgeIconKey] && SPRITES[edgeIconKey][0]) {
            drawSprite(ctx, edgeIconKey, 0, wsX + 11, wsY + 6, false, 2);
          } else if (SPRITES.item_blade && SPRITES.item_blade[0]) {
            drawSprite(ctx, "item_blade", 0, wsX + 7, wsY + 6, false, 2);
          }
          // Small key letter badge at bottom-right of the framed weapon slot
          RENDER.drawOutlinedHudText(ctx, "Q", wsX + wsW - 5, wsY + wsH - 4, "#FFC53A", "right", 14);
          ctx.restore();
          GAME.hudBoxes.push({ x: wsX, y: wsY, w: wsW, h: wsH });

          // 3e. Throttle: small vertical 3-step indicator at the right edge below the resources,
          //     with its Up and Down buttons beside it.
          GAME.hudThrottleUpRect = { x: btnX, y: thY, w: btnW, h: btnH };
          GAME.hudThrottleDownRect = { x: btnX, y: thY + thH - btnH, w: btnW, h: btnH };

          var canUp = b.throttleNotch < 3;
          ctx.save();
          ctx.fillStyle = canUp ? "#2B2B33" : "rgba(20, 18, 26, 0.85)";
          ctx.fillRect(btnX, thY, btnW, btnH);
          ctx.strokeStyle = canUp ? "#C9962E" : "#5A6270";
          ctx.lineWidth = 1.5;
          ctx.strokeRect(btnX, thY, btnW, btnH);
          RENDER.drawOutlinedHudText(ctx, "\u25B2", btnX + btnW * 0.5, thY + btnH - 3, canUp ? "#FFC53A" : "#8C95A3", "center", 18);

          var canDown = b.throttleNotch > 1;
          var dnY = thY + thH - btnH;
          ctx.fillStyle = canDown ? "#2B2B33" : "rgba(20, 18, 26, 0.85)";
          ctx.fillRect(btnX, dnY, btnW, btnH);
          ctx.strokeStyle = canDown ? "#C9962E" : "#5A6270";
          ctx.lineWidth = 1.5;
          ctx.strokeRect(btnX, dnY, btnW, btnH);
          RENDER.drawOutlinedHudText(ctx, "\u25BC", btnX + btnW * 0.5, dnY + btnH - 3, canDown ? "#FFC53A" : "#8C95A3", "center", 18);

          ctx.fillStyle = "rgba(12, 10, 16, 0.94)";
          ctx.fillRect(indX, thY, indW, thH);
          ctx.strokeStyle = "#C9962E";
          ctx.lineWidth = 1.5;
          ctx.strokeRect(indX, thY, indW, thH);

          var stepH = 11;
          var stepGap = 2;
          var sIdx;
          for (sIdx = 1; sIdx <= 3; sIdx++) {
            var sy = thY + 3 + (3 - sIdx) * (stepH + stepGap);
            var activeStep = b.throttleNotch >= sIdx;
            var stepCol = sIdx === 3 ? "#FF6A1A" : (sIdx === 2 ? "#FFC53A" : "#2FE6A0");
            ctx.fillStyle = activeStep ? stepCol : "#2B2B33";
            ctx.fillRect(indX + 3, sy, indW - 6, stepH);
          }
          ctx.restore();
          GAME.hudBoxes.push({ x: btnX, y: thY, w: btnW + 4 + indW, h: thH });

          // ===================================================================
          // 4. DEBUG OVERLAYS: Show safe areas, Show HUD boxes, Show touch zones
          // ===================================================================
          if (GAME.showSafeAreasDebug) {
            ctx.save();
            ctx.strokeStyle = "#2FE6A0";
            ctx.lineWidth = 1.5;
            ctx.setLineDash([6, 4]);
            ctx.strokeRect(12, 12, lw - 24, lh - 24);

            ctx.strokeStyle = "#FF6A1A";
            ctx.beginPath();
            ctx.moveTo(0, 100);
            ctx.lineTo(lw, 100);
            ctx.stroke();

            var railScreenY = Math.round(lh * (CFG.railScreenFractionY || 0.70));
            ctx.strokeStyle = "#FFC53A";
            ctx.beginPath();
            ctx.moveTo(0, railScreenY);
            ctx.lineTo(lw, railScreenY);
            ctx.stroke();

            var midLeftX = Math.round(lw * 0.30);
            var midRightX = Math.round(lw * 0.70);
            ctx.strokeStyle = "rgba(53, 224, 240, 0.65)";
            ctx.beginPath();
            ctx.moveTo(midLeftX, 0);
            ctx.lineTo(midLeftX, lh);
            ctx.moveTo(midRightX, 0);
            ctx.lineTo(midRightX, lh);
            ctx.stroke();
            ctx.restore();
          }

          if (GAME.showHudBoxesDebug || GAME.showTouchZonesDebug) {
            ctx.save();
            ctx.strokeStyle = "#35E0F0";
            ctx.lineWidth = 1.8;
            ctx.setLineDash([4, 3]);
            var bi;
            for (bi = 0; bi < GAME.hudBoxes.length; bi++) {
              var hb = GAME.hudBoxes[bi];
              ctx.strokeRect(hb.x, hb.y, hb.w, hb.h);
            }
            ctx.restore();
          }

          // 5. Step R2 Touch Controls (drawn on canvas during active gameplay)
          if (GAME.mode === "PLAYING" && !GAME.ledgerOpen) {
            RENDER.drawTouchControls(ctx, false);
          }

          // 6. Run mode 2-second player rebuild fade overlay (at least 20 px banner text)
          if (GAME.playMode === "RUN" && GAME.runState.rebuildTimer > 0) {
            var rebProg = 1 - GAME.runState.rebuildTimer / CFG.runPlayerRebuildTime;
            var fadeAlpha = Math.sin(rebProg * Math.PI) * 0.55;
            ctx.save();
            ctx.fillStyle = "rgba(18, 8, 12, " + fadeAlpha.toFixed(2) + ")";
            ctx.fillRect(0, 0, lw, lh);

            ctx.fillStyle = "rgba(24, 16, 28, 0.92)";
            ctx.strokeStyle = "#FF8A1E";
            ctx.lineWidth = 2;
            ctx.fillRect(lw * 0.5 - 240, 206, 480, 78);
            ctx.strokeRect(lw * 0.5 - 240, 206, 480, 78);

            RENDER.drawOutlinedHudText(
              ctx,
              "REBUILDING IN FOUNDRY CAR...",
              lw * 0.5,
              240,
              "#FFC53A",
              "center",
              20
            );
            RENDER.drawOutlinedHudText(
              ctx,
              "Ready in " + fmt(GAME.runState.rebuildTimer, 1) + "s · Deaths: " + GAME.runState.playerDeaths,
              lw * 0.5,
              268,
              "#ffffff",
              "center",
              18
            );
            ctx.restore();
          }
        },

        // Step R7 Requirement 7: Train tab — big side view of the train with the 4 wagon slots
        // as framed boxes holding the wagon sprites at 2x with names under them;
        // the wagon list as scrollable cards with a sprite, name, cost chips with icons,
        // and a BUILD button (green when affordable, grey when not).
        drawFoundryTrainTab: function (ctx, viewX, viewY, viewW, viewH) {
          var b = GAME.bastion;
          var i;

          // 1. Big Side View of the Train with Engine, Foundry Car, and the 4 Wagon Slots (sprites at 2x)
          var sideY = viewY + 2;
          var sideH = 148;
          ctx.fillStyle = "#141822";
          ctx.fillRect(viewX + 4, sideY, viewW - 8, sideH);
          ctx.strokeStyle = "#C9962E";
          ctx.lineWidth = 2;
          ctx.strokeRect(viewX + 4, sideY, viewW - 8, sideH);

          // Section Header >= 20 px
          ctx.textAlign = "left";
          ctx.font = "bold 20px monospace";
          ctx.fillStyle = "#FFC53A";
          ctx.fillText("THE BASTION CONSIST — 4 WAGON SLOTS (2x SPRITE VIEW)", viewX + 14, sideY + 23);

          // Rail track line across bottom of train side-view
          var trackY = sideY + 114;
          ctx.fillStyle = "#6B3A1E";
          for (i = 0; i < 42; i++) {
            ctx.fillRect(viewX + 12 + i * 21, trackY + 2, 12, 4);
          }
          ctx.fillStyle = "#8C95A3";
          ctx.fillRect(viewX + 10, trackY, viewW - 20, 3);

          // 4 Framed Wagon Slot Boxes (holding 45x30 wagon sprites at 2x = 90x60) + Foundry Car + Engine + Drill on the right
          GAME.foundrySlotRects = [];
          var slotBoxW = 142;
          var slotBoxH = 82;
          var slotGap = 10;
          var slotStartX = viewX + 14;
          var slotY = sideY + 30;

          for (i = 0; i < CFG.wagonSlotCount; i++) {
            var sx = slotStartX + i * (slotBoxW + slotGap);
            GAME.foundrySlotRects.push({ x: sx, y: slotY, w: slotBoxW, h: slotBoxH });

            var wId = (b.wagonSlots && b.wagonSlots[i]) ? b.wagonSlots[i] : null;
            var wDef = getWagonDef(wId);
            var isSelected = GAME.selectedWagonSlot === i;
            var isSwapSrc = GAME.wagonSwapSourceSlot === i;
            var slotHasCombo = b.slotCombos && b.slotCombos[i] && b.slotCombos[i].length > 0;

            ctx.fillStyle = isSwapSrc
              ? "#3b2c1e"
              : isSelected
              ? "#252B3D"
              : "#181C26";
            ctx.fillRect(sx, slotY, slotBoxW, slotBoxH);

            ctx.strokeStyle = isSwapSrc
              ? "#35E0F0"
              : isSelected
              ? "#FFC53A"
              : slotHasCombo
              ? "#2FE6A0"
              : (wDef ? wDef.colour : "#5A6270");
            ctx.lineWidth = (isSelected || isSwapSrc || slotHasCombo) ? 2.6 : 1.5;
            ctx.strokeRect(sx, slotY, slotBoxW, slotBoxH);

            // Draw Wagon Sprite at 2x (45x30 art px * 2 = 90x60 px)
            var sprKey = wDef ? ("wagon_" + wDef.id) : "wagon_empty";
            var sprX = sx + Math.round((slotBoxW - 90) * 0.5);
            var sprY = slotY + 20;
            if (SPRITES[sprKey] && SPRITES[sprKey][0]) {
              drawSprite(ctx, sprKey, 0, sprX, sprY, false, 2);
            }
            if (SPRITES.bastion_wheel && SPRITES.bastion_wheel[0]) {
              drawSprite(ctx, "bastion_wheel", 0, sprX + 8, sprY + 42, false, 2);
              drawSprite(ctx, "bastion_wheel", 0, sprX + 62, sprY + 42, false, 2);
            }

            // Slot number badge at top-left
            ctx.textAlign = "left";
            ctx.font = "bold 12px monospace";
            ctx.fillStyle = isSelected ? "#FFC53A" : "#D8E2F0";
            ctx.fillText(
              "SLOT " + (i + 1) + (isSwapSrc ? " [SWAP]" : (isSelected ? " [SEL]" : "")),
              sx + 6,
              slotY + 14
            );

            // Wagon name under the framed box
            ctx.textAlign = "center";
            ctx.font = "bold 13px monospace";
            ctx.fillStyle = wDef ? "#FFFFFF" : "#8C95A3";
            ctx.fillText(wDef ? wDef.name.toUpperCase() : "EMPTY SLOT", sx + slotBoxW * 0.5, slotY + slotBoxH + 17);
          }

          // Adjacency combo links between neighbouring slots (1-2, 2-3, 3-4)
          var pairIdx;
          for (pairIdx = 0; pairIdx < CFG.wagonSlotCount - 1; pairIdx++) {
            var leftSx = slotStartX + pairIdx * (slotBoxW + slotGap);
            var gapX = leftSx + slotBoxW;
            var pairComboMenu = getAdjacentComboBetweenSlots(pairIdx, pairIdx + 1);
            if (pairComboMenu) {
              ctx.fillStyle = pairComboMenu.colour;
              ctx.fillRect(gapX - 2, slotY + 36, slotGap + 4, 10);
              ctx.fillStyle = "#FFFFFF";
              ctx.fillRect(gapX, slotY + 39, slotGap, 4);
            } else {
              ctx.fillStyle = "#5A6270";
              ctx.fillRect(gapX, slotY + 40, slotGap, 4);
            }
          }

          // Draw Foundry Car & Bastion Engine + Drill at the front-right of the consist side view
          var fCarX = slotStartX + 4 * (slotBoxW + slotGap) + 4;
          if (SPRITES.wagon_foundry && SPRITES.wagon_foundry[0]) {
            drawSprite(ctx, "wagon_foundry", 0, fCarX, slotY + 20, false, 2);
            if (SPRITES.bastion_wheel && SPRITES.bastion_wheel[0]) {
              drawSprite(ctx, "bastion_wheel", 0, fCarX + 8, slotY + 62, false, 2);
              drawSprite(ctx, "bastion_wheel", 0, fCarX + 62, slotY + 62, false, 2);
            }
          }
          ctx.textAlign = "center";
          ctx.font = "bold 12px monospace";
          ctx.fillStyle = "#FFC53A";
          ctx.fillText("FOUNDRY", fCarX + 45, slotY + slotBoxH + 17);

          var engX = fCarX + 96;
          if (SPRITES.bastion_engine && SPRITES.bastion_engine[0]) {
            drawSprite(ctx, "bastion_engine", 0, engX, slotY + 20, false, 2);
            if (SPRITES.bastion_wheel && SPRITES.bastion_wheel[0]) {
              drawSprite(ctx, "bastion_wheel", 0, engX + 10, slotY + 62, false, 2);
              drawSprite(ctx, "bastion_wheel", 0, engX + 58, slotY + 62, false, 2);
            }
          }
          if (SPRITES.bastion_drill && SPRITES.bastion_drill[0]) {
            var dFrame = Math.floor(GAME.time * 12) % SPRITES.bastion_drill.length;
            drawSprite(ctx, "bastion_drill", dFrame, engX + 90, slotY + 20, false, 2);
          }
          ctx.fillStyle = "#FF8A1E";
          ctx.fillText("ENGINE & DRILL", engX + 68, slotY + slotBoxH + 17);

          // 2. Action Buttons Row (>= 64 px tall per R7 Requirement 9)
          var actY = sideY + sideH + 6;
          var actH = 64;
          var selSlotIdx = GAME.selectedWagonSlot;
          var selSlotOccupied = !!(b.wagonSlots && b.wagonSlots[selSlotIdx]);
          var selDesign = getWagonDef(GAME.selectedWagonId);
          var canBuildNow =
            GAME.playMode === "RUN" &&
            !selSlotOccupied &&
            selDesign &&
            selDesign.availableInB8 &&
            canAffordWagon(selDesign);

          var bBtnX = viewX + 4;
          var bBtnW = 216;
          GAME.foundryBuildBtnRect = { x: bBtnX, y: actY, w: bBtnW, h: actH };
          ctx.fillStyle = canBuildNow ? "#2FE6A0" : "#3A3D4A";
          RENDER.fillRoundRect(ctx, bBtnX, actY, bBtnW, actH, 6);
          ctx.strokeStyle = canBuildNow ? "#E6FFF5" : "#6C7385";
          ctx.lineWidth = 2;
          RENDER.strokeRoundRect(ctx, bBtnX, actY, bBtnW, actH, 6);
          ctx.textAlign = "center";
          ctx.font = "bold 18px sans-serif";
          ctx.fillStyle = canBuildNow ? "#0C0A10" : "#B0B8C8";
          ctx.fillText("BUILD IN SLOT " + (selSlotIdx + 1), bBtnX + bBtnW * 0.5, actY + 38);

          var sBtnX = bBtnX + bBtnW + 8;
          var sBtnW = 168;
          var swapActive = GAME.wagonSwapSourceSlot >= 0;
          GAME.foundrySwapBtnRect = { x: sBtnX, y: actY, w: sBtnW, h: actH };
          ctx.fillStyle = swapActive ? "#1F4A52" : "#262B38";
          RENDER.fillRoundRect(ctx, sBtnX, actY, sBtnW, actH, 6);
          ctx.strokeStyle = swapActive ? "#35E0F0" : "#C9962E";
          ctx.lineWidth = 2;
          RENDER.strokeRoundRect(ctx, sBtnX, actY, sBtnW, actH, 6);
          ctx.fillStyle = swapActive ? "#35E0F0" : "#F4EFE6";
          ctx.font = "bold 17px sans-serif";
          ctx.fillText(swapActive ? "CANCEL SWAP" : ("SWAP SLOT " + (selSlotIdx + 1)), sBtnX + sBtnW * 0.5, actY + 38);

          var rBtnX = sBtnX + sBtnW + 8;
          var rBtnW = 168;
          GAME.foundryRemoveBtnRect = { x: rBtnX, y: actY, w: rBtnW, h: actH };
          ctx.fillStyle = selSlotOccupied ? "#4A2029" : "#262B38";
          RENDER.fillRoundRect(ctx, rBtnX, actY, rBtnW, actH, 6);
          ctx.strokeStyle = selSlotOccupied ? "#FF6B6B" : "#5A6270";
          ctx.lineWidth = 2;
          RENDER.strokeRoundRect(ctx, rBtnX, actY, rBtnW, actH, 6);
          ctx.fillStyle = selSlotOccupied ? "#FFD6D6" : "#8C95A3";
          ctx.font = "bold 17px sans-serif";
          ctx.fillText("REMOVE SLOT " + (selSlotIdx + 1), rBtnX + rBtnW * 0.5, actY + 38);

          // Status & Active Combos box on right of action buttons
          var msgX = rBtnX + rBtnW + 8;
          var msgW = viewX + viewW - 4 - msgX;
          ctx.fillStyle = "#141822";
          ctx.fillRect(msgX, actY, msgW, actH);
          ctx.strokeStyle = "#C9962E";
          ctx.lineWidth = 1.5;
          ctx.strokeRect(msgX, actY, msgW, actH);
          ctx.textAlign = "left";
          ctx.font = "bold 12px monospace";
          ctx.fillStyle = "#FFC53A";
          var statusText = GAME.foundryStatusMsg ||
            ("Selected: " + (selDesign ? selDesign.name : "None"));
          ctx.fillText(statusText.slice(0, 42), msgX + 8, actY + 24);
          ctx.fillStyle = "#2FE6A0";
          var activeEffectsStr = "Active: " + getActiveWagonEffectsSummary();
          ctx.fillText(activeEffectsStr.slice(0, 42), msgX + 8, actY + 46);

          // 3. Scrollable Wagon Cards List (with sprite, name, cost chips with icons, and green/grey BUILD button)
          var listY = actY + actH + 8;
          var listH = viewY + viewH - listY - 4;
          var wagons = DATA_TABLES.wagons;
          var cols = 2;
          var cardGapX = 12;
          var cardGapY = 10;
          var wCardW = Math.floor((viewW - 24 - cardGapX) / cols);
          var wCardH = 112;
          var totalRows = Math.ceil(wagons.length / cols);
          var totalContentH = totalRows * (wCardH + cardGapY);
          GAME.foundryTrainMaxScrollY = Math.max(0, totalContentH - listH + 8);
          var scrollY = Math.max(0, Math.min(GAME.foundryTrainMaxScrollY, GAME.foundryTrainScrollY || 0));
          GAME.foundryTrainScrollY = scrollY;
          GAME.foundryWagonCardRects = [];

          ctx.save();
          ctx.beginPath();
          ctx.rect(viewX + 4, listY, viewW - 8, listH);
          ctx.clip();

          for (i = 0; i < wagons.length; i++) {
            var w = wagons[i];
            var colIdx = i % cols;
            var rowIdx = Math.floor(i / cols);
            var cx = viewX + 6 + colIdx * (wCardW + cardGapX);
            var cy = listY + rowIdx * (wCardH + cardGapY) - scrollY;
            if (cy + wCardH < listY || cy > listY + listH) continue;

            var isCardSel = GAME.selectedWagonId === w.id;
            var affordable = canAffordWagon(w);

            ctx.fillStyle = isCardSel ? "#252B3D" : "#181C26";
            ctx.fillRect(cx, cy, wCardW, wCardH);
            ctx.strokeStyle = isCardSel ? "#FFC53A" : w.colour;
            ctx.lineWidth = isCardSel ? 2.5 : 1.5;
            ctx.strokeRect(cx, cy, wCardW, wCardH);

            // Wagon sprite on left of card (at 2x = 90x60)
            var wSpr = "wagon_" + w.id;
            ctx.fillStyle = "#10131C";
            ctx.fillRect(cx + 8, cy + 10, 96, 66);
            ctx.strokeStyle = "#3A4154";
            ctx.lineWidth = 1;
            ctx.strokeRect(cx + 8, cy + 10, 96, 66);
            if (SPRITES[wSpr] && SPRITES[wSpr][0]) {
              drawSprite(ctx, wSpr, 0, cx + 11, cy + 13, false, 2);
            }

            // Wagon Name (>= 20 px header) & Effect description
            var infoX = cx + 112;
            ctx.textAlign = "left";
            ctx.font = "bold 20px sans-serif";
            ctx.fillStyle = "#FFFFFF";
            ctx.fillText(w.name, infoX, cy + 26);

            ctx.font = "12px sans-serif";
            ctx.fillStyle = "#D8E2F0";
            var effShort = w.baseEffect.length > 42 ? w.baseEffect.slice(0, 40) + "…" : w.baseEffect;
            ctx.fillText(effShort, infoX, cy + 45);

            // Cost chips with 12x12 pixel icons
            var chipX = infoX;
            var chipY = cy + 54;
            if (w.cost && w.cost.ore) {
              var hasOre = GAME.wagonsUnlockedAll || GAME.ore >= w.cost.ore;
              ctx.fillStyle = "#12151E";
              ctx.fillRect(chipX, chipY, 64, 22);
              ctx.strokeStyle = hasOre ? "#35E0F0" : "#FF6B6B";
              ctx.strokeRect(chipX, chipY, 64, 22);
              RENDER.drawIcon(ctx, "ore", chipX + 3, chipY + 3, 16);
              ctx.font = "bold 12px monospace";
              ctx.fillStyle = hasOre ? "#E8FCFF" : "#FF9B8F";
              ctx.fillText(String(w.cost.ore), chipX + 23, chipY + 15);
              chipX += 70;
            }
            if (w.cost && w.cost.materials) {
              var mKey;
              for (mKey in w.cost.materials) {
                if (Object.prototype.hasOwnProperty.call(w.cost.materials, mKey)) {
                  var need = w.cost.materials[mKey];
                  var have = GAME.wagonsUnlockedAll || (GAME.inventory[mKey] || 0) >= need;
                  ctx.fillStyle = "#12151E";
                  ctx.fillRect(chipX, chipY, 64, 22);
                  ctx.strokeStyle = have ? "#2FE6A0" : "#FF6B6B";
                  ctx.strokeRect(chipX, chipY, 64, 22);
                  RENDER.drawMaterialIcon(ctx, mKey, chipX + 11, chipY + 11, 7, false);
                  ctx.font = "bold 12px monospace";
                  ctx.fillStyle = have ? "#D9FFEF" : "#FF9B8F";
                  ctx.fillText(String(need), chipX + 23, chipY + 15);
                  chipX += 70;
                }
              }
            }

            // Card BUILD Button (64 px tall, green when affordable, grey when not)
            var cbW = 86;
            var cbH = 64;
            var cbX = cx + wCardW - cbW - 8;
            var cbY = cy + 24;
            var buildGreen = affordable && GAME.playMode === "RUN";
            ctx.fillStyle = buildGreen ? "#2FE6A0" : "#3A3D4A";
            RENDER.fillRoundRect(ctx, cbX, cbY, cbW, cbH, 6);
            ctx.strokeStyle = buildGreen ? "#E6FFF5" : "#6C7385";
            ctx.lineWidth = 2;
            RENDER.strokeRoundRect(ctx, cbX, cbY, cbW, cbH, 6);
            ctx.textAlign = "center";
            ctx.font = "bold 16px sans-serif";
            ctx.fillStyle = buildGreen ? "#0C0A10" : "#B0B8C8";
            ctx.fillText("BUILD", cbX + cbW * 0.5, cbY + 38);

            var clipTop = Math.max(listY, cy);
            var clipBot = Math.min(listY + listH, cy + wCardH);
            if (clipBot > clipTop + 8) {
              GAME.foundryWagonCardRects.push({
                x: cx,
                y: clipTop,
                w: wCardW,
                h: clipBot - clipTop,
                wagonId: w.id,
                buildBtnRect: { x: cbX, y: Math.max(listY, cbY), w: cbW, h: cbH }
              });
            }
          }
          ctx.restore();

          // Scrollbar on right of wagon cards
          if (GAME.foundryTrainMaxScrollY > 0) {
            var trkX = viewX + viewW - 10;
            ctx.fillStyle = "rgba(255,255,255,0.12)";
            ctx.fillRect(trkX, listY, 6, listH);
            var thmH = Math.max(28, Math.round((listH / totalContentH) * listH));
            var thmY = listY + Math.round((scrollY / GAME.foundryTrainMaxScrollY) * (listH - thmH));
            ctx.fillStyle = "#FFC53A";
            ctx.fillRect(trkX, thmY, 6, thmH);
          }
        },

        // Step R7 Requirement 7: Forge tab — the blade drawn large at the left with 4 slot boxes
        // around it (Edge, Counterweight, Motor Core, Coil) and a stats readout with plus arrows;
        // right side has scrollable part cards with >= 64 px tall buttons and >= 20 px headers.
        drawFoundryForgeTab: function (ctx, viewX, viewY, viewW, viewH) {
          var bs = GAME.bladeStats || recomputeStats(GAME.loadout);
          var sIdx;

          // LEFT COLUMN (w: 392): Large Blade Diagram with 4 Slot Boxes Around It + Stats Readout with Plus (+) Arrows
          var leftX = viewX + 4;
          var leftY = viewY + 2;
          var leftW = 392;
          var leftH = viewH - 6;

          ctx.fillStyle = "#141822";
          ctx.fillRect(leftX, leftY, leftW, leftH);
          ctx.strokeStyle = "#C9962E";
          ctx.lineWidth = 2;
          ctx.strokeRect(leftX, leftY, leftW, leftH);

          ctx.textAlign = "left";
          ctx.font = "bold 20px monospace";
          ctx.fillStyle = "#FFC53A";
          ctx.fillText("ENGINE-BLADE ASSEMBLY", leftX + 12, leftY + 24);

          // Central Large Blade Canvas Box (drawn large in the middle of the 4 slots)
          var bBoxX = leftX + 104;
          var bBoxY = leftY + 104;
          var bBoxW = 184;
          var bBoxH = 74;
          ctx.fillStyle = "#0E1018";
          ctx.fillRect(bBoxX, bBoxY, bBoxW, bBoxH);
          ctx.strokeStyle = bs.coreColor || "#FF8C29";
          ctx.lineWidth = 2;
          ctx.strokeRect(bBoxX, bBoxY, bBoxW, bBoxH);

          // Draw the pixel-art flame sword large (4x scale = 72x36) + active Edge/Core/Coil accents
          if (SPRITES.item_blade && SPRITES.item_blade[0]) {
            drawSprite(ctx, "item_blade", 0, bBoxX + 36, bBoxY + 14, false, 4);
          }
          var edgeIconName = "icon_edge_" + (bs.edgeId || "cleaver");
          if (SPRITES[edgeIconName] && SPRITES[edgeIconName][0]) {
            drawSprite(ctx, edgeIconName, 0, bBoxX + 132, bBoxY + 18, false, 3);
          }

          // 4 Slot Boxes Positioned Around the Large Blade ( each >= 64 px tall per R7 Req 9 )
          // Top-Left: Edge, Top-Right: Counterweight, Bottom-Left: Motor Core, Bottom-Right: Coil
          var slotDefs = DATA_TABLES.partSlots;
          var slotCoords = [
            { x: leftX + 10, y: leftY + 34, w: 182, h: 64 },  // Slot 1: Edge (top-left)
            { x: leftX + 200, y: leftY + 34, w: 182, h: 64 }, // Slot 2: Counterweight (top-right)
            { x: leftX + 10, y: leftY + 184, w: 182, h: 64 }, // Slot 3: Motor Core (bottom-left)
            { x: leftX + 200, y: leftY + 184, w: 182, h: 64 } // Slot 4: Tether Coil (bottom-right)
          ];
          GAME.forgeSlotRects = [];

          for (sIdx = 0; sIdx < slotDefs.length; sIdx++) {
            var sDef = slotDefs[sIdx];
            var sc = slotCoords[sIdx];
            var isSelSlot = (GAME.selectedForgeSlot || "edge") === sDef.key;
            var eqPartId = GAME.loadout[sDef.key];
            var eqPart = getPartDef(sDef.key, eqPartId);
            var eqTier = (GAME.partTiers[sDef.key] && GAME.partTiers[sDef.key][eqPartId]) || 1;
            var eqTierDef = getPartTierDef(eqTier);

            GAME.forgeSlotRects.push({
              x: sc.x,
              y: sc.y,
              w: sc.w,
              h: sc.h,
              slotKey: sDef.key,
              label: sDef.label
            });

            // Connector line from slot box to the central blade box
            ctx.strokeStyle = isSelSlot ? "#FFC53A" : "#5A6270";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(sc.x + sc.w * 0.5, sIdx < 2 ? (sc.y + sc.h) : sc.y);
            ctx.lineTo(bBoxX + bBoxW * 0.5, sIdx < 2 ? bBoxY : (bBoxY + bBoxH));
            ctx.stroke();

            ctx.fillStyle = isSelSlot ? "#252B3D" : "#181C26";
            RENDER.fillRoundRect(ctx, sc.x, sc.y, sc.w, sc.h, 6);
            ctx.strokeStyle = isSelSlot ? "#FFC53A" : (eqPart ? eqPart.color : "#6C7385");
            ctx.lineWidth = isSelSlot ? 2.5 : 1.5;
            RENDER.strokeRoundRect(ctx, sc.x, sc.y, sc.w, sc.h, 6);

            ctx.textAlign = "left";
            ctx.font = "bold 11px monospace";
            ctx.fillStyle = isSelSlot ? "#FFC53A" : "#B0B8C8";
            ctx.fillText(sDef.shortLabel.toUpperCase(), sc.x + 8, sc.y + 16);

            ctx.font = "bold 15px sans-serif";
            ctx.fillStyle = "#FFFFFF";
            ctx.fillText(eqPart ? eqPart.name : "Standard", sc.x + 8, sc.y + 36);

            ctx.font = "bold 12px monospace";
            ctx.fillStyle = eqTierDef.color;
            ctx.fillText("T" + eqTier + " " + eqTierDef.name + " (x" + eqTierDef.mult + ")", sc.x + 8, sc.y + 54);
          }

          // Stats Readout with Plus (+) Arrows at bottom of Left Column
          var stBoxY = leftY + 256;
          var stBoxH = leftH - 262;
          ctx.fillStyle = "#10131C";
          ctx.fillRect(leftX + 10, stBoxY, leftW - 20, stBoxH);
          ctx.strokeStyle = "#3A4154";
          ctx.lineWidth = 1.5;
          ctx.strokeRect(leftX + 10, stBoxY, leftW - 20, stBoxH);

          ctx.textAlign = "left";
          ctx.font = "bold 16px monospace";
          ctx.fillStyle = "#FFC53A";
          ctx.fillText("STATS READOUT", leftX + 18, stBoxY + 20);

          var statRows = [
            {
              label: "Blade DMG & Reach",
              val: fmt(bs.baseDamage, 0) + " DMG · " + fmt(bs.reach, 0) + "px",
              plus: bs.edgeTier > 1 || bs.baseDamage > 25
            },
            {
              label: "Swing Spd & Knockback",
              val: "x" + fmt(bs.attackSpeedMult, 2) + " · KB x" + fmt(bs.knockbackMult, 2),
              plus: bs.counterweightTier > 1 || bs.attackSpeedMult > 1 || bs.knockbackMult > 1
            },
            {
              label: "Heat Cap & Redline",
              val: fmt(bs.heatCapacity, 0) + " Cap · +" + fmt(Math.max(0, Math.round((bs.redlineDamageMult - 1) * 100)), 0) + "% DMG",
              plus: bs.coreTier > 1 || bs.heatCapacity > 100 || bs.redlineDamageMult > 1.25
            },
            {
              label: "Hook Range & Wire",
              val: fmt(bs.hookRange, 0) + "px · " + fmt(bs.tripwireDuration, 1) + "s",
              plus: bs.coilTier > 1 || bs.hookRange > 420
            },
            {
              label: "Bastion Drill Bit",
              val: "T" + fmt(bs.drillBitTier, 0) + " Ore x" + fmt(bs.drillOreYieldMult, 1) + " (" + fmt(bs.drillEnemyDps, 0) + " DPS)",
              plus: bs.drillBitTier > 1
            }
          ];
          var sri;
          for (sri = 0; sri < statRows.length; sri++) {
            var sr = statRows[sri];
            var rY = stBoxY + 40 + sri * 23;
            ctx.textAlign = "left";
            ctx.font = "12px monospace";
            ctx.fillStyle = "#B0B8C8";
            ctx.fillText(sr.label, leftX + 18, rY);

            ctx.textAlign = "right";
            ctx.font = "bold 12px monospace";
            ctx.fillStyle = sr.plus ? "#2FE6A0" : "#FFFFFF";
            var arrowPrefix = sr.plus ? "▲+ " : "▲ ";
            ctx.fillText(arrowPrefix + sr.val, leftX + leftW - 18, rY);
          }

          // RIGHT COLUMN: Selected Slot Parts List with 64px Action Buttons + Drill Bit Upgrade Card
          var rightX = leftX + leftW + 10;
          var rightY = leftY;
          var rightW = viewW - leftW - 18;
          var rightH = leftH;

          ctx.fillStyle = "#141822";
          ctx.fillRect(rightX, rightY, rightW, rightH);
          ctx.strokeStyle = "#C9962E";
          ctx.lineWidth = 2;
          ctx.strokeRect(rightX, rightY, rightW, rightH);

          var activeSlotKey = GAME.selectedForgeSlot || "edge";
          var activeSlotLabel = "BLADE EDGE";
          for (sIdx = 0; sIdx < slotDefs.length; sIdx++) {
            if (slotDefs[sIdx].key === activeSlotKey) {
              activeSlotLabel = slotDefs[sIdx].label.toUpperCase();
              break;
            }
          }

          // Section Header >= 20 px
          ctx.textAlign = "left";
          ctx.font = "bold 20px monospace";
          ctx.fillStyle = "#FFC53A";
          ctx.fillText(activeSlotLabel + " PARTS", rightX + 12, rightY + 25);

          if (GAME.foundryStatusMsg) {
            ctx.textAlign = "right";
            ctx.font = "bold 11.5px monospace";
            ctx.fillStyle = "#2FE6A0";
            ctx.fillText(GAME.foundryStatusMsg.slice(0, 38), rightX + rightW - 12, rightY + 24);
          }

          // Scrollable list of parts for the selected slot + Train Drill Bit upgrade card at bottom
          var listVpX = rightX + 8;
          var listVpY = rightY + 34;
          var listVpW = rightW - 16;
          var listVpH = rightH - 42;

          var partList = DATA_TABLES.parts[activeSlotKey] || [];
          var rowH = 82;
          var rowGap = 8;
          var drillCardH = 78;
          var totalForgeContentH = partList.length * (rowH + rowGap) + drillCardH + 8;
          GAME.foundryForgeMaxScrollY = Math.max(0, totalForgeContentH - listVpH);
          var fScrollY = Math.max(0, Math.min(GAME.foundryForgeMaxScrollY, GAME.foundryForgeScrollY || 0));
          GAME.foundryForgeScrollY = fScrollY;

          GAME.forgePartActionRects = [];
          GAME.forgeDrillUpgradeRect = null;

          ctx.save();
          ctx.beginPath();
          ctx.rect(listVpX, listVpY, listVpW, listVpH);
          ctx.clip();

          var pIdx;
          for (pIdx = 0; pIdx < partList.length; pIdx++) {
            var pDef = partList[pIdx];
            var ry = listVpY + pIdx * (rowH + rowGap) - fScrollY;
            var rx = listVpX;
            var rw = listVpW - 8;

            var isOwned = !!(GAME.ownedParts[activeSlotKey] && GAME.ownedParts[activeSlotKey][pDef.id]);
            var isEquipped = GAME.loadout[activeSlotKey] === pDef.id;
            var pTier = (GAME.partTiers[activeSlotKey] && GAME.partTiers[activeSlotKey][pDef.id]) || 1;
            var pTierDef = getPartTierDef(pTier);
            var nextPTierDef = pTier < 4 ? getPartTierDef(pTier + 1) : null;

            ctx.fillStyle = isEquipped ? "#252B3D" : (isOwned ? "#1B202E" : "#151822");
            ctx.fillRect(rx, ry, rw, rowH);
            ctx.strokeStyle = isEquipped ? "#FFC53A" : (isOwned ? pDef.color : "#4A5266");
            ctx.lineWidth = isEquipped ? 2.4 : 1.4;
            ctx.strokeRect(rx, ry, rw, rowH);

            // Left accent bar & icon if edge
            ctx.fillStyle = pDef.color;
            ctx.fillRect(rx + 2, ry + 2, 6, rowH - 4);
            var textOffX = rx + 14;
            if (activeSlotKey === "edge" && SPRITES["icon_edge_" + pDef.id]) {
              drawSprite(ctx, "icon_edge_" + pDef.id, 0, rx + 12, ry + 10, false, 2);
              textOffX = rx + 42;
            }

            ctx.textAlign = "left";
            ctx.font = "bold 17px sans-serif";
            ctx.fillStyle = "#FFFFFF";
            ctx.fillText(pDef.name, textOffX, ry + 23);

            ctx.font = "bold 12px monospace";
            ctx.fillStyle = pTierDef.color;
            ctx.fillText("T" + pTier + " " + pTierDef.name + " (x" + pTierDef.mult + ")", textOffX + 132, ry + 22);

            ctx.font = "11.5px sans-serif";
            ctx.fillStyle = "#D8E2F0";
            var sumRaw = String(pDef.summary || pDef.description || ""); // BB-R7 fix (extra): part data uses "description", not "summary"
            var sumTxt = sumRaw.length > 42 ? sumRaw.slice(0, 40) + "…" : sumRaw;
            ctx.fillText(sumTxt, rx + 14, ry + 45);

            ctx.font = "bold 11.5px monospace";
            var canBuy = canAffordCostObj(pDef.cost);
            if (isEquipped) {
              ctx.fillStyle = "#FFC53A";
              ctx.fillText("EQUIPPED ON BLADE", rx + 14, ry + 67);
            } else if (isOwned) {
              ctx.fillStyle = "#2FE6A0";
              ctx.fillText("OWNED — TAP EQUIP", rx + 14, ry + 67);
            } else {
              ctx.fillStyle = canBuy ? "#2FE6A0" : "#FF877A";
              ctx.fillText("COST: " + pDef.costText, rx + 14, ry + 67);
            }

            // Two 64px-tall side-by-side buttons on the right of each part row: EQUIP/BUY and TIER UP
            var eqBtnW = 96;
            var eqBtnH = 64;
            var upBtnW = 108;
            var upBtnH = 64;
            var upBtnX = rx + rw - upBtnW - 6;
            var eqBtnX = upBtnX - eqBtnW - 6;
            var btnY = ry + 9;

            // Equip / Buy button (64 px tall)
            var eqGreen = !isEquipped && (isOwned || canBuy);
            ctx.fillStyle = isEquipped ? "#4A3B1C" : (eqGreen ? "#2FE6A0" : "#3A3D4A");
            RENDER.fillRoundRect(ctx, eqBtnX, btnY, eqBtnW, eqBtnH, 6);
            ctx.strokeStyle = isEquipped ? "#FFC53A" : (eqGreen ? "#E6FFF5" : "#6C7385");
            ctx.lineWidth = 1.8;
            RENDER.strokeRoundRect(ctx, eqBtnX, btnY, eqBtnW, eqBtnH, 6);
            ctx.textAlign = "center";
            ctx.font = "bold 14px sans-serif";
            ctx.fillStyle = isEquipped ? "#FFC53A" : (eqGreen ? "#0C0A10" : "#B0B8C8");
            ctx.fillText(isEquipped ? "EQUIPPED" : (isOwned ? "EQUIP" : "BUILD"), eqBtnX + eqBtnW * 0.5, btnY + 37);

            // Tier Upgrade button (64 px tall)
            var canUpTier = isOwned && nextPTierDef && canAffordCostObj(nextPTierDef.cost);
            ctx.fillStyle = !nextPTierDef ? "#2C2538" : (canUpTier ? "#35E0F0" : "#3A3D4A");
            RENDER.fillRoundRect(ctx, upBtnX, btnY, upBtnW, upBtnH, 6);
            ctx.strokeStyle = !nextPTierDef ? "#FFC53A" : (canUpTier ? "#E6FBFF" : "#6C7385");
            ctx.lineWidth = 1.8;
            RENDER.strokeRoundRect(ctx, upBtnX, btnY, upBtnW, upBtnH, 6);
            ctx.fillStyle = !nextPTierDef ? "#FFC53A" : (canUpTier ? "#0C0A10" : "#B0B8C8");
            ctx.font = "bold 13px sans-serif";
            ctx.fillText(
              !nextPTierDef ? "MAX T4" : ("UP T" + (pTier + 1)),
              upBtnX + upBtnW * 0.5,
              btnY + 28
            );
            ctx.font = "bold 10px monospace";
            ctx.fillText(
              !nextPTierDef ? "x1.7" : nextPTierDef.costText.slice(0, 14),
              upBtnX + upBtnW * 0.5,
              btnY + 46
            );

            var cTop = Math.max(listVpY, btnY);
            var cBot = Math.min(listVpY + listVpH, btnY + eqBtnH);
            if (cBot > cTop + 8) {
              GAME.forgePartActionRects.push({
                slotKey: activeSlotKey,
                partId: pDef.id,
                equipRect: { x: eqBtnX, y: cTop, w: eqBtnW, h: cBot - cTop },
                upgradeRect: { x: upBtnX, y: cTop, w: upBtnW, h: cBot - cTop },
                rowRect: { x: rx, y: Math.max(listVpY, ry), w: eqBtnX - rx - 4, h: Math.min(listVpY + listVpH, ry + rowH) - Math.max(listVpY, ry) }
              });
            }
          }

          // Train Drill Bit 4-Tier Upgrade Row at the bottom of the Forge list (64px button)
          var drY = listVpY + partList.length * (rowH + rowGap) - fScrollY;
          var drW = listVpW - 8;
          var dTier = GAME.drillBitTier || 1;
          var dTierDef = getDrillBitTierDef(dTier);
          var nextDrillDef = dTier < 4 ? getDrillBitTierDef(dTier + 1) : null;
          var canUpgradeDrill = nextDrillDef ? canAffordCostObj(nextDrillDef.cost) : false;

          ctx.fillStyle = "#181C26";
          ctx.fillRect(listVpX, drY, drW, drillCardH);
          ctx.strokeStyle = dTierDef.color;
          ctx.lineWidth = 2;
          ctx.strokeRect(listVpX, drY, drW, drillCardH);

          ctx.textAlign = "left";
          ctx.font = "bold 16px sans-serif";
          ctx.fillStyle = "#FFC53A";
          ctx.fillText("BASTION DRILL BIT [T" + dTier + "/4: " + dTierDef.name + "]", listVpX + 12, drY + 26);
          ctx.font = "12px monospace";
          ctx.fillStyle = "#D8E2F0";
          ctx.fillText("Ore Yield x" + dTierDef.oreYieldMult + " · Drill Contact " + dTierDef.drillEnemyDps + " DPS", listVpX + 12, drY + 48);
          if (nextDrillDef) {
            ctx.fillStyle = canUpgradeDrill ? "#2FE6A0" : "#FF877A";
            ctx.fillText("Next Tier Cost: " + nextDrillDef.costText, listVpX + 12, drY + 66);
          }

          var dBtnW = 148;
          var dBtnH = 64;
          var dBtnX = listVpX + drW - dBtnW - 6;
          var dBtnY = drY + 7;
          ctx.fillStyle = !nextDrillDef ? "#2C2538" : (canUpgradeDrill ? "#2FE6A0" : "#3A3D4A");
          RENDER.fillRoundRect(ctx, dBtnX, dBtnY, dBtnW, dBtnH, 6);
          ctx.strokeStyle = !nextDrillDef ? "#FFC53A" : (canUpgradeDrill ? "#E6FFF5" : "#6C7385");
          ctx.lineWidth = 2;
          RENDER.strokeRoundRect(ctx, dBtnX, dBtnY, dBtnW, dBtnH, 6);
          ctx.textAlign = "center";
          ctx.font = "bold 15px sans-serif";
          ctx.fillStyle = !nextDrillDef ? "#FFC53A" : (canUpgradeDrill ? "#0C0A10" : "#B0B8C8");
          ctx.fillText(!nextDrillDef ? "MAX TIER 4" : ("UPGRADE T" + (dTier + 1)), dBtnX + dBtnW * 0.5, dBtnY + 38);

          if (dBtnY + dBtnH > listVpY && dBtnY < listVpY + listVpH) {
            GAME.forgeDrillUpgradeRect = { x: dBtnX, y: Math.max(listVpY, dBtnY), w: dBtnW, h: dBtnH };
          }

          ctx.restore();
        },

        // Step R7 Requirement 7 & 9: Full-screen panel of dark steel plates with rivets
        // and a brass title bar with an anvil icon; tabs (Forge, Train, Perks, Ledger) at least 64 px tall;
        // slides in over 0.15 s; Mara's portrait sits at the top-left of the panel with one short hint line.
        drawAnatomyLedger: function (ctx) {
          ctx.save();
          // Darkened backdrop
          ctx.fillStyle = "rgba(8, 6, 12, 0.88)";
          ctx.fillRect(0, 0, CFG.logicalWidth, CFG.logicalHeight);

          // Step R7 Requirement 7: Slide-in animation over 0.15 s
          var slideProg = 1 - Math.max(0, Math.min(1, (GAME.foundrySlideTimer || 0) / 0.15));
          var easeOut = 1 - (1 - slideProg) * (1 - slideProg);
          var slideOffsetY = Math.round((1 - easeOut) * -48);

          var ox = Math.round((CFG.logicalWidth - 960) * 0.5);
          ctx.translate(ox, slideOffsetY);

          // Full-screen riveted dark-steel panel with brass title bar and anvil icon
          RENDER.drawRivetedSteelPanel(ctx, 12, 6, 960 - 24, CFG.logicalHeight - 12, "THE FOUNDRY — CHIEF ENGINEER MARA", true);

          // Top Resource Strip inside the brass title bar (right side)
          var resStripX = 450;
          var resStripY = 13;
          var topChips = [
            { icon: "ore", val: GAME.ore, col: "#35E0F0" },
            { icon: "ingot", val: GAME.inventory.ingot || 0, col: "#FFC53A" },
            { icon: "scrap_chitin", val: GAME.inventory.scrap_chitin || 0, col: "#d6b05c" },
            { icon: "sensor_lens", val: GAME.inventory.sensor_lens || 0, col: "#56e2ff" },
            { icon: "carapace_plate", val: GAME.inventory.carapace_plate || 0, col: "#f28b3c" },
            { icon: "limb_strut", val: GAME.inventory.limb_strut || 0, col: "#68e894" }
          ];
          var tci;
          for (tci = 0; tci < topChips.length; tci++) {
            var tc = topChips[tci];
            var tcx = resStripX + tci * 78;
            ctx.fillStyle = "#141822";
            ctx.fillRect(tcx, resStripY, 72, 26);
            ctx.strokeStyle = tc.col;
            ctx.lineWidth = 1.2;
            ctx.strokeRect(tcx, resStripY, 72, 26);
            RENDER.drawIcon(ctx, tc.icon, tcx + 4, resStripY + 4, 18);
            ctx.textAlign = "right";
            ctx.font = "bold 14px monospace";
            ctx.fillStyle = "#FFFFFF";
            ctx.fillText(String(tc.val), tcx + 67, resStripY + 18);
          }

          // Top Row (y: 48, h: 64):
          // - Mara's Portrait (16x16 art px drawn at 3x = 48x48) at Top-Left with one short hint line
          // - Four 64px-tall Tabs: FORGE, TRAIN, PERKS, LEDGER
          // - 64px-tall CLOSE Button
          var topRowY = 48;
          var tabH = 64;

          // Mara's Portrait Box at Top-Left (x: 24, y: 48, w: 300, h: 64)
          var maraBoxX = 24;
          var maraBoxW = 300;
          ctx.fillStyle = "#141822";
          RENDER.fillRoundRect(ctx, maraBoxX, topRowY, maraBoxW, tabH, 6);
          ctx.strokeStyle = "#C9962E";
          ctx.lineWidth = 2;
          RENDER.strokeRoundRect(ctx, maraBoxX, topRowY, maraBoxW, tabH, 6);

          ctx.fillStyle = "#261B14";
          ctx.fillRect(maraBoxX + 6, topRowY + 6, 52, 52);
          ctx.strokeStyle = "#FFC53A";
          ctx.lineWidth = 1.5;
          ctx.strokeRect(maraBoxX + 6, topRowY + 6, 52, 52);
          if (SPRITES.mara_portrait && SPRITES.mara_portrait[0]) {

      (function installSafeRenderWrappers() {

        Object.keys(RENDER).forEach(function (name) {
          if (name.indexOf("draw") !== 0 || skip[name]) return;
          var orig = RENDER[name];

          var wrapped = function () {
            var ctxArg = (arguments[0] && typeof arguments[0].save === "function") ? arguments[0] : RENDER.ctx;
